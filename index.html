/* ================= Kapitel 9: Lernen und nicht-assoziatives Lernen =================
   Grundlage: Folien Sitzung 2 (WiSe 26/27), Klausur WiSe 24/25 (Lehr-Lernpsychologie, Aufgaben 1 und 2), Lehrbuch Urhahne/Dresel/Fischer (2019) Kap. 1 */
LESSONS[9]=[
{id:"9-1", t:"Was ist Lernen?", html:`
<p>Heine stellt drei Definitionen von Lernen gegenüber:</p>
<table class="kvq"><tr><th></th><th>Definition</th><th>Fokus</th></tr>
<tr><td>1</td><td>Eine Veränderung als Folge der Auseinandersetzung mit der Umwelt</td><td>eher unspezifisch</td></tr>
<tr><td>2</td><td>Ein biologischer Prozess, der die Anpassung an die Umwelt bewirkt</td><td>eher evolutionär, auf das Ziel gerichtet</td></tr>
<tr><td>3</td><td>Ein Veränderungsprozess, durch den sich <b>Verhalten bzw. Verhaltenspotenzial</b> in Abhängigkeit von <b>Erfahrung konsistent und relativ dauerhaft</b> ändert</td><td>auf Art und Qualität der Veränderung</td></tr></table>
<p>Mit Definition 3 wird gearbeitet. Ihre drei Bausteine haben jeweils einen Haken:</p>
<p><b>1. Verhalten vs. Verhaltenspotenzial.</b> Lernen wird sichtbar, wenn sich das Verhalten ändert (tatsächliche <b>Performanz</b>). Aber:</p>
<ul><li>Nicht jede beobachtbare Verhaltensänderung ist Lernen. Sie kann auch auf <b>Reifung</b> (langfristig) oder <b>Ermüdung</b> (kurzfristig) beruhen.</li>
<li>Nicht jedes Lernen zeigt sich sofort im Verhalten. Es kann als <b>Verhaltenspotenzial</b> vorhanden sein, ohne dass es ausgeführt wird. Das ist ein <i>messtheoretisches Problem</i>.</li></ul>
<p><b>2. Konsistent und dauerhaft.</b> Die Veränderung muss über gleichartige Situationen hinweg und zeitlich stabil sein. Offen bleibt: Was sind „gleichartige“ Situationen, und wie lange ist „dauerhaft“? Eine kurzfristige Motivationsschwankung ist jedenfalls kein Lernen.</p>
<p><b>3. Erfahrungsbasiert.</b> Lernen hängt von Erfahrung ab, Reifung nicht. Dafür müssen Informationen aufgenommen, verarbeitet und gespeichert werden. Deshalb ist das <b>Gedächtnis</b> so wichtig für das Lernen. Die Abgrenzung zur Reifung ist trotzdem schwierig, weil auch manche Reifungsprozesse umweltabhängig sind (z. B. die frühe Entwicklung des Sehens).</p>
<div class="merk"><b>Schulbeispiele aus dem Lehrbuch (Urhahne et al., 2019, Kap. 1)</b><div class="mrows">
<div><span class="ml">Erfahrung statt Reifung</span><span>Zeigt die Lehrkraft den „Schweigefuchs“, wird die Klasse still. Das Handzeichen hat erst durch frühere Erfahrungen seine Wirkung bekommen. Krabbeln, Laufen und Sprechen beim Kleinkind kommen dagegen mit der Reifung.</span></div>
<div><span class="ml">Keine physiologischen Ursachen</span><span>Bleibt am Abend vor der Prüfung nichts mehr hängen, kann das an Krankheit, Übermüdung oder Alkohol liegen. Das ist dann kein Lernen und kein Vergessen.</span></div>
<div><span class="ml">Verhaltenspotenzial</span><span>Auch ein Kind, das stumm im Unterricht sitzt, kann lernen. Ob es gelernt hat, zeigt sich erst, wenn es die Fragen der Lehrkraft beantworten kann.</span></div>
<div><span class="ml">Relativ dauerhaft</span><span>Wer mit Messer und Gabel essen gelernt hat, kann es bei jeder Gelegenheit. Schulwissen (Wer war Franz Ferdinand?) wirkt weniger stabil, lässt sich aber oft mit passenden Hinweisreizen wieder abrufen. Erst wenn auch das scheitert, war die Veränderung nicht dauerhaft genug.</span></div></div></div>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Jede beobachtbare Veränderung des Verhaltens ist das Ergebnis von Lernprozessen.“<br><span class="small muted">Grund: Reifung, Ermüdung</span></span></div>
<div><span class="ml"><span class="vd t">wahr</span></span><span>„Ein Lernprozess führt nicht unbedingt zu einer unmittelbar beobachtbaren Veränderung des Verhaltens.“<br><span class="small muted">Grund: Verhaltenspotenzial</span></span></div></div></div>`,
check:[
 {q:"Ein Kind kann nach den Ferien plötzlich höher springen. Warum ist das nicht automatisch Lernen?", o:["Weil Lernen immer eine bewusste Absicht voraussetzt","Weil die Veränderung auch auf Reifung beruhen kann","Weil Lernen nur das Verhaltenspotenzial, nie das Verhalten ändert","Weil die Veränderung nur in einer einzigen Situation auftritt"], a:1, ex:"Nicht jede beobachtbare Verhaltensänderung ist Lernen. Reifung ist nicht erfahrungsbasiert.", w:["Lernen muss nicht bewusst sein (siehe Habituation oder Beobachtungslernen).",null,"Lernen kann Verhalten oder Verhaltenspotenzial ändern.","Das Kind springt allgemein höher; die Frage ist, ob Erfahrung oder Reifung die Ursache ist."]},
 {q:"Eine Schülerin hat eine Rechenstrategie verstanden, wendet sie in der Arbeit aber vor Aufregung nicht an. Was liegt vor?", o:["Kein Lernen, weil sich das Verhalten nicht ändert","Lernen auf der Ebene des Verhaltenspotenzials","Habituation an die Prüfungssituation","Eine reifungsbedingte Veränderung"], a:1, ex:"Gelernt ist gelernt, auch wenn es sich (noch) nicht im Verhalten zeigt. Deshalb spricht Definition 3 von Verhalten bzw. Verhaltenspotenzial.", w:["Gelerntes kann als Verhaltenspotenzial vorliegen, ohne gezeigt zu werden.",null,"Habituation wäre eine schwächere Reaktion auf einen wiederholten Reiz; hier fehlt nur die Ausführung.","Das Verstehen der Strategie beruht auf Erfahrung, nicht auf Reifung."]}
]},
{id:"9-2", t:"Arten des Lernens im Überblick", html:`
<p>Grundsätzlich unterscheidet man zwei Typen:</p>
<ul><li><b>Nichtassoziatives Lernen:</b> Die Stärke oder Art einer Reaktion auf einen Reiz verändert sich, weil der Reiz <i>wiederholt</i> auftritt. Es wird nichts verknüpft.</li>
<li><b>Assoziatives Lernen:</b> Gelernt werden <b>Kontingenzen</b>, also das zeitliche Zusammenfallen von Ereignissen. Es entstehen Verknüpfungen (Assoziationen)
 <ul><li>zwischen zwei Reizen, S → S: <b>klassische Konditionierung</b>,</li>
 <li>zwischen einer Reaktion und einem Reiz, R → S: <b>operante Konditionierung</b>.</li></ul></li></ul>
<table class="kvq"><tr><th>Nichtassoziativ</th><th>Assoziativ</th></tr>
<tr><td><b>Lernen infolge wiederholter Stimulusdarbietung:</b> Habituation, Sensitivierung, Priming</td><td>klassische Konditionierung (S1 → S2)</td></tr>
<tr><td><b>Perzeptuelles Lernen:</b> „mere exposure“, Diskriminationstraining, räumliches Lernen</td><td>operante Konditionierung (R → S)</td></tr></table>
<p class="small muted">S = Stimulus (Reiz), R = Response (Reaktion). So steht es in Heines Baum „Strukturierung des Schwerpunkts Lernen“ (Sitzung 2, 3 und 4). <span class="erg">Ergänzung</span> Grau gedruckt sind Priming und das ganze perzeptuelle Lernen, vermutlich also nicht vertieft; rot umkreist ist jeweils der Teil, um den es in der Sitzung geht.</p>
<div class="merk"><b>Merksatz</b><div class="mrows">
<div><span class="ml">Nichtassoziativ</span><span>ein Reiz, oft wiederholt, die Reaktion ändert sich</span></div>
<div><span class="ml">Assoziativ</span><span>zwei Ereignisse, die zusammen auftreten, werden verknüpft</span></div></div></div>`,
check:[
 {q:"Was wird beim assoziativen Lernen gelernt?", o:["Reaktionen auf einen einzigen wiederholten Reiz","Kontingenzen, also das gemeinsame Auftreten von Ereignissen","Veränderte Reflexstärken durch wiederholte Reizdarbietung","Einzelne Reize, die durch Wiederholung vertraut werden"], a:1, ex:"Zum Beispiel, dass auf einen Ton Futter folgt (klassisch) oder dass auf ein Verhalten Lob folgt (operant).", w:["Das ist nichtassoziatives Lernen (Habituation, Sensitivierung).",null,"Das ist nichtassoziatives Lernen.","Das ist „mere exposure“, laut Heines Baum perzeptuelles Lernen, also nichtassoziativ."]},
 {q:"Welche Form gehört zum nichtassoziativen Lernen?", o:["Klassische Konditionierung","Operante Konditionierung","Habituation","Lernen am Modell"], a:2, ex:"Habituation und Sensitivierung sind die beiden basalen nichtassoziativen Lernprozesse.", w:["Klassische Konditionierung ist assoziativ (S → S).","Operante Konditionierung ist assoziativ (R → S).",null,"Lernen am Modell ist kein nichtassoziatives Lernen infolge wiederholter Reizdarbietung."]}
]},
{id:"9-3", t:"Reflexe und Habituation", html:`
<p>Betrachtet werden die einfachsten Reaktionen auf Reize, die angeborenen <b>Reflexe</b>. Reflexe sind <b>unwillkürlich</b>, <b>invariant</b> (immer gleich ablaufend) und <b>schnell</b>. Drei Arten:</p>
<table class="kvq"><tr><th>Reflex</th><th>Beispiel</th><th>durch Lernen veränderbar?</th></tr>
<tr><td>Eigenreflex (Reizort = Effektort)</td><td>Kniesehnenreflex (Patellarreflex)</td><td>nein</td></tr>
<tr><td>Fremdreflex (Reizort ≠ Effektort)</td><td>Lidschlussreflex</td><td>ja</td></tr>
<tr><td>koordinierte, komplexe Reflexbewegung</td><td>Schreckreflex</td><td>ja</td></tr></table>
<p><b>Habituation</b> ist die Abschwächung einer Reflexreaktion (Stärke, Häufigkeit) auf einen Reiz, der wiederholt auftritt. Man gewöhnt sich daran, etwa an das Ticken einer Uhr. Habituation ist ein Lernprozess, der die Anpassung an eine bestimmte Umwelt erlaubt.</p>
<p>Wie schnell und stark habituiert wird, hängt ab von</p>
<ul><li>der <b>Intensität</b> des Reizes (schwache Reize: leichter),</li><li>der <b>Regelmäßigkeit</b> des Auftretens,</li><li>dem <b>Intervall</b> zwischen den Reizen,</li><li>dem <b>tonischen Zustand</b> des Organismus, also dem allgemeinen Erregungsniveau (<b>Arousal</b>).</li></ul>
<p>Weitere Eigenschaften:</p>
<ul><li><b>Reversibel:</b> Nach einer Pause kehrt die Reaktion teilweise zurück (<b>Spontanerholung</b>). Eine erneute Habituation geht dann aber schneller, denn es wurde etwas gelernt.</li>
<li>Der Effekt ist <b>anfangs stark</b> (steiler Abfall der Reaktion) und flacht dann ab.</li>
<li><b>Stimulusspezifisch:</b> Bei einem neuen, unbekannten Reiz ist die ursprüngliche Reaktion sofort wieder da (<b>Dishabituation</b>).</li></ul>`,
check:[
 {q:"Welcher Reflex ist durch Lernen nicht veränderbar?", o:["Lidschlussreflex","Schreckreflex","Patellarreflex","Alle sind veränderbar"], a:2, ex:"Beim Eigenreflex sind Reiz- und Effektort gleich; laut Folie ist keine lernbedingte Veränderung möglich.", w:["Der Lidschlussreflex ist ein Fremdreflex und lässt sich verändern, etwa konditionieren.","Auch der Schreckreflex verändert sich, etwa durch Habituation.",null,"Der Patellarreflex als Eigenreflex ist laut Folie nicht lernbedingt veränderbar."]},
 {q:"Eine Klasse hat sich an das Brummen des Beamers gewöhnt. Plötzlich piept der Rauchmelder, und alle schrecken hoch. Welche Eigenschaft der Habituation zeigt sich?", o:["Spontanerholung nach einer Pause","Stimulusspezifität (Dishabituation)","Sensitivierung durch hohe Erregung","Reversibilität durch Zeitablauf"], a:1, ex:"Die Habituation gilt nur für den gewohnten Reiz. Ein neuer Reiz löst die volle Reaktion aus.", w:["Spontanerholung kommt nach einer Pause mit demselben Reiz; hier ist es ein neuer Reiz.",null,"Die Klasse reagiert nicht stärker auf das Brummen, sondern voll auf einen neuen Reiz.","Reversibilität zeigt sich nach einer Pause, nicht bei einem neuen Reiz."]}
]},
{id:"9-4", t:"Sensitivierung und der Schulalltag", html:`
<p><b>Sensitivierung</b> ist das Gegenstück zur Habituation: Die Reflexreaktion auf einen Reiz wird bei wiederholter Darbietung <b>stärker</b> (Reaktionsstärke, Häufigkeit).</p>
<p>Eigenschaften:</p>
<ul><li>Auslöser sind eine <b>hohe Reizintensität</b> und ein <b>hohes allgemeines Erregungsniveau</b>.</li>
<li>Es braucht <b>nur wenige Darbietungen</b>.</li>
<li><b>Weniger stimulusspezifisch</b> als Habituation: Sensitivierung gegenüber Reiz 1 kann auch die Reaktion auf Reiz 2 verstärken, weil das allgemeine Erregungsniveau steigt.</li>
<li>Die <b>„Failure-to-habituate“-Theorie</b> erklärt damit z. B. Symptome bei posttraumatischer Belastungsstörung (PTBS): Die Betroffenen gewöhnen sich nicht an Reize, sondern reagieren immer stärker.</li></ul>
<table class="kvq"><tr><th></th><th>Habituation</th><th>Sensitivierung</th></tr>
<tr><td>Reaktion</td><td>wird schwächer</td><td>wird stärker</td></tr>
<tr><td>Reizintensität</td><td>eher gering</td><td>hoch</td></tr>
<tr><td>Erregungsniveau</td><td>eher niedrig</td><td>hoch</td></tr>
<tr><td>Spezifität</td><td>stimulusspezifisch</td><td>weniger spezifisch</td></tr></table>
<div class="merk"><b>Beispiel aus der Vorlesung</b>Im normalen Lernalltag stört das Schniefen des Sitznachbarn nicht (Habituation). In der Klausur ist das Erregungsniveau hoch: Man nimmt das Geräusch plötzlich wahr, kann es nicht mehr ausblenden, und es wirkt immer lauter (Sensitivierung).</div>
<p><b>Schulbezug:</b> In ersten Klassen wurden im Unterricht durchschnittlich 60 bis 85 dB gemessen (Schönwälder et al., 2004), eine Bohrmaschine liegt bei etwa 90 dB. Lärm und Prüfungsstress erhöhen das Erregungsniveau und begünstigen damit Sensitivierung. Für Lehrkräfte heißt das: Lärm senken und eine ruhige Atmosphäre schaffen, besonders in Prüfungen.</p>`,
check:[
 {q:"Unter welchen Bedingungen ist Sensitivierung besonders wahrscheinlich?", o:["Geringe Reizintensität, niedriges Erregungsniveau","Hohe Reizintensität, hohes Erregungsniveau","Viele regelmäßige Wiederholungen eines schwachen Reizes","Wenn der Reiz neu ist"], a:1, ex:"Bei schwachen, regelmäßigen Reizen und niedrigem Arousal tritt eher Habituation auf.", w:["Umgekehrt: Geringe Intensität und niedrige Erregung begünstigen Habituation.",null,"Viele Wiederholungen eines schwachen Reizes führen eher zu Habituation.","Neuheit allein reicht nicht; entscheidend sind Intensität und Erregungsniveau."]},
 {q:"Nach einem lauten Knall zuckt man auch bei einer zufallenden Tür stark zusammen. Welche Eigenschaft der Sensitivierung zeigt sich?", o:["Sie ist streng stimulusspezifisch","Sie ist weniger stimulusspezifisch","Spontanerholung nach dem Knall","Dishabituation durch einen neuen Reiz"], a:1, ex:"Das allgemeine Erregungsniveau ist gestiegen, deshalb wirkt sich die Sensitivierung auch auf andere Reize aus.", w:["Gerade nicht: Sensitivierung auf S1 verstärkt auch die Reaktion auf S2.",null,"Spontanerholung gehört zur Habituation und braucht eine Pause.","Dishabituation setzt eine vorherige Habituation voraus."]}
]}
];

CARDS[9]=[
 {id:"c9-01", f:"Lernen: Arbeitsdefinition (Definition 3)", b:"Ein Veränderungsprozess, durch den sich Verhalten bzw. Verhaltenspotenzial in Abhängigkeit von Erfahrung konsistent und relativ dauerhaft ändert."},
 {id:"c9-02", f:"Die drei Lerndefinitionen und ihr Fokus", b:"1. Veränderung als Folge der Auseinandersetzung mit der Umwelt (eher unspezifisch)\n2. Biologischer Prozess der Anpassung an die Umwelt (eher evolutionär)\n3. Erfahrungsbedingte, konsistente, relativ dauerhafte Änderung von Verhalten bzw. Verhaltenspotenzial (Art und Qualität der Veränderung)"},
 {id:"c9-03", f:"Warum ist nicht jede Verhaltensänderung Lernen?", b:"Reifung: langfristig, z. B. Wachstum\nErmüdung: kurzfristig\nAuch kein Lernen: Veränderungen durch Krankheit, Alkohol oder Drogen (Lehrbuch Kap. 1)"},
 {id:"c9-04", f:"Warum zeigt sich nicht jedes Lernen im Verhalten?", b:"Grund: Gelerntes kann als Verhaltenspotenzial vorhanden sein, ohne ausgeführt zu werden\nWeil: die Ausführung von vielen Faktoren abhängt (z. B. Motivation, Aufregung)\nFolge: ein messtheoretisches Problem"},
 {id:"c9-05", f:"Lernen vs. Reifung", b:"Lernen: erfahrungsabhängig. Informationen werden aufgenommen, verarbeitet und gespeichert (daher die Bedeutung des Gedächtnisses).\nReifung: nicht erfahrungsabhängig (z. B. Krabbeln, Laufen beim Kleinkind).\nProblem: Die Abgrenzung ist schwierig, weil auch manche Reifung umweltabhängig ist (frühe Entwicklung des Sehens)."},
 {id:"c9-06", f:"Nichtassoziatives vs. assoziatives Lernen", b:"Nichtassoziativ: Stärke oder Art einer Reaktion auf einen Reiz ändert sich durch wiederholte Darbietung (Habituation, Sensitivierung).\nAssoziativ: Lernen von Kontingenzen (gemeinsamem Auftreten) von Ereignissen, S → S (klassisch) oder R → S (operant).\nBeispiel: Man hört die Uhr im Raum irgendwann nicht mehr (nichtassoziativ). Ein Kind meldet sich häufiger, weil es gelobt wird (assoziativ)."},
 {id:"c9-07", f:"Kontingenz", b:"Das zeitliche Zusammenfallen bzw. die regelhafte Verknüpfung von Ereignissen, etwa Verhalten und Konsequenz.\nBeispiel: Jedes Mal, wenn ein Schüler reinruft, wird er drangenommen."},
 {id:"c9-08", f:"Drei Eigenschaften von Reflexen", b:"unwillkürlich\ninvariant (stereotyp, immer gleich)\nschnell"},
 {id:"c9-09", f:"Eigenreflex, Fremdreflex, koordinierter Reflex", b:"Eigenreflex: Reizort = Effektort, z. B. Patellarreflex, nicht lernbar veränderbar\nFremdreflex: Reizort ≠ Effektort, z. B. Lidschlussreflex, veränderbar\nKoordinierte Reflexbewegung: z. B. Schreckreflex, veränderbar"},
 {id:"c9-10", f:"Habituation", b:"Was: Abschwächung einer Reflexreaktion (Stärke, Häufigkeit) bei wiederholter Darbietung eines Reizes\nNutzen: Anpassung an eine bestimmte Umwelt\nBeispiel: Gewöhnung an Straßenlärm."},
 {id:"c9-11", f:"Vier Determinanten des Habituationsverlaufs", b:"Intensität des Reizes\nRegelmäßigkeit des Auftretens\nAuftretensintervall\ntonischer Zustand des Organismus (allgemeines Erregungsniveau, Arousal)"},
 {id:"c9-12", f:"Spontanerholung", b:"Was: nach einer Pause kehrt die habituierte Reaktion teilweise zurück\nDanach: erneute Habituation geht schneller, ein Hinweis, dass gelernt wurde\nBeispiel: Nach den Ferien fällt dir das Ticken der Klassenzimmeruhr wieder auf, du gewöhnst dich aber schneller daran."},
 {id:"c9-13", f:"Dishabituation", b:"Weil Habituation stimulusspezifisch ist, zeigt sich bei einem neuen, unbekannten Reiz wieder die ursprüngliche volle Reaktion.\nBeispiel: An den Straßenlärm gewöhnt, schreckst du bei einer Sirene wieder voll auf."},
 {id:"c9-14", f:"Sensitivierung", b:"Verstärkung einer Reflexreaktion (Stärke, Häufigkeit) auf einen Reiz bei wiederholter Darbietung.\nBeispiel: Nach einem Schreck zuckst du bei jedem weiteren Geräusch stärker zusammen."},
 {id:"c9-15", f:"Eigenschaften der Sensitivierung", b:"hohe Reizintensität und hohes allgemeines Erregungsniveau als Determinante\nnur geringe Expositionsraten nötig\nweniger stimulusspezifisch (S1 kann Reaktion auf S2 verstärken)\n„Failure-to-habituate“-Theorie, z. B. bei PTBS"},
 {id:"c9-16", f:"Habituation vs. Sensitivierung im Vergleich", b:"Reaktion: wird schwächer / wird stärker\nReizintensität: eher gering / hoch\nErregungsniveau: eher niedrig / hoch\nSpezifität: stimulusspezifisch / weniger spezifisch"},
 {id:"c9-17", f:"Sensitivierung in der Klausursituation", b:"Ursache: hohes Erregungsniveau (Stress) begünstigt Sensitivierung\nFolge: sonst unbemerkte Geräusche (Schniefen, Tüte) werden nicht mehr ausgeblendet und wirken immer lauter\nSchulbezug: Unterrichtslärm von 60–85 dB in ersten Klassen (Schönwälder et al., 2004)."}
];

  ["Jede beobachtbare Veränderung auf der Ebene des Verhaltens ist das Ergebnis von Lernprozessen.", false, "Verhaltensänderungen können auch auf <b>Reifung</b> oder <b>Ermüdung</b> beruhen."],
  ["Hat ein Lernprozess stattgefunden, so führt das nicht unbedingt zu einer unmittelbar beobachtbaren Veränderung des Verhaltens.", true, "Gelerntes kann als Verhaltenspotenzial vorliegen."],
  ["Lernen führt dazu, dass sich das Verhalten oder Verhaltenspotenzial in Situationen dauerhaft ändert, die mit der Lernsituation vergleichbar sind.", true, "Konsistent über gleichartige Situationen und relativ dauerhaft."]]},
 {id:"x9-02", ch:9, stem:"Für nicht-assoziatives Lernen gilt:", klausur:"WiSe 24/25", s:[
  ["Je geringer die Reizintensität, desto wahrscheinlicher ist es, dass der Organismus sensitiviert.", false, "Umgekehrt: <b>Hohe</b> Reizintensität begünstigt Sensitivierung, geringe eher Habituation."],
  ["Die Habituation ist stimulusspezifisch.", true, "Bei einem neuen Reiz kehrt die volle Reaktion zurück (Dishabituation)."],
  ["Je höher der allgemeine Erregtheitszustand des Organismus ist, desto wahrscheinlicher ist es, dass Sensitivierungsprozesse stattfinden.", true, "Hohes Arousal ist neben hoher Reizintensität die Determinante der Sensitivierung."]]},
 {id:"x9-03", ch:9, stem:"Für Reflexe gilt:", s:[
  ["Reflexe sind unwillkürliche, invariante und schnelle Reaktionen auf spezifische Reize.", true, "So definiert auf der Folie."],

  ["Der Lidschlussreflex ist ein Fremdreflex.", true, "Reizort (z. B. Luftstoß aufs Auge) und Effektort (Lidmuskel) sind verschieden. Fremdreflexe sind lernbar veränderbar."]]},
 {id:"x9-04", ch:9, stem:"Für die Habituation gilt:", s:[
  ["Habituation ist reversibel.", true, "Nach einer Pause zeigt sich Spontanerholung."],
  ["Nach einer Spontanerholung erfolgt die erneute Habituation langsamer als beim ersten Mal.", false, "Sie erfolgt <b>schneller</b>, ein Zeichen dafür, dass gelernt wurde."],
  ["Der Habituationseffekt ist anfangs stark und schwächt sich im Verlauf der Exposition ab.", true, "Steiler Abfall der Reaktion zu Beginn, dann flacher."]]},
 {id:"x9-05", ch:9, stem:"Für die Sensitivierung gilt:", s:[

 {id:"x9-06", ch:9, stem:"Für die Unterscheidung von Lernformen gilt:", s:[

  ["„Mere exposure“ gehört wie Habituation zum Lernen infolge wiederholter Stimulusdarbietung.", false, "In Heines Baum steht „mere exposure“ unter <b>perzeptuellem Lernen</b> (mit Diskriminationstraining und räumlichem Lernen). Unter wiederholter Stimulusdarbietung stehen Habituation, Sensitivierung und Priming."]]}

KURZ.push(
 {id:"k9-1", ch:9, pts:6,
  q:"Erläutern Sie die Definition von Lernen als „Veränderungsprozess, der dazu führt, dass sich Verhalten bzw. Verhaltenspotenzial in Abhängigkeit von Erfahrung konsistent und relativ dauerhaft ändert“. Gehen Sie auf je ein Problem der drei Bestandteile ein.",
  k:["Verhalten vs. Verhaltenspotenzial erläutert (Performanz)","Problem: nicht jede Verhaltensänderung ist Lernen (Reifung, Ermüdung) bzw. nicht jedes Lernen ist sichtbar","Konsistent und dauerhaft: stabil über gleichartige Situationen und über die Zeit","Problem: unklar, was gleichartige Situationen sind und wie lange dauerhaft ist","Erfahrungsbasiert: Information wird aufgenommen, verarbeitet, gespeichert (Gedächtnis)","Problem: Abgrenzung zur Reifung, da auch Reifung umweltabhängig sein kann"],
  m:"Lernen zeigt sich in Verhaltensänderungen, also in der Performanz. Allerdings ist nicht jede Verhaltensänderung Lernen (Reifung, Ermüdung), und nicht jedes Lernen ist sofort sichtbar, weil es als Verhaltenspotenzial vorliegen kann. Die Veränderung muss konsistent über gleichartige Situationen und relativ dauerhaft sein; offen bleibt, was gleichartige Situationen sind und wie dauerhaft eine Änderung sein muss. Schließlich ist Lernen erfahrungsbasiert: Informationen werden aufgenommen, verarbeitet und gespeichert, weshalb das Gedächtnis zentral ist. Die Abgrenzung zur Reifung bleibt schwierig, da auch Reifungsprozesse umweltabhängig sein können, etwa die frühe Entwicklung des visuellen Systems."},
 {id:"k9-2", ch:9, pts:6,
  q:"Ein Schüler bemerkt im Unterricht das Ticken der Wanduhr nicht. In der Klassenarbeit stört ihn dasselbe Ticken so sehr, dass er sich nicht konzentrieren kann. Erklären Sie beide Beobachtungen mit nichtassoziativen Lernprozessen und leiten Sie eine Handlungsmöglichkeit für die Lehrkraft ab.",
  k:["Unterricht: Habituation, Abschwächung der Reaktion bei wiederholtem Reiz","Bedingungen: schwacher, regelmäßiger Reiz, niedriges Erregungsniveau","Klassenarbeit: Sensitivierung, Verstärkung der Reaktion","Bedingung: hohes allgemeines Erregungsniveau (Prüfungsstress)","Weniger stimulusspezifisch: auch andere Geräusche stören stärker","Handlungsmöglichkeit, z. B. Störquellen beseitigen, Lärm senken, Stress reduzieren"],
  m:"Im Unterricht habituiert der Schüler: Das Ticken ist ein schwacher, regelmäßiger Reiz, sein Erregungsniveau ist niedrig, die Reaktion auf den Reiz schwächt sich ab. In der Klassenarbeit ist sein allgemeines Erregungsniveau durch den Prüfungsstress hoch. Das begünstigt Sensitivierung: Die Reaktion auf denselben Reiz wird stärker, er nimmt das Ticken wahr und kann es nicht mehr ausblenden. Da Sensitivierung weniger stimulusspezifisch ist, stören ihn auch andere Geräusche stärker. Die Lehrkraft kann Störquellen wie die Uhr entfernen, für eine ruhige Prüfungsatmosphäre sorgen und das Stressniveau senken, etwa durch klare Ansagen und einen ruhigen Einstieg."}
);

{id:"11-5", t:"Thorndike und instrumentelles Lernen", html:`
<p>Angeregt durch Darwin untersuchte <b>Edward Thorndike</b> (1874–1949) das Problemlöseverhalten von Tieren in <b>Problemkäfigen</b> („puzzle boxes“). Eine Katze im Käfig probiert alles Mögliche aus, bis sie zufällig den Knopf oder Draht betätigt, der die Tür öffnet. Mit der Zeit unterbleiben die erfolglosen Versuche, der erfolgreiche wird „eingeprägt“.</p>
<ul><li>Prinzip „<b>Trial and Error</b>“: beliebige Verhaltenssequenzen, bis zufällig eine passende Handlung gelingt.</li>
<li>Die ersten Durchläufe dauern lange, mit jeder Wiederholung befreit sich das Tier schneller: Die <b>Latenz sinkt</b>.</li>
<li>Das Verhalten wird zum <b>Instrument</b>, also zum Mittel zum Zweck.</li></ul>
<p><b>Gesetz der Wirkung</b> (law of effect): Je größer die resultierende Befriedigung bzw. Frustration, desto stärker wird die Assoziation zwischen Situation (Stimulus) und Verhaltensweise (Reaktion) gestärkt bzw. geschwächt. Die Verhaltenswahrscheinlichkeit ist eine <b>Funktion der Verhaltenskonsequenzen</b>.</p>
<p><b>Instrumentelles Lernen</b> allgemein: Latenz, Geschwindigkeit, Wahrscheinlichkeit bzw. Häufigkeit eines Verhaltens verändern sich, nachdem eine Verstärkung <b>kontingent</b> zu diesem Verhalten gemacht wird (assoziatives Lernen). Das Verhalten kann mehr oder weniger komplex sein (vgl. <b>Shaping</b>).</p>
<p><b>Skinners Konzeption</b>: Anders als beim reflexartigen (reaktiven) Verhalten der klassischen Konditionierung steht komplexeres Verhalten im Fokus, das auf die Umwelt wirkt („operates on“): <b>operantes Verhalten</b>. „Instrumentelles Lernen“ passt eher auf natürliche Situationen, Skinner untersuchte vor allem kontrollierte Lernexperimente (<b>operante Konditionierung</b>).</p>`,
check:[
 {q:"Was beobachtete Thorndike bei den Katzen in den Problemkäfigen?", o:["Sie fanden die Lösung sofort durch Nachdenken","Die Zeit bis zur Befreiung sank mit jeder Wiederholung","Sie lernten durch Zuschauen bei Katzen, die sich schon befreit hatten","Sie reagierten reflexartig auf einen Ton"], a:1, ex:"Trial and Error: Erst zufällig, dann immer schneller, die Latenz sinkt.", w:["Die Lösung wurde zufällig gefunden, nicht durch Einsicht.",null,"Thorndike beschreibt Versuch und Irrtum, kein Beobachtungslernen.","Reflexe auf einen Ton gehören zur klassischen Konditionierung."]},
 {q:"Was unterscheidet operantes Verhalten nach Skinner vom Verhalten bei der klassischen Konditionierung?", o:["Es ist reflexartig und wird vom Reiz ausgelöst","Es wirkt auf die Umwelt ein","Es braucht keinen Reiz","Es ist angeboren"], a:1, ex:"Operant heißt: Das Verhalten „operates on“ die Umwelt. Klassisch konditioniert werden reflexartige, reaktive Reaktionen.", w:["Reflexartiges (reaktives) Verhalten ist gerade das der klassischen Konditionierung.",null,"Auch operantes Verhalten steht in Beziehung zu Reizen, nämlich zu den Konsequenzen.","Angeborenes ist kein Lernen."]}
]},
{id:"11-1", t:"Die vier operanten Konsequenzen", html:`
<p>Bei der operanten Konditionierung wird eine Verknüpfung zwischen einem <b>Verhalten</b> (R) und seiner <b>Konsequenz</b> (S) gelernt. Zwei Fragen ordnen jede Konsequenz ein:</p>
<ul><li><b>Positiv oder negativ?</b> Das heißt nur: Wird eine Konsequenz <b>präsentiert</b> (positiv) oder <b>entzogen</b> (negativ)? Mit „gut“ oder „schlecht“ hat es nichts zu tun.</li>
<li><b>Verstärkung oder Bestrafung?</b> Verstärkung führt zur <b>Zunahme</b> der Frequenz eines Verhaltens, Bestrafung zur <b>Abnahme</b>.</li></ul>
<p>Heines Tabelle (Sitzung 3, Folie 23):</p>
<table class="kvq"><tr><th>Art</th><th>Mechanismus</th><th>Effekt</th><th>Beispiel</th></tr>
<tr><td><b>positive Verstärkung</b></td><td>Präsentation einer appetitiven Konsequenz</td><td>Zunahme</td><td>Regelmäßige Nachbereitung der Vorlesung führt zu einer besseren Klausurnote: Die Nachbereitung wird häufiger und intensiver.</td></tr>
<tr><td><b>negative Verstärkung</b></td><td>Entzug einer aversiven Konsequenz</td><td>Zunahme</td><td>Das Verlassen einer lauten Lernumgebung führt zu weniger Störung: Man zieht sich häufiger in eine leise Umgebung zurück.</td></tr>
<tr><td><b>(positive) Bestrafung</b></td><td>Präsentation einer aversiven Konsequenz</td><td>Abnahme</td><td>Abschreiben in der Klausur führt zu Ärger mit dem Dozenten: Es wird seltener abgeschrieben.</td></tr>
<tr><td><b>negative Bestrafung</b></td><td>Entzug einer appetitiven Konsequenz</td><td>Abnahme</td><td>Schlafen in der Vorlesung führt dazu, dass spannende Inhalte verpasst werden: Man schläft seltener.</td></tr></table>
<p class="small muted">Schulbeispiele aus dem Lehrbuch (Kap. 1.4): Lob für Mitarbeit, Befreiung von Hausaufgaben, Ermahnung bei Störung, Wegnahme des Handys. Folgt gar keine Konsequenz mehr, wird das Verhalten seltener: <b>Löschung</b>.</p>
<div class="merk"><b>So fragt Heine in der Klausur (WiSe 24/25)</b>Genau in den Spalten ihrer Tabelle: Art der Konsequenz, Mechanismus „allgemein“ und „im konkreten Fall“, Effekt auf die Auftretenshäufigkeit, allgemein und konkret. Bei negativer Bestrafung also: Eine <i>appetitive</i> Konsequenz wird <i>entnommen</i>, die Auftretenshäufigkeit <i>sinkt</i>.</div>`,
check:[
 {q:"Was bedeutet „negativ“ bei negativer Verstärkung?", o:["Die Konsequenz ist unangenehm","Ein Reiz wird entzogen","Das Verhalten wird seltener","Die Konsequenz folgt verzögert"], a:1, ex:"Positiv und negativ sagen nur, ob ein Reiz dargeboten oder entzogen wird. Bei negativer Verstärkung fällt etwas Unangenehmes weg, deshalb wird das Verhalten häufiger.", w:["Unangenehm ist der Reiz, der wegfällt. „Negativ“ bezeichnet aber das Wegnehmen, nicht die Qualität.",null,"Seltener wird ein Verhalten durch Bestrafung. Jede Verstärkung macht es häufiger.","„Negativ“ heißt entziehen, nicht verzögern."]},
 {q:"Weil ein Schüler im Unterricht spielt, wird ihm das Handy bis Stundenende abgenommen. Welche Konsequenz liegt vor?", o:["Positive Bestrafung","Negative Verstärkung","Negative Bestrafung","Löschung"], a:2, ex:"Ein angenehmer (appetitiver) Reiz wird entzogen, das Spielen soll seltener werden.", w:["Bei positiver Bestrafung käme etwas Unangenehmes hinzu, z. B. eine Ermahnung.","Negative Verstärkung macht ein Verhalten häufiger, weil etwas Unangenehmes wegfällt.",null,"Löschung hieße, dass gar keine Konsequenz mehr folgt."]}

{id:"11-6", t:"Typen von Verstärkern", html:`
<table class="kvq"><tr><th>Typ</th><th>Was er ist</th></tr>
<tr><td><b>primäre Verstärker</b></td><td>befriedigen physiologische Bedürfnisse wie Hunger, Durst, Wärme</td></tr>
<tr><td><b>sekundäre Verstärker</b></td><td>erwerben ihre Wirkung durch gelernte Assoziation mit primären Verstärkern (<b>konditionierte Verstärker</b>). Beispiele sind <b>generalisierte Verstärker</b> wie Geld oder Tokens.</td></tr>
<tr><td><b>soziale Verstärker</b></td><td>Aufmerksamkeit, Lob, Liebe. Sie lassen sich nicht eindeutig einer der beiden Kategorien zuordnen.</td></tr></table>
<div class="merk"><b>Schulbezug</b>Sticker, Stempel oder Punkte in einem Token-System sind sekundäre, generalisierte Verstärker: Sie wirken erst, weil sie gegen etwas eingetauscht werden können oder mit Anerkennung verbunden sind.</div>`,
check:[
 {q:"Zu welchem Verstärkertyp gehört Geld?", o:["Ein primärer Verstärker wie Essen","Ein generalisierter Verstärker","Ein sozialer Verstärker wie Lob","Ein unbedingter Reiz (US)"], a:1, ex:"Geld wirkt durch gelernte Assoziation mit primären Verstärkern und lässt sich gegen vieles eintauschen.", w:["Geld stillt kein physiologisches Bedürfnis direkt.",null,"Sozial sind Aufmerksamkeit, Lob oder Liebe.","Unbedingte Reize gehören zur klassischen Konditionierung. Geld ist ein Verstärker."]},
 {q:"Was gilt laut Folie für Lob? Es ist …", o:["ein primärer Verstärker wie Nahrung","eindeutig ein sekundärer Verstärker","sozial und nicht eindeutig zuzuordnen","ein generalisierter Verstärker wie Geld"], a:2, ex:"Soziale Verstärker wie Aufmerksamkeit, Lob, Liebe sind nicht eindeutig primär oder sekundär.", w:["Primär sind Verstärker für physiologische Bedürfnisse wie Hunger.","Genau das sagt die Folie nicht: Die Zuordnung ist nicht eindeutig.",null,"Generalisierte Verstärker wie Geld lassen sich gegen viele andere eintauschen; Lob ist laut Folie sozial und nicht eindeutig zuzuordnen."]}
]},
{id:"11-2", t:"Verstärkungspläne und ihre Effekte", html:`
<p>Bei <b>kontinuierlicher Verstärkung</b> (continuous reinforcement, <b>CRF</b>) wird jede einzelne Verhaltensäußerung verstärkt. Wird nur manchmal verstärkt, spricht man von <b>intermittierender Verstärkung</b>. Die vier wichtigsten Pläne:</p>
<table class="kvq"><tr><th></th><th>Quotenpläne (nach Anzahl)</th><th>Intervallpläne (nach Zeit)</th></tr>
<tr><td>fest</td><td><b>Feste Quote</b> (FQ, fixed ratio): exakt jede x-te korrekte Reaktion wird verstärkt. Spezialfall: CRF</td><td><b>Festes Intervall</b> (FI): jeweils die erste korrekte Reaktion eines x-Minuten-Intervalls wird verstärkt</td></tr>
<tr><td>variabel</td><td><b>Variable Quote</b> (VQ): ungefähr jede x-te korrekte Reaktion wird verstärkt</td><td><b>Variables Intervall</b> (VI): durchschnittlich alle x Minuten wird eine korrekte Reaktion verstärkt</td></tr></table>
<p><b>Effekte:</b></p>
<ul><li><b>CRF</b> führt <b>rasch zum Erwerb</b> des Verhaltens. Bleibt die Verstärkung aus, wird das Verhalten aber <b>schnell eingestellt</b> (Extinktion).</li>
<li><b>Intermittierende Verstärkung</b> ist <b>extinktionsresistenter</b> als CRF („<b>partieller Verstärkungseffekt</b>“). Sie ist die Basis von <b>Fading/Thinning</b>: erst kontinuierlich verstärken, dann immer seltener.</li></ul>
<table class="kvq"><tr><th>Plan</th><th>Reaktionsrate</th><th>Besonderheit</th></tr>
<tr><td>FQ</td><td>hoch</td><td><b>Nachverstärkungspause</b> (post-reinforcement effect, PRE)</td></tr>
<tr><td>VQ</td><td>hoch, gleichmäßig</td><td>geringe Nachverstärkungspause</td></tr>
<tr><td>FI</td><td>moderat</td><td><b>FI-Bögen</b>: Pause nach der Verstärkung, dann immer schnellere Reaktion</td></tr>
<tr><td>VI</td><td>moderat, gleichmäßig</td><td></td></tr></table>
<div class="merk"><b>Merksatz</b><div class="mrows">
<div><span class="ml">Quote</span><span>hohe Raten, denn mehr Verhalten bringt mehr Verstärkung</span></div>
<div><span class="ml">Variabel</span><span>gleichmäßig, denn die nächste Verstärkung ist nie vorhersehbar</span></div></div></div>`,

 {q:"Ein Kind bekommt anfangs für jede gelesene Seite einen Sticker, später nur noch ab und zu. Was ist der Vorteil?", o:["Das Verhalten wird schneller erworben","Das Verhalten wird extinktionsresistenter","Die Nachverstärkungspause verschwindet ganz","Das Verhalten wird nicht mehr bewusst gesteuert"], a:1, ex:"Das ist Fading/Thinning: CRF für den schnellen Erwerb, dann intermittierend, weil das stabiler gegen Löschung ist (partieller Verstärkungseffekt).", w:["Schnell erworben wird mit CRF, also in der ersten Phase. Der Wechsel dient der Stabilität.",null,"Eine Nachverstärkungspause gibt es bei festen Quoten. Sie verschwindet durch Fading nicht automatisch.","Mit Bewusstheit hat der Verstärkungsplan nichts zu tun."]},

{id:"11-3", t:"Was die Lernkurve beeinflusst, und Bestrafung", html:`
<p>Wie schnell ein Verhalten erworben wird, hängt unter anderem ab von:</p>
<ul><li><b>Kontiguität:</b> Je geringer der zeitliche Abstand zwischen Verhalten und Verstärkung, desto schneller der Erwerb.</li>
<li><b>Kontingenz:</b> Wie regelmäßig das Verhalten verstärkt wird (→ Verstärkungspläne).</li>
<li><b>Motivation:</b> Die Wirkung des Verstärkers hängt von der momentanen motivationalen Lage ab (z. B. Hunger).</li>
<li><b>Verstärkereigenschaften:</b> Je potenter der Verstärker, desto schneller der Erwerb.</li></ul>
<p><b>Bestrafung</b> dient dazu, Verhaltenstendenzen zu schwächen. Positive Bestrafung (eine aversive Konsequenz) hat im echten Leben Probleme:</p>
<ul><li>Sie <b>stärkt kein erwünschtes Verhalten</b>.</li>
<li>Der Bestrafer wird <b>gemieden</b>, oder das Verhalten wird <b>nur in seiner Anwesenheit</b> unterdrückt.</li>
<li>Sie führt zu <b>emotionalen Reaktionen</b> wie Aggression.</li>
<li>Der Effekt von Bestrafung <b>verstärkt auch das Bestrafungsverhalten</b> des Bestrafers.</li></ul>
<p>Wenn positive (statt negative!) Bestrafung, dann</p>
<ul><li><b>ohne Verzögerung</b>,</li><li><b>nicht intermittierend</b>,</li><li><b>von Beginn an mit der notwendigen Intensität</b>,</li><li>mit <b>gleichzeitiger Verstärkung erwünschten Verhaltens</b>,</li><li>bei Menschen in Kombination mit <b>Erklärungen</b>.</li></ul>
<div class="merk"><b>Schulbezug</b>Wer nur ermahnt, bringt der Klasse nicht bei, was sie stattdessen tun soll. Deshalb gehört zur Strafe immer die Verstärkung des erwünschten Verhaltens. Ruft eine Lehrkraft selten und unberechenbar zur Ordnung, ist die Bestrafung intermittierend und wirkt schlecht.</div>`,
check:[
 {q:"Warum wirkt positive Bestrafung im Alltag oft nicht wie gewünscht? Weil sie …", o:["das unerwünschte Verhalten immer noch verstärkt","nichts Erwünschtes aufbaut und der Bestrafer gemieden wird","nur bei Tieren im Labor zuverlässig funktioniert","meist viel zu schnell auf das Verhalten folgt"], a:1, ex:"Laut Folie stärkt Bestrafung kein erwünschtes Verhalten, der Bestrafer wird gemieden oder das Verhalten nur in seiner Anwesenheit unterdrückt, dazu kommen Aggression und ein sich selbst verstärkendes Bestrafen.", w:["Bestrafung schwächt Verhaltenstendenzen. Dass sie das Verhalten immer verstärkt, steht nirgends.",null,"Die Probleme sind gerade aus dem menschlichen Alltag bekannt.","Im Gegenteil: Bestrafung soll ohne Verzögerung erfolgen."]},
 {q:"Welche Bedingung nennt Heine für den Einsatz positiver Bestrafung?", o:["Erst schwach beginnen und dann langsam steigern","Nur ab und zu, damit sie überraschend kommt","Sofort und von Beginn an mit nötiger Intensität","Ohne gleichzeitige Verstärkung erwünschten Verhaltens"], a:2, ex:"Bestrafung soll sofort, nicht intermittierend, gleich mit der nötigen Intensität, mit Verstärkung des Erwünschten und mit Erklärung erfolgen.", w:["Langsames Steigern widerspricht der Bedingung „von Beginn an mit notwendiger Intensität“.","Gerade nicht intermittierend: Bestrafung soll jedes Mal erfolgen.",null,"Umgekehrt: mit gleichzeitiger Verstärkung erwünschten Verhaltens."]}
]},
{id:"11-4", t:"Erlernte Hilflosigkeit und Fallbeispiele", html:`
<p><b>Erlernte Hilflosigkeit</b> (Seligman) ist eine mögliche Folge, wenn jemand wiederholt aversiven Reizen ausgesetzt ist, die er als <b>nicht kontrollierbar</b> erlebt. Sie geht einher mit</p>
<ul><li>psychischen Symptomen wie Stress, Angst, Apathie, Depression und psychosomatischen Erkrankungen,</li><li>einer <b>Verminderung der Lernfähigkeit</b>.</li></ul>
<p>Zentral für die Entstehung ist ein <b>Mangel an Kontingenz</b> zwischen Verhalten und Konsequenz: Die Person erfährt, dass ihre Reaktion die Konsequenz nicht kontrolliert. <span class="small muted">Schulbezug: Wer trotz Anstrengung immer schlechte Noten bekommt, erlebt genau diese fehlende Kontingenz.</span></p>
<p><b>Fallbeispiele von den Folien</b> <span class="erg">Lösungsvorschlag</span> <span class="small muted">Die Folien stellen nur die Frage.</span></p>
<table class="kvq"><tr><th>Fall</th><th>Verhalten → Konsequenz</th><th>Art</th></tr>
<tr><td><b>Michael</b> (Klausur 24/25)</td><td>Ohrfeige → zwei Wochen Trainingsverbot, also wird eine appetitive Konsequenz (Fußballspielen) entnommen. Danach schlägt er nicht mehr.</td><td>negative Bestrafung</td></tr>
<tr><td><b>Mutter</b> (Fall 2)</td><td>Süßigkeit kaufen → Quengeln und Weinen hören auf, also fällt etwas Aversives weg. Beim nächsten Mal kauft sie schon vorher.</td><td>negative Verstärkung</td></tr>
<tr><td><b>Lina</b> (Fall 3)</td><td>Quengeln und Weinen → Süßigkeit, also kommt etwas Appetitives hinzu. Beim nächsten Einkauf quengelt sie wieder.</td><td>positive Verstärkung</td></tr>
<tr><td><b>Snoopy</b> (Fall 4)</td><td>dem Zaun nähern → schrilles Piepsen, also kommt etwas Aversives hinzu. Er meidet den Zaun.</td><td>positive Bestrafung</td></tr></table>
<div class="merk"><b>Merksatz</b>Immer zuerst fragen: Wessen Verhalten betrachte ich? Dieselbe Szene (Mutter und Lina) enthält zwei verschiedene Lernprozesse, je nachdem, auf wen man schaut.</div>`,
check:[
 {q:"Was ist laut Folie zentral für die Entstehung erlernter Hilflosigkeit?", o:["Zu häufige Verstärkung durch die Umwelt","Fehlende Kontingenz von Verhalten und Konsequenz","Eine einmalige, aber sehr starke und unerwartete Bestrafung","Die Beobachtung eines hilflosen Modells"], a:1, ex:"Die Person erfährt, dass ihre Reaktion die Konsequenz nicht kontrolliert.", w:["Häufige Verstärkung setzt gerade Kontingenz voraus.",null,"Stärke allein ist nicht entscheidend, sondern die Unkontrollierbarkeit.","Beobachtungslernen ist eine andere Lernform. Hilflosigkeit entsteht durch eigene Erfahrung."]},
 {q:"Fall 2 aus der Vorlesung, Fokus Mutter: Sie kauft die Süßigkeit, das Weinen hört auf, beim nächsten Mal kauft sie schon früher. Was liegt vor?", o:["Positive Verstärkung","Negative Verstärkung","Negative Bestrafung","Positive Bestrafung"], a:1, ex:"Das Verhalten der Mutter (kaufen) wird häufiger, weil dadurch etwas Aversives (Quengeln, Weinen) entfernt wird.", w:["Positive Verstärkung gilt für Lina: Sie bekommt etwas Angenehmes. Für die Mutter fällt etwas weg.",null,"Bestrafung macht ein Verhalten seltener. Das Kaufen wird aber häufiger.","Bei positiver Bestrafung käme etwas Unangenehmes hinzu und das Verhalten würde seltener."]}
]}
];

CARDS[11]=[
 {id:"c11-17", f:"Thorndikes Problemkäfige: Was wurde beobachtet?", b:"Trial and Error: beliebige Verhaltenssequenzen, bis zufällig eine passende Handlung gelingt\nMit jeder Wiederholung: sinkt die Latenz\nErgebnis: das Verhalten wird zum Instrument (Mittel zum Zweck)"},
 {id:"c11-18", f:"Gesetz der Wirkung (Thorndike)", b:"Regel: je größer Befriedigung bzw. Frustration, desto stärker wird die Assoziation Situation (S) – Reaktion (R) gestärkt bzw. geschwächt\nKurz: Verhaltenswahrscheinlichkeit = Funktion der Konsequenzen"},
 {id:"c11-19", f:"Instrumentelles Lernen (Definition)", b:"Was ändert sich: Latenz, Geschwindigkeit, Wahrscheinlichkeit bzw. Häufigkeit eines Verhaltens\nWodurch: Verstärkung, kontingent zu diesem Verhalten\nArt: assoziatives Lernen"},
 {id:"c11-20", f:"Operantes Verhalten (Skinner) vs. instrumentelles Lernen", b:"Operant (Skinner): komplexeres Verhalten, das auf die Umwelt wirkt („operates on“)\nAbgrenzung: nicht reflexartig wie bei der klassischen Konditionierung\nVerwendung: „instrumentell“ eher für natürliche Situationen, Skinner vor allem für kontrollierte Experimente"},
 {id:"c11-21", f:"Primäre, sekundäre und soziale Verstärker", b:"Primär: befriedigen physiologische Bedürfnisse (Hunger, Durst, Wärme)\nSekundär (konditioniert): wirken durch Assoziation mit primären; generalisierte Verstärker wie Geld, Tokens\nSozial: Aufmerksamkeit, Lob, Liebe, nicht eindeutig zuzuordnen\nBeispiel: Süßigkeit (primär), Stempel im Heft (sekundär, Token), Lob vor der Klasse (sozial)."},
 {id:"c11-01", f:"Operante Konditionierung: was wird gelernt?", b:"Die Verknüpfung von Verhalten und Konsequenz (R → S). Die Konsequenz bestimmt, ob das Verhalten künftig häufiger oder seltener auftritt."},
 {id:"c11-02", f:"„Positiv“ und „negativ“ bei operanten Konsequenzen", b:"Positiv: Ein Reiz wird dargeboten.\nNegativ: Ein Reiz wird entzogen.\nKeine Wertung („gut“/„schlecht“).\nBeispiel: Strafarbeit geben ist positiv (etwas kommt dazu), Pausenentzug negativ (etwas wird weggenommen)."},
 {id:"c11-03", f:"Positive Verstärkung", b:"Präsentation einer appetitiven Konsequenz, Zunahme der Frequenz.\nBeispiel Heine: Nachbereitung führt zu besserer Note, Nachbereitung wird häufiger."},
 {id:"c11-04", f:"Negative Verstärkung", b:"Entzug einer aversiven Konsequenz, Zunahme der Frequenz.\nBeispiel Heine: Rückzug aus lauter Lernumgebung bringt Ruhe, Rückzug wird häufiger."},
 {id:"c11-05", f:"Positive Bestrafung", b:"Präsentation einer aversiven Konsequenz, Abnahme der Frequenz.\nBeispiel Heine: Abschreiben führt zu Ärger mit dem Dozenten, es wird seltener abgeschrieben."},

 {id:"c11-08", f:"Die vier intermittierenden Verstärkungspläne", b:"Feste Quote (FQ): exakt jede x-te Reaktion\nVariable Quote (VQ): ungefähr jede x-te Reaktion\nFestes Intervall (FI): erste Reaktion nach x Minuten\nVariables Intervall (VI): durchschnittlich alle x Minuten\nBeispiel: Jeder 10. Kaffee gratis (FQ), Spielautomat (VQ), fester Vokabeltest jeden Freitag (FI), unangekündigte Tests (VI)."},

LESSONS[12]=[
{id:"12-1", t:"Soziales Lernen und Modelle", html:`
<p>Allgemein ist Lernen eine Änderung von Verhalten, die durch Erfahrung bedingt ist. <b>Banduras Theorie des sozialen Lernens</b> betont: Höhere Lebewesen lernen nicht in Isolation, sondern zunächst und vor allem <b>eingebettet in soziale Kontexte</b>.</p>
<p>Unter dem Oberbegriff <b>soziales Lernen</b> werden diskutiert:</p>
<ul><li><b>Beobachtungslernen</b> (observational learning),</li><li><b>Imitationslernen</b> (imitation learning),</li><li><b>stellvertretendes Lernen</b> (vicarious learning).</li></ul>
<p>Zentral ist jeweils das <b>Modell</b>, also eine Verhaltensvorgabe, die der Beobachter erwerben soll. Heine unterscheidet vier Arten:</p>
<table class="kvq"><tr><th>Modell</th><th>Was passiert</th></tr>
<tr><td><b>reales Modell</b></td><td>Ein Anderer (Person, Tier) zeigt ein Verhalten und dessen Konsequenz.</td></tr>
<tr><td><b>symbolisch-verbales Modell</b></td><td>Ein Anderer beschreibt ein Verhalten und instruiert, wie man es ausführt.</td></tr>
<tr><td><b>symbolisch-bildhaftes Modell</b></td><td>Ein Medium zeigt das Verhalten (Film usw.).</td></tr>
<tr><td><b>imaginäres Modell</b></td><td>Ein vorgestellter Anderer dient als Vorbild.</td></tr></table>`,
check:[
 {q:"Eine Sportlehrerin erklärt nur mit Worten, wie der Handstand geht, ohne ihn vorzumachen. Welches Modell ist das?", o:["Reales Modell","Symbolisch-verbales Modell","Symbolisch-bildhaftes Modell","Imaginäres Modell"], a:1, ex:"Das Verhalten wird beschrieben und es wird instruiert, wie man es ausführt.", w:["Ein reales Modell würde den Handstand selbst vormachen.",null,"Symbolisch-bildhaft wäre ein Video oder ein Bild.","Imaginär wäre ein vorgestelltes Vorbild, kein Mensch, der gerade spricht."]},
 {q:"Was ist der Kern von Banduras Theorie des sozialen Lernens?", o:["Lernen geschieht nur durch eigene Konsequenzen","Lernen ist vor allem in soziale Kontexte eingebettet","Lernen geschieht vor allem durch Versuch und Irrtum","Lernen ist vor allem die Kopplung zweier Reize"], a:1, ex:"Höhere Lebewesen lernen nicht isoliert, sondern zunächst und vor allem im sozialen Kontext.", w:["Eigene Konsequenzen sind operante Konditionierung. Bandura betont das Lernen von anderen.",null,"Versuch und Irrtum beschreibt Thorndike.","Die Kopplung zweier Reize ist klassische Konditionierung."]}
]},
{id:"12-2", t:"Beobachtungslernen und Abgrenzung", html:`
<p>Beim <b>Beobachtungslernen</b> ändert sich das Verhalten (Verhaltenskopie), nachdem das Individuum (Mensch oder Tier) ein Modell bei der Ausführung einer Handlung beobachtet hat.</p>
<ul><li>Es ist <b>unabhängig davon, ob Beobachter oder Modell sich bewusst sind, dass gelernt wird</b>.</li>
<li>Weil die Leistung davon profitiert, ein anderes, im Idealfall <b>kompetenteres</b> Individuum zu beobachten, nutzt man es z. B. im <b>Sport</b> oder in der <b>Verhaltenstherapie</b>.</li></ul>
<p>Abzugrenzen sind einfachere Formen sozialer Verhaltensbeeinflussung, die typischerweise nur zu <b>kurzfristiger</b> Verhaltensänderung führen:</p>
<table class="kvq"><tr><th>Form</th><th>Was passiert</th><th>Beispiel</th></tr>
<tr><td><b>Verhaltensansteckung</b></td><td>Ausführung (mehr oder weniger) instinktiver Verhaltensmuster nach Beobachtung bei einem Artgenossen</td><td>gähnen, fliehen, lachen</td></tr>
<tr><td><b>Aufmerksamkeitslenkung</b></td><td>Das Verhalten eines Artgenossen verändert die Salienz eines Reizes</td><td>Zeigegeste</td></tr></table>
<div class="merk"><b>Merksatz</b>Beobachtungslernen: eine neue Verhaltenskopie, die bleibt. Ansteckung und Aufmerksamkeitslenkung: kurzfristig, ohne dass etwas Neues erworben wird.</div>`,
check:[
 {q:"Im Klassenraum gähnt eine Schülerin, kurz darauf gähnen drei weitere. Was liegt vor?", o:["Beobachtungslernen","Verhaltensansteckung","Aufmerksamkeitslenkung","Stellvertretende Verstärkung"], a:1, ex:"Ein instinktives Verhaltensmuster wird nach Beobachtung ausgeführt, kurzfristig und ohne Erwerb von etwas Neuem.", w:["Beobachtungslernen erwirbt ein neues Verhalten dauerhaft. Gähnen ist instinktiv.",null,"Aufmerksamkeitslenkung hieße, dass ein Reiz durch das Verhalten anderer auffälliger wird, etwa durch Zeigen.","Hier wird nichts verstärkt, das Gähnen wird einfach ausgelöst."]},
 {q:"Was gilt laut Folie für Beobachtungslernen?", o:["Es setzt voraus, dass das Modell bewusst lehren will","Es findet ausschließlich bei Menschen statt, nicht bei Tieren","Es ist unabhängig davon, ob das Lernen bewusst geschieht","Es führt nur zu einer kurzfristigen Änderung im Verhalten"], a:2, ex:"Weder Beobachter noch Modell müssen wissen, dass gelernt wird.", w:["Das Modell muss nichts davon wissen.","Die Folie nennt ausdrücklich Mensch und Tier.",null,"Kurzfristig sind gerade die einfacheren Formen wie Verhaltensansteckung."]}
]},
{id:"12-3", t:"Determinanten und Selbstwirksamkeitserwartung", html:`
<p>Ob beobachtetes Verhalten übernommen wird, hängt ab von:</p>
<table class="kvq"><tr><th>Determinante</th><th>Wirkung</th></tr>
<tr><td><b>beobachtete Konsequenzen für das Modell</b></td><td>Je positiver, desto eher wird das Verhalten übernommen.</td></tr>
<tr><td><b>Konsequenzen für den Beobachter</b></td><td>Je positiver, desto eher wird es wiederholt (vgl. „see aggression, do aggression“, <b>Bobo-Doll-Experimente</b> der 1960er).</td></tr>
<tr><td><b>Eigenschaften des Modells</b></td><td>Je attraktiver und ähnlicher dem Beobachter, desto eher wird übernommen.</td></tr>
<tr><td><b>Fähigkeiten des Beobachters</b></td><td>Er muss grundsätzlich in der Lage sein, das Verhalten auszuführen.</td></tr>
<tr><td><b>Lerngeschichte des Beobachters</b></td><td>Bisherige Erfahrungen mit dem Übernehmen von Modellverhalten (→ Selbstwirksamkeitserwartung).</td></tr></table>
<p>Bandura geht davon aus, dass Lernprozesse stark von <b>kognitiven Bewertungsprozessen</b> abhängen. Die wichtigste ist die <b>Selbstwirksamkeitserwartung</b>: die Beurteilung der eigenen Fähigkeiten, ein Zielverhalten zu planen und auszuführen.</p>
<ul><li>Relevant ist <b>nicht das tatsächliche Können</b>, sondern die individuelle Beurteilung, was man mit seinen Fähigkeiten erreichen kann.</li>
<li>Lernen wird wahrscheinlicher, wenn die Selbstwirksamkeitserwartung positiv ist, also ein Ergebnis als möglich erkannt wird.</li></ul>
<div class="merk"><b>Schulbezug</b>Ein Mitschüler als Modell wirkt oft besser als die Lehrkraft, weil er ähnlicher ist. Wer sieht, dass ein ähnlicher Schüler die Aufgabe schafft und dafür gelobt wird, traut es sich eher selbst zu.</div>`,

 {q:"Was ist bei der Selbstwirksamkeitserwartung entscheidend?", o:["Das tatsächliche, messbare Können der Person","Die eigene Beurteilung, was man erreichen kann","Die Bewertung der Person durch die Lehrkraft","Die Zahl der bisher erhaltenen Belohnungen für das Verhalten"], a:1, ex:"Nicht das Können zählt, sondern die subjektive Einschätzung, ein Ergebnis zu erreichen.", w:["Die Folie betont ausdrücklich, dass es nicht um das tatsächliche Können geht.",null,"Es ist eine Selbstbeurteilung, keine Fremdbeurteilung.","Belohnungen können die Lerngeschichte prägen, entscheidend ist aber die eigene Beurteilung."]}
]}

  q:"Die Lerntheorie nach Skinner unterscheidet vier operante Konsequenzen. Fallbeispiel: Michael spielt in einem Fußballverein. Während eines Spiels foult ihn ein gegnerischer Spieler, woraufhin Michael dem Spieler eine Ohrfeige verpasst. Der Trainer, der dieses Verhalten nicht billigt, erteilt Michael für zwei Wochen Trainingsverbot. Als Michael nach diesen zwei Wochen wieder an einem Spiel teilnimmt und erneut gefoult wird, schlägt Michael seinen Gegenspieler nicht. a) Benennen Sie für das Fallbeispiel die Art der operanten Konsequenz korrekt (linke Spalte, 2 P.). b) Beschreiben Sie den Mechanismus allgemein und identifizieren Sie den relevanten Aspekt der Situation im Fallbeispiel (mittlere Spalte, 2 + 2 P.). c) Welche Effekte sind für künftiges Verhalten (Auftretenshäufigkeit) allgemein und im konkreten Fall zu erwarten? (rechte Spalte, 2 + 2 P.) In der Klausur steht das als Tabelle mit Lückensätzen: „Allgemein bedeutet das, dass eine ___ Konsequenz ___ wird.“",
  k:["a) Negative Bestrafung","b) allgemein: Eine appetitive (angenehme) Konsequenz wird entnommen","b) konkret: Der Trainer entzieht ihm für zwei Wochen das Training bzw. Fußballspielen","c) allgemein: Die Auftretenshäufigkeit des Verhaltens sinkt","c) konkret: Michael schlägt seinen Gegenspieler beim nächsten Foul nicht"],
  m:"a) Es handelt sich um eine negative Bestrafung. b) Allgemein bedeutet das, dass eine appetitive Konsequenz entnommen wird. Im konkreten Fall entzieht der Trainer Michael für zwei Wochen das Training, also das Fußballspielen. c) Allgemein ist zu erwarten, dass die Auftretenshäufigkeit des bestraften Verhaltens sinkt. Im konkreten Fall zeigt sich der Lerneffekt darin, dass Michael seinem Gegenspieler nach einem Foul keine Ohrfeige mehr gibt."},
 {id:"k11-2", ch:11, pts:8,
  q:"Frau Schmidt kauft ihrer quengelnden Tochter Lina im Supermarkt nach einiger Zeit eine Süßigkeit. Beim nächsten Einkauf quengelt Lina wieder, und die Mutter kauft die Süßigkeit sofort. Beschreiben Sie die Situation mit Konzepten operanten Lernens, einmal mit Fokus auf die Mutter und einmal mit Fokus auf Lina.",
  k:["Fokus Mutter: Verhalten = Süßigkeit kaufen","Konsequenz: Quengeln/Weinen (aversiv) hört auf → negative Verstärkung","Kaufen wird häufiger, sie kauft sogar früher (bevor es eskaliert)","Fokus Lina: Verhalten = Quengeln/Weinen","Konsequenz: Süßigkeit (appetitiv) wird dargeboten → positive Verstärkung","Quengeln wird häufiger; beide verstärken sich gegenseitig"],
  m:"Mit Fokus auf die Mutter: Ihr Verhalten ist das Kaufen der Süßigkeit. Darauf hört das Quengeln und Weinen auf, ein aversiver Reiz wird also entfernt. Das ist negative Verstärkung, das Kaufen wird häufiger; beim nächsten Einkauf kauft sie schon, bevor die Situation eskaliert. Mit Fokus auf Lina: Ihr Verhalten ist das Quengeln und Weinen. Darauf folgt die Süßigkeit, ein appetitiver Reiz wird dargeboten. Das ist positive Verstärkung, das Quengeln wird häufiger, wie der nächste Einkauf zeigt. Mutter und Kind verstärken sich so gegenseitig."},
 {id:"k12-1", ch:12, pts:8,
  q:"Erläutern Sie, wovon es laut Bandura abhängt, ob Schülerinnen und Schüler das Verhalten eines Modells übernehmen. Leiten Sie zwei Konsequenzen für die Unterrichtsgestaltung ab.",
  k:["Beobachtete Konsequenzen für das Modell (je positiver, desto eher)","Konsequenzen für den Beobachter selbst","Eigenschaften des Modells: attraktiv, ähnlich","Fähigkeiten des Beobachters: muss Verhalten ausführen können","Lerngeschichte / Selbstwirksamkeitserwartung","zwei passende Konsequenzen, z. B. Mitschüler als Modell, erwünschtes Modellverhalten sichtbar loben, Aufgaben an Fähigkeiten anpassen"],
  m:"Übernommen wird Verhalten eher, wenn das Modell dafür positive Konsequenzen erfährt und wenn auch der Beobachter selbst positive Konsequenzen erlebt. Das Modell sollte attraktiv und dem Beobachter ähnlich sein. Der Beobachter muss grundsätzlich in der Lage sein, das Verhalten auszuführen, und seine Lerngeschichte spielt mit, vor allem seine Selbstwirksamkeitserwartung, also die eigene Beurteilung, das Ergebnis erreichen zu können. Für den Unterricht folgt daraus etwa, Mitschülerinnen und Mitschüler als Modelle einzusetzen, weil sie ähnlicher sind als die Lehrkraft, und erwünschtes Verhalten sichtbar zu verstärken, damit die Klasse die positiven Konsequenzen beobachtet. Aufgaben sollten so gestuft sein, dass die Lernenden sie sich zutrauen."}
);

/* ================= Kapitel 2: Gedächtnis =================
   Grundlage: Folien Sitzung 4 (Input 3/4: Folien 22–26) und Sitzung 5 (Input 2–4, Exkurs Schlaf: Folien 12–29), WiSe 26/27;

LESSONS[2]=[
{id:"2-1", t:"Was Gedächtnis ist", html:`
<p><b>Gedächtnis</b> ist das Fortbestehen aufgenommener Information über die Zeit, das deren Verfügbarmachung ermöglicht.</p>
<p>Zwei Konzepte von Gedächtnis:</p>
<ul><li><b>Strukturelle Sicht:</b> Gedächtnis ist ein <i>Ort</i>, an dem Information aufbewahrt wird. Räumliche Metaphern dominieren („Speicher“).</li>
<li><b>Prozedurale Sicht:</b> Gedächtnis sind die <i>Prozesse</i>, durch die Gedächtnisinhalte entstehen. Eine dynamische Konzeption.</li></ul>
<p>Die drei zentralen <b>Gedächtnisprozesse</b>:</p>
<ol><li><b>Enkodierung</b> von Information,</li><li><b>Speicherung</b> von Information,</li><li><b>Abruf</b> von Information.</li></ol>
<p><b>Vergessen</b> bezeichnet den Verlust von zugreifbarer Information.</p>
<div class="merk"><b>Merksatz</b>Enkodieren, speichern, abrufen. Vergessen heißt: Die Information ist nicht mehr zugreifbar.</div>`,
check:[
 {q:"Wie definiert Heine Gedächtnis?", o:["Als fester Ort, an dem aufgenommene Information dauerhaft aufbewahrt wird","Als Fortbestehen aufgenommener Information über die Zeit, das sie verfügbar macht","Als relativ dauerhafte Veränderung des Verhaltens oder Verhaltenspotenzials durch Erfahrung","Als aktives System, das Information für die aktuelle Aufgabe bereithält"], a:1, ex:"So steht es auf der Folie. Die Sicht als „Ort“ ist nur eine von zwei Konzeptionen (strukturell).", w:["Das ist nur die strukturelle Sicht mit räumlicher Metapher, nicht die Definition.",null,"Das ist die Definition von Lernen, nicht von Gedächtnis.","Das beschreibt das Arbeitsgedächtnis (Baddeley & Hitch), nicht Gedächtnis allgemein."]},
 {q:"Welche Sicht betrachtet Gedächtnis als dynamisch?", o:["Die strukturelle Sicht","Die prozedurale Sicht","Das modale Modell","Die Speichersicht"], a:1, ex:"Prozedural: Gedächtnis sind die Prozesse, durch die Gedächtnisinhalte entstehen.", w:["Die strukturelle Sicht arbeitet mit räumlichen Metaphern, also eher statisch.",null,"Das modale Modell ist ein Mehrspeichermodell, also strukturell gedacht.","„Speicher“ ist gerade die räumliche Metapher der strukturellen Sicht."]}
]},
{id:"2-2", t:"Das modale Modell (Atkinson & Shiffrin, 1968)", html:`
<p>Das <b>Mehrkomponentenmodell</b> (modales Modell) von <b>Atkinson & Shiffrin (1968)</b> nimmt unterschiedliche Gedächtnissysteme an. Sie unterscheiden sich in</p>
<ul><li>zeitlichen Constraints,</li><li>Kapazitäts-Constraints,</li><li>Vergessensmechanismen,</li><li>ihrer neuroanatomischen Basis.</li></ul>
<table class="kvq"><tr><th>Speicher</th><th>Dauer</th><th>Vergessen</th></tr>
<tr><td><b>Sensorischer Speicher</b> (visuell, auditiv, haptisch)</td><td>unter 1 Sekunde</td><td>Zerfall nicht beachteter Information</td></tr>
<tr><td><b>Kurzzeitspeicher</b></td><td>mehrere Sekunden, aber verlängerbar durch <b>Rehearsal</b></td><td>Interferenz und Verdrängung durch neue Information</td></tr>
<tr><td><b>Langzeitgedächtnis</b> (episodisch, semantisch, prozedural)</td><td>beliebige Dauer</td><td>Interferenz oder Zerfall</td></tr></table>
<p>Der Weg: Reizinformation → sensorischer Speicher → (durch <b>Aufmerksamkeit</b>) Kurzzeitspeicher → (Transfer) Langzeitgedächtnis. Aus dem Langzeitgedächtnis wird in den Kurzzeitspeicher <b>abgerufen</b>. Kontrollprozesse im Kurzzeitspeicher sind z. B. Wiederholen (Rehearsal) und Elaboration.</p>`,
check:[
 {q:"Worin unterscheiden sich die Speicher im modalen Modell laut Folie nicht?", o:["Zeitliche Constraints","Kapazitäts-Constraints","Vergessensmechanismen","Persönlichkeit"], a:3, ex:"Genannt sind zeitliche Constraints, Kapazität, Vergessensmechanismen und neuroanatomische Basis.", w:["Zeitliche Constraints sind ein Unterscheidungsmerkmal (unter 1 Sek., mehrere Sek., beliebig).","Kapazität ist ein Unterscheidungsmerkmal.","Vergessensmechanismen sind ein Unterscheidungsmerkmal (Zerfall, Interferenz).",null]},
 {q:"Wie lange hält der Kurzzeitspeicher Information im modalen Modell?", o:["Unter einer Sekunde, dann zerfällt die Spur","Mehrere Sekunden, länger mit Rehearsal","Etwa 20 Minuten, solange die Aufmerksamkeit bleibt","Bis zum nächsten Schlaf, in dem konsolidiert wird"], a:1, ex:"Ohne Wiederholung geht die Information nach Sekunden verloren. Rehearsal hält sie aktiv.", w:["Unter einer Sekunde gilt für den sensorischen Speicher.",null,"Ohne Rehearsal geht Information nach etwa 20 Sekunden verloren, nicht nach Minuten.","Konsolidierung im Schlaf betrifft das Langzeitgedächtnis."]}
]},
{id:"2-3", t:"Gedächtnissysteme und semantisches Netzwerk", html:`
<p>Heines Übersicht der Gedächtnissysteme:</p>
<table class="kvq"><tr><th colspan="2">Langzeitgedächtnis</th></tr>
<tr><td><b>deklarativ</b> (explizit)</td><td><b>episodisches Gedächtnis</b>: persönliche Erlebnisse<br><b>semantisches Gedächtnis</b>: Weltwissen, Sprache</td></tr>
<tr><td><b>non-deklarativ</b> (implizit)</td><td><b>prozedurales Gedächtnis</b>: motorische Fertigkeiten<br><b>PRS</b>: perzeptuelles Priming<br><b>klassische Konditionierung</b>: CS-UCS-Assoziation<br><b>non-assoziatives Lernen</b>: Habituation und Sensitivierung</td></tr>
<tr><th colspan="2">Transientes Gedächtnis</th></tr>
<tr><td colspan="2">sensorische Register, Kurzzeit- und Arbeitsgedächtnis</td></tr></table>
<p><b>Struktur des semantischen Gedächtnisses</b>: das <b>Spreading-Activation-Modell</b> von <b>Collins & Loftus (1975)</b>. Annahmen:</p>
<ul><li>Semantische Konzepte sind in einem <b>nicht-hierarchischen Netzwerk</b> gespeichert.</li>
<li>Je mehr Eigenschaften zwei Konzepte teilen, desto mehr Verbindungen haben sie.</li>
<li>Wird ein Konzept verarbeitet, wird es <b>aktiviert</b>. Die Aktivierung <b>breitet sich auf nahe liegende Knoten aus</b>.</li>
<li>Die Aktivierung nimmt mit zunehmender <b>Entfernung</b> vom Zielknoten ab, und sie nimmt mit der <b>Zeit</b> ab.</li></ul>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd t">wahr</span></span><span>Spreading Activation: semantische Inhalte in einem nicht-hierarchischen Netzwerk</span></div>
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Das prozedurale Gedächtnis ist Teil des transienten Gedächtnisses.“<br><span class="small muted">Grund: Es gehört zum (non-deklarativen) Langzeitgedächtnis.</span></span></div>
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Inhalte aus dem expliziten LZG können nicht verbalisiert werden.“<br><span class="small muted">Grund: Explizite, deklarative Inhalte sind bewusst und berichtbar.</span></span></div></div></div>`,
check:[
 {q:"Wohin gehört das prozedurale Gedächtnis?", o:["Zum transienten Gedächtnis (Kurzzeit- und Arbeitsgedächtnis)","Zum deklarativen Langzeitgedächtnis","Zum non-deklarativen Langzeitgedächtnis","Zum episodischen Teil des deklarativen Gedächtnisses"], a:2, ex:"Prozedurales Gedächtnis (motorische Fertigkeiten) ist Teil des impliziten, non-deklarativen LZG. Genau das wurde 24/25 abgefragt.", w:["Klausur 24/25: falsch. Prozedurales Gedächtnis ist Langzeitgedächtnis.","Deklarativ sind episodisches und semantisches Gedächtnis.",null,"Episodisch sind persönliche Erlebnisse, also deklarative Inhalte."]},
 {q:"Was nimmt das Spreading-Activation-Modell an?", o:["Konzepte sind streng hierarchisch nach Ober- und Unterbegriffen geordnet","Aktivierung breitet sich auf nahe Knoten aus, mit Entfernung schwächer","Aktivierung erreicht alle Knoten gleich stark, egal wie weit entfernt","Einmal aktivierte Konzepte bleiben dauerhaft aktiviert"], a:1, ex:"Collins & Loftus (1975): nicht-hierarchisches Netzwerk, Aktivierung breitet sich aus, schwächer mit Entfernung und Zeit.", w:["Collins & Loftus (1975) nehmen gerade ein nicht-hierarchisches Netzwerk an (Klausur 24/25).",null,"Die Aktivierung wird mit der Entfernung schwächer.","Die Aktivierung nimmt mit der Zeit ab."]}
]},
{id:"2-4", t:"Episodisches Gedächtnis und Kontext", html:`
<p>Neben dem semantischen Gedächtnis für Fakten und Objekte haben Menschen Wissen, das zum „was“ auch enthält:</p>
<ul><li>„<b>wann</b>“ (Zeitpunkt),</li><li>„<b>wo</b>“ (Ort),</li><li>„<b>wie</b>“ (situativer Kontext).</li></ul>
<p>Das <b>episodische Gedächtnis</b> ist für Enkodierung, Speicherung und Abruf von Wissen um spezifische Ereignisse (komplexe Episoden) verantwortlich, die ein Individuum erlebt hat. Das Wissen wird <b>kontextgebunden</b> enkodiert und abgerufen (→ <b>Quellengedächtnis</b>).</p>
<p>Der Abruferfolg hängt stark von der <b>Passung des externalen und internalen Kontexts</b> bei Enkodierung und Abruf ab:</p>
<table class="kvq"><tr><th>Effekt</th><th>Befund</th></tr>
<tr><td><b>Umgebung</b></td><td>Godden & Baddeley (1975): Abruf ist am besten, wenn Enkodierungs- und Abrufsituation ähnlich sind. <b>Mentales Simulieren</b> des Kontexts reicht oft aus.</td></tr>
<tr><td><b>physischer Status</b></td><td>Godwin et al. (1969): Unter Alkohol Gelerntes wird unter Alkohol besser abgerufen (auch andere psychotrope Substanzen). Miles & Hardman (1998): gleicher kardiovaskulärer Status hilft ebenfalls.</td></tr>
<tr><td><b>emotionaler Status</b></td><td><b>Stimmungsabhängigkeit</b> (Eich et al., 1994): Abruf am besten bei gleicher Stimmung.<br><b>Stimmungskongruenz</b>: Bei positiver bzw. negativer Stimmung werden vor allem positive bzw. negative Ereignisse erinnert (→ Depression).</td></tr></table>
<p>Belegt ist Kontextabhängigkeit auch für Musik, Temperatur, Geruch, Körperlage und Tageszeit.</p>
<div class="merk"><b>Schulbezug</b>Die Klausur wird am PC im PC-Raum geschrieben. Wer am PC übt und sich den Raum vorstellt, nutzt die Kontextpassung.</div>`,
check:[
 {q:"Was unterscheidet Stimmungskongruenz von Stimmungsabhängigkeit?", o:["Kongruenz: Abruf am besten bei gleicher Stimmung wie beim Lernen","Kongruenz: Man erinnert eher, was zur aktuellen Stimmung passt","Kongruenz: Abruf am besten bei gleichem körperlichem Zustand wie beim Lernen","Kongruenz: Gute Stimmung verbessert jeden Abruf gleichermaßen"], a:1, ex:"Abhängigkeit: Abruf am besten bei gleicher Stimmung wie beim Lernen. Kongruenz: ein Bias zu stimmungspassenden Inhalten, etwa bei Depression zu negativen.", w:["Das ist Stimmungsabhängigkeit (Eich et al., 1994). Kongruenz ist ein Bias zu stimmungspassenden Inhalten.",null,"Das ist ein Effekt des physischen Status (z. B. Alkohol), nicht der Stimmung.","Kongruenz heißt: bei negativer Stimmung eher negative Ereignisse, bei positiver eher positive."]},
 {q:"Welche drei Informationen enthält episodisches Wissen über das „was“ hinaus?", o:["wer, warum, wozu","wann, wo, wie","wie viel, wie oft, wie lange","was, womit, wodurch"], a:1, ex:"Zeitpunkt, Ort und situativer Kontext.", w:["Diese W-Fragen nennt die Folie nicht.",null,"Häufigkeiten und Dauer stehen nicht auf der Folie.","„Was“ ist der semantische Teil. Gefragt ist, was darüber hinaus kommt."]}
]},
{id:"2-5", t:"Prozedurales Gedächtnis und Schlaf", html:`
<p>Das <b>implizite, nicht-deklarative Gedächtnis</b> wirkt sich auf Verhalten aus, ohne zwangsläufig ins Bewusstsein zu treten (<b>Schacter, 1987</b>). Davon abzugrenzen ist das <b>explizite Gedächtnis</b>: Seine Inhalte sind bewusst und können berichtet werden, also „deklarativ“.</p>
<p><b>Prozedurales Gedächtnis</b>: durch Übung erworbenes Wissen um automatisierte motorische Muster und Handlungsabläufe, etwa Gehen, Sprechen, Jonglieren.</p>
<p><b>Phasenmodell des Erwerbs prozeduralen Wissens:</b></p>
<table class="kvq"><tr><th>Phase</th><th>Kennzeichen</th></tr>
<tr><td>1. <b>kognitive Phase</b></td><td>Wissen ist explizit, oft verbal repräsentiert (Schemata); die Ausführung erfordert starke Aufmerksamkeit.</td></tr>
<tr><td>2. <b>assoziative Phase</b></td><td>Durch wiederholtes Üben prägen sich zunehmend automatisierte Antwortmuster auf relevante Reize ein.</td></tr>
<tr><td>3. <b>autonome Phase</b></td><td>Sehr genaue, schnelle Ausführung ohne Aufmerksamkeit.</td></tr></table>
<p><b>Exkurs: Langzeitgedächtnis und Schlaf.</b> Schlaf ist unabdingbar für die <b>Konsolidierung</b> (Verfestigung) von LZG-Inhalten. Dabei werden dieselben Hirnareale aktiv wie bei der ersten Reizverarbeitung (Interaktion Hippocampus und Kortex). Schlafphasen wechseln zyklisch:</p>
<ul><li><b>Non-REM-Schlaf</b> (slow-wave sleep, <b>SWS</b>, Stadien III und IV): stärker in der <b>ersten Schlafhälfte</b>, langsame EEG-Oszillationen. Befördert vor allem die Konsolidierung <b>deklarativer</b> Inhalte (Wortpaare).</li>
<li><b>REM-Schlaf</b>: stärker in der <b>zweiten Schlafhälfte</b>, schnelle EEG-Oszillationen und Augenbewegungen. Befördert vor allem <b>nicht-deklarative</b> Inhalte (Mirror-Tracing).</li></ul>`,
check:[
 {q:"In welcher Phase des Fertigkeitserwerbs braucht die Ausführung starke Aufmerksamkeit?", o:["Kognitive Phase","Assoziative Phase","Autonome Phase","In allen drei Phasen gleich stark"], a:0, ex:"Zu Beginn ist das Wissen explizit, oft verbal, und die Ausführung erfordert starke Aufmerksamkeitsfokussierung.", w:[null,"In der assoziativen Phase werden die Muster schon zunehmend automatisiert.","In der autonomen Phase läuft die Ausführung gerade ohne Aufmerksamkeit.","In der autonomen Phase läuft die Ausführung weitgehend ohne Aufmerksamkeit."]},
 {q:"Welcher Schlaf befördert vor allem die Konsolidierung deklarativer Inhalte?", o:["REM-Schlaf in der zweiten Nachthälfte","Früher, SWS-reicher Schlaf","Leichtschlaf (Stadium 1) beim Einschlafen","Jede Schlafphase gleichermaßen"], a:1, ex:"Im klassischen Paradigma profitiert das Lernen von Wortpaaren vor allem vom frühen Tiefschlaf (SWS).", w:["REM-Schlaf befördert vor allem nicht-deklarative Inhalte wie Mirror-Tracing.",null,"Laut Folie ist es der frühe Tiefschlaf (SWS), nicht der Leichtschlaf.","Die Folie trennt: SWS vor allem deklarativ, REM vor allem nicht-deklarativ."]}
]},
{id:"2-6", t:"Sensorisches Gedächtnis und Kurzzeitgedächtnis", html:`
<p>Zum <b>transienten Gedächtnis</b> gehören sensorische Register, Kurzzeit- und Arbeitsgedächtnis.</p>
<p><b>Sensorisches Gedächtnis</b>: unmittelbare und sehr kurze Speicherung eingehender sensorischer Information. Eigenschaften:</p>
<ul><li>streng <b>modalitätsspezifisch</b>,</li><li>sehr kurze Speicherdauer (je nach Sinnesmodalität unterschiedlich),</li><li>Kapazität relativ <b>hoch</b> (z. B. mehr als 7),</li><li><b>unabhängig von Aufmerksamkeit</b> und Bewusstsein,</li><li>Vergessen durch <b>Spurenzerfall</b>.</li></ul>
<p>Funktion: Basis des kontinuierlichen Informationsflusses, den spätere Gedächtnissysteme übernehmen.</p>
<p><b>Kurzzeitgedächtnis</b> (KZG), nach Atkinson & Shiffrin (1968): die Funktion, kleine Informationsmengen kurz in einem aktiven Zustand zu halten.</p>
<ul><li>eine <b>bewusste</b> Verarbeitungsstufe, Information ist leicht zugreifbar,</li>
<li>Information geht nach etwa <b>20 Sekunden</b> verloren, außer sie wird durch <b>Rehearsal</b> aufgefrischt,</li>
<li>Kapazität bei Ungeübten etwa <b>7 ± 2</b> Einheiten (<b>Miller, 1956</b>),</li>
<li><b>Chunking</b>, die Bündelung einfacher Elemente zu Stimuluskomplexen, erlaubt größere Mengen. Chunks werden auf Basis von <b>Vorwissen aus dem LZG</b> gebildet (Lehrbuch Kap. 2: „i-t-b-m-w“ → „IT“, „BMW“),</li>
<li>durch <b>Elaboration</b> (Enkodierung in ein Format, z. B. visuell, semantisch) kann Information ins LZG übergehen.</li></ul>
<p><b>Vergessen im KZG:</b> Spurenverlust über die Zeit (<b>Peterson & Peterson, 1959</b>). Wahrscheinlicher ist aber, dass vor allem <b>Interferenz</b> zwischen Elementen den Abruf behindert (<b>Waugh & Norman, 1965</b>).</p>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd t">wahr</span></span><span>Chunking setzt Zugriff auf Information aus dem LZG voraus.</span></div>
<div><span class="ml"><span class="vd t">wahr</span></span><span>Gesunde Erwachsene können Information im KZG länger als 20 Sekunden halten.<br><span class="small muted">Grund: Rehearsal</span></span></div></div></div>`,

{id:"2-7", t:"Arbeitsgedächtnis (Baddeley & Hitch, 1974)", html:`
<p>Zwei Schwächen des modalen Modells mit seinem KZG führten zum Konzept des Arbeitsgedächtnisses:</p>
<ul><li><b>Annahme eines passiven Speichers:</b> Wie soll dann aktive Manipulation von Information beim Problemlösen gehen?</li>
<li><b>Annahme eines unitären Speichers:</b> <b>Dual-Task-Studien</b> zeigen, dass bestimmte Aufgabentypen kaum interferieren.</li></ul>
<p>Das <b>Arbeitsgedächtnis</b> (AG) nach <b>Baddeley & Hitch (1974)</b> ist ein <b>aktives</b> Verarbeitungssystem, das die für die aktuelle Aufgabe nötige Information temporär bereitstellt und <b>manipuliert</b>. Es besteht aus mindestens vier Subsystemen, die untereinander und mit dem LZG interagieren:</p>
<table class="kvq"><tr><th>Subsystem</th><th>Aufgabe</th></tr>
<tr><td><b>phonologische Schleife</b></td><td>hält sprachbasierte Information aufrecht</td></tr>
<tr><td><b>räumlich-visueller Notizblock</b></td><td>hält visuell-räumliche Information aufrecht</td></tr>
<tr><td><b>episodischer Puffer</b></td><td>multimodaler Speicher; bindet unterschiedliche Informationsflüsse zu komplexen Mustern („<b>Binding</b>“)</td></tr>
<tr><td><b>zentrale Exekutive</b></td><td>überwacht Verarbeitungsprozesse, verteilt Ressourcen, lenkt Aufmerksamkeit</td></tr></table>
<p>Schleife und Notizblock bestehen jeweils aus einem <b>Speicher</b> und einem <b>Rehearsal-Mechanismus</b>. Die zentrale Exekutive ist angelehnt an das <b>supervisory attentional system</b> (SAS) von Norman & Shallice (1986). Sie ist gefragt, wenn nicht-automatisierte Handlungen ausgeführt werden oder ein Konflikt auftritt und unerwünschte Tendenzen unterdrückt werden müssen.</p>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Räumlich-visuelle und verbale Informationen parallel zu verarbeiten (Dual-Tasking), ist nur mit deutlichen Leistungseinbußen möglich.“<br><span class="small muted">Grund: Getrennte Subsysteme, die Aufgaben interferieren kaum.</span></span></div></div></div>`,

{id:"3-1", t:"Enkodierung und Gedächtnis als Konstruktion", html:`
<p><b>Enkodierung</b> ist der Prozess des Abspeicherns von Information, noch während der Reiz präsent ist. Für die Qualität der Enkodierung sind wichtig:</p>
<ul><li><b>Verarbeitungstiefe</b> („levels of processing“, „deep/shallow encoding“): Je tiefer, also z. B. semantisch statt nur oberflächlich verarbeitet, desto besser wird erinnert.</li>
<li><b>Passung der Enkodierungs- und Abrufprozesse</b>,</li>
<li><b>Vorwissen</b>,</li>
<li><b>Lernrate</b>: Bei expliziten Inhalten ist verteiltes Lernen dem massierten überlegen.</li></ul>
<p><b>Gedächtnis als konstruktiver Prozess:</b> Gedächtnisinhalte sind <b>keine objektiven Abbildungen</b> von Reizen oder Ereignissen (siehe <b>Augenzeugenberichte</b>). <b>Schemata</b> und <b>Skripte</b> (gelernte Muster von Ereignisabfolgen) wirken als „Situationsmodelle“ und lenken</p>
<ul><li>die Enkodierung durch Selektion, Abstraktion, Interpretation (inferenzielle Prozesse) und Integration von Informationseinheiten,</li>
<li>den Abruf durch <b>Rekonstruktion</b> von Inhalten.</li></ul>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Gedächtnisinhalte sind objektive Repräsentationen von Stimuli und Ereignissen.“</span></div>
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Je tiefer Information bei der Enkodierung verarbeitet wurde, desto schwieriger ist der Abruf.“</span></div></div></div>
<p class="small muted">Die Aussage zum verteilten Lernen stammt aus der Grafik auf Folie 27 (Sitzung 4).</p>`,

{id:"3-2", t:"Behalten und Abruf", html:`
<p><b>Behaltensleistung:</b> Nach einem anfänglichen Abfall in den ersten <b>2 bis 3 Jahren</b> nach dem Lernen bleibt semantisches Wissen relativ stabil („<b>permastore</b>“). <b>Abruf wirkt konservierend</b>. Allerdings erinnert man bei jedem Abruf womöglich nicht das ursprüngliche Ereignis, sondern das, was zuletzt erinnert wurde.</p>
<p>Beim <b>Abruf</b> wird ein Gedächtnisinhalt (z. B. die Vokabel „agua“) nach einem <b>Schlüsselreiz</b> (retrieval cue, hier „water“) reproduziert. Was den Abruf bestimmt:</p>
<table class="kvq"><tr><th>Faktor</th><th>Wirkung</th></tr>
<tr><td><b>Aufmerksamkeitslenkung</b></td><td>Der Abruferfolg sinkt, wenn der Cue nicht beachtet wird.</td></tr>
<tr><td><b>Cue-Relevanz</b></td><td>Der Cue muss mit dem Ziel assoziiert sein, also Ähnlichkeit zwischen Enkodierungs- und Abrufphase.</td></tr>
<tr><td><b>assoziative Stärke</b></td><td>Cue und Ziel müssen hinreichend stark verknüpft sein.</td></tr>
<tr><td><b>Anzahl der Cues</b></td><td>Kombinationen von Cues wirken besser als einzelne.</td></tr>
<tr><td><b>Stärke der Gedächtnisspur</b></td><td>Schwach repräsentierte Inhalte sind schlechter abrufbar.</td></tr>
<tr><td><b>Abrufstrategie</b></td><td>Sie sollte der Enkodierungsstrategie ähneln.</td></tr>
<tr><td><b>mentaler Modus</b></td><td>Ein aktiviertes Schema richtet die Aufmerksamkeit auf relevante Cues.</td></tr></table>
<div class="merk"><b>Merksatz</b>Viele verschiedene Cues zu einem Inhalt helfen. Viele Inhalte an einem Cue schaden (Cue-Overload, nächste Lektion).</div>`,

{id:"3-3", t:"Vergessen und Interferenz", html:`
<p><b>Inzidentelles Vergessen</b> im Laufe der Zeit entsteht durch:</p>
<ul><li><b>Spurenzerfall</b>: graduelles Abschwächen der Gedächtnisspur. Unklar, ob es ihn im LZG gibt, denn er lässt sich nicht untersuchen: Jeder Abruf zum Prüfen führt zur Konsolidierung.</li>
<li><b>Kontextfluktuation</b>: Abruf-Cues gehen verloren, weil sich der Kontext verändert.</li>
<li><b>Interferenz</b>: Der Abruf einer Information wird gestört, weil eine ähnliche Information gespeichert wird.
 <ul><li><b>Cue-Competition</b>: Ein Abruf-Cue ist mit mehr als einer Gedächtnisspur verknüpft, die Inhalte blockieren sich gegenseitig.</li>
 <li><b>Cue-Overload-Prinzip</b>: Die Abrufleistung sinkt systematisch mit der Anzahl der Einheiten, die mit einem Cue verknüpft sind.</li></ul></li></ul>
<table class="kvq"><tr><th>Interferenzphänomen</th><th>Was stört was?</th></tr>
<tr><td><b>retroaktive Interferenz</b></td><td><b>Neu</b> erworbene Information stört den Abruf <b>früher</b> erworbener Inhalte.</td></tr>
<tr><td><b>proaktive Interferenz</b></td><td><b>Früher</b> erworbene Information stört den Abruf <b>später</b> erworbener Inhalte.</td></tr>
<tr><td><b>abrufinduziertes Vergessen</b></td><td>Der Abruf bestimmter Teilinformationen behindert einen späteren Abruf anderer Informationsteile.</td></tr></table>
<div class="merk"><b>Eselsbrücke</b><div class="mrows">
<div><span class="ml">retro</span><span>„zurück“: Das Neue wirkt zurück auf das Alte.</span></div>
<div><span class="ml">pro</span><span>„vorwärts“: Das Alte wirkt nach vorn auf das Neue.</span></div></div></div>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Je mehr unterschiedliche Gedächtnisspuren mit einem Cue verknüpft sind, desto besser der Abruf.“<br><span class="small muted">Grund: Cue-Overload</span></span></div>
<div><span class="ml"><span class="vd t">wahr</span></span><span>Proaktive Interferenz: Früheres stört den Abruf von Späterem.</span></div>
<div><span class="ml"><span class="vd t">wahr</span></span><span>Kontextfluktuation bedingt Vergessen, weil relevante Abrufreize verlorengehen können.</span></div></div></div>`,
