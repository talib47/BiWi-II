<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiWi II</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiWi II">
<meta name="theme-color" content="#5E3F73">
<link rel="apple-touch-icon" href="/BiWi-II/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="/BiWi-II/icon-192.png?v=3">
<link rel="manifest" href="/BiWi-II/manifest.webmanifest?v=3">
<style>
/* Layout: eine schmale Lernspalte (max. 42rem) mit fester Tableiste unten, wie die W&G-I-App; eigene Akzentfarbe (Pflaume) für BiWi II Psychologie */
:root{
  --bg:#F0EEF2; --surface:#FAF9FB; --ink:#211B27; --muted:#625A6B; --line:#D3CDD9;
  --accent:#5E3F73; --accent-ink:#FFFFFF; --accent-soft:#E7DEEF;
  --good:#2F7A4A; --good-soft:#DDEEE2; --bad:#A3392B; --bad-soft:#F4DEDA; --gold:#A87B1F;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#151219; --surface:#1E1A24; --ink:#E8E3EE; --muted:#A79DB1; --line:#3A3242;
    --accent:#C9AEDF; --accent-ink:#1A1222; --accent-soft:#34293F;
    --good:#6CC28B; --good-soft:#1E3327; --bad:#E58373; --bad-soft:#3A2420; --gold:#D9AE55; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#151219; --surface:#1E1A24; --ink:#E8E3EE; --muted:#A79DB1; --line:#3A3242;
  --accent:#C9AEDF; --accent-ink:#1A1222; --accent-soft:#34293F;
  --good:#6CC28B; --good-soft:#1E3327; --bad:#E58373; --bad-soft:#3A2420; --gold:#D9AE55; }
*{box-sizing:border-box}
html{font-size:calc(100% * var(--z,1))}
.zoom{position:fixed;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(72px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;z-index:6}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;opacity:.9;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tag{display:inline-block;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.tag.core{color:var(--accent);border:1px solid var(--accent)}
.tag.bg{color:var(--muted);border:1px dashed var(--line)}
.cctx{margin:-4px 0 0;font-size:.82rem;color:var(--muted)}
.cinfo{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:.82rem;line-height:1.45;color:var(--muted)}
.cinfo .cl{display:block}
.cinfo .cl+.cl{margin-top:3px}
.cinfo b{color:var(--ink);font-weight:600}
.cinfo .ci{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);font:600 .7rem/16px var(--serif);font-style:italic;text-align:center;margin-top:1px}
.wlink{color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.4}
.wlink:hover{text-decoration:underline}
.mc .idk{border-style:dashed;color:var(--muted);text-align:center}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:42rem;margin:0 auto;padding-block:20px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .3em}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.l1{color:var(--gold);border-color:var(--gold)}
.chip.l2{color:var(--accent);border-color:var(--accent)}
.chip.l3{color:var(--good);border-color:var(--good)}
.chip.soon{border-style:dashed}

/* Klausuraufbau */
.parts{display:grid;grid-template-columns:12fr 24fr 24fr;gap:4px;margin:10px 0 8px}
.parts div{height:10px;border-radius:3px;background:var(--line)}
.parts div.on{background:var(--accent)}
.partlist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-size:.92rem}
.partlist b{font-variant-numeric:tabular-nums}

/* Aufgabenliste */
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.titem:first-child{border-top:0}
.titem .t{font-weight:600}
.titem .d{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good)}

/* Aufgabe */
.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.data th,.data td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.data th{font-weight:600;color:var(--muted);font-size:.8rem}
.data td{font-family:var(--mono)}
.tablewrap{overflow-x:auto;margin:8px 0 2px}
.eq{font-family:var(--mono);font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.step.ok{border-color:var(--good);background:var(--good-soft)}
.step.no{border-color:var(--bad);background:var(--bad-soft)}
.step .lab{font-weight:600}
.step .why{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.inp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp input{width:9.5rem;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:1.05rem}
.inp input:focus{border-color:var(--accent)}
.res{font-size:.9rem;margin-top:8px}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
.hint{font-size:.88rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}

/* Schmierzettel */
.pad{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.pad canvas{display:block;width:100%;height:240px;touch-action:none}
.pad .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.pad .tools button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem}
.pad .ph{position:absolute;left:12px;top:10px;font-size:.8rem;color:var(--muted);pointer-events:none}

/* Statistik */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;margin:10px 0 4px}
.week div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.weekl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.75rem;color:var(--muted);text-align:center;line-height:1.3}
.weekl b{display:block;color:var(--ink);font-weight:600}
.weekl .n{display:block;margin-top:3px;font-size:.7rem}
.weekl .today b{color:var(--accent)}
.week div.today{opacity:1}.week div{opacity:.6}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.srow:first-of-type{border-top:0}
.srow span{font-variant-numeric:tabular-nums}

/* Tableiste */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:5}
nav button{flex:1;max-width:9rem;background:none;border:0;border-radius:10px;padding:9px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){ .step{transition:background .2s,border-color .2s} }

/* ===== Lernpfad, Lektionen, Karten, Grafiken, Essay ===== */
.chap{display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.chap:first-child{border-top:0}
.chap .no{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--accent);text-align:center}
.chap .t{font-weight:600;min-width:0}
.chap .d{grid-column:2/-1;font-size:.82rem;color:var(--muted)}
.chap .bar{grid-column:2/-1}
.chap.off .no,.chap.off .t{color:var(--muted)}
.chap:disabled{cursor:default}
.modes{display:flex;flex-direction:column}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mode:first-child{border-top:0}
.mode .t{font-weight:600}
.mode .d{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.mode .n{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.today{border-color:var(--accent);background:var(--accent-soft)}
.lesson h2{margin-top:.2em}
.lesson p,.lesson li{max-width:65ch}
.lesson ul{padding-left:1.2em;margin:0 0 .8em}
.lesson li{margin:.2em 0}
.merk{border-left:4px solid var(--gold);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0}
.merk>b:first-child{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.kv{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 10px}
.kv td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.kv td:first-child{font-weight:600;white-space:nowrap;padding-right:10px}
.mc{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mc button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mc button.r{border-color:var(--good);background:var(--good-soft)}
.mc button.w{border-color:var(--bad);background:var(--bad-soft)}
.mc button:disabled{cursor:default;color:var(--ink)}
.ex{font-size:.9rem;margin-top:8px}
.card{min-height:12rem;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .front{font-family:var(--serif);font-size:1.25rem;font-weight:600;text-wrap:balance}
.card .back{border-top:1px solid var(--line);padding-top:10px}
.card.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.tap:active{transform:scale(.995)}
.card .tapnote{align-self:flex-end;font-size:.75rem;color:var(--muted);margin-top:-2px}
/* Kartenrückseite: Absätze, Listen, Begriffspaare, Vergleichstabelle */
.cb p{margin:0 0 8px} .cb p:last-child{margin-bottom:0}
.cb-dl{margin:0;display:flex;flex-direction:column}
.cb-dl>div{padding:7px 0;border-top:1px solid var(--line)}
.cb-dl>div:first-child{border-top:0;padding-top:0}
.cb-dl dt{font-weight:600}
.cb-dl dd{margin:1px 0 0}
.cb-ul,.cb-ol{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:5px}
.cb-ul li{position:relative;padding-left:1.05rem}
.cb-ul li::before{content:"";position:absolute;left:.15rem;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.75}
.cb-ol{counter-reset:n}
.cb-ol li{display:grid;grid-template-columns:1.5rem 1fr;gap:8px;align-items:start}
.cb-ol li::before{counter-increment:n;content:counter(n);width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:600 .74rem/1.35rem var(--sans);text-align:center;color:var(--muted);margin-top:.1rem}
.cb-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.cb .pd{color:var(--muted)}
.cb-tbl th{font-weight:600;text-align:left;padding:0 10px 4px 0;font-family:var(--serif);font-size:1rem}
.cb-tbl td{padding:1px 10px 7px 0;vertical-align:top}
.cb-tbl tr.lab td{border-top:1px solid var(--line);padding:7px 0 1px;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cb .eq{margin:0 0 8px}
/* Kästen in Lektionen */
.merk .mi{margin:0 0 8px}
.merk .eq{background:var(--surface);display:inline-block;max-width:100%;margin-top:4px}
.merk .kvq{background:transparent}
.mrows{display:flex;flex-direction:column}
.mrows>div{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.mrows>div:first-child{border-top:0;padding-top:2px}
.mrows>div:last-child{padding-bottom:0}
.ml{font-weight:600;font-size:.92rem}
.msteps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.msteps li{display:grid;grid-template-columns:1.5rem 1fr;column-gap:10px;row-gap:3px;align-items:start}
.msteps li::before{counter-increment:s;content:counter(s);grid-row:1 / span 2;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font:600 .74rem/1.3rem var(--sans);text-align:center;margin-top:.05rem}
.msteps .eq{margin:0;display:block}
.vd{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:999px}
.vd.t{color:var(--good);background:var(--good-soft)} .vd.f{color:var(--bad);background:var(--bad-soft)}
.sol-ol{margin:6px 0 0;padding-left:1.2em} .sol-ol li{margin:.25em 0}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.gbox{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.gbox svg,.gbox canvas{position:absolute;inset:0;width:100%;height:100%}
.gbox canvas{touch-action:none}
.gbox .solsvg{pointer-events:none}
.fig{width:100%;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:8px 0 12px}
svg .ax{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .base{stroke:var(--ink);stroke-width:2.4;fill:none}
svg .sol{stroke:var(--accent);stroke-width:2.8;fill:none}
svg .gold{stroke:var(--gold);stroke-width:2.8;fill:none}
svg .dash{stroke-dasharray:5 5}
svg .thin{stroke-width:1.4}
svg text{fill:var(--muted);font:13px var(--sans)}
svg text.st{fill:var(--accent);font-weight:600}
svg text.bt{fill:var(--ink)}
svg .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
svg .sdot{fill:var(--accent)}
svg .arrowhead{fill:var(--muted)}
svg .sarrow{fill:var(--accent)}
.essay textarea{width:100%;min-height:16rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font:1rem/1.55 var(--sans);resize:vertical}
.pts{font-variant-numeric:tabular-nums;font-weight:600}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.9rem;margin-bottom:8px}

/* ===== BiWi II: Kreuzaufgaben, Abschnitte, Verständnis-Hilfe ===== */
.sect{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.kz{border-top:1px solid var(--line);padding:12px 0 10px}
.kz:first-of-type{border-top:0;padding-top:4px}
.kz .st{margin:0 0 8px;line-height:1.45}
.kz .st i.no{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.wf{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wf button{background:var(--bg);border:0;padding:8px 16px;font-size:.9rem;font-weight:600;color:var(--muted);min-width:5.5rem}
.wf button+button{border-left:1px solid var(--line)}
.wf button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.wf button.r{background:var(--good-soft);color:var(--good)}
.wf button.w{background:var(--bad-soft);color:var(--bad)}
.wf button:disabled{cursor:default}
.kz .why{font-size:.86rem;color:var(--muted);margin:8px 0 0;line-height:1.45}
.kz .why b{color:var(--ink);font-weight:600}
.pbadge{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}
.unclear{display:flex;gap:10px;align-items:flex-start}
.unclear p{margin:0}
.kvq{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.kvq th,.kvq td{border-top:1px solid var(--line);padding:6px 6px;text-align:left}
.kvq th{font-weight:600;color:var(--muted);font-size:.8rem}
svg .fillA{fill:var(--accent-soft);stroke:none}
svg .fillB{fill:var(--accent-soft);opacity:.55;stroke:none}
.kvq .nw{white-space:nowrap}
.chip.flag{color:var(--gold);border-color:var(--gold)}
/* ===== Aus Wirtschaft II: Rückmeldungen, Beispielboxen, Tageseinheit, Zeichen, Statistik ===== */
/* ===== Strukturierte Inhalte: Begriffslisten, Gegenüberstellungen, Beispielboxen, Formeln ===== */
.eq{white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:visible;line-height:1.55}
.pz{color:var(--muted);font-size:.9em}
.dlist{display:grid;grid-template-columns:fit-content(42%) 1fr;margin:4px 0 8px}
.dlist>b,.dlist>span{padding:6px 0;border-top:1px solid var(--line);min-width:0;overflow-wrap:break-word}
.dlist>b{padding-right:14px;font-weight:600;hyphens:auto;-webkit-hyphens:auto}
.dlist>b:first-child,.dlist>b:first-child+span{border-top:0}
.dlist .eq{margin:4px 0 2px}
.cmp{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 10px}
.cmp th,.cmp td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.cmp thead th{border-top:0;font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cmp tbody th{font-weight:600;padding-left:0}
.cmp td{overflow-wrap:break-word}
@media (max-width:560px){
  .cmp:not(.tight) thead{display:none}
  .cmp:not(.tight),.cmp:not(.tight) tbody,.cmp:not(.tight) tr,.cmp:not(.tight) th,.cmp:not(.tight) td{display:block;width:100%}

<body>
<div id="sessbar" hidden></div>
<main id="app"></main>
<nav id="nav"></nav>
<div class="zoom" role="group" aria-label="Schriftgröße"><button id="zIn" aria-label="Größer">+</button><button id="zOut" aria-label="Kleiner">−</button></div>

<script>
"use strict";
/* ================= Speicher (eigene Schlüssel, damit nichts mit anderen Apps unter talib47.github.io kollidiert) ================= */
const KEY="bw2-lernapp-v1";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let state;
try{ state=JSON.parse(lsGet(KEY)||"null"); }catch(e){ state=null; }
if(!state||typeof state!=="object") state={};
function norm(){ for(const k of ["lvl","streak","hist","days","lessons","box","graphs","essays","drafts","kreuz","unclear","qbox","qlapses","lapses","who","sessions"]) if(!state[k]||typeof state[k]!=="object") state[k]={}; }
norm();
function save(){ state.updated=Date.now(); lsSet(KEY,JSON.stringify(state)); schedulePush(); }

/* ===== Geräte-Abgleich über GitHub (Datei fortschritt.json im Zweig "fortschritt", wie in der W&G-I-App) ===== */
const GH={repo:"https://api.github.com/repos/talib47/BiWi-II", file:"fortschritt.json", branch:"fortschritt", tokenKey:"bw2-gh-token"};
GH.api=GH.repo+"/contents/"+GH.file;
let ghToken=null, remoteSha=null, syncStatus="aus", lastSync=null, pushTimer=null, pushing=false, pushAgain=false;
function initToken(){
  const m=location.hash.match(/[#&]t=([A-Za-z0-9_]+)/);
  if(m){ lsSet(GH.tokenKey,m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  ghToken=lsGet(GH.tokenKey);
}
const ghHeaders=()=>({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
const b64enc=str=>btoa(unescape(encodeURIComponent(str)));
const b64dec=str=>decodeURIComponent(escape(atob(str.replace(/\n/g,""))));
async function ensureBranch(){
  const r=await fetch(GH.repo+"/git/ref/heads/"+GH.branch,{headers:ghHeaders(),cache:"no-store"});
  if(r.ok) return true;
  const base=await fetch(GH.repo,{headers:ghHeaders(),cache:"no-store"}); if(!base.ok) return false;
  const def=(await base.json()).default_branch||"main";
  const h=await fetch(GH.repo+"/git/ref/heads/"+def,{headers:ghHeaders(),cache:"no-store"}); if(!h.ok) return false;
  const sha=(await h.json()).object.sha;
  const c=await fetch(GH.repo+"/git/refs",{method:"POST",headers:ghHeaders(),body:JSON.stringify({ref:"refs/heads/"+GH.branch,sha})});
  return c.ok;
}
async function pull(){
  if(!ghToken) return null;
  const r=await fetch(GH.api+"?ref="+GH.branch+"&_="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404){ remoteSha=null; return {}; }
  if(r.status===401){ syncStatus="schluessel"; return null; }
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); remoteSha=d.sha;
  return JSON.parse(b64dec(d.content));
}
async function push(){
  if(!ghToken) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    for(let attempt=0;attempt<3;attempt++){
      const body={message:"Lernstand",branch:GH.branch,content:b64enc(JSON.stringify(state))};
      if(remoteSha) body.sha=remoteSha;
      const r=await fetch(GH.api,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json(); remoteSha=d.content.sha; syncStatus="ok"; lastSync=new Date(); break; }
      if(r.status===401){ syncStatus="schluessel"; break; }
      if(r.status===404){ if(!(await ensureBranch())){ syncStatus="fehler"; break; } continue; }  // Zweig fehlt noch: anlegen
      if(r.status===409||r.status===422){ await pull(); continue; }  // veraltete Version: neu holen und nochmal
      syncStatus="fehler"; break;
    }
  }catch(e){ syncStatus="fehler"; }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function schedulePush(){ if(!ghToken) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>{ pushTimer=null; push(); },1500); }
function flushPush(){ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); } }
/* Neuerer Stand gewinnt (Zeitstempel "updated") */
async function syncFromRemote(){
  if(!ghToken) return false;
  try{
    const remote=await pull();
    if(remote===null) return false;
    if(remote.updated && remote.updated>(state.updated||0)){ state=Object.assign(state,remote); norm(); lsSet(KEY,JSON.stringify(state)); syncStatus="ok"; lastSync=new Date(); return true; }
    if((state.updated||0)>(remote.updated||0)) await push();
    else { syncStatus="ok"; lastSync=new Date(); }
  }catch(e){ syncStatus="fehler"; }
  return false;
}
async function autoPull(){
  if(!ghToken||document.visibilityState!=="visible"||["task","exam","essay","graph","kurz","lesson","cards","kreuz","recall","who"].includes(view)||pushTimer||pushing) return;
  if(await syncFromRemote()) render();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushPush(); else autoPull(); });
window.addEventListener("pagehide",flushPush);
window.addEventListener("focus",autoPull);
setInterval(autoPull,30000);
function syncBox(){
  if(!ghToken) return `<div class="block"><h3>Geräte verbinden</h3>
    <p class="small muted">Damit iPad, iPhone und Laptop denselben Stand haben, verbinde jedes Gerät einmal. Am einfachsten öffnest du dafür deinen Verbindungslink (Adresse der App mit #t=Schlüssel am Ende).</p>
    <label class="small muted" for="tkIn">Oder füge hier deinen GitHub-Schlüssel ein (beginnt mit github_pat_):</label>
    <textarea id="tkIn" style="width:100%;min-height:70px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font-family:var(--mono);font-size:.85rem"></textarea>
    <button class="btn" id="tkGo" style="margin-top:8px">Gerät verbinden</button></div>`;
  const msg={ok:`Dieses Gerät ist verbunden und gleicht automatisch ab${lastSync?", zuletzt um "+lastSync.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}.`,
    fehler:"Abgleich gerade nicht möglich, etwa ohne Internet. Dein Stand bleibt auf diesem Gerät und wird später abgeglichen.",
    schluessel:"Der Schlüssel funktioniert nicht. Prüfe, ob er Zugriff auf das Repository BiWi-II hat, oder verbinde mit einem neuen Schlüssel.",
    aus:"Wird abgeglichen …"}[syncStatus];
  return `<div class="block"><h3>Geräte-Abgleich</h3>
    <p class="small" ${syncStatus==="ok"?'style="color:var(--muted)"':'style="color:var(--bad)"'}>${msg}</p>
    <div class="row"><button class="btn ghost small" id="syNow">Jetzt abgleichen</button><button class="btn ghost small" id="syOff">Gerät trennen</button></div></div>`;
}
function bindSync(){
  const goB=$("#tkGo");
  if(goB) goB.onclick=async()=>{
    const t=$("#tkIn").value.trim();
    if(!/^github_pat_\w+$/.test(t)){ toast("Das sieht nicht nach einem Schlüssel aus. Er beginnt mit github_pat_."); return; }
    lsSet(GH.tokenKey,t); ghToken=t; toast("Verbinde …");
    await syncFromRemote(); toast(syncStatus==="ok"?"Gerät verbunden":"Verbinden hat nicht geklappt"); render();
  };
  const now=$("#syNow");
  if(now) now.onclick=async()=>{ flushPush(); await syncFromRemote(); toast(syncStatus==="ok"?"Abgeglichen":"Abgleich hat nicht geklappt"); render(); };
  const off=$("#syOff");
  if(off) off.onclick=()=>{ if(!off.dataset.armed){ off.dataset.armed="1"; off.textContent="Wirklich trennen"; return; } lsDel(GH.tokenKey); ghToken=null; syncStatus="aus"; render(); };
}

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
const nice=(x,dec)=>Math.abs(x*10**dec-Math.round(x*10**dec))<1e-7;
const r=x=>Math.round(x*1e6)/1e6;
function fmt(x){
  x=r(x); if(Object.is(x,-0)) x=0;
  let s=String(Math.abs(x)); if(s.includes("e")) s=Math.abs(x).toFixed(6).replace(/0+$/,"");
  s=s.replace(".",","); return (x<0?"−":"")+s;
}
const par=x=>x<0?"("+fmt(x)+")":fmt(x);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseNum(v){
  let t=String(v).trim().replace(/\s|€/g,"").replace(/−|–/g,"-");
  const pct=t.includes("%"); t=t.replace("%","");
  if(t.includes(",")) t=t.replace(/\./g,"").replace(",",".");
  if(t===""||t==="-"||isNaN(+t)) return null;
  return {v:+t,pct};
}
const close=(a,b)=>Math.abs(a-b)<=Math.max(0.011,Math.abs(b)*0.005);
function judge(step,raw){
  const p=parseNum(raw); if(!p) return null;
  let v=p.v;
  if(step.tol!=null) return Math.abs(v-step.ans)<=step.tol;
  if(step.rate){ if(p.pct) v=v/100; return close(v,step.ans)||close(v/100,step.ans); }
  if(step.pct){ return close(v,step.ans)||close(v*100,step.ans); }
  return close(v,step.ans);
}

/* ================= Textformat: Karten, Rückmeldungen, Beispielboxen (aus Wirtschaft II übernommen) =================
   - **fett**; Zahl und Einheit bleiben zusammen (34,13 %)
   - Klammern mit Wörtern werden leiser gesetzt: „Gewöhnung (Habituation)“
   - richText(): "- " Aufzählung, "1. " Schritte, "Begriff: Erklärung", "$ Formel", "| A | B" Gegenüberstellung */
const nb=s=>String(s).replace(/(\d) (%|Prozent|Punkte|P\.|Tage|Minuten|SD|dB)(?![a-zäöüß])/g,"$1&nbsp;$2");
const quietParens=s=>s.replace(/\(([^()]{2,})\)/g,(m,x)=>/^[A-Za-zÄÖÜäöüß„]/.test(x)&&/[A-Za-zÄÖÜäöüß]{3,}/.test(x)&&!/[=+−·<>\/]/.test(x)?`<span class="pz">(${x})</span>`:m);
const inl=s=>quietParens(nb(String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")));
const fx=s=>nb(s);
const TERM=/^([^:=⇒]{1,42}): (.+)$/;
function cmp(rows){
  const h=rows[0], body=rows.slice(1);
  const tight=rows.every(r=>r.every(c=>String(c).replace(/\*\*/g,"").length<=18));
  return `<table class="cmp${tight?" tight":""}"><thead><tr>${h.map(x=>`<th>${inl(x)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr><th scope="row">${inl(r[0])}</th>${r.slice(1).map((c,j)=>`<td data-l="${esc(String(h[j+1]).replace(/\*\*/g,""))}"><span>${inl(c)}</span></td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function richText(b){
  const L=String(b).split("\n"); let out="", kind=null, items=[];
  const flush=()=>{ if(!kind) return;
    if(kind==="dl") out+=`<div class="dlist">${items.join("")}</div>`;
    else out+=`<${kind}>${items.map(x=>`<li>${x}</li>`).join("")}</${kind}>`;
    kind=null; items=[]; };
  const open=k=>{ if(kind!==k){ flush(); kind=k; } };
  for(let i=0;i<L.length;i++){ const l=L[i].trim(); let m;
    if(!l){ flush(); continue; }
    if((m=l.match(/^\$ ?(.*)$/))){ const box=`<div class="eq">${fx(m[1])}</div>`;
      if((kind==="ol"||kind==="ul")&&items.length) items[items.length-1]+=box; else { flush(); out+=box; } continue; }
    if(l.startsWith("|")){ flush(); const rows=[];
      while(i<L.length&&L[i].trim().startsWith("|")){ rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim())); i++; }
      i--; out+=cmp(rows); continue; }
    if((m=l.match(/^[-•] (.*)$/))){ open("ul"); items.push(termInline(m[1])); continue; }
    if((m=l.match(/^\d+[.)] (.*)$/))){ open("ol"); items.push(termInline(m[1])); continue; }
    if((m=l.match(TERM))){ open("dl"); items.push(`<b>${inl(m[1])}</b><span>${inl(m[2])}</span>`); continue; }
    flush(); out+=`<p>${inl(l)}</p>`;
  }
  flush(); return out;
}
function termInline(s){ const m=s.match(TERM); return m? `<b>${inl(m[1])}:</b> ${inl(m[2])}` : inl(s); }
/* Beispielbox für Lektionen: links Label (Gegeben, Formel, Einsetzen, Ergebnis, Deutung), rechts Inhalt.
   Zeilen, die mit "$" beginnen, werden Formelbox. */
function bsp(title,rows){
  const cell=v=>v.split("\n").map(x=>x.startsWith("$")?`<div class="eq">${fx(x.replace(/^\$ ?/,""))}</div>`:`<span class="bl">${inl(x)}</span>`).join("");
  return `<div class="bsp"><p class="bh">${title}</p><div class="dlist">${rows.map(([k,v])=>`<b>${k}</b><span>${cell(v)}</span>`).join("")}</div></div>`; }
/* Text kopieren, sonst zum Markieren anzeigen */
async function copyText(text,holder){
  try{ await navigator.clipboard.writeText(text); toast("Kopiert. In den Claude-Chat einfügen."); return true; }
  catch(x){ const h=$(holder); if(h){ h.innerHTML=`<textarea class="copybox" readonly>${esc(text)}</textarea>`; const t=h.querySelector("textarea"); t.focus(); t.select(); } toast("Text markiert, jetzt kopieren"); return false; }
}

LESSONS[16]=[
{id:"10-1", t:"Warum ein Rohwert allein nichts sagt", html:`
<p>Ein Kind löst in einem Lesetest 36 Aufgaben. Ist das gut? Das lässt sich erst beurteilen, wenn man weiß, wie andere Kinder <i>desselben Alters im selben Test</i> abgeschnitten haben. Die Zahl der gelösten Aufgaben heißt <b>Testrohwert</b>. Er bekommt seine Bedeutung erst durch den Vergleich mit einer <b>Referenzgruppe</b>, der sogenannten <b>Normstichprobe</b>.</p>
<p>Viele psychologische Merkmale, etwa die Intelligenz, sind in der Bevölkerung annähernd <b>normalverteilt</b>: Die meisten Menschen liegen nahe am Mittelwert, nach außen hin werden es symmetrisch immer weniger. Beschrieben wird so eine Verteilung durch zwei Kennwerte:</p>
<ul><li><b>Mittelwert</b> (μ oder x̄): wo die Mitte liegt.</li>
<li><b>Standardabweichung</b> (σ oder sd): wie weit die Werte typischerweise um die Mitte streuen.</li></ul>
{{fig:nv}}
<p>Bei jeder Normalverteilung liegen immer dieselben Anteile in denselben Abschnitten, gemessen in Standardabweichungen (SD):</p>
<table class="kvq"><tr><th>Bereich</th><th>Anteil</th><th>Beim IQ (100/15)</th></tr>
<tr><td>zwischen Mittelwert und ±1 SD</td><td class="nw">je 34,13 %</td><td>85–115 zusammen 68,26 %</td></tr>
<tr><td>zwischen 1 und 2 SD</td><td class="nw">je 13,59 %</td><td>70–85 und 115–130</td></tr>
<tr><td>zwischen 2 und 3 SD</td><td class="nw">je 2,14 %</td><td>55–70 und 130–145</td></tr>
<tr><td>jenseits von 3 SD</td><td class="nw">je 0,13 %</td><td>unter 55, über 145</td></tr></table>
<p>Daraus folgt die <b>deskriptive Einordnung</b>, die Heine in den Klausuren abfragt:</p>
<table class="kvq"><tr><th>IQ</th><th>Einordnung</th></tr>
<tr><td class="nw">unter 70</td><td>weit unterdurchschnittlich (z. B. geistige Behinderung)</td></tr>
<tr><td class="nw">70–85</td><td>unterdurchschnittlich</td></tr>
<tr><td class="nw">85–115</td><td>durchschnittlich</td></tr>
<tr><td class="nw">115–130</td><td>überdurchschnittlich</td></tr>
<tr><td class="nw">über 130</td><td>weit überdurchschnittlich (z. B. Hochbegabung)</td></tr></table>
<div class="merk"><b>Merksatz</b>Zwei Drittel (68,26 %) liegen innerhalb von einer Standardabweichung um den Mittelwert. Jenseits von zwei Standardabweichungen liegen auf jeder Seite nur 2,27 % (2,14 + 0,13).</div>`,
check:[
 {q:"Wie viel Prozent der Bevölkerung haben einen IQ von 130 oder mehr?", o:["0,13 %","2,27 %","13,59 %","15,87 %"], a:1, ex:"130 liegt zwei Standardabweichungen über dem Mittelwert. Darüber liegen 2,14 % + 0,13 % = 2,27 %.", w:["0,13 % liegen erst jenseits von 3 SD, also über 145. Du hast nur den äußersten Abschnitt genommen.",null,"13,59 % liegen zwischen 115 und 130, nicht darüber. Das ist der Abschnitt zwischen 1 und 2 SD.","15,87 % liegen über 115 (13,59 + 2,14 + 0,13). Gefragt ist ab 130."]},
 {q:"Eine Schülerin hat einen IQ von 117. Wie ordnen Sie das deskriptiv ein?", o:["Durchschnittlich","Überdurchschnittlich","Weit überdurchschnittlich","Hochbegabt"], a:1, ex:"117 liegt zwischen 115 und 130, also zwischen einer und zwei Standardabweichungen über dem Mittelwert.", w:["Durchschnittlich reicht nur bis 115.",null,"Weit überdurchschnittlich beginnt erst über 130.","Von Hochbegabung spricht man erst über 130 (weit überdurchschnittlich)."]}
]},
{id:"10-2", t:"z-Wert und Abweichungs-IQ", html:`
<p>Um einen Rohwert einzuordnen, rechnet man ihn zuerst in einen <b>z-Wert</b> um. Der z-Wert sagt, um wie viele Standardabweichungen ein Wert über oder unter dem Mittelwert liegt:</p>
<div class="eq">z = (x − μ) / σ</div>
<p class="small muted" style="margin-top:6px">x = Rohwert der Person, μ = Mittelwert der Normstichprobe, σ = Standardabweichung der Normstichprobe</p>
<p>Ein z-Wert von +1 heißt „eine Standardabweichung über dem Durchschnitt“, ein z-Wert von −0,5 „eine halbe Standardabweichung darunter“. Die z-Skala hat den Mittelwert 0 und die Standardabweichung 1.</p>
<p>Weil Kommazahlen und negative Werte im Alltag schwer zu vermitteln sind, rechnet man z in eine andere Skala um. Das Prinzip ist immer gleich: <b>neuer Mittelwert + neue Standardabweichung · z</b>.</p>
<table class="kvq"><tr><th>Skala</th><th>Mittelwert</th><th>SD</th><th>Umrechnung</th></tr>
<tr><td>z-Skala</td><td>0</td><td>1</td><td>z</td></tr>
<tr><td>IQ-Skala</td><td>100</td><td>15</td><td>100 + 15 · z</td></tr>
<tr><td>T-Skala</td><td>50</td><td>10</td><td>50 + 10 · z</td></tr>
<tr><td>C-Skala</td><td>5</td><td>2</td><td>5 + 2 · z</td></tr></table>
<p>Die IQ-Umrechnung heißt <b>Abweichungs-IQ</b> und geht auf David Wechsler (1939) zurück:</p>
<div class="eq">AIQ = 100 + 15 · (x − μ) / σ</div>
${bsp("Klausurbeispiel (WiSe 17/18)",[["Gegeben","Testrohwert x = 500, Mittelwert μ = 460, Standardabweichung σ = 50"],["Formel","$z = (x − μ) / σ\n$IQ = 100 + 15 · z"],["Einsetzen","$z = (500 − 460) / 50 = 0,8\n$IQ = 100 + 15 · 0,8 = 112"],["Ergebnis","z = 0,8 und IQ = 112"],["Deutung","0,8 Standardabweichungen über dem Mittel: **durchschnittlich** (85 bis 115)"]])}
<p>Früher wurde der IQ anders berechnet: Binet führte das <b>Intelligenzalter</b> (mentale Alter) ein, Stern teilte es durch das Lebensalter: <span style="font-family:var(--mono)">IQ = Intelligenzalter / Lebensalter · 100</span>. Das funktioniert bei Kindern, aber nicht bei Erwachsenen, deren Intelligenz nicht mehr jedes Jahr wächst. Deshalb setzte sich Wechslers Abweichungs-IQ durch.</p>`,
check:[
 {q:"Ein Testrohwert liegt 18 Punkte unter dem Mittelwert, die Standardabweichung beträgt 12. Welcher IQ ergibt sich?", o:["82","77,5","122,5","85"], a:1, ex:"z = −18 / 12 = −1,5. IQ = 100 + 15 · (−1,5) = 77,5. Achtung aufs Vorzeichen, sonst kommt 122,5 heraus.", w:["82 entsteht, wenn man die 18 Rohwertpunkte direkt von 100 abzieht. Erst muss der Abstand in Standardabweichungen umgerechnet werden: z = −18 / 12.",null,"Vorzeichen vergessen: Der Rohwert liegt unter dem Mittel, z ist also negativ.","85 wäre z = −1. Hier ist z = −1,5."]},
 {q:"Welchen Mittelwert und welche Standardabweichung hat die T-Skala?", o:["100 und 15","50 und 10","5 und 2","0 und 1"], a:1, ex:"T = 50 + 10 · z. Ein IQ von 115 entspricht z = 1 und damit T = 60.", w:["Das ist die IQ-Skala.",null,"Das ist die C-Skala.","Das ist die z-Skala."]}
]},
{id:"10-3", t:"Der Prozentrang", html:`
<p>Der <b>Prozentrang</b> (PR) beschreibt ein Ergebnis anders als der z-Wert: Er gibt an, wie viel Prozent der Referenzgruppe <b>gleich gut oder schlechter</b> abgeschnitten haben. Er braucht keine Normalverteilung, sondern nur eine Reihenfolge der Werte.</p>
<div class="eq">PR = cumf / N · 100</div>
<p class="small muted" style="margin-top:6px">cumf = kumulierte Häufigkeit, also die Anzahl der Werte bis einschließlich des gesuchten Werts · N = Gesamtzahl der Werte (Probanden)</p>
<p>So gehst du in der Klausur vor:</p>
<ul><li><b>Sortieren:</b> alle Werte der Größe nach ordnen.</li>
<li><b>cumf bestimmen:</b> zählen, wie viele Werte kleiner oder gleich dem gesuchten Wert sind.</li>
<li><b>N bestimmen</b> und in die Formel einsetzen.</li></ul>
${bsp("Klausurbeispiel (WiSe 22/23)",[["Gegeben","Testwert 18 in dieser Verteilung:\n21; 18; 19; 12; 13; 16; 13; 12; 25; 10; 13; 16"],["Formel","$PR = cumf / N · 100"],["Sortieren","10, 12, 12, 13, 13, 13, 16, 16, **18**, 19, 21, 25"],["Zählen","cumf = 9 (Werte bis einschließlich 18)\nN = 12 (alle Werte)"],["Einsetzen","$PR = 9 / 12 · 100 = 75"],["Deutung","75 % der Gruppe haben gleich gut oder schlechter abgeschnitten, **25 % besser**."]])}
<p><b>Interpretation:</b> Ein Prozentrang von 75 heißt, dass 75 % der Gruppe gleich gut oder schlechter abgeschnitten haben, also 25 % besser. Ein Prozentrang von 25 heißt umgekehrt: 75 % waren besser.</p>
<p>Prozentrang und z-Wert hängen über die Normalverteilung zusammen: Der Mittelwert (z = 0) hat PR 50, z = +1 entspricht PR 84,1, z = −2 entspricht PR 2,3.</p>`,
check:[
 {q:"Ein Student hat in einer Klausur den Prozentrang 25. Was bedeutet das?", o:["Er hat 25 % der Punkte erreicht","25 % haben besser abgeschnitten","75 % haben besser abgeschnitten","Er liegt eine Standardabweichung unter dem Mittel"], a:2, ex:"25 % haben gleich gut oder schlechter abgeschnitten, also 75 % besser. Mit der Punktzahl hat der Prozentrang nichts zu tun.", w:["Der Prozentrang sagt nichts über die Punktzahl, nur über die Position in der Gruppe.","Umgedreht: Der Prozentrang zählt, wer gleich gut oder schlechter war, nicht wer besser war.",null,"Eine SD unter dem Mittel wäre bei Normalverteilung etwa PR 16. Der Prozentrang braucht aber gar keine Normalverteilung."]},
 {q:"In einer Verteilung von 20 Werten sind 14 Werte kleiner oder gleich dem gesuchten Wert. Wie hoch ist der Prozentrang?", o:["14","70","30","65"], a:1, ex:"PR = 14 / 20 · 100 = 70.", w:["14 ist cumf, also erst der Zähler. Er muss noch durch N geteilt und mit 100 malgenommen werden.",null,"30 % ist der Anteil derer, die besser waren: 100 − 70.","Nachrechnen: 14 / 20 = 0,7, also 70."]}
]},
{id:"10-4", t:"Standardisieren in der Praxis", html:`
<p>Rohwerte aus <b>verschiedenen Tests</b> lassen sich nicht direkt vergleichen. Wer in Test A und Test B je 36 Punkte hat, kann ganz unterschiedlich gut sein, weil die Tests unterschiedlich schwer sind und anders streuen. Erst die Umrechnung in Standardwerte (z, IQ, T) macht sie vergleichbar.</p>
<div class="merk"><b>Klausuraufgabe (WiSe 22/23)</b><p class="mi">Drei Viertklässlerinnen, drei verschiedene Lesetests, ein Platz im Lesetraining für die Schwächste.</p>
<table class="kvq" style="margin-top:6px"><tr><th></th><th>Rohwert</th><th>M</th><th>SD</th><th>z</th><th>IQ-Skala</th></tr>
<tr><td>A</td><td>36</td><td>42</td><td>3</td><td>−2</td><td>70</td></tr>
<tr><td>B</td><td>36</td><td>39</td><td>6</td><td>−0,5</td><td>92,5</td></tr>
<tr><td>C</td><td>36</td><td>42</td><td>6</td><td>−1</td><td>85</td></tr></table>
<p class="mi" style="margin:0">Alle haben 36 Punkte, aber Schülerin A liegt zwei Standardabweichungen unter ihrer Referenzgruppe. <b>Sie bekommt den Platz.</b></p></div>
<p>Damit Standardwerte stimmen, müssen die Normen selbst gut sein. Die <b>Normierung</b> ist ein Nebengütekriterium: Die Normen sollen <b>aktuell</b> und an einer <b>repräsentativen</b> Stichprobe gewonnen sein. Drei typische Probleme, gerade in extremen Leistungsbereichen wie der Hochbegabungsdiagnostik:</p>
<ul><li><b>Deckeneffekt:</b> Der Test ist zu leicht, sehr gute Personen lösen fast alles. Er kann oben nicht mehr unterscheiden (Messfehler durch Überschreiten des Messbereichs).</li>
<li><b>Größerer Messfehler</b> an den Rändern der Verteilung, weil es dort nur wenige Aufgaben und Vergleichspersonen gibt.</li>
<li><b>Flynn-Effekt:</b> Die durchschnittlichen Testleistungen sind über Jahrzehnte gestiegen. Mit veralteten Normen wirkt eine Person deshalb besser, als sie im Vergleich zu heute ist.</li></ul>`,
check:[
 {q:"Warum lässt man in der Aufgabe nicht einfach die Rohwerte entscheiden?", o:["Weil alle drei gleich sind","Weil die Tests unterschiedliche Mittelwerte und Streuungen haben","Weil Rohwerte immer ungenau sind","Weil nur IQ-Werte zulässig sind"], a:1, ex:"Gleiche Rohwerte bedeuten in unterschiedlich schweren Tests Unterschiedliches. Erst z-Werte zeigen die Position in der jeweiligen Referenzgruppe.", w:["Gleich sind nur die Rohwerte. Genau das ist das Problem: Sie stammen aus verschiedenen Tests.",null,"Ungenauigkeit (Messfehler) ist ein anderes Thema. Hier fehlt die gemeinsame Vergleichsbasis.","Es geht nicht um die Skala, sondern um die Umrechnung. z-Werte reichen schon."]},
 {q:"Ein Intelligenztest wurde vor 30 Jahren normiert. Was ist zu erwarten?", o:["Die IQ-Werte fallen zu niedrig aus","Die IQ-Werte fallen zu hoch aus","Es gibt keinen Unterschied","Der Test wird reliabler"], a:1, ex:"Wegen des Flynn-Effekts war die alte Normstichprobe im Schnitt schwächer. Im Vergleich zu ihr schneidet man heute besser ab, der IQ wird überschätzt.", w:["Umgekehrt: Die Leistungen sind über die Jahrzehnte gestiegen. Wer heute mit der schwächeren alten Gruppe verglichen wird, wirkt besser.",null,"Der Flynn-Effekt zeigt gerade, dass sich der Durchschnitt über die Jahrzehnte verschiebt.","Reliabilität (Messgenauigkeit) hängt nicht vom Alter der Normen ab. Betroffen ist die Normierung."]}
]}
];

/* ================= Rechentrainer Diagnostik (Kapitel 16) =================
   Jede Aufgabe liefert Schritte {lab, why, f, calc, ans, final?}; Stufen wie in Wirtschaft II: vorgerechnet, geführt, frei. */
const ZS=[-2.5,-2,-1.75,-1.5,-1.25,-1,-.8,-.75,-.6,-.5,-.4,-.25,.25,.4,.5,.6,.75,.8,1,1.25,1.5,1.75,2,2.5];
function rawCase(){
  for(;;){ const mu=pick([20,24,30,36,40,42,50,60,100,120,200,300,460,500,600]), sd=pick([2,3,4,5,6,8,10,12,15,20,25,40,50,100]), z=pick(ZS);
    const x=mu+z*sd; if(!isInt(x)||x<0||sd>=mu) continue; return {mu,sd,z,x}; }
}
const tblRow=(h,v)=>`<div class="tablewrap"><table class="data"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr><tr>${v.map(x=>`<td>${typeof x==="number"?fmt(x):x}</td>`).join("")}</tr></table></div>`;
const zSteps=(c,lab="")=>[
  {lab:`Abstand zum Mittelwert x − μ${lab}`, why:"Erst schauen, wie weit der Rohwert vom Mittelwert der Referenzgruppe entfernt ist. Liegt er darunter, wird es negativ.", f:"x − μ", calc:`${fmt(c.x)} − ${fmt(c.mu)} = ${fmt(c.x-c.mu)}`, ans:c.x-c.mu, sign:true},
  {lab:`z-Wert${lab}`, why:"Den Abstand durch die Standardabweichung teilen: So viele Standardabweichungen liegt die Person vom Mittel entfernt.", f:"z = (x − μ) / σ", calc:`z = ${par(c.x-c.mu)} / ${fmt(c.sd)} = ${fmt(c.z)}`, ans:c.z, final:true, sign:true}
];
const posTxt=(z,ref)=>`Die Person liegt ${fmt(Math.abs(z))} ${Math.abs(z)===1?"Standardabweichung":"Standardabweichungen"} ${z<0?"unter":"über"} ${ref}.`;
const iqBand=iq=>iq<70?"unter 70":iq<85?"70 bis 85":iq<=115?"85 bis 115":iq<=130?"115 bis 130":"über 130";
const iqLabel=iq=>iq<70?"weit unterdurchschnittlich":iq<85?"unterdurchschnittlich":iq<=115?"durchschnittlich":iq<=130?"überdurchschnittlich":"weit überdurchschnittlich";
/* Flächen unter der Normalverteilung nach Heines Tabelle (in %) */
const NV_SEG=[[-99,-3,.13],[-3,-2,2.14],[-2,-1,13.59],[-1,0,34.13],[0,1,34.13],[1,2,13.59],[2,3,2.14],[3,99,.13]];
const nvArea=(a,b)=>r(NV_SEG.filter(([lo,hi])=>lo>=a&&hi<=b).reduce((s,x)=>s+x[2],0));

    for(;;){ const x=rint(25,45), M=[0,1,2].map(()=>x+pick([-3,-2,-1,1,2,3,4,5,6,8])), S=[0,1,2].map(()=>pick([2,3,4,5,6,8]));

        table:`<div class="tablewrap"><table class="data"><tr><th></th><th>Rohwert</th><th>M</th><th>SD</th></tr>${N.map((n,i)=>`<tr><th>${n}</th><td>${x}</td><td>${M[i]}</td><td>${S[i]}</td></tr>`).join("")}</table></div>`,
        q:"Wandeln Sie die Rohwerte in z-Werte um. Welche Schülerin sollte den Platz bekommen? (Antwort als Zahl: A = 1, B = 2, C = 3)", deut:`Gleicher Rohwert, aber unterschiedliche Tests: Schülerin ${N[w]} liegt mit z = ${fmt(Z[w])} am weitesten unter ihrer Referenzgruppe und bekommt den Platz.`,

const tri=(x,y,dir,cls)=>{ const s=7, p={up:[[x,y],[x-s/1.6,y+s],[x+s/1.6,y+s]],right:[[x,y],[x-s,y-s/1.6],[x-s,y+s/1.6]],down:[[x,y],[x-s/1.6,y-s],[x+s/1.6,y-s]]}[dir]; return `<polygon class="${cls}" points="${p.map(q=>q.join(",")).join(" ")}"/>`; };

/* Normalverteilung mit Flächenanteilen und den üblichen Skalen (Mittelwert 200, 1 SD = 50 px) */
function nvCurve(){
  const X=z=>200+z*50, Y=z=>196-150*Math.exp(-z*z/2);
  let d=""; for(let i=0;i<=140;i++){ const z=-3.5+i*.05; d+=(i?"L":"M")+X(z).toFixed(1)+","+Y(z).toFixed(1); }
  return {X,Y,d};
}
const GFX={
  nv:{base:()=>{ const {X,Y,d}=nvCurve();
      const area=(a,b,cls)=>{ let p=`M${X(a)},196`; for(let z=a;z<=b+1e-9;z+=.05) p+=`L${X(z).toFixed(1)},${Y(z).toFixed(1)}`; return `<path class="${cls}" d="${p}L${X(b)},196Z"/>`; };
      let s=area(-1,1,"fillA")+area(-2,-1,"fillB")+area(1,2,"fillB")+`<path class="base" d="${d}"/>`+ln(18,196,382,196,"ax");
      for(const z of [-3,-2,-1,0,1,2,3]) s+=ln(X(z),Y(z),X(z),200,"ax dash thin");
      const pc=[["34,13 %",-.5,150,11],["34,13 %",.5,150,11],["13,59 %",-1.5,189,10],["13,59 %",1.5,189,10],["2,14 %",-2.75,170,10],["2,14 %",2.75,170,10]];
      for(const [t,z,y,f] of pc) s+=tx(X(z),y,t,"bt","middle",f);
      const rows=[["z",z=>String(z).replace("-","−")],["IQ",z=>100+15*z],["T",z=>50+10*z],["PR",z=>({"-3":"0,13","-2":"2,3","-1":"15,9","0":"50","1":"84,1","2":"97,7","3":"99,9"})[z]]];
      rows.forEach(([lab,f],i)=>{ const y=218+i*19; s+=tx(10,y,lab,"","start",11); for(const z of [-3,-2,-1,0,1,2,3]) s+=tx(X(z),y,f(z),i===1?"bt":"","middle",11); });
      return s; },
    sol:()=>""}

/* Zeichenfläche für den Stift, wiederverwendbar */
function drawSurface(c,strokes){
  const ctx=c.getContext("2d"); let penSeen=false, cur=null;
  const color=()=>getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#A87B1F";
  function size(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function draw(){ const r=c.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=color();
    for(const s of strokes){ for(let i=1;i<s.length;i++){ ctx.lineWidth=s[i][2]; ctx.beginPath(); ctx.moveTo(s[i-1][0]*r.width,s[i-1][1]*r.height); ctx.lineTo(s[i][0]*r.width,s[i][1]*r.height); ctx.stroke(); } } }
  const pt=e=>{ const r=c.getBoundingClientRect(); const p=e.pressure&&e.pointerType==="pen"?e.pressure:.5; return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,1.2+p*2.6]; };
  c.onpointerdown=e=>{ if(e.pointerType==="pen") penSeen=true; if(penSeen&&e.pointerType==="touch") return; cur=[pt(e)]; strokes.push(cur); try{c.setPointerCapture(e.pointerId);}catch(x){} };
  c.onpointermove=e=>{ if(!cur) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) cur.push(pt(ev)); draw(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
  size(); window.addEventListener("resize",size);
  return {undo(){ strokes.pop(); draw(); }, clear(){ strokes.length=0; draw(); }};
}

/* ================= Fortschritt ================= */
function lessonState(id){ return (state.lessons||{})[id]; }
function cardBox(id){ return (state.box||{})[id]||0; }
function chapterProgress(n){
  const L=LESSONS[n]||[], K=CARDS[n]||[], C=CALC[n]||[], G=GRAPHS[n]||[], X=kreuzOf(n), W=kurzOf(n);
  if(!L.length) return null;
  const l=L.filter(x=>lessonState(x.id)).length/L.length;
  const k=K.length? K.filter(x=>cardBox(x.id)>=3).length/K.length : 1;
  const x=X.length? X.filter(i=>(kzStat(i.id)||{}).best===4).length/X.length : 1;
  const c=C.length? C.filter(t=>lvlOf(t)===3 && (acc(t)||0)>=.6).length/C.length : 1;
  const g=G.length? G.filter(i=>(state.graphs||{})[i.id]).length/G.length : 1;
  const w=W.length? W.filter(i=>kurzScore(i.id)).length/W.length : 1;
  const parts=[[l,.25,1],[k,.2,K.length],[x,.25,X.length],[c,.15,C.length],[g,.05,G.length],[w,.1,W.length]].filter(p=>p[2]);
  const wsum=parts.reduce((s,p)=>s+p[1],0);
  return {l,k,x,c,g,w,total:Math.round(parts.reduce((s,p)=>s+p[0]*p[1],0)/wsum*100)};
}

function nextStep(){

    if(li>=0) return {label:`Kapitel ${n} · Theorie`, title:L[li].t, go:()=>openLesson(n,li)};

/* ================= Karten (Karteikasten, Fächer 0–5) ================= */
/* Rückseite aus Zeilen aufbauen: „Begriff: Text“ wird zum Begriffspaar, „1. …“ zur nummerierten Liste,
   mehrere einfache Zeilen zur Aufzählung, „A vs. B“ mit „Merkmal: a / b“ zur Vergleichstabelle */
function cardBackHTML(c){
  if(c.rt) return richText(c.b);
  const lines=c.b.split("\n").map(s=>s.trim()).filter(Boolean);
  const kvRe=/^([^:]{1,38}):\s+(.+)$/, numRe=/^\d+\.\s+(.+)$/;
  const kind=l=>{ if(/^\$ /.test(l)) return "eq"; if(/^[-•] /.test(l)) return "plain"; if(numRe.test(l)) return "num"; const m=l.match(kvRe); if(m&&!/,\s|\sheißt/.test(m[1])&&!/[.!?]$/.test(m[1])) return "kv"; if(/ = /.test(l)&&l.length<44) return "eq"; return "plain"; };
  const clean=l=>l.replace(/^[-•$] /,"");
  if(lines.length===1) return `<p>${inl(clean(lines[0]))}</p>`;
  const vs=c.f.split(/\s+vs\.\s+/);
  if(vs.length===2 && lines.every(l=>kind(l)==="kv"&&l.match(kvRe)[2].includes(" / "))){
    const h=vs.map(x=>x.replace(/\s+im Vergleich$/,"").replace(/[?:]$/,""));
    return `<table class="cb-tbl"><tr><th>${inl(h[0])}</th><th>${inl(h[1])}</th></tr>${lines.map(l=>{ const m=l.match(kvRe), p=m[2].split(" / "); return `<tr class="lab"><td colspan="2">${inl(m[1])}</td></tr><tr><td>${inl(p[0])}</td><td>${inl(p.slice(1).join(" / "))}</td></tr>`; }).join("")}</table>`;
  }
  /* „Begriff (Fachbegriff)“ am Zeilenanfang: Begriff fett, Klammer leiser */
  const nm=l=>{ const m=l.match(/^([^()]{2,40}?) \((.+)\)$/); return m?`<b>${inl(m[1])}</b> <span class="pz">(${m[2]})</span>`:inl(l); };
  const groups=[]; for(const l of lines){ const k=kind(l), g=groups[groups.length-1]; if(g&&g.k===k&&k!=="eq") g.l.push(l); else groups.push({k,l:[l]}); }
  return groups.map(g=>{
    if(g.k==="num") return `<ol class="cb-ol">${g.l.map(l=>`<li><span>${nm(l.match(numRe)[1])}</span></li>`).join("")}</ol>`;
    if(g.k==="kv") return `<dl class="cb-dl">${g.l.map(l=>{ const m=l.match(kvRe); return `<div><dt>${inl(m[1])}</dt><dd>${inl(m[2])}</dd></div>`; }).join("")}</dl>`;
    if(g.k==="eq") return `<div class="eq">${fx(clean(g.l[0]))}</div>`;
    if(g.l.length===1) return `<p>${inl(clean(g.l[0]))}</p>`;
    return `<ul class="cb-ul">${g.l.map(l=>`<li>${nm(clean(l))}</li>`).join("")}</ul>`;
  }).join("");
}
function allCards(n){ return n? (CARDS[n]||[]) : Object.values(CARDS).flat(); }
/* Wiederholung mit Fälligkeitsdatum (wie Anki): sicherer gewusst = längerer Abstand */
const INTERVAL=[0,0,1,3,7,16];   // Tage bis zur nächsten Abfrage je Fach; Fach 5 erneut gewusst: 35 Tage
const dayStart=(t=Date.now())=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const isSeen=id=>!!(state.box||{})[id];
const isDue=id=>isSeen(id) && ((state.due||{})[id]||0)<=Date.now();
function dueCards(n){ return allCards(n).filter(x=>isDue(x.id)).sort((a,b)=>((state.due||{})[a.id]||0)-((state.due||{})[b.id]||0)); }
function openCards(n,free,deck){ cur.cardCh=n; cur.free=!!free; cur.deck=deck?deck.slice():(free?buildDeck(n):buildDueDeck(n)); cur.ci=0; cur.flip=false; cur.right=0; cur.unsure=0; cur.typed=""; cur.tyOpen=false; cur.hist=[]; cur.requeued={}; go("cards"); }

const deckBack=n=>DECK_NAME[n]?go("sym"):n?go("chapter"):go("practice");
let CARD_CH=null;
function cardChapter(id){ if(!CARD_CH){ CARD_CH={}; CHAPTERS.forEach(ch=>(CARDS[ch.n]||[]).forEach(c=>CARD_CH[c.id]=ch)); } return CARD_CH[id]; }
function buildDueDeck(n){
  const due=dueCards(n), fresh=n? allCards(n).filter(x=>!isSeen(x.id)) : [];
  return due.concat(fresh).slice(0,Math.max(10,Math.min(due.length,30)));
}
function buildDeck(n){
  const pool=allCards(n).slice(), deck=[];
  while(deck.length<Math.min(10,pool.length)){
    const w=pool.map(x=>[6,5,4,3,2,1][cardBox(x.id)]); let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0;
    for(;i<pool.length;i++){ r-=w[i]; if(r<=0) break; } deck.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return deck;
}
function renderCards(){

    const when=nextDue? Math.round((dayStart(nextDue)-dayStart())/864e5) : null;
    $("#app").innerHTML=`${backTo(deckLabel(n))}<h1>${D.length?(left?"Runde geschafft":"Für heute erledigt"):"Nichts fällig"}</h1>
      <div class="block">${D.length?`<p>${cur.right} sicher, ${cur.unsure||0} nicht sicher.</p>`:""}
      <p class="small muted">${left?`Noch ${left} Karten fällig oder neu.`:`Alle Karten${n?" dieses Stapels":""} sind auf dem Stand. ${when!=null?`Die nächsten werden ${when<=0?"heute":when===1?"morgen":"in "+when+" Tagen"} fällig.`:""}`} Sichere Karten kommen nach 1, 3, 7, 16 und 35 Tagen wieder, nicht sichere gleich in dieser Runde und morgen noch einmal.</p>
      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="again">Weiter</button>`:""}<button class="btn ghost" id="free">Freiwillig weiterüben</button><button class="btn ghost" id="out">Fertig</button>`}</div></div>`;
    bindCrumb(()=>deckBack(n)); if($("#again")) $("#again").onclick=()=>openCards(n); if($("#free")) $("#free").onclick=()=>openCards(n,true); if($("#out")) $("#out").onclick=()=>deckBack(n); return;
  }
  const c=D[cur.ci], b=cardBox(c.id), ch=cardChapter(c.id), sym=/^[sr]-/.test(c.id);
  const ctx=CARD_CTX[c.id]||(ch?ch.title:"");
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("#app").innerHTML=`${backTo(deckLabel(n))}
    <div class="row between"><p class="eyebrow" style="margin:0">Karte ${cur.ci+1} von ${D.length}${cur.free?" · freiwillig":isSeen(c.id)?" · fällig":" · neu"}</p><span class="dots" aria-label="Fach ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span></div>
    <div class="swipewrap">
    <div class="block card${cur.enter?" enter":""}" id="theCard" style="margin-top:8px" role="button" tabindex="0" aria-label="Karte umdrehen"><i class="tint" aria-hidden="true"></i>
      ${ctx?`<p class="cctx">${inl(ctx)}</p>`:""}
      <div class="front${sym&&c.id.startsWith("s-")?" symf":""}">${inl(c.f)}</div>
      ${cur.flip?`${cur.typed.trim()?`<div class="typed"><span class="small muted">Deine Antwort</span><p>${esc(cur.typed)}</p></div>`:""}<div class="back cb">${cardBackHTML(c)}</div>${cardInfoHTML(c.id)}`:`<span class="tapnote">Tippen zum Umdrehen</span>`}</div></div>
    ${cur.flip?`<div class="grade"><button class="btn ghost" id="mid">← Nicht sicher</button><button class="btn" id="yes">Sicher →</button></div>`
      :`${cur.tyOpen||cur.typed?`<textarea id="cty" class="cty" rows="1" placeholder="Deine Antwort …" aria-label="Antwort tippen">${esc(cur.typed)}</textarea>`:""}
      <div class="row"><button class="btn" id="flip" style="flex:1">Antwort zeigen</button>${cur.tyOpen||cur.typed?"":`<button class="tylink" id="tyO">Tippen</button>`}</div><p class="hint">Erst antworten, dann aufdecken.</p>`}
    ${cur.hist.length?`<button class="btn ghost small" id="cprev" style="margin-top:6px">← Vorherige Karte</button>`:""}`;
  bindCrumb(()=>deckBack(n));
  if($("#tyO")) $("#tyO").onclick=()=>{ cur.tyOpen=true; renderCards(); $("#cty").focus(); };
  const ta=$("#cty"); if(ta){ const fit=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }; fit(); ta.oninput=()=>{ cur.typed=ta.value; fit(); }; }
  if($("#flip")) $("#flip").onclick=()=>{ cur.flip=true; renderCards(); };
  const cd=$("#theCard"); let moved=false;
  cd.onclick=e=>{ if(e.target.closest("a")||moved) return; cur.flip=!cur.flip; renderCards(); };
  cd.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cd.click(); } else if(cur.flip&&e.key==="ArrowRight") grade(2); else if(cur.flip&&e.key==="ArrowLeft") grade(1); };
  /* Wischen wie bei Dating-Apps, erst nach dem Aufdecken: rechts sicher, links nicht sicher.
     Die Karte folgt dem Finger, eine leichte Tönung zeigt die Richtung an. */
  if(cur.flip){ const tint=cd.querySelector(".tint"); let x0=null, y0=0, dx=0, raf=0, w=360, dir=0;
    /* Pro Bild nur transform und opacity ändern: beides läuft auf dem Grafikchip, nichts wird neu gezeichnet */
    const paint=()=>{ raf=0; const k=Math.min(1,Math.abs(dx)/(w*.35)), d=dx>0?1:-1;
      if(d!==dir){ dir=d; tint.className="tint "+(d>0?"ok":"no"); }
      cd.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/45}deg)`; tint.style.opacity=k; };
    cd.onpointerdown=e=>{ if(e.target.closest("a")) return; x0=e.clientX; y0=e.clientY; dx=0; moved=false; w=cd.offsetWidth||360; };
    cd.onpointermove=e=>{ if(x0===null) return; const d=e.clientX-x0;
      if(!moved){ if(Math.abs(d)>6&&Math.abs(d)>Math.abs(e.clientY-y0)){ moved=true; x0+=d>0?6:-6; try{cd.setPointerCapture(e.pointerId);}catch(x){} cd.style.transition="none"; tint.style.transition="none"; } else return; }
      e.preventDefault(); dx=e.clientX-x0; if(!raf) raf=requestAnimationFrame(paint); };
    cd.onpointerup=cd.onpointercancel=()=>{ if(x0===null) return; x0=null; if(!moved) return; if(raf){ cancelAnimationFrame(raf); raf=0; }
      const lim=Math.min(100,w*.25);
      if(Math.abs(dx)>lim){ const out=(dx>0?1:-1)*(window.innerWidth+100);
        cd.style.transition="transform .3s cubic-bezier(.2,.7,.3,1), opacity .3s ease-out"; cd.style.transform=`translate3d(${out}px,0,0) rotate(${dx>0?12:-12}deg)`; cd.style.opacity="0";
        setTimeout(()=>{ cur.enter=true; grade(dx>0?2:1); },220); }
      else { cd.style.transition="transform .35s cubic-bezier(.3,1.4,.5,1)"; tint.style.transition="opacity .25s"; cd.style.transform=""; tint.style.opacity="0"; setTimeout(()=>{ moved=false; },0); } };
  }
  /* Bewertung: 2 sicher (nächstes Fach), 1 nicht sicher (ein Fach zurück, morgen wieder, in dieser Runde noch einmal) */
  function grade(lv){ state.box=state.box||{}; state.due=state.due||{}; state.lapses=state.lapses||{};
    const b0=cardBox(c.id), old=state.due[c.id]||0;
    cur.hist.push({ci:cur.ci, id:c.id, box:state.box[c.id], due:state.due[c.id], lapse:state.lapses[c.id], right:cur.right, unsure:cur.unsure, len:D.length, rq:Object.assign({},cur.requeued), typed:cur.typed});
    const b1= lv===2? Math.min(5,Math.max(b0,1)+1) : Math.max(1,b0-1);
    const nd= lv===2? dayStart()+(b0===5?35:INTERVAL[b1])*864e5 : dayStart()+864e5;
    if(!cur.free){ state.box[c.id]=b1; state.due[c.id]=nd; }
    else if(lv<2){ state.box[c.id]=Math.min(b0||1,b1); state.due[c.id]=Math.min(old||nd,nd); }
    if(lv===2) cur.right++;
    else { cur.unsure=(cur.unsure||0)+1; state.lapses[c.id]=(state.lapses[c.id]||0)+1; if(!cur.requeued[c.id]){ cur.requeued[c.id]=1; D.push(c); } }
    logDay(); save(); cur.ci++; cur.flip=false; cur.typed=""; renderCards(); window.scrollTo(0,0); }
  if($("#yes")) $("#yes").onclick=()=>{ cur.enter=true; grade(2); };
  if($("#mid")) $("#mid").onclick=()=>{ cur.enter=true; grade(1); };
  /* Eine Karte zurück: letzte Bewertung rückgängig machen */
  if($("#cprev")) $("#cprev").onclick=()=>{ const h=cur.hist.pop(); if(!h) return;
    const put=(o,k,v)=>{ if(v===undefined) delete o[k]; else o[k]=v; };
    put(state.box,h.id,h.box); put(state.due,h.id,h.due); put(state.lapses,h.id,h.lapse);
    cur.right=h.right; cur.unsure=h.unsure; D.length=h.len; cur.requeued=h.rq; cur.ci=h.ci; cur.flip=true; cur.typed=h.typed; save(); renderCards(); };
}

function calcTypes(n){ return n? (CALC[n]||[]) : [...new Set(Object.values(CALC).flat())]; }
function recommend(){
  const T=calcTypes(0), started=T.filter(t=>state.hist[t]&&state.hist[t].n);
  const fresh=T.find(t=>!started.includes(t)), weak=started.filter(t=>acc(t)<.7).sort((a,b)=>acc(a)-acc(b))[0];
  return weak||fresh||T[Math.floor(Math.random()*T.length)];
}

const kreuzOf=n=>n? KREUZ.filter(x=>x.ch===n) : KREUZ.filter(x=>LESSONS[x.ch]);
const kzStat=id=>(state.kreuz||{})[id];
function kzPoints(item,ans,gs){ const right=item.s.filter((st,j)=>ans[j]===st[1]&&!(gs&&gs[j])).length; return right+(right===3?1:0); }
/* Wiederholung mit Abstand: 4 Punkte schiebt die Aufgabe weiter nach hinten (1, 3, 7, 16, 35 Tage), sonst morgen wieder */
function kzDueAt(id){ const s=kzStat(id); if(!s) return null; return s.due||dayStart(s.t)+(s.p===4?3:1)*864e5; }
const kzDue=()=>kreuzOf(0).filter(x=>{ const d=kzDueAt(x.id); return d!=null&&d<=Date.now(); });
function pickKreuz(n,k){
  const pool=kreuzOf(n).slice(), out=[], now=Date.now();
  while(out.length<Math.min(k,pool.length)){
    const w=pool.map(x=>{ const s=kzStat(x.id); if(!s) return 5; const due=kzDueAt(x.id)<=now; return s.p<4?(due?7:3):(due?5:.5); });
    let q=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<pool.length;i++){ q-=w[i]; if(q<=0) break; }
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}
function openKreuz(n,k,ids){ cur.kr={n, items:ids||pickKreuz(n,k||5).map(x=>x.id), i:0, ans:{}, gs:{}, shown:false, pts:[], sure:[]}; go("kreuz"); }
function kzBlock(item,ans,shown,key,gs){
  return item.s.map((st,j)=>{ const a=ans[j], g=gs&&gs[j];
    const cls=v=>shown?(st[1]===v?"r":(a===v?"w":"")):"";
    return `<div class="kz"><p class="st"><i class="no">${"abc"[j]})</i>${st[0]}</p>
      <div class="wf" role="group" aria-label="Aussage ${"abc"[j]}"><button data-kz="${key}:${j}" data-v="1" aria-pressed="${a===true}" class="${cls(true)}" ${shown?"disabled":""}>wahr</button><button data-kz="${key}:${j}" data-v="0" aria-pressed="${a===false}" class="${cls(false)}" ${shown?"disabled":""}>falsch</button></div>${gs?`<button data-kg="${j}" class="kg" aria-pressed="${!!g}" ${shown?"disabled":""}>${g?"✓ ":""}geraten</button>`:""}
      ${!shown?"":a===st[1]&&!g?`<p class="why"><b class="okc">Richtig.</b> ${st[2]}</p>`
        :a===st[1]?`<div class="fb idk"><p class="fh">Richtig geraten. Zählt noch nicht als gewusst.</p><p style="margin:0">${st[2]}</p></div>`
        :`<div class="fb ${a===undefined?"idk":"bad"}"><p class="fh">${a===undefined?"Nicht angekreuzt. ":""}Die Aussage ist ${st[1]?"wahr":"falsch"}.</p><p style="margin:0">${st[2]}</p></div>`}</div>`; }).join("");
}
function renderKreuz(){

      :`<button class="btn" id="ev" style="width:100%" ${all?"":"disabled"}>Auswerten</button><p class="hint">Keine Minuspunkte, im Zweifel ankreuzen. „geraten“ zählt nicht als gewusst.</p>`}`;

  if($("#ev")) $("#ev").onclick=()=>{ K.pts[K.i]=kzPoints(item,K.ans); const p=kzPoints(item,K.ans,K.gs); K.sure[K.i]=p; K.shown=true;
    const s=kzStat(item.id)||{n:0,best:0}, b=p===4?Math.min(5,(s.b||1)+1):1;

/* ---------- Musterlösung: „1) … 2) … 3) …“ als Liste setzen ---------- */
function solHTML(m){
  const parts=m.split(/(?:^|\s)(?=\d\)\s)/);
  if(parts.length<3) return `<p style="margin:0">${m}</p>`;
  const intro=/^\d\)\s/.test(parts[0])?"":parts.shift(), items=parts.map(p=>p.replace(/^\d\)\s/,""));
  const last=items[items.length-1], cut=last.search(/\.\s+(Bei|Weitere|Insgesamt|Fazit)/);
  let tail=""; if(cut>0){ tail=last.slice(cut+2); items[items.length-1]=last.slice(0,cut+1); }
  return `${intro?`<p style="margin:0 0 6px">${intro}</p>`:""}<ol class="sol-ol">${items.map(i=>`<li>${i.replace(/^([^:.]{2,30}):/,"<b>$1:</b>")}</li>`).join("")}</ol>${tail?`<p style="margin:8px 0 0">${tail}</p>`:""}`;
}

{id:"1-1", t:"Lernziele und die Stufen nach Bloom", html:`
<p>Heine beginnt jede Sitzung mit <b>kognitiven Lernzielen</b>. Das ist kein Zufall: Lernziele sind selbst ein Thema der Vorlesung.</p>
<p>Nach Ingenkamp und Lissmann (2008) beschreiben <b>operationalisierte Lernziele</b> das beabsichtigte Verhalten, das Lernende nach Abschluss des Lernprozesses zeigen sollen. Ein angemessen operationalisiertes Lernziel enthält drei Dinge:</p>
<ul><li><b>beobachtbare Verhaltensweisen</b> (was genau soll man sehen können?),</li>
<li><b>Bedingungen</b>, unter denen das Verhalten überprüft wird (worauf reagieren, in welcher Zeit …),</li>
<li>einen <b>Bewertungsmaßstab</b>, an dem man ablesen kann, ob das Ziel erreicht ist.</li></ul>
<div class="merk"><b>Beispiel</b><div class="mrows">
<div><span class="ml">Nicht operationalisiert</span><span>„Die Schüler verstehen Brüche.“</span></div>
<div><span class="ml">Operationalisiert</span><span>„Die Schüler kürzen in 10 Minuten ohne Hilfsmittel mindestens 8 von 10 Brüchen richtig.“</span></div></div>
<table class="kvq" style="margin:8px 0 0"><tr><td>Verhalten</td><td>kürzen</td></tr><tr><td>Bedingung</td><td>10 Minuten, ohne Hilfsmittel</td></tr><tr><td>Maßstab</td><td>8 von 10 richtig</td></tr></table></div>
<p><b>Bloom (1956)</b> hat in seiner „Taxonomy of Educational Objectives“ kognitive Lernziele nach Komplexität geordnet, von einfach nach schwer:</p>
<table class="kvq"><tr><th>Stufe</th><th>englisch</th><th>Beispielverb</th></tr>
<tr><td>1. Wissen / Erinnerung</td><td>Remembering</td><td>nennen, benennen</td></tr>
<tr><td>2. Verständnis</td><td>Comprehending</td><td>erklären, unterscheiden</td></tr>
<tr><td>3. Anwendung</td><td>Applying</td><td>berechnen, übertragen</td></tr>
<tr><td>4. Analyse</td><td>Analyzing</td><td>zerlegen, vergleichen</td></tr>
<tr><td>5. Synthese</td><td>Synthesizing</td><td>entwerfen, zusammenführen</td></tr>
<tr><td>6. Bewertung</td><td>Evaluating</td><td>beurteilen, begründen</td></tr></table>
<p>Laut Heine sind in einer Vorlesung vor allem die unteren Stufen erreichbar: Wissen und Verstehen sehr stark, Anwenden und Analysieren etwas. Für die Klausur heißt das: Begriffe sicher <i>benennen</i> und <i>erklären</i> können, dazu einfache Anwendungen.</p>`,

]},
{id:"1-2", t:"Kompetenz und Handlungskompetenz", html:`
<p>Der bekannteste Kompetenzbegriff stammt von <b>Weinert (2001)</b>. Sinngemäß: Kompetenzen sind die verfügbaren oder erlernbaren <b>kognitiven Fähigkeiten und Fertigkeiten</b>, um bestimmte Probleme zu lösen, zusammen mit den <b>motivationalen, volitionalen und sozialen Bereitschaften</b>, diese Lösungen in wechselnden Situationen erfolgreich und verantwortungsvoll zu nutzen.</p>
<p>Kompetenz umfasst also drei Bestandteile:</p>
<ul><li><b>Wissen</b> (verstehen),</li><li><b>Fertigkeiten</b> (können),</li><li><b>motivationale Orientierungen und Emotionen</b> (wollen).</li></ul>
<p>Wichtig ist die Abgrenzung: Kompetenz ist die <b>Voraussetzung</b> für Handeln, also eine Disposition. Das tatsächlich gezeigte Handeln heißt <b>Performanz</b>. Wer kompetent ist, zeigt nicht automatisch gute Leistung, etwa bei Müdigkeit oder Prüfungsangst.</p>
<p>Die Kultusministerkonferenz (KMK, 1999) beschreibt <b>Handlungskompetenz</b> als die Fähigkeit, sich in beruflichen, gesellschaftlichen und privaten Situationen sachgerecht, durchdacht und verantwortlich zu verhalten. Sie setzt sich aus vier Kompetenzen zusammen:</p>
<table class="kvq"><tr><th>Kompetenz</th><th>Beispiele</th></tr>
<tr><td>Sachkompetenz</td><td>Grundlagen- und Fachwissen, Kenntnis wissenschaftlicher Methoden</td></tr>
<tr><td>Methodenkompetenz</td><td>selbstständig arbeiten, Transfer, eigene Wissenslücken erkennen und schließen, reflektieren</td></tr>
<tr><td>Sozialkompetenz</td><td>kommunizieren, Fachsprache, Perspektivwechsel</td></tr>
<tr><td>Selbstkompetenz</td><td>Verantwortung übernehmen, Selbstkritik, ethisches Bewusstsein (Berufsethos)</td></tr></table>
<p>Ziel der Vorlesung ist die professionelle Unterrichtswahrnehmung nach <b>Seidel (2022)</b>:</p>
<ul><li><b>Noticing:</b> Auf Basis von Fachwissen die Aufmerksamkeit gezielt auf Ereignisse im Klassenraum richten, die für das Lernen wichtig sind.</li>
<li><b>Reasoning:</b> Das Wahrgenommene mithilfe dieses Wissens deuten und erklären.</li></ul>
<div class="merk"><b>Wozu das Ganze?</b>Die Vorlesung will, dass du schulische Situationen mit psychologischen Modellen verstehst (Noticing und Reasoning) und daraus sinnvolle Handlungsmöglichkeiten ableitest.</div>`,
check:[
 {q:"Welche drei Bestandteile umfasst Kompetenz nach Weinert?", o:["Wissen, Fertigkeiten, motivationale Orientierungen und Emotionen","Sach-, Methoden- und Sozialkompetenz","Noticing, Reasoning, Handeln","Wissen, Verstehen, Anwenden"], a:0, ex:"Verstehen, Können, Wollen. Sach-, Methoden-, Sozial- und Selbstkompetenz sind die vier Teile der Handlungskompetenz nach KMK."},
 {q:"Was bezeichnet Seidel als „Noticing“?", o:["Das Mitschreiben im Unterricht","Die gezielte Wahrnehmung lernrelevanter Ereignisse im Klassenraum","Das Deuten beobachteter Ereignisse","Die Notengebung"], a:1, ex:"Das Deuten ist Reasoning. Noticing ist die selektive Aufmerksamkeit auf das, was für Lehr-Lern-Prozesse wichtig ist."}
]},
{id:"1-3", t:"Die vier Ziele der Psychologie", html:`
<p>Im Fokus der Psychologie steht die Untersuchung menschlichen <b>Erlebens und Verhaltens</b>. Sie will es</p>
<table class="kvq"><tr><th>Ziel</th><th>Fachbegriff</th><th>Leitfrage</th></tr>
<tr><td>beschreiben</td><td>Deskription</td><td>Was ist da, und was hängt zusammen?</td></tr>
<tr><td>erklären</td><td>Explikation</td><td>Was bedingt was?</td></tr>
<tr><td>vorhersagen</td><td>Prognose</td><td>Was wird passieren?</td></tr>
<tr><td>ggf. verändern</td><td>Intervention</td><td>Wie lässt es sich beeinflussen?</td></tr></table>
<p>Psychologie ist eine <b>empirische Wissenschaft</b>: Sie formuliert mögliche Antworten als <b>Hypothesen</b> und konfrontiert sie systematisch mit der Realität, durch Beobachtung und Messung.</p>
<p><b>Beschreiben</b> heißt: ein Phänomen benennen und definieren, ordnen und klassifizieren, Art und Intensität angeben und <b>Zusammenhänge</b> darstellen. Beispiel: Wissen in einem Fach und die Motivation, sich damit zu beschäftigen, <i>korrelieren</i>. Über Ursache und Wirkung sagt das noch nichts.</p>
<p><b>Erklären</b> heißt: Bedingungsverhältnisse angeben, also <i>A bedingt B</i>. Das setzt die Beschreibung voraus. Beispiel (Dollard et al.): Frustration führt zu Aggression. Die Ursache heißt <b>unabhängiger Indikator</b>, die Wirkung <b>abhängiger Indikator</b>.</p>
<p><b>Vorhersagen</b> heißt: Variablen mit Erklärungswert nutzen, um Prognosemodelle zu bauen. Die Vorhersagevariablen heißen <b>Prädiktoren</b>, das Vorhergesagte heißt <b>Kriterium</b>. Beispiel (Elbro, 1996): Phonologische Bewusstheit und Wortschatz bei der Einschulung sagen den späteren Schriftspracherwerb voraus.</p>
<p><b>Verändern</b> heißt: gezielt auf Sachverhalte einwirken, und zwar als</p>
<ul><li><b>Korrektur</b> (einen negativen Ausgangszustand ausgleichen),</li>
<li><b>Förderung</b> (einen Sachverhalt allgemein verbessern),</li>
<li><b>Prävention</b> (eine Verschlechterung verhindern).</li></ul>
<p>Beispiel: das Vorschulprogramm „Hören, lauschen, lernen“ (Küspert) zur Förderung der phonologischen Bewusstheit.</p>
<div class="merk"><b>Klausurfalle</b>Beim Erklären bedingt der <i>unabhängige</i> Indikator den <i>abhängigen</i>, nie umgekehrt. Achte in Kreuzaufgaben genau auf die Reihenfolge.</div>`,
check:[
 {q:"„Phonologische Bewusstheit in der Kita sagt den späteren Leseerfolg voraus.“ Welche Rolle hat die phonologische Bewusstheit?", o:["Kriterium","Prädiktor","Abhängiger Indikator","Intervention"], a:1, ex:"Die Variable, mit der vorhergesagt wird, ist der Prädiktor. Der Leseerfolg ist das Kriterium."},
 {q:"Ein Förderprogramm soll verhindern, dass sich die Lesefähigkeit verschlechtert. Welche Form der Veränderung ist das?", o:["Korrektur","Förderung","Prävention","Explikation"], a:2, ex:"Prävention verhindert eine Verschlechterung. Korrektur gleicht einen schon negativen Zustand aus."}
]},
{id:"1-4", t:"Konstrukte und Operationalisierung", html:`
<p>Begriffe wie Intelligenz, Konzentrationsfähigkeit, Motivation oder soziale Kompetenz bezeichnen keine Dinge, die man anfassen oder direkt sehen kann. Sie sind <b>psychologische Konstrukte</b>: angenommene Eigenschaften von Personen, mit denen man beobachtbares Verhalten erklärt.</p>
<ul><li><b>Distale Merkmale</b> (Brunswik, 1956): die Konstrukte selbst. Sie sind der direkten Beobachtung <i>nicht</i> zugänglich.</li>
<li><b>Proximale Merkmale</b>: beobachtbare und messbare <b>Indikatoren</b>, aus denen man auf das Konstrukt schließt. Wer misst, muss wissen, welche Indikatoren wirklich zum Konstrukt gehören (das ist eine Frage der Validität).</li></ul>
<p>Konstrukte sind <b>Erklärungszugänge</b>, keine realen Entitäten. Als warnendes Gegenbeispiel zeigt Heine die <b>Phrenologie</b> (19. Jahrhundert), die geistige Eigenschaften an Schädelformen ablesen wollte, als säßen sie als Organe im Kopf.</p>
<p>Schon das Beschreiben setzt eine <b>Operationalisierung</b> voraus: die Übersetzung eines Konstrukts in beobachtbare bzw. messbare Indikatoren. Beispiel: „Wissensniveau in Psychologie“ wird operationalisiert als Punktzahl in einem fachspezifischen Test.</p>
<div class="merk"><b>Klausuraufgabe (WiSe 22/23): Lernmotivation operationalisieren</b><p class="mi">Mögliche Indikatoren und was man bei <i>hoher</i> Lernmotivation erwartet:</p>
<table class="kvq" style="margin:0"><tr><th>Indikator</th><th>bei hoher Motivation</th></tr>
<tr><td>Aufmerksamkeit</td><td>hoch</td></tr><tr><td>Anstrengung</td><td>hoch</td></tr><tr><td>Latenz (Zeit bis zum Beginn)</td><td>kurz</td></tr>
<tr><td>Persistenz (Ausdauer)</td><td>groß</td></tr><tr><td>Präferenz für Lernaufgaben</td><td>groß</td></tr>
<tr><td>Verhaltenswahrscheinlichkeit</td><td>hoch</td></tr><tr><td>emotionaler Ausdruck</td><td>positiv</td></tr></table></div>
<p>Merkmale lassen sich außerdem nach ihrer Stabilität unterscheiden: <b>Traits</b> sind zeitlich stabile Merkmale (z. B. Intelligenz), <b>States</b> sind situationsabhängige Zustände (z. B. aktuelle Müdigkeit).</p>
<p><b>Berufspraktische Relevanz:</b> Wer „Intelligenz“ oder „Motivation“ als Konstrukt begreift, behandelt eine Zuschreibung wie „der ist halt faul“ als <i>Hypothese</i> über eine Person in einer Situation. Sie muss über Indikatoren geprüft werden, und zu jedem Konstrukt gibt es unterschiedliche theoretische Zugänge.</p>`,
check:[
 {q:"Was sind distale Merkmale?", o:["Messbare Indikatoren wie Testpunkte","Konstrukte, die der direkten Beobachtung nicht zugänglich sind","Merkmale, die weit in der Vergangenheit liegen","Situationsabhängige Zustände"], a:1, ex:"Distal (fern) ist das Konstrukt, proximal (nah) sind die beobachtbaren Indikatoren."},
 {q:"Was versteht man unter Operationalisierung?", o:["Die statistische Auswertung","Die Übersetzung eines Konstrukts in beobachtbare bzw. messbare Indikatoren","Die Durchführung eines Tests","Die Wahl einer Stichprobe"], a:1, ex:"Beispiel: Lernmotivation wird über Persistenz, Anstrengung oder Latenz messbar gemacht."}
]}
];
