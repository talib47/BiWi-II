/* ================= Rechentrainer Diagnostik (Kapitel 16) =================
   Jede Aufgabe liefert Schritte {lab, why, f, calc, ans, final?}; Stufen wie in Wirtschaft II: vorgerechnet, geführt, frei. */
const ZS=[-2.5,-2,-1.75,-1.5,-1.25,-1,-.8,-.75,-.6,-.5,-.4,-.25,.25,.4,.5,.6,.75,.8,1,1.25,1.5,1.75,2,2.5];
function rawCase(){
  for(;;){ const mu=pick([20,24,30,36,40,42,50,60,100,120,200,300,460,500,600]), sd=pick([2,3,4,5,6,8,10,12,15,20,25,40,50,100]), z=pick(ZS);
    const x=mu+z*sd; if(!isInt(x)||x<0||sd>=mu) continue; return {mu,sd,z,x}; }
}
const tblRow=(h,v)=>`<div class="tablewrap"><table class="data"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr><tr>${v.map(x=>`<td>${typeof x==="number"?fmt(x):x}</td>`).join("")}</tr></table></div>`;
const zSteps=(c,lab="")=>[
  {lab:`Abstand zum Mittelwert x − μ${lab}`, why:"Erst schauen, wie weit der Rohwert vom Mittelwert der Referenzgruppe entfernt ist. Liegt er darunter, wird es negativ.", f:"x − μ", calc:`${fmt(c.x)} − ${fmt(c.mu)} = ${fmt(c.x-c.mu)}`, ans:c.x-c.mu, sign:true},
  {lab:`z-Wert${lab}`, why:"Den Abstand durch die Standardabweichung teilen: So viele Standardabweichungen liegt die Person vom Mittel entfernt.", f:"z = (x − μ) / σ", calc:`z = ${par(c.x-c.mu)} / ${fmt(c.sd)} = ${fmt(c.z)}`, ans:c.z, final:true, sign:true}
];
const posTxt=(z,ref)=>`Die Person liegt ${fmt(Math.abs(z))} ${Math.abs(z)===1?"Standardabweichung":"Standardabweichungen"} ${z<0?"unter":"über"} ${ref}.`;
const iqBand=iq=>iq<70?"unter 70":iq<85?"70 bis 85":iq<=115?"85 bis 115":iq<=130?"115 bis 130":"über 130";
const iqLabel=iq=>iq<70?"weit unterdurchschnittlich":iq<85?"unterdurchschnittlich":iq<=115?"durchschnittlich":iq<=130?"überdurchschnittlich":"weit überdurchschnittlich";
/* Flächen unter der Normalverteilung nach Heines Tabelle (in %) */
const NV_SEG=[[-99,-3,.13],[-3,-2,2.14],[-2,-1,13.59],[-1,0,34.13],[0,1,34.13],[1,2,13.59],[2,3,2.14],[3,99,.13]];
const nvArea=(a,b)=>r(NV_SEG.filter(([lo,hi])=>lo>=a&&hi<=b).reduce((s,x)=>s+x[2],0));
const SCALES={z:{n:"z-Wert",m:0,s:1},IQ:{n:"IQ",m:100,s:15},T:{n:"T-Wert",m:50,s:10},C:{n:"C-Wert",m:5,s:2}};

const TYPES={
  zwert:{name:"z-Wert berechnen", short:"z-Wert", desc:"Rohwert, Mittelwert und Standardabweichung gegeben: Wie viele Standardabweichungen liegt die Person vom Mittel entfernt?", gen(){
    const c=rawCase();
    return {intro:"Eine Person hat in einem standardisierten Leistungstest folgenden Testrohwert erzielt. Für die Normstichprobe sind Mittelwert und Standardabweichung angegeben.", table:tblRow(["Rohwert x","Mittelwert μ","Standardabw. σ"],[c.x,c.mu,c.sd]), q:"Berechnen Sie den z-Wert (exakt).", steps:zSteps(c), deut:posTxt(c.z,"dem Mittelwert der Normstichprobe")};
  }},
  iq:{name:"Vom Rohwert zum IQ", short:"Rohwert → IQ", desc:"Klausurklassiker (WiSe 17/18, 18/19): z-Wert berechnen, in den Abweichungs-IQ umrechnen, deskriptiv einordnen.", gen(){
    const c=rawCase(), iq=r(100+15*c.z);
    return {intro:`Eine Person hat bei einem standardisierten Intelligenztest (μ = ${fmt(c.mu)}, σ = ${fmt(c.sd)}) einen Testrohwert von ${fmt(c.x)} erzielt.`, table:"", q:"Berechnen Sie den z-Wert und den IQ-Wert (jeweils exakt) und ordnen Sie das Ergebnis deskriptiv ein.",
      deut:`IQ ${fmt(iq)}: ${iqLabel(iq)} (${iqBand(iq)}). ${posTxt(c.z,"dem Durchschnitt")}`,
      steps:[...zSteps(c),{lab:"IQ-Wert (Abweichungs-IQ)", why:"Die IQ-Skala hat Mittelwert 100 und Standardabweichung 15: 100 plus 15 mal z.", f:"IQ = 100 + 15 · z", calc:`IQ = 100 + 15 · ${par(c.z)} = ${fmt(iq)}  →  ${iqLabel(iq)}`, ans:iq, final:true}]};
  }},
  skalen:{name:"Zwischen Normskalen umrechnen", short:"Skalen", desc:"IQ, T-Wert, C-Wert und z-Wert ineinander umrechnen: immer erst zurück zu z.", gen(){
    for(;;){ const from=pick(["IQ","T","C","z"]), to=pick(["IQ","T","C","z"].filter(x=>x!==from)), z=pick(ZS), A=SCALES[from], B=SCALES[to];
      const v=r(A.m+A.s*z), w=r(B.m+B.s*z); if(!nice(v,2)) continue;
      const steps=[];
      if(from!=="z") steps.push({lab:"Zurück zum z-Wert", why:`Die ${A.n}-Skala hat Mittelwert ${A.m} und Standardabweichung ${A.s}. Abstand zum Mittel durch die Standardabweichung teilen.`, f:`z = (Wert − ${A.m}) / ${A.s}`, calc:`z = (${fmt(v)} − ${A.m}) / ${A.s} = ${fmt(z)}`, ans:z, sign:true, final:to==="z"});
      if(to!=="z") steps.push({lab:`${B.n}`, why:`Die ${B.n}-Skala hat Mittelwert ${B.m} und Standardabweichung ${B.s}: Mittelwert plus Standardabweichung mal z.`, f:`${B.n} = ${B.m} + ${B.s} · z`, calc:`${B.m} + ${B.s} · ${par(z)} = ${fmt(w)}`, ans:w, final:true});
      return {intro:`Ein Kind hat in einem Test ${from==="z"?"einen z-Wert":from==="IQ"?"einen IQ":"einen "+A.n} von ${fmt(v)} erreicht.`, table:"", q:`Welcher ${B.n} entspricht diesem Ergebnis?`, steps, deut:`${from==="z"?"z":A.n} ${fmt(v)} und ${to==="z"?"z":B.n} ${fmt(w)} beschreiben dieselbe Position in der Referenzgruppe. ${posTxt(z,"dem Mittel")}`};
    }
  }},
  nv:{name:"Anteile unter der Normalverteilung", short:"Anteile", desc:"Wie viel Prozent der Bevölkerung haben einen IQ in einem bestimmten Bereich? Mit Heines Tabelle 34,13 / 13,59 / 2,14 / 0,13.", gen(){
    const B=[55,70,85,100,115,130,145], kind=pick(["zw","ge","le"]);
    let a,b,txt;
    if(kind==="zw"){ const i=rint(0,5), j=rint(i+1,6); a=B[i]; b=B[j]; txt=`zwischen ${a} und ${b}`; }
    else if(kind==="ge"){ a=pick([70,85,100,115,130,145]); b=null; txt=`von ${a} oder mehr`; }
    else { a=null; b=pick([55,70,85,100,115,130]); txt=`von ${b} oder weniger`; }
    const za=a==null?-99:(a-100)/15, zb=b==null?99:(b-100)/15, p=nvArea(za,zb);
    const steps=[];
    if(a!=null) steps.push({lab:`Grenze ${a} als z-Wert`, why:"Jede Grenze in Standardabweichungen ausdrücken.", f:"z = (IQ − 100) / 15", calc:`z = (${a} − 100) / 15 = ${fmt(za)}`, ans:za, sign:true});
    if(b!=null) steps.push({lab:`Grenze ${b} als z-Wert`, why:"Jede Grenze in Standardabweichungen ausdrücken.", f:"z = (IQ − 100) / 15", calc:`z = (${b} − 100) / 15 = ${fmt(zb)}`, ans:zb, sign:true});
    const parts=NV_SEG.filter(([lo,hi])=>lo>=za&&hi<=zb).map(x=>String(x[2]).replace(".",","));
    steps.push({lab:"Anteil in Prozent", why:"Die Abschnitte zwischen den Grenzen aufaddieren: 34,13 innen, 13,59 zwischen 1 und 2 SD, 2,14 zwischen 2 und 3 SD, 0,13 außen.", f:"Summe der Abschnitte", calc:`${parts.join(" + ")} = ${fmt(p)} %`, ans:p, final:true, tol:.06});
    return {intro:"Der IQ ist normalverteilt mit Mittelwert 100 und Standardabweichung 15.", table:"", q:`Wie viel Prozent der Bevölkerung haben einen IQ ${txt}?`, steps, deut:`Etwa ${fmt(p)} % der Bevölkerung haben einen IQ ${txt}. Zum Vergleich: Zwei Drittel (68,26 %) liegen zwischen 85 und 115.`};
  }},
  pr:{name:"Prozentrang aus einer Werteverteilung", short:"Prozentrang", desc:"Klausur WiSe 18/19 und 22/23: Werte sortieren, cumf zählen, PR = cumf / N · 100.", gen(){
    for(;;){ const N=pick([10,12,15,16,20]), vals=[...Array(N)].map(()=>rint(8,40)); const x=pick(vals);
      const sorted=vals.slice().sort((a,b)=>a-b), cumf=sorted.filter(v=>v<=x).length, pr=r(cumf/N*100);
      if(cumf===N||cumf<3||!nice(pr,2)) continue;
      return {intro:"Gegeben ist die folgende Werteverteilung einer Referenzgruppe.", table:`<div class="eq" style="white-space:normal;margin-top:8px">${vals.join("; ")}</div>`, q:`Ermitteln Sie den Prozentrang des Testwerts ${x} und interpretieren Sie ihn.`, deut:`Prozentrang ${fmt(pr)}: ${fmt(pr)} % der Referenzgruppe haben gleich gut oder schlechter abgeschnitten, ${fmt(r(100-pr))} % besser.`,
        steps:[
          {lab:"cumf: Anzahl der Werte ≤ "+x, why:"Werte sortieren und zählen, wie viele kleiner oder gleich dem Testwert sind. Gleiche Werte zählen mit.", f:"cumf = Anzahl Werte ≤ x", calc:`${sorted.map(v=>v<=x?v:"·").join(" ").replace(/( ·)+$/,"")} → cumf = ${cumf}`, ans:cumf, tol:0},
          {lab:"N: Anzahl aller Werte", why:"Alle Werte der Verteilung zählen.", f:"N", calc:`N = ${N}`, ans:N, tol:0},
          {lab:"Prozentrang PR", why:"Anteil der Werte bis einschließlich des Testwerts in Prozent.", f:"PR = cumf / N · 100", calc:`PR = ${cumf} / ${N} · 100 = ${fmt(pr)}  →  ${fmt(pr)} % haben gleich gut oder schlechter abgeschnitten, ${fmt(r(100-pr))} % besser.`, ans:pr, final:true, tol:.06}
        ]};
    }
  }},
  prrev:{name:"Prozentrang rückwärts: welcher Testwert?", short:"PR rückwärts", desc:"Prozentrang gegeben, Testwert gesucht: Formel nach cumf auflösen, dann in der sortierten Verteilung abzählen.", gen(){
    for(;;){ const N=pick([10,12,16,20]), vals=[...Array(N)].map(()=>rint(8,40)), sorted=vals.slice().sort((a,b)=>a-b);
      const cumf=rint(2,N-1), pr=r(cumf/N*100), x=sorted[cumf-1];
      if(!nice(pr,2)||sorted[cumf]===x) continue;
      return {intro:"Gegeben ist die folgende Werteverteilung einer Referenzgruppe.", table:`<div class="eq" style="white-space:normal;margin-top:8px">${vals.join("; ")}</div>`, q:`Welcher Testwert hat in dieser Verteilung den Prozentrang ${fmt(pr)}?`, deut:`Der Testwert ${x}: ${cumf} von ${N} Werten sind kleiner oder gleich ${x}, das sind ${fmt(pr)} %.`,
        steps:[
          {lab:"cumf aus dem Prozentrang", why:"Formel nach cumf auflösen: durch 100 teilen, mit N malnehmen.", f:"cumf = PR / 100 · N", calc:`cumf = ${fmt(pr)} / 100 · ${N} = ${cumf}`, ans:cumf, tol:0},
          {lab:"Gesuchter Testwert", why:"Werte sortieren und bis zur Stelle cumf abzählen. Der Wert an dieser Stelle hat den Prozentrang.", f:"Wert an Stelle cumf", calc:`${sorted.map((v,i)=>i===cumf-1?"["+v+"]":v).join(" ")} → Stelle ${cumf}: Testwert ${x}`, ans:x, final:true, tol:0}
        ]};
    }
  }},
  vergleich:{name:"Ergebnisse aus verschiedenen Tests vergleichen", short:"Vergleich", desc:"Klausur WiSe 22/23 (14 P.): drei Schülerinnen, drei Lesetests. Rohwerte standardisieren und begründet auswählen.", gen(){
    for(;;){ const x=rint(25,45), M=[0,1,2].map(()=>x+pick([-3,-2,-1,1,2,3,4,5,6,8])), S=[0,1,2].map(()=>pick([2,3,4,5,6,8]));
      const Z=M.map((m,i)=>r((x-m)/S[i])); if(!Z.every(z=>nice(z,2))||new Set(Z).size<3) continue;
      const w=Z.indexOf(Math.min(...Z)), N=["A","B","C"];
      return {intro:"Ein letzter Platz in einem Lesetraining für leseschwache Kinder ist zu vergeben. Drei Schulen schlagen je eine Viertklässlerin vor, gemessen mit unterschiedlichen standardisierten Lesetests.",
        table:`<div class="tablewrap"><table class="data"><tr><th></th><th>Rohwert</th><th>M</th><th>SD</th></tr>${N.map((n,i)=>`<tr><th>${n}</th><td>${x}</td><td>${M[i]}</td><td>${S[i]}</td></tr>`).join("")}</table></div>`,
        q:"Wandeln Sie die Rohwerte in z-Werte um. Welche Schülerin sollte den Platz bekommen? (Antwort als Zahl: A = 1, B = 2, C = 3)", deut:`Gleicher Rohwert, aber unterschiedliche Tests: Schülerin ${N[w]} liegt mit z = ${fmt(Z[w])} am weitesten unter ihrer Referenzgruppe und bekommt den Platz.`,
        steps:[...N.map((n,i)=>({lab:`z-Wert Schülerin ${n}`, why:"Rohwert minus Mittelwert ihres Tests, geteilt durch die Standardabweichung ihres Tests.", f:"z = (x − M) / SD", calc:`z = (${x} − ${M[i]}) / ${S[i]} = ${fmt(Z[i])}  (IQ-Skala: ${fmt(r(100+15*Z[i]))})`, ans:Z[i], final:true, sign:true})),
          {lab:"Platz für Schülerin (A = 1, B = 2, C = 3)", why:"Gesucht ist die schwächste Leserin, also der niedrigste z-Wert: Sie liegt am weitesten unter ihrer Referenzgruppe.", f:"min(z)", calc:`Schülerin ${N[w]}: Ihre Leistung liegt ${fmt(Math.abs(Z[w]))} Standardabweichungen unter dem Mittel ihrer Referenzgruppe, weiter als bei den anderen.`, ans:w+1, final:true, tol:0}]};
    }
  }}
};

/* ================= Grafiken (SVG, Raster 400 × 300) ================= */
const tri=(x,y,dir,cls)=>{ const s=7, p={up:[[x,y],[x-s/1.6,y+s],[x+s/1.6,y+s]],right:[[x,y],[x-s,y-s/1.6],[x-s,y+s/1.6]],down:[[x,y],[x-s/1.6,y-s],[x+s/1.6,y-s]]}[dir]; return `<polygon class="${cls}" points="${p.map(q=>q.join(",")).join(" ")}"/>`; };
const ln=(x1,y1,x2,y2,cls)=>`<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const tx=(x,y,s,cls="",anchor="start",size)=>`<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}"${size?` style="font-size:${size}px"`:""}>${s}</text>`;
const dot=(x,y,cls="dot")=>`<circle class="${cls}" cx="${x}" cy="${y}" r="5"/>`;

/* Normalverteilung mit Flächenanteilen und den üblichen Skalen (Mittelwert 200, 1 SD = 50 px) */
function nvCurve(){
  const X=z=>200+z*50, Y=z=>196-150*Math.exp(-z*z/2);
  let d=""; for(let i=0;i<=140;i++){ const z=-3.5+i*.05; d+=(i?"L":"M")+X(z).toFixed(1)+","+Y(z).toFixed(1); }
  return {X,Y,d};
}
const GFX={
  nv:{base:()=>{ const {X,Y,d}=nvCurve();
      const area=(a,b,cls)=>{ let p=`M${X(a)},196`; for(let z=a;z<=b+1e-9;z+=.05) p+=`L${X(z).toFixed(1)},${Y(z).toFixed(1)}`; return `<path class="${cls}" d="${p}L${X(b)},196Z"/>`; };
      let s=area(-1,1,"fillA")+area(-2,-1,"fillB")+area(1,2,"fillB")+`<path class="base" d="${d}"/>`+ln(18,196,382,196,"ax");
      for(const z of [-3,-2,-1,0,1,2,3]) s+=ln(X(z),Y(z),X(z),200,"ax dash thin");
      const pc=[["34,13 %",-.5,150,11],["34,13 %",.5,150,11],["13,59 %",-1.5,189,10],["13,59 %",1.5,189,10],["2,14 %",-2.75,170,10],["2,14 %",2.75,170,10]];
      for(const [t,z,y,f] of pc) s+=tx(X(z),y,t,"bt","middle",f);
      const rows=[["z",z=>String(z).replace("-","−")],["IQ",z=>100+15*z],["T",z=>50+10*z],["PR",z=>({"-3":"0,13","-2":"2,3","-1":"15,9","0":"50","1":"84,1","2":"97,7","3":"99,9"})[z]]];
      rows.forEach(([lab,f],i)=>{ const y=218+i*19; s+=tx(10,y,lab,"","start",11); for(const z of [-3,-2,-1,0,1,2,3]) s+=tx(X(z),y,f(z),i===1?"bt":"","middle",11); });
      return s; },
    sol:()=>""}
};
const figSVG=(id,sol=true)=>`<svg class="fig" viewBox="0 0 400 300" role="img" aria-label="Grafik">${GFX[id].base()}${sol?GFX[id].sol():""}</svg>`;

/* Zeichenfläche für den Stift, wiederverwendbar */
function drawSurface(c,strokes){
  const ctx=c.getContext("2d"); let penSeen=false, cur=null;
  const color=()=>getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#A87B1F";
  function size(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function draw(){ const r=c.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=color();
    for(const s of strokes){ for(let i=1;i<s.length;i++){ ctx.lineWidth=s[i][2]; ctx.beginPath(); ctx.moveTo(s[i-1][0]*r.width,s[i-1][1]*r.height); ctx.lineTo(s[i][0]*r.width,s[i][1]*r.height); ctx.stroke(); } } }
  const pt=e=>{ const r=c.getBoundingClientRect(); const p=e.pressure&&e.pointerType==="pen"?e.pressure:.5; return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,1.2+p*2.6]; };
  c.onpointerdown=e=>{ if(e.pointerType==="pen") penSeen=true; if(penSeen&&e.pointerType==="touch") return; cur=[pt(e)]; strokes.push(cur); try{c.setPointerCapture(e.pointerId);}catch(x){} };
  c.onpointermove=e=>{ if(!cur) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) cur.push(pt(ev)); draw(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
  size(); window.addEventListener("resize",size);
  return {undo(){ strokes.pop(); draw(); }, clear(){ strokes.length=0; draw(); }};
}

/* ================= Fortschritt ================= */
function lessonState(id){ return (state.lessons||{})[id]; }
function cardBox(id){ return (state.box||{})[id]||0; }
function chapterProgress(n){
  const L=LESSONS[n]||[], K=CARDS[n]||[], C=CALC[n]||[], G=GRAPHS[n]||[], X=kreuzOf(n), W=kurzOf(n);
  if(!L.length) return null;
  const l=L.filter(x=>lessonState(x.id)).length/L.length;
  const k=K.length? K.filter(x=>cardBox(x.id)>=3).length/K.length : 1;
  const x=X.length? X.filter(i=>(kzStat(i.id)||{}).best===4).length/X.length : 1;
  const c=C.length? C.filter(t=>lvlOf(t)===3 && (acc(t)||0)>=.6).length/C.length : 1;
  const g=G.length? G.filter(i=>(state.graphs||{})[i.id]).length/G.length : 1;
  const w=W.length? W.filter(i=>kurzScore(i.id)).length/W.length : 1;
  const parts=[[l,.25,1],[k,.2,K.length],[x,.25,X.length],[c,.15,C.length],[g,.05,G.length],[w,.1,W.length]].filter(p=>p[2]);
  const wsum=parts.reduce((s,p)=>s+p[1],0);
  return {l,k,x,c,g,w,total:Math.round(parts.reduce((s,p)=>s+p[0]*p[1],0)/wsum*100)};
}
function acc(t){ const h=state.hist[t]; return h&&h.n? h.r/h.n : null; }
/* Was ist als Nächstes dran? Theorie zuerst, dann abfragen, rechnen, zeichnen, schreiben */
function nextStep(){
  for(const ch of CHAPTERS){ const n=ch.n; if(!LESSONS[n]) continue;
    const L=LESSONS[n], li=L.findIndex(x=>!lessonState(x.id));
    if(li>=0) return {label:`Kapitel ${n} · Theorie`, title:L[li].t, go:()=>openLesson(n,li)};
    if((CARDS[n]||[]).some(x=>!isSeen(x.id))) return {label:`Kapitel ${n} · Karten`, title:"Begriffe festigen", go:()=>openCards(n)};
    if(kreuzOf(n).some(x=>!kzStat(x.id))) return {label:`Kapitel ${n} · Kreuzen`, title:"Kreuzaufgaben wie in der Klausur", go:()=>openKreuz(n)};
    const ct=(CALC[n]||[]).find(t=>lvlOf(t)<3);
    if(ct) return {label:`Kapitel ${n} · Rechnen`, title:TYPES[ct].name, go:()=>startTask(ct,false)};
    const g=(GRAPHS[n]||[]).findIndex(x=>!(state.graphs||{})[x.id]);
    if(g>=0) return {label:`Kapitel ${n} · Grafik`, title:GRAPHS[n][g].t, go:()=>openGraph(n,g)};
    if(kurzOf(n).some(x=>!kurzScore(x.id))) return {label:`Kapitel ${n} · Schreiben`, title:"Offene Klausuraufgaben", go:()=>openKurz(n)};
  }
  return {label:"Wiederholen", title:"Gemischt üben hält alles frisch", go:()=>openCards(0)};
}

function openLesson(n,i){ cur.ch=n; cur.li=i; cur.ans={}; cur.shown={}; go("lesson"); }
function renderLesson(){
  const n=cur.ch, L=LESSONS[n], x=L[cur.li];
  const html=nb(x.html).replace(/\{\{fig:(\w+)\}\}/g,(_,id)=>figSVG(id,true));

    <article class="block lesson"><h1>${x.t}</h1>${html}</article>
    ${unclearBox(x)}
    <div class="block"><h3>Kurz prüfen</h3>${x.check.map((c,j)=>qBlock(c,j,cur.ans[j],cur.shown[j],j===0)).join("")}</div>
    <div class="lnav">
      ${cur.li>0?`<button class="btn ghost" id="prev">← Vorherige</button>`:"<span></span>"}
      ${allAns&&inSess?sessBtn():allAns?(cur.li<L.length-1?`<button class="btn" id="next">Nächste Lektion →</button>`:`<button class="btn" id="fin">Kapitel-Übersicht</button>`):`<span class="small muted">Beantworte die Fragen, dann geht es weiter.</span>`}
    </div>`;
  bindCrumb(()=>go("chapter"));
  const keep=f=>{ const y=window.scrollY; f(); renderLesson(); window.scrollTo(0,y); };
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>keep(()=>{ cur.shown[+b.dataset.show]=true; }));
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.q, k=+b.dataset.k; if(cur.ans[j]!==undefined) return; cur.ans[j]=k; qGrade(qid(x.id,j),k===x.check[j].a);
    if(x.check.every((_,q)=>cur.ans[q]!==undefined)){ state.lessons=state.lessons||{}; const ok=x.check.every((c,q)=>cur.ans[q]===c.a);
      state.lessons[x.id]={ok, t:Date.now()}; logDay(); save(); }
    keep(()=>{});
  });
  bindUnclear(x);
  if($("#prev")) $("#prev").onclick=()=>openLesson(n,cur.li-1);
  if($("#next")) $("#next").onclick=()=>openLesson(n,cur.li+1);
  if($("#fin")) $("#fin").onclick=()=>go("chapter");
}

function bindUnclear(x){

  const ask=()=>copyForClaude(`Ich lerne für die Modulklausur Bildungswissenschaften II (UDE, Prof. Heine, Pädagogische Psychologie). Diese Lektion verstehe ich noch nicht richtig. Erkläre sie mir bitte einfacher: kurze Sätze, Fachbegriffe kurz erklärt, mit einem Beispiel aus der Schule. Bleib bei den Begriffen und Formeln aus Heines Folien. Stell mir danach zwei Kontrollfragen, die Lösungen bitte erst, wenn ich geantwortet habe.\n\nKapitel: ${CHAPTERS.find(c=>c.n===cur.ch).title}\nLektion „${x.t}“:\n${plain}`,"#ucCopy");
  $("#ucOn").onclick=()=>{ if(state.unclear[x.id]) delete state.unclear[x.id]; else { state.unclear[x.id]=Date.now(); ask(); } save(); const y=window.scrollY; renderLesson(); window.scrollTo(0,y); };

/* ================= Karten (Karteikasten, Fächer 0–5) ================= */
/* Rückseite aus Zeilen aufbauen: „Begriff: Text“ wird zum Begriffspaar, „1. …“ zur nummerierten Liste,
   mehrere einfache Zeilen zur Aufzählung, „A vs. B“ mit „Merkmal: a / b“ zur Vergleichstabelle */
/* Beispiele heben sich von Aufzählungen ab: eigener Absatz mit Etikett, damit „drei Merkmale + Beispiel“ nicht wie vier Merkmale wirkt */
const EXRE=/^(Beispiele?|Bsp\.|z\. ?B\.)(\s+[^:]{1,24})?:?\s+/i;
function exHTML(l){ const m=l.match(EXRE), lab=(m[1]+(m[2]||"")).replace(/^Bsp\.$/i,"Beispiel").replace(/^z\. ?B\.$/i,"Beispiel"); return `<div class="cb-ex"><span class="exl">${inl(lab)}</span><span>${inl(l.slice(m[0].length))}</span></div>`; }
function cardBackHTML(c){
  if(c.rt) return richText(c.b);
  const lines=c.b.split("\n").map(s=>s.trim()).filter(Boolean);
  const kvRe=/^([^:]{1,38}):\s+(.+)$/, numRe=/^\d+\.\s+(.+)$/;
  const kind=l=>{ if(EXRE.test(l)) return "ex"; if(/^\$ /.test(l)) return "eq"; if(/^[-•] /.test(l)) return "plain"; if(numRe.test(l)) return "num"; const m=l.match(kvRe); if(m&&!/,\s|\sheißt/.test(m[1])&&!/[.!?]$/.test(m[1])) return "kv"; if(/ = /.test(l)&&l.length<44) return "eq"; return "plain"; };
  const clean=l=>l.replace(/^[-•$] /,"");
  if(lines.length===1) return `<p>${inl(clean(lines[0]))}</p>`;
  const vs=c.f.split(/\s+vs\.\s+/);
  if(vs.length===2 && lines.every(l=>kind(l)==="kv"&&l.match(kvRe)[2].includes(" / "))){
    const h=vs.map(x=>x.replace(/\s+im Vergleich$/,"").replace(/[?:]$/,""));
    return `<table class="cb-tbl"><tr><th>${inl(h[0])}</th><th>${inl(h[1])}</th></tr>${lines.map(l=>{ const m=l.match(kvRe), p=m[2].split(" / "); return `<tr class="lab"><td colspan="2">${inl(m[1])}</td></tr><tr><td>${inl(p[0])}</td><td>${inl(p.slice(1).join(" / "))}</td></tr>`; }).join("")}</table>`;
  }
  /* „Begriff (Fachbegriff)“ am Zeilenanfang: Begriff fett, Klammer leiser */
  const nm=l=>{ const m=l.match(/^([^()]{2,40}?) \((.+)\)$/); return m?`<b>${inl(m[1])}</b> <span class="pz">(${m[2]})</span>`:inl(l); };
  const groups=[]; for(const l of lines){ const k=kind(l), g=groups[groups.length-1]; if(g&&g.k===k&&k!=="eq") g.l.push(l); else groups.push({k,l:[l]}); }
  return groups.map(g=>{
    if(g.k==="num") return `<ol class="cb-ol">${g.l.map(l=>`<li><span>${nm(l.match(numRe)[1])}</span></li>`).join("")}</ol>`;
    if(g.k==="kv") return `<dl class="cb-dl">${g.l.map(l=>{ const m=l.match(kvRe); return `<div><dt>${inl(m[1])}</dt><dd>${inl(m[2])}</dd></div>`; }).join("")}</dl>`;
    if(g.k==="eq") return `<div class="eq">${fx(clean(g.l[0]))}</div>`;
    if(g.k==="ex") return g.l.map(exHTML).join("");
    if(g.l.length===1) return `<p>${inl(clean(g.l[0]))}</p>`;
    return `<ul class="cb-ul">${g.l.map(l=>`<li>${nm(clean(l))}</li>`).join("")}</ul>`;
  }).join("");
}
function allCards(n){ return n? (CARDS[n]||[]) : Object.values(CARDS).flat(); }
/* Wiederholung mit Fälligkeitsdatum (wie Anki): sicherer gewusst = längerer Abstand */
const INTERVAL=[0,0,1,3,7,16];   // Tage bis zur nächsten Abfrage je Fach; Fach 5 erneut gewusst: 35 Tage
const dayStart=(t=Date.now())=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const isSeen=id=>!!(state.box||{})[id];
const isDue=id=>isSeen(id) && ((state.due||{})[id]||0)<=Date.now();
function dueCards(n){ return allCards(n).filter(x=>isDue(x.id)).sort((a,b)=>((state.due||{})[a.id]||0)-((state.due||{})[b.id]||0)); }
function openCards(n,free,deck){ cur.cardCh=n; cur.free=!!free; cur.deck=deck?deck.slice():(free?buildDeck(n):buildDueDeck(n)); cur.ci=0; cur.flip=false; cur.right=0; cur.unsure=0; cur.typed=""; cur.tyOpen=false; cur.hist=[]; cur.requeued={}; go("cards"); }
const deckLabel=n=>DECK_NAME[n]?"Zeichen":n?"Kapitel "+n:"Üben";
const deckBack=n=>DECK_NAME[n]?go("sym"):n?go("chapter"):go("practice");
let CARD_CH=null;
function cardChapter(id){ if(!CARD_CH){ CARD_CH={}; CHAPTERS.forEach(ch=>(CARDS[ch.n]||[]).forEach(c=>CARD_CH[c.id]=ch)); } return CARD_CH[id]; }
function buildDueDeck(n){
  const due=dueCards(n), fresh=n? allCards(n).filter(x=>!isSeen(x.id)) : [];
  return due.concat(fresh).slice(0,Math.max(10,Math.min(due.length,30)));
}
function buildDeck(n){
  const pool=allCards(n).slice(), deck=[];
  while(deck.length<Math.min(10,pool.length)){
    const w=pool.map(x=>[6,5,4,3,2,1][cardBox(x.id)]); let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0;
    for(;i<pool.length;i++){ r-=w[i]; if(r<=0) break; } deck.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return deck;
}
/* Lernstand einer Karte oder Frage als fünf kleine Punkte statt „Stufe x von 5“: gefüllt = wie gut sie sitzt */
const lvlDots=b=>`<span class="lvl" role="img" aria-label="Sitzt ${b} von 5" title="Sitzt ${b} von 5">${[1,2,3,4,5].map(k=>`<i class="${k<=b?"on":""}"></i>`).join("")}</span>`;
function renderCards(){
  const D=cur.deck, n=cur.cardCh;
  if(cur.ci>=D.length){
    const left=dueCards(n).length+(n?allCards(n).filter(x=>!isSeen(x.id)).length:0);
    const nextDue=allCards(n).filter(x=>isSeen(x.id)&&!isDue(x.id)).map(x=>(state.due||{})[x.id]).sort((a,b)=>a-b)[0];
    const when=nextDue? Math.round((dayStart(nextDue)-dayStart())/864e5) : null;
    $("#app").innerHTML=`${backTo(deckLabel(n))}<h1>${D.length?(left?"Runde geschafft":"Für heute erledigt"):"Nichts fällig"}</h1>
      <div class="block">${D.length?`<p>${cur.right} sicher, ${cur.unsure||0} nicht sicher.</p>`:""}

      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="again">Weiter</button>`:""}<button class="btn ghost" id="free">Freiwillig weiterüben</button><button class="btn ghost" id="out">Fertig</button>`}</div></div>`;

  }
  const c=D[cur.ci], b=cardBox(c.id), ch=cardChapter(c.id), sym=/^[sr]-/.test(c.id);
  const ctx=CARD_CTX[c.id]||(ch?ch.title:"");
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("#app").innerHTML=`
    <div class="row between ctop"><p class="eyebrow" style="margin:0">Karte ${cur.ci+1} von ${D.length}${cur.free?" · freiwillig":isSeen(c.id)?lvlDots(b):` <span class="lvnew">neu</span>`}</p><span class="crt">${cur.hist.length?`<button class="cundo" id="cprev" aria-label="Eine Karte zurück" title="Eine Karte zurück"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Zurück</span></button>`:""}</span></div>
    <div class="swipewrap">
    <div class="block card${cur.enter?" enter":""}" id="theCard" style="margin-top:8px" role="button" tabindex="0" aria-label="Karte umdrehen"><i class="tint" aria-hidden="true"></i>
      ${ctx?`<p class="cctx">${inl(ctx)}</p>`:""}
      <div class="front${sym&&c.id.startsWith("s-")?" symf":""}">${inl(c.f)}${c.erg?` <span class="erg">Ergänzung</span>`:""}</div>
      ${cur.flip?`${cur.typed.trim()?`<div class="typed"><span class="small muted">Deine Antwort</span><p>${esc(cur.typed)}</p></div>`:""}<div class="back cb">${cardBackHTML(c)}</div>${cardInfoHTML(c.id)}`:""}</div></div>
    ${cur.flip?`<div class="grade"><button class="btn ghost" id="mid"><span class="arr">← </span>Nicht sicher</button><button class="btn" id="yes">Sicher<span class="arr"> →</span></button></div>`
      :`${cur.tyOpen||cur.typed?`<textarea id="cty" class="cty" rows="1" placeholder="Deine Antwort …" aria-label="Antwort tippen">${esc(cur.typed)}</textarea>`:""}
      <div class="row fliprow"><button class="btn" id="flip" style="flex:1">Antwort zeigen</button></div>`}`;
  bindCrumb(()=>deckBack(n));
  if($("#tyO")) $("#tyO").onclick=()=>{ cur.tyOpen=true; renderCards(); $("#cty").focus(); };
  const ta=$("#cty"); if(ta){ const fit=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }; fit(); ta.oninput=()=>{ cur.typed=ta.value; fit(); }; }
  if($("#flip")) $("#flip").onclick=()=>{ cur.flip=true; renderCards(); };
  const cd=$("#theCard"); let moved=false; cur.drag=null;
  cd.onclick=e=>{ if(e.target.closest("a")||moved) return; cur.flip=!cur.flip; renderCards(); };
  cd.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cd.click(); } else if(cur.flip&&e.key==="ArrowRight") grade(2); else if(cur.flip&&e.key==="ArrowLeft") grade(1); };
  /* Wischen wie bei Dating-Apps, erst nach dem Aufdecken: rechts sicher, links nicht sicher.
     Die Karte folgt dem Finger, eine leichte Tönung zeigt die Richtung an. */
  /* Zugedeckt: Wischen bewertet noch nicht. Die Karte schüttelt kurz den Kopf (rot), auf Android vibriert es dazu. */
  if(!cur.flip){ let fx=null,fy=0,shook=false;
    cd.onpointerdown=e=>{ fx=e.clientX; fy=e.clientY; shook=false; };
    cd.onpointermove=e=>{ if(fx===null||shook) return; const d=e.clientX-fx; if(Math.abs(d)>28&&Math.abs(d)>1.4*Math.abs(e.clientY-fy)){ shook=true; buzz(); } };
    cd.onpointerup=cd.onpointercancel=()=>{ if(shook) window.__noClick=Date.now(); fx=null; };
  }
  if(cur.flip){ const tint=cd.querySelector(".tint");
    let x0=null, y0=0, dx=0, raf=0, w=360, dir=0, hist=[], done=false;
    /* Pro Bild nur transform und opacity ändern (läuft auf dem Grafikchip). Die Tönung erreicht schon bei einem Fünftel
       der Kartenbreite volle Stärke. */
    const paint=()=>{ raf=0; const k=Math.min(1,Math.abs(dx)/(w*.2)), d=dx>0?1:-1;
      if(d!==dir){ dir=d; tint.className="tint "+(d>0?"ok":"no"); }
      cd.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/40}deg)`; tint.style.opacity=k; };
    const track=x=>{ const t=performance.now(); hist.push([t,x]); while(hist.length>2&&t-hist[0][0]>90) hist.shift(); };
    const speed=()=>{ if(hist.length<2) return 0; const [t1,x1]=hist[0],[t2,x2]=hist[hist.length-1]; return t2>t1?(x2-x1)/(t2-t1):0; };  /* px pro ms */
    const begin=()=>{ dx=0; hist=[]; w=cd.offsetWidth||360; cd.style.transition="none"; tint.style.transition="none"; cd.classList.add("drag"); };
    const release=()=>{ if(raf){ cancelAnimationFrame(raf); raf=0; paint(); }
      const v=speed(), lim=Math.min(90,w*.22);
      /* Ausgelöst wird durch Weite oder durch einen schnellen Schwung in dieselbe Richtung */
      const go=Math.abs(dx)>lim || (Math.abs(v)>.45 && Math.abs(dx)>24 && Math.sign(v)===Math.sign(dx));
      if(go&&!done){ done=true; const sgn=Math.sign(dx)||Math.sign(v), out=sgn*(window.innerWidth*.6+w);
        const ms=Math.round(Math.max(160,Math.min(320,Math.abs(out-dx)/Math.max(1.4,Math.abs(v)))));
        tint.style.opacity=1; cd.style.transition=`transform ${ms}ms cubic-bezier(.25,.8,.35,1), opacity ${ms}ms linear`;
        cd.style.transform=`translate3d(${out}px,0,0) rotate(${sgn*16}deg)`; cd.style.opacity="0";
        let fired=false; const fin=()=>{ if(fired) return; fired=true; cur.enter=true; grade(sgn>0?2:1); };
        cd.addEventListener("transitionend",fin,{once:true}); setTimeout(fin,ms+40); }
      else { cd.classList.remove("drag"); cd.style.transition="transform .42s cubic-bezier(.2,1.5,.4,1)"; tint.style.transition="opacity .2s"; cd.style.transform=""; tint.style.opacity="0"; setTimeout(()=>{ moved=false; },0); } };
    /* Wischen auch außerhalb der Karte (iPad: Daumen rechts neben der Karte): cur.drag nimmt die Bewegung an */
    cur.drag={start:begin, move:d=>{ dx=d; track(d); if(!raf) raf=requestAnimationFrame(paint); }, end:()=>{ moved=true; release(); }};
    cd.onpointerdown=e=>{ if(e.target.closest("a")||done) return; x0=e.clientX; y0=e.clientY; dx=0; moved=false; };
    cd.onpointermove=e=>{ if(x0===null) return; const d=e.clientX-x0;
      if(!moved){ if(Math.abs(d)>6&&Math.abs(d)>Math.abs(e.clientY-y0)){ moved=true; x0+=d>0?6:-6; try{cd.setPointerCapture(e.pointerId);}catch(x){} begin(); } else return; }
      e.preventDefault(); dx=e.clientX-x0; track(dx); if(!raf) raf=requestAnimationFrame(paint); };
    cd.onpointerup=cd.onpointercancel=()=>{ if(x0===null) return; x0=null; if(!moved) return; release(); };
  }
  /* Bewertung: 2 sicher (nächstes Fach), 1 nicht sicher (ein Fach zurück, morgen wieder, in dieser Runde noch einmal) */
  function grade(lv){ state.box=state.box||{}; state.due=state.due||{}; state.lapses=state.lapses||{};
    const b0=cardBox(c.id), old=state.due[c.id]||0;
    cur.hist.push({ci:cur.ci, id:c.id, box:state.box[c.id], due:state.due[c.id], lapse:state.lapses[c.id], right:cur.right, unsure:cur.unsure, len:D.length, rq:Object.assign({},cur.requeued), typed:cur.typed});
    const b1= lv===2? Math.min(5,Math.max(b0,1)+1) : Math.max(1,b0-1);
    const nd= lv===2? dayStart()+spaceDays(b0===5?35:INTERVAL[b1])*864e5 : dayStart()+864e5;
    if(!cur.free){ state.box[c.id]=b1; state.due[c.id]=nd; }
    else if(lv<2){ state.box[c.id]=Math.min(b0||1,b1); state.due[c.id]=Math.min(old||nd,nd); }
    if(lv===2) cur.right++;
    else { cur.unsure=(cur.unsure||0)+1; state.lapses[c.id]=(state.lapses[c.id]||0)+1; if((cur.requeued[c.id]||0)<3){ cur.requeued[c.id]=(cur.requeued[c.id]||0)+1; D.push(c); } }
    logDay(); save(); cur.ci++; cur.flip=false; cur.typed=""; renderCards(); window.scrollTo(0,0); }
  if($("#yes")) $("#yes").onclick=()=>{ cur.enter=true; grade(2); };
  if($("#mid")) $("#mid").onclick=()=>{ cur.enter=true; grade(1); };
  /* Eine Karte zurück: letzte Bewertung rückgängig machen */
  if($("#cprev")) $("#cprev").onclick=()=>{ const h=cur.hist.pop(); if(!h) return;
    const put=(o,k,v)=>{ if(v===undefined) delete o[k]; else o[k]=v; };
    put(state.box,h.id,h.box); put(state.due,h.id,h.due); put(state.lapses,h.id,h.lapse);
    cur.right=h.right; cur.unsure=h.unsure; D.length=h.len; cur.requeued=h.rq; cur.ci=h.ci; cur.flip=true; cur.typed=h.typed; save(); renderCards(); };
}

function calcTypes(n){ return n? (CALC[n]||[]) : [...new Set(Object.values(CALC).flat())]; }

  const T=calcTypes(0), started=T.filter(t=>state.hist[t]&&state.hist[t].n);
  const fresh=T.find(t=>!started.includes(t)), weak=started.filter(t=>acc(t)<.7).sort((a,b)=>acc(a)-acc(b))[0];
  return weak||fresh||T[Math.floor(Math.random()*T.length)];
}

/* Tastatur (iPad mit Tastatur): Leertaste oder Enter dreht die Karte, → sicher, ← nicht sicher, Z eine Karte zurück */
document.addEventListener("keydown",e=>{
  if(view!=="cards"||e.metaKey||e.ctrlKey||e.altKey||(e.target.closest&&e.target.closest("textarea,input,select"))) return;
  const c=$("#theCard"); if(!c||document.activeElement===c) return;
  const k=e.key, hit=id=>{ const b=$(id); if(b){ e.preventDefault(); b.click(); } };
  if(k===" "||k==="Enter"){ e.preventDefault(); c.click(); }
  else if(k==="ArrowRight") hit("#yes"); else if(k==="ArrowLeft") hit("#mid"); else if(k==="z"||k==="Z") hit("#cprev");

/* Tippen und Wischen getrennt (Muster 17.11.): Auf dem Touch-Bildschirm dreht ein Tippen irgendwo außerhalb der Karte
   die Karte um, hin und zurück, genau wie ein Tipp auf die Karte. Waagerechtes Wischen bewertet nur
   die aufgedeckte Karte, auf oder neben ihr: rechts sicher, links nicht sicher. Zugedeckt bewirkt Wischen nichts. */
/* Kurzes Kopfschütteln der Karte: Hinweis, dass sie noch zugedeckt ist */
function buzz(){ const cd=$("#theCard"); if(!cd||cd.classList.contains("buzz")) return;
  cd.classList.add("buzz"); try{ navigator.vibrate&&navigator.vibrate([18,40,18]); }catch(x){}
  setTimeout(()=>cd.classList.remove("buzz"),420); }
(function(){ let x0=null,y0=0,t0=0,on=false,id=null,shook=false;
  const ok=e=>view==="cards"&&e.pointerType!=="mouse"&&$("#theCard")&&!e.target.closest("#theCard,textarea,input,a,button,#sessbar,#focusbar,nav");

    if(!views.includes(view)||!QC||e.metaKey||e.ctrlKey||e.altKey||(e.target.closest&&e.target.closest("textarea,input,select"))||document.activeElement===QC.cd) return;
    const k=e.key;
    if(k===" "||k==="Enter"){ if(document.activeElement&&document.activeElement.tagName==="BUTTON") return; e.preventDefault(); QC.tap(); }
    else if(k==="ArrowRight"||k==="ArrowLeft"){ const d=k==="ArrowRight"?1:-1, a=QC.can(d); if(a){ e.preventDefault(); if(a==="fly"){ QC.enter=true; } QC.swipe(d); } }
    else if(/^[1-8a-hA-H]$/.test(k)){ const ix=/\d/.test(k)?+k-1:"abcdefgh".indexOf(k.toLowerCase()), b=document.querySelectorAll(".qcopts [data-qk]")[ix]; if(b){ e.preventDefault(); b.click(); } }
    else if(k==="?"){ const b=document.querySelector(".qidk"); if(b){ e.preventDefault(); b.click(); } }
  });
})();

/* Kreuzaufgaben als Auswahlkarte: eine Aussage nach der anderen, Punkte wie in der Klausur nach der dritten Aussage.
   „Weiß ich nicht“ zählt keinen Punkt. */
const KZ_DOT="abc";
function kzFinish(K,item){
  const p=kzPoints(item,K.ans); K.pts[K.i]=p; K.sure[K.i]=p;
  const s=kzStat(item.id)||{n:0,best:0}, b=p===4?Math.min(5,(s.b||1)+1):1;
  state.kreuz[item.id]={n:s.n+1,p,best:Math.max(s.best||0,p),t:Date.now(),b,due:dayStart()+(p===4?spaceDays(s.b===5?35:INTERVAL[b]):1)*864e5}; logDay(); save();
}
function kzNext(){ const K=cur.kr; if(!(K.j in K.ans)) return;
  if(K.j<2){ K.j++; } else { K.i++; K.j=0; K.ans={}; K.prev=null; }
  renderKreuz(); window.scrollTo(0,0); }
function renderKreuz(){
  const K=cur.kr, back=K.n?"Kapitel "+K.n:"Üben", backFn=()=>{ if(K.n){ cur.ch=K.n; go("chapter"); } else go("practice"); };
  if(K.j===undefined) K.j=0;
  if(!K.items.length){ $("#app").innerHTML=`${backTo(back)}<h1>Noch keine Kreuzaufgaben</h1><p class="muted">Für diesen Bereich gibt es noch keine Aufgaben.</p>`; bindCrumb(backFn); return; }
  if(K.i>=K.items.length&&cur.mx) return mixNext(null,K.pts.reduce((a,b)=>a+b,0));
  if(K.i>=K.items.length){
    const sum=K.pts.reduce((a,b)=>a+b,0), max=K.items.length*4;
    $("#app").innerHTML=`${backTo(back)}<h1>Runde geschafft</h1>
      <div class="block"><p class="pbadge">${sum} von ${max} Punkten</p>
      <p class="small muted">So wird auch in der Klausur gezählt: je richtiges Kreuz ein Punkt, alle drei Aussagen einer Aufgabe richtig ein Zusatzpunkt. Aufgaben mit Fehlern kommen bevorzugt wieder.</p>
      <div class="row">${sess?sessBtn():`<button class="btn" id="again">Neue Runde</button><button class="btn ghost" id="out">Fertig</button>`}</div></div>`;
    bindCrumb(backFn); if($("#again")) $("#again").onclick=()=>openKreuz(K.n); if($("#out")) $("#out").onclick=backFn; return;
  }
  const item=KREUZ.find(x=>x.id===K.items[K.i]), ch=CHAPTERS.find(c=>c.n===item.ch), j=K.j, st=item.s[j];
  if(j===0&&!(0 in K.ans)&&K.prev===null) K.prev=kzStat(item.id)||false;
  const done=j in K.ans, a=K.ans[j], ok=done&&a===st[1], last=j===2, word=v=>v?"wahr":"falsch";
  const dots=[0,1,2].map(k=>{ const d=k in K.ans, r=d&&K.ans[k]===item.s[k][1], q=d&&K.ans[k]===null;
    return `<i class="${q?"idk":d?(r?"ok":"no"):k===j?"now":""}" aria-label="Aussage ${KZ_DOT[k]}${q?" nicht gewusst":d?(r?" richtig":" falsch"):""}">${q?"?":d?(r?"✓":"✕"):KZ_DOT[k]}</i>`; }).join("");
  qcRender({
    eye:`${cur.mx?"Kreuzaufgabe":`Aufgabe ${K.i+1} von ${K.items.length}`} · Kap. ${item.ch} ${ch.title}${item.klausur?" · Klausur "+item.klausur:""}`,
    right:`<span class="kzdots">${dots}</span>`, stem:item.stem, erg:item.erg,
    ctx:`Aussage ${KZ_DOT[j]})${K.prev&&j===0&&!done?` · zuletzt ${K.prev.p} von 4 Punkten`:""}`,
    front:inl(st[0]), phase:done?"done":"open", binary:true, idk:true,
    opts:[{k:"0",l:"falsch"},{k:"1",l:"wahr"}],
    ok:!done?undefined:a===null?null:ok,
    verdict:!done?null:ok?{t:"Richtig.",s:[`Die Aussage ist ${word(st[1])}.`]}
      :a===null?{t:"Nicht gewusst.",s:[`Die Aussage ist ${word(st[1])}.`]}
      :{t:"Falsch.",s:[`Du hast „${word(a)}“ gewählt, die Aussage ist aber ${word(st[1])}.`]},
    why:done?st[2]:"",
    next:!last||cur.mx||K.i<K.items.length-1?"Weiter":"Auswertung",
    below:done&&last?`<p class="kzsum">Diese Aufgabe: ${K.pts[K.i]} von 4 Punkten</p>`:"",
    pick:k=>{ if(j in K.ans) return; K.ans[j]=k==="__idk"?null:k==="1"; if(j===2) kzFinish(K,item); renderKreuz(); if(K.ans[j]!==null&&K.ans[j]!==st[1]) buzz(); },
    go:kzNext
  });
}

/* ---------- Musterlösung: „1) … 2) … 3) …“ als Liste setzen ---------- */
function solHTML(m){
  const parts=m.split(/(?:^|\s)(?=\d\)\s)/);
  if(parts.length<3) return `<p style="margin:0">${m}</p>`;
  const intro=/^\d\)\s/.test(parts[0])?"":parts.shift(), items=parts.map(p=>p.replace(/^\d\)\s/,""));
  const last=items[items.length-1], cut=last.search(/\.\s+(Bei|Weitere|Insgesamt|Fazit)/);
  let tail=""; if(cut>0){ tail=last.slice(cut+2); items[items.length-1]=last.slice(0,cut+1); }
  return `${intro?`<p style="margin:0 0 6px">${intro}</p>`:""}<ol class="sol-ol">${items.map(i=>`<li>${i.replace(/^([^:.]{2,30}):/,"<b>$1:</b>")}</li>`).join("")}</ol>${tail?`<p style="margin:8px 0 0">${tail}</p>`:""}`;
}

function teilReady(t){ return KREUZ.some(x=>LESSONS[x.ch]&&teilOf(x.ch)===t); }
function newExam(teile,min){

    const ops=OPEN.filter(o=>LESSONS[o.ch]&&teilOf(o.ch)===t), o=ops.length?pick(ops):null;
    const open=o?(o.kind==="calc"?{id:o.id,kind:"calc",title:o.title,pts:TEILE[t].op,data:TYPES[o.t].gen(),ans:{}}:{id:o.id,kind:"kurz",title:o.title,pts:TEILE[t].op,k:o.k,ans:""}):null;
    return {teil:t, kz:pool.map(x=>({id:x.id,ans:{}})), open};
  });
  return {start:Date.now(), min, phase:"run", parts, grade:{}};
}

    return `<div class="block"><p style="margin:0 0 6px"><b>${no}. ${o.title}</b> <span class="small muted">(${o.pts} P.)</span></p><p style="margin:0 0 8px">${x.q}</p>
      <textarea data-op="${pi}" style="width:100%;min-height:9rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:1rem/1.5 var(--sans)">${esc(o.ans)}</textarea></div>`; }
  const d=o.data, F=d.steps.map((s,i)=>[s,i]).filter(([s])=>s.final);
  return `<div class="block"><p style="margin:0 0 6px"><b>${no}. ${o.title}</b> <span class="small muted">(${o.pts} P.)</span></p><p class="small" style="margin:0">${d.intro}</p>${d.table}<p style="margin:8px 0 0"><b>${d.q}</b></p>
    ${F.map(([s,i])=>`<div style="margin-top:8px"><label class="small" style="font-weight:600" for="op${pi}_${i}">${s.lab}</label><div class="inp" style="margin-top:4px"><input id="op${pi}_${i}" data-op="${pi}" data-i="${i}" inputmode="decimal" autocomplete="off" value="${esc(o.ans[i]||"")}"></div></div>`).join("")}</div>`;
}
function calcPts(o){ const F=o.data.steps.map((s,i)=>[s,i]).filter(([s])=>s.final); const ok=F.filter(([s,i])=>judge(s,o.ans[i]||"")).length; return {ok,n:F.length,p:Math.round(o.pts*ok/F.length*2)/2}; }
function renderExamGrade(){
  const e=state.examRun, g=e.grade;
  const kurzP=(o,pi)=>{ const x=KURZ.find(y=>y.id===o.k); const c=x.k.filter((_,j)=>g[pi+"_"+j]).length; return Math.round(o.pts*c/x.k.length*2)/2; };
  const partP=(p,pi)=>p.kz.reduce((s,k)=>s+kzPoints(KREUZ.find(x=>x.id===k.id),k.ans),0)+(p.open?(p.open.kind==="calc"?calcPts(p.open).p:kurzP(p.open,pi)):0);
  const total=()=>e.parts.reduce((s,p,pi)=>s+partP(p,pi),0), max=e.parts.reduce((s,p)=>s+partMax(p),0);
  $("#app").innerHTML=`<p class="eyebrow">Probeklausur · Bewertung · ${Math.round((e.used||0)/60000)} von ${e.min} Minuten genutzt</p>
    <div class="block row between" style="position:sticky;top:env(safe-area-inset-top,0px);z-index:4"><span><b>Ergebnis</b></span><span class="pts" id="tot" style="font-size:1.3rem">${String(total()).replace(".",",")} / ${max}</span></div>
    ${e.parts.map((p,pi)=>`<h2>Teil ${p.teil}: ${TEILE[p.teil].t}</h2>
      ${p.kz.map((k,ii)=>{ const item=KREUZ.find(x=>x.id===k.id); return `<div class="block"><div class="row between"><h3 style="margin:0">${ii+1}. ${item.stem}</h3><span class="pbadge">${kzPoints(item,k.ans)}/4</span></div>${kzBlock(item,k.ans,true,"g")}</div>`; }).join("")}
      ${p.open?openGrade(p.open,pi,p.kz.length+1):""}`).join("")}
    <div class="row" style="margin-bottom:20px"><button class="btn" id="xsave">Ergebnis speichern und beenden</button></div>`;
  document.querySelectorAll("[data-g]").forEach(c=>c.onchange=()=>{ g[c.dataset.g]=c.checked; $("#tot").textContent=String(total()).replace(".",",")+" / "+max; examSave(); });
  document.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>{ const pi=+b.dataset.cl, o=e.parts[pi].open, x=KURZ.find(y=>y.id===o.k);
    copyForClaude(`Bewerte bitte meine Antwort aus einer Probeklausur im Modul Bildungswissenschaften II (UDE, Prof. Heine).\n\nAufgabe (${o.pts} Punkte):\n${x.q}\n\nErwartungshorizont:\n${x.k.map(k=>"- "+k).join("\n")}\n\nMeine Antwort:\n${o.ans}\n\nGib mir eine Punktzahl mit Begründung und sag, was fehlt.`,"#cl"+pi); });
  $("#xsave").onclick=()=>{ state.exams=state.exams||[]; const parts=e.parts.map((p,pi)=>({teil:p.teil,p:partP(p,pi),max:partMax(p)}));
    state.exams.push({t:Date.now(),p:total(),max,parts}); e.parts.forEach(p=>p.kz.forEach(k=>{ const item=KREUZ.find(x=>x.id===k.id), s=kzStat(k.id)||{n:0,best:0}, pp=kzPoints(item,k.ans); state.kreuz[k.id]={n:s.n+1,p:pp,best:Math.max(s.best||0,pp),t:Date.now()}; }));
    state.examRun=null; logDay(); save(); toast("Gespeichert"); renderExam(); window.scrollTo(0,0); };
}
function openGrade(o,pi,no){
  if(o.kind==="kurz"){ const x=KURZ.find(y=>y.id===o.k);
    return `<div class="block"><p style="margin:0 0 6px"><b>${no}. ${o.title}</b> <span class="small muted">(${o.pts} P.)</span></p><p class="small" style="margin:0 0 6px">${x.q}</p>
      <p class="small" style="white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px">${esc(o.ans)||'<span class="muted">keine Antwort</span>'}</p>
      ${x.k.map((k,j)=>`<label class="check"><input type="checkbox" data-g="${pi}_${j}" ${state.examRun.grade[pi+"_"+j]?"checked":""}><span>${k}</span></label>`).join("")}
      <details><summary class="small">Musterlösung</summary><div class="small">${solHTML(x.m)}</div></details>
      <div class="row" style="margin-top:6px"><button class="btn ghost small" data-cl="${pi}">Für Claude kopieren</button></div><div id="cl${pi}"></div></div>`; }
  const c=calcPts(o), S=o.data.steps;
  return `<div class="block"><div class="row between"><p style="margin:0"><b>${no}. ${o.title}</b></p><span class="pbadge">${String(c.p).replace(".",",")}/${o.pts}</span></div>
    ${S.map((s,i)=>s.final?`<p class="res ${judge(s,o.ans[i]||"")?"good":"bad"}" style="margin:4px 0">${s.lab}: ${esc(o.ans[i]||"–")}${judge(s,o.ans[i]||"")?"":" · richtig: "+fmt(s.ans)}</p>`:"").join("")}
    <div class="stack" style="margin-top:6px">${S.map(s=>`<div><div class="small" style="font-weight:600">${s.lab}</div><div class="eq">${esc(s.calc)}</div></div>`).join("")}</div></div>`;
}

{id:"1-1", t:"Lernziele und die Stufen nach Bloom", html:`
<p>Heine beginnt jede Sitzung mit <b>kognitiven Lernzielen</b>. Das ist kein Zufall: Lernziele sind selbst ein Thema der Vorlesung.</p>
<p>Nach Ingenkamp und Lissmann (2008) beschreiben <b>operationalisierte Lernziele</b> das beabsichtigte Verhalten, das Lernende nach Abschluss des Lernprozesses zeigen sollen. Ein angemessen operationalisiertes Lernziel enthält drei Dinge:</p>
<ul><li><b>beobachtbare Verhaltensweisen</b> (was genau soll man sehen können?),</li>
<li><b>Bedingungen</b>, unter denen das Verhalten überprüft wird (worauf reagieren, in welcher Zeit …),</li>
<li>einen <b>Bewertungsmaßstab</b>, an dem man ablesen kann, ob das Ziel erreicht ist.</li></ul>
<div class="merk"><b>Beispiel</b><div class="mrows">
<div><span class="ml">Nicht operationalisiert</span><span>„Die Schüler verstehen Brüche.“</span></div>
<div><span class="ml">Operationalisiert</span><span>„Die Schüler kürzen in 10 Minuten ohne Hilfsmittel mindestens 8 von 10 Brüchen richtig.“</span></div></div>
<table class="kvq" style="margin:8px 0 0"><tr><td>Verhalten</td><td>kürzen</td></tr><tr><td>Bedingung</td><td>10 Minuten, ohne Hilfsmittel</td></tr><tr><td>Maßstab</td><td>8 von 10 richtig</td></tr></table></div>
<p><b>Bloom (1956)</b> hat in seiner „Taxonomy of Educational Objectives“ kognitive Lernziele nach Komplexität geordnet, von einfach nach schwer:</p>
<table class="kvq"><tr><th>Stufe</th><th>englisch</th><th>Beispielverb</th></tr>
<tr><td>1. Wissen / Erinnerung</td><td>Remembering</td><td>nennen, benennen</td></tr>
<tr><td>2. Verständnis</td><td>Comprehending</td><td>erklären, unterscheiden</td></tr>
<tr><td>3. Anwendung</td><td>Applying</td><td>berechnen, übertragen</td></tr>
<tr><td>4. Analyse</td><td>Analyzing</td><td>zerlegen, vergleichen</td></tr>
<tr><td>5. Synthese</td><td>Synthesizing</td><td>entwerfen, zusammenführen</td></tr>
<tr><td>6. Bewertung</td><td>Evaluating</td><td>beurteilen, begründen</td></tr></table>
<p>Laut Heine sind in einer Vorlesung vor allem die unteren Stufen erreichbar: Wissen und Verstehen sehr stark, Anwenden und Analysieren etwas. Für die Klausur heißt das: Begriffe sicher <i>benennen</i> und <i>erklären</i> können, dazu einfache Anwendungen.</p>`,

 {q:"Was fehlt dem Lernziel „Die Schüler können Vokabeln“?", o:["Nur der Bewertungsmaßstab, das Verhalten ist genannt","Beobachtbares Verhalten, Bedingungen und Maßstab","Nur die Bedingungen, unter denen geprüft wird","Nichts, „können“ ist schon beobachtbar formuliert"], a:1, ex:"„Können“ ist nicht beobachtbar, und weder Bedingungen (z. B. 20 Vokabeln, 5 Minuten) noch ein Maßstab (z. B. 18 richtig) sind genannt.", w:["„Können“ ist kein beobachtbares Verhalten, es fehlt also mehr als der Maßstab.",null,"Es fehlen auch beobachtbares Verhalten und Maßstab.","„Können“ beschreibt keine beobachtbare Handlung, etwa „übersetzt 20 Vokabeln schriftlich“."]}

{id:"1-2", t:"Kompetenz und Handlungskompetenz", html:`
<p>Der bekannteste Kompetenzbegriff stammt von <b>Weinert (2001)</b>. Sinngemäß: Kompetenzen sind die verfügbaren oder erlernbaren <b>kognitiven Fähigkeiten und Fertigkeiten</b>, um bestimmte Probleme zu lösen, zusammen mit den <b>motivationalen, volitionalen und sozialen Bereitschaften</b>, diese Lösungen in wechselnden Situationen erfolgreich und verantwortungsvoll zu nutzen.</p>
<p>Kompetenz umfasst also drei Bestandteile:</p>
<ul><li><b>Wissen</b> (verstehen),</li><li><b>Fertigkeiten</b> (können),</li><li><b>motivationale Orientierungen und Emotionen</b> (wollen).</li></ul>
<p>Wichtig ist die Abgrenzung: Kompetenz ist die <b>Voraussetzung</b> für Handeln, also eine Disposition. Das tatsächlich gezeigte Handeln heißt <b>Performanz</b>. Wer kompetent ist, zeigt nicht automatisch gute Leistung, etwa bei Müdigkeit oder Prüfungsangst.</p>
<p>Die Kultusministerkonferenz (KMK, 1999) beschreibt <b>Handlungskompetenz</b> als die Fähigkeit, sich in beruflichen, gesellschaftlichen und privaten Situationen sachgerecht, durchdacht und verantwortlich zu verhalten. Sie setzt sich aus vier Kompetenzen zusammen:</p>
<table class="kvq"><tr><th>Kompetenz</th><th>Beispiele</th></tr>
<tr><td>Sachkompetenz</td><td>Grundlagen- und Fachwissen, Kenntnis wissenschaftlicher Methoden</td></tr>
<tr><td>Methodenkompetenz</td><td>selbstständig arbeiten, Transfer, eigene Wissenslücken erkennen und schließen, reflektieren</td></tr>
<tr><td>Sozialkompetenz</td><td>kommunizieren, Fachsprache, Perspektivwechsel</td></tr>
<tr><td>Selbstkompetenz</td><td>Verantwortung übernehmen, Selbstkritik, ethisches Bewusstsein (Berufsethos)</td></tr></table>
<p>Ziel der Vorlesung ist die professionelle Unterrichtswahrnehmung nach <b>Seidel (2022)</b>:</p>
<ul><li><b>Noticing:</b> Auf Basis von Fachwissen die Aufmerksamkeit gezielt auf Ereignisse im Klassenraum richten, die für das Lernen wichtig sind.</li>
<li><b>Reasoning:</b> Das Wahrgenommene mithilfe dieses Wissens deuten und erklären.</li></ul>
<div class="merk"><b>Wozu das Ganze?</b>Die Vorlesung will, dass du schulische Situationen mit psychologischen Modellen verstehst (Noticing und Reasoning) und daraus sinnvolle Handlungsmöglichkeiten ableitest.</div>`,
check:[
 {q:"Welche drei Bestandteile umfasst Kompetenz nach Weinert?", o:["Wissen, Fertigkeiten, motivationale Orientierungen und Emotionen","Sach-, Methoden- und Sozialkompetenz im Sinne der KMK","Wissen, Fertigkeiten und die tatsächlich gezeigte Performanz","Kognitive, metakognitive und motivational-affektive Wissensbestände"], a:0, ex:"Verstehen, Können, Wollen. Sach-, Methoden-, Sozial- und Selbstkompetenz sind die vier Teile der Handlungskompetenz nach KMK.", w:[null,"Das sind Teile der Handlungskompetenz nach KMK (dazu Selbstkompetenz), nicht Weinerts Bestandteile.","Performanz ist das gezeigte Handeln und gerade nicht Teil der Kompetenz.","So gliedert Seidel (2022) die professionellen Wissensbestände, nicht Weinert den Kompetenzbegriff."]},
 {q:"Was bezeichnet Seidel als „Noticing“?", o:["Das Deuten beobachteter Ereignisse mithilfe von Fachwissen","Die gezielte Wahrnehmung lernrelevanter Ereignisse im Klassenraum","Das Selbst-Monitoring der eigenen Unterrichtsführung","Das Planen von Unterricht anhand operationalisierter Lernziele"], a:1, ex:"Das Deuten ist Reasoning. Noticing ist die selektive Aufmerksamkeit auf das, was für Lehr-Lern-Prozesse wichtig ist.", w:["Das ist Reasoning, die interpretative Verarbeitung.",null,"Selbst-Monitoring ist bei Seidel ein metakognitiver Wissensbestand, nicht Noticing.","Lernziele gehören zur Unterrichtsplanung, nicht zur Unterrichtswahrnehmung."]}
]},
{id:"1-3", t:"Die vier Ziele der Psychologie", html:`
<p>Im Fokus der Psychologie steht die Untersuchung menschlichen <b>Erlebens und Verhaltens</b>. Sie will es</p>
<table class="kvq"><tr><th>Ziel</th><th>Fachbegriff</th><th>Leitfrage</th></tr>
<tr><td>beschreiben</td><td>Deskription</td><td>Was ist da, und was hängt zusammen?</td></tr>
<tr><td>erklären</td><td>Explikation</td><td>Was bedingt was?</td></tr>
<tr><td>vorhersagen</td><td>Prognose</td><td>Was wird passieren?</td></tr>
<tr><td>ggf. verändern</td><td>Intervention</td><td>Wie lässt es sich beeinflussen?</td></tr></table>
<p>Psychologie ist eine <b>empirische Wissenschaft</b>: Sie formuliert mögliche Antworten als <b>Hypothesen</b> und konfrontiert sie systematisch mit der Realität, durch Beobachtung und Messung.</p>
<p><b>Beschreiben</b> heißt: ein Phänomen benennen und definieren, ordnen und klassifizieren, Art und Intensität angeben und <b>Zusammenhänge</b> darstellen. Beispiel: Wissen in einem Fach und die Motivation, sich damit zu beschäftigen, <i>korrelieren</i>. Über Ursache und Wirkung sagt das noch nichts.</p>
<p><b>Erklären</b> heißt: Bedingungsverhältnisse angeben, also <i>A bedingt B</i>. Das setzt die Beschreibung voraus. Beispiel (Dollard et al.): Frustration führt zu Aggression. Die Ursache heißt <b>unabhängiger Indikator</b>, die Wirkung <b>abhängiger Indikator</b>.</p>
<p><b>Vorhersagen</b> heißt: Variablen mit Erklärungswert nutzen, um Prognosemodelle zu bauen. Die Vorhersagevariablen heißen <b>Prädiktoren</b>, das Vorhergesagte heißt <b>Kriterium</b>. Beispiel (Elbro, 1996): Phonologische Bewusstheit und Wortschatz bei der Einschulung sagen den späteren Schriftspracherwerb voraus.</p>
<p><b>Verändern</b> heißt: gezielt auf Sachverhalte einwirken, und zwar als</p>
<ul><li><b>Korrektur</b> (einen negativen Ausgangszustand ausgleichen),</li>
<li><b>Förderung</b> (einen Sachverhalt allgemein verbessern),</li>
<li><b>Prävention</b> (eine Verschlechterung verhindern).</li></ul>
<p>Beispiel: das Vorschulprogramm „Hören, lauschen, lernen“ (Küspert) zur Förderung der phonologischen Bewusstheit.</p>
<div class="merk"><b>Klausurfalle</b>Beim Erklären bedingt der <i>unabhängige</i> Indikator den <i>abhängigen</i>, nie umgekehrt. Achte in Kreuzaufgaben genau auf die Reihenfolge.</div>`,
check:[
 {q:"„Phonologische Bewusstheit in der Kita sagt den späteren Leseerfolg voraus.“ Welche Rolle hat die phonologische Bewusstheit?", o:["Kriterium","Prädiktor","Abhängiger Indikator","Intervention"], a:1, ex:"Die Variable, mit der vorhergesagt wird, ist der Prädiktor. Der Leseerfolg ist das Kriterium.", w:["Das Kriterium ist das Vorhergesagte, hier der Leseerfolg.",null,"Abhängiger Indikator gehört zum Erklären (Wirkung), nicht zur Vorhersage.","Intervention heißt gezielt verändern, nicht vorhersagen."]},

]},
{id:"1-4", t:"Konstrukte und Operationalisierung", html:`
<p>Begriffe wie Intelligenz, Konzentrationsfähigkeit, Motivation oder soziale Kompetenz bezeichnen keine Dinge, die man anfassen oder direkt sehen kann. Sie sind <b>psychologische Konstrukte</b>: angenommene Eigenschaften von Personen, mit denen man beobachtbares Verhalten erklärt.</p>
<ul><li><b>Distale Merkmale</b> (Brunswik, 1956): die Konstrukte selbst. Sie sind der direkten Beobachtung <i>nicht</i> zugänglich.</li>
<li><b>Proximale Merkmale</b>: beobachtbare und messbare <b>Indikatoren</b>, aus denen man auf das Konstrukt schließt. Wer misst, muss wissen, welche Indikatoren wirklich zum Konstrukt gehören (das ist eine Frage der Validität).</li></ul>
<p>Konstrukte sind <b>Erklärungszugänge</b>, keine realen Entitäten. Als warnendes Gegenbeispiel zeigt Heine die <b>Phrenologie</b> (19. Jahrhundert), die geistige Eigenschaften an Schädelformen ablesen wollte, als säßen sie als Organe im Kopf.</p>
<p>Schon das Beschreiben setzt eine <b>Operationalisierung</b> voraus: die Übersetzung eines Konstrukts in beobachtbare bzw. messbare Indikatoren. Beispiel: „Wissensniveau in Psychologie“ wird operationalisiert als Punktzahl in einem fachspezifischen Test.</p>
<div class="merk"><b>Klausuraufgabe (WiSe 22/23): Lernmotivation operationalisieren</b><p class="mi">Mögliche Indikatoren und was man bei <i>hoher</i> Lernmotivation erwartet:</p>
<table class="kvq" style="margin:0"><tr><th>Indikator</th><th>bei hoher Motivation</th></tr>
<tr><td>Aufmerksamkeit</td><td>hoch</td></tr><tr><td>Anstrengung</td><td>hoch</td></tr><tr><td>Latenz (Zeit bis zum Beginn)</td><td>kurz</td></tr>
<tr><td>Persistenz (Ausdauer)</td><td>groß</td></tr><tr><td>Präferenz für Lernaufgaben</td><td>groß</td></tr>
<tr><td>Verhaltenswahrscheinlichkeit</td><td>hoch</td></tr><tr><td>emotionaler Ausdruck</td><td>positiv</td></tr></table></div>
<p>Merkmale lassen sich außerdem nach ihrer Stabilität unterscheiden: <b>Traits</b> sind zeitlich stabile Merkmale (z. B. Intelligenz), <b>States</b> sind situationsabhängige Zustände (z. B. aktuelle Müdigkeit).</p>
<p><b>Berufspraktische Relevanz:</b> Wer „Intelligenz“ oder „Motivation“ als Konstrukt begreift, behandelt eine Zuschreibung wie „der ist halt faul“ als <i>Hypothese</i> über eine Person in einer Situation. Sie muss über Indikatoren geprüft werden, und zu jedem Konstrukt gibt es unterschiedliche theoretische Zugänge.</p>`,
check:[
 {q:"Was sind distale Merkmale?", o:["Situationsabhängige Zustände wie die aktuelle Müdigkeit","Konstrukte, die der direkten Beobachtung nicht zugänglich sind","Beobachtbare und messbare Merkmale, aus denen man auf Konstrukte schließt","Zeitlich stabile Merkmale wie die Intelligenz einer Person"], a:1, ex:"Distal (fern) ist das Konstrukt, proximal (nah) sind die beobachtbaren Indikatoren.", w:["Das sind States. Distal und proximal betrifft die Beobachtbarkeit, nicht die Stabilität.",null,"Das sind proximale Merkmale, also die Indikatoren.","Das sind Traits. Distal heißt: der Beobachtung nicht direkt zugänglich."]},
 {q:"Was versteht man unter Operationalisierung?", o:["Die Angabe von Bedingungsverhältnissen zwischen zwei Sachverhalten","Die Übersetzung eines Konstrukts in messbare Indikatoren","Die Vorhersage eines Kriteriums mithilfe von Prädiktoren","Die Verortung eines Konstrukts in einem Hirnareal"], a:1, ex:"Beispiel: Lernmotivation wird über Persistenz, Anstrengung oder Latenz messbar gemacht.", w:["Das ist Erklären (A bedingt B).",null,"Das ist Vorhersagen (Prognose).","So ging die Phrenologie vor; Konstrukte sind Erklärungszugänge, keine Organe."]}
]}
];

 {id:"c1-03", f:"Die sechs Lernzielstufen nach Bloom (1956)", b:"1. Wissen / Erinnerung (Remembering)\n2. Verständnis (Comprehending)\n3. Anwendung (Applying)\n4. Analyse (Analyzing)\n5. Synthese (Synthesizing)\n6. Bewertung (Evaluating)"},
 {id:"c1-04", f:"Kompetenz nach Weinert (2001)", b:"Können: verfügbare oder erlernbare kognitive Fähigkeiten und Fertigkeiten, um Probleme zu lösen\nWollen: motivationale, volitionale (willensbezogene) und soziale Bereitschaft\nWozu: die Lösungen in variablen Situationen erfolgreich und verantwortungsvoll nutzen"},
 {id:"c1-05", f:"Drei Bestandteile von Kompetenz", b:"Wissen (verstehen)\nFertigkeiten (können)\nmotivationale Orientierungen und Emotionen (wollen)\nBeispiel: Du weißt, was Verstärkung ist (Wissen), kannst Lob gezielt einsetzen (Fertigkeit) und willst es im Unterricht auch tun (Wollen)."},
 {id:"c1-06", f:"Kompetenz vs. Performanz", b:"Kompetenz: die Voraussetzung (Disposition) für Handeln.\nPerformanz: das tatsächlich gezeigte Handeln (z. B. die Klausurleistung an einem bestimmten Tag)."},
 {id:"c1-07", f:"Vier Teile der Handlungskompetenz (KMK, 1999)", b:"Sachkompetenz (Fachwissen, Methodenkenntnis)\nMethodenkompetenz (selbstständig arbeiten, Transfer, Wissenslücken erkennen)\nSozialkompetenz (kommunizieren, Perspektivwechsel)\nSelbstkompetenz (Verantwortung, Selbstkritik, Berufsethos)"},
 {id:"c1-08", f:"Noticing und Reasoning (Seidel, 2022)", b:"Noticing: Aufmerksamkeit gezielt auf lernrelevante Ereignisse im Klassenraum richten.\nReasoning: das Wahrgenommene auf Basis von Fachwissen deuten und erklären.\nBeispiel: Ein Schüler schaut ständig aus dem Fenster. Noticing: Du bemerkst es als lernrelevant. Reasoning: Du deutest es mit Fachwissen, etwa als Überforderung."},
 {id:"c1-09", f:"Gegenstand der Psychologie", b:"Menschliches Erleben und Verhalten."},
 {id:"c1-10", f:"Die vier Ziele der Psychologie", b:"beschreiben (Deskription)\nerklären (Explikation)\nvorhersagen (Prognose)\nggf. verändern (Intervention)\nBeispiel: Leseschwäche: beschreiben, wie viele betroffen sind; erklären, woran es liegt; vorhersagen, wer gefährdet ist; durch Förderung verändern."},
 {id:"c1-11", f:"Was heißt „empirisch“?", b:"Mögliche Antworten auf Fragen werden als Hypothesen formuliert und systematisch mit der Realität konfrontiert (Beobachtung, Messung).\nBeispiel: Hypothese „Lob steigert die Mitarbeit“, dann in der Klasse zählen, wie oft sich die Schüler melden."},
 {id:"c1-12", f:"Beschreiben: was gehört dazu?", b:"Phänomen benennen und definieren\nordnen und klassifizieren\nArt und Intensität angeben\nZusammenhänge (Korrelationen) darstellen, z. B. Fachwissen und Motivation hängen zusammen"},
 {id:"c1-13", f:"Erklären: unabhängiger und abhängiger Indikator", b:"Erklären heißt, Bedingungsverhältnisse anzugeben: A bedingt B.\nUnabhängiger Indikator: die Ursache (z. B. Frustration)\nAbhängiger Indikator: die Wirkung (z. B. Aggression; Dollard et al.)"},
 {id:"c1-14", f:"Vorhersagen: Prädiktor und Kriterium", b:"Prädiktoren: Variablen, mit denen vorhergesagt wird (z. B. phonologische Bewusstheit und Wortschatz bei Einschulung)\nKriterium: das Vorhergesagte (z. B. späterer Schriftspracherwerb; Elbro, 1996)"},
 {id:"c1-15", f:"Drei Formen des Veränderns", b:"Korrektur: negativen Ausgangszustand ausgleichen\nFörderung: Sachverhalt allgemein verbessern\nPrävention: Verschlechterung verhindern\nBeispiel: „Hören, lauschen, lernen“ (Küspert)"},
 {id:"c1-16", f:"Psychologisches Konstrukt", b:"Was: angenommene, nicht direkt beobachtbare Eigenschaft von Personen (z. B. Intelligenz, Motivation)\nWozu: beobachtbares Verhalten beschreiben, erklären oder vorhersagen\nStatus: ein Erklärungszugang, keine reale Entität"},
 {id:"c1-17", f:"Distale vs. proximale Merkmale", b:"Distal: das Konstrukt selbst, der direkten Beobachtung nicht zugänglich (Brunswik, 1956).\nProximal: beobachtbare, messbare Indikatoren, aus denen auf das Konstrukt geschlossen wird.\nBeispiel: Motivation (distal) erschließt man aus beobachtbarer Ausdauer bei Aufgaben (proximal)."},
 {id:"c1-18", f:"Operationalisierung", b:"Übersetzung eines Konstrukts in beobachtbare bzw. messbare Indikatoren, die es abbilden können (z. B. Wissensniveau → Punktzahl in einem Fachtest)."},
 {id:"c1-19", f:"Die sieben Indikatoren für Lernmotivation", b:"- Aufmerksamkeit\n- Anstrengung\n- Latenz (Zeit bis zum Beginn)\n- Persistenz (Ausdauer)\n- Präferenz\n- Verhaltenswahrscheinlichkeit\n- emotionaler Ausdruck"},
 {id:"c1-25", f:"Hohe Lernmotivation: Wie fallen die Indikatoren aus?", b:"Latenz kurz, alle anderen hoch bzw. positiv.\nBeispiel: Eine motivierte Schülerin fängt sofort an (kurze Latenz) und bleibt dran, wenn es schwierig wird (hohe Persistenz)."},
 {id:"c1-20", f:"Traits vs. States", b:"Traits: zeitlich stabile Merkmale von Personen (z. B. Intelligenz).\nStates: situationsabhängige Zustände (z. B. aktuelle Nervosität)."}
];

  q:"Wir beschreiben und erklären menschliches Erleben und Verhalten unter Bezugnahme auf sogenannte psychologische Konstrukte. Bitte erläutern Sie diesen Begriff unter Bezugnahme auf den Begriff des Merkmals von Personen.",
