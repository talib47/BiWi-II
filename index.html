 {id:"c1-08", f:"Noticing und Reasoning (Seidel, 2022)", b:"Noticing: Aufmerksamkeit gezielt auf lernrelevante Ereignisse im Klassenraum richten.\nReasoning: das Wahrgenommene auf Basis von Fachwissen deuten und erklären."},
 {id:"c1-09", f:"Gegenstand der Psychologie", b:"Menschliches Erleben und Verhalten."},
 {id:"c1-10", f:"Die vier Ziele der Psychologie", b:"beschreiben (Deskription)\nerklären (Explikation)\nvorhersagen (Prognose)\nggf. verändern (Intervention)"},
 {id:"c1-11", f:"Was heißt „empirisch“?", b:"Mögliche Antworten auf Fragen werden als Hypothesen formuliert und systematisch mit der Realität konfrontiert (Beobachtung, Messung)."},
 {id:"c1-12", f:"Beschreiben: was gehört dazu?", b:"Phänomen benennen und definieren\nordnen und klassifizieren\nArt und Intensität angeben\nZusammenhänge (Korrelationen) darstellen, z. B. Fachwissen und Motivation hängen zusammen"},
 {id:"c1-13", f:"Erklären: unabhängiger und abhängiger Indikator", b:"Erklären heißt, Bedingungsverhältnisse anzugeben: A bedingt B.\nUnabhängiger Indikator: die Ursache (z. B. Frustration)\nAbhängiger Indikator: die Wirkung (z. B. Aggression; Dollard et al.)"},
 {id:"c1-14", f:"Vorhersagen: Prädiktor und Kriterium", b:"Prädiktoren: Variablen, mit denen vorhergesagt wird (z. B. phonologische Bewusstheit und Wortschatz bei Einschulung)\nKriterium: das Vorhergesagte (z. B. späterer Schriftspracherwerb; Elbro, 1996)"},
 {id:"c1-15", f:"Drei Formen des Veränderns", b:"Korrektur: negativen Ausgangszustand ausgleichen\nFörderung: Sachverhalt allgemein verbessern\nPrävention: Verschlechterung verhindern\nBeispiel: „Hören, lauschen, lernen“ (Küspert)"},
 {id:"c1-16", f:"Psychologisches Konstrukt", b:"Eine angenommene, nicht direkt beobachtbare Eigenschaft von Personen (z. B. Intelligenz, Motivation), mit der man beobachtbares Verhalten beschreibt, erklärt oder vorhersagt. Ein Erklärungszugang, keine reale Entität."},
 {id:"c1-17", f:"Distale vs. proximale Merkmale", b:"Distal: das Konstrukt selbst, der direkten Beobachtung nicht zugänglich (Brunswik, 1956).\nProximal: beobachtbare, messbare Indikatoren, aus denen auf das Konstrukt geschlossen wird."},
 {id:"c1-18", f:"Operationalisierung", b:"Übersetzung eines Konstrukts in beobachtbare bzw. messbare Indikatoren, die es abbilden können (z. B. Wissensniveau → Punktzahl in einem Fachtest)."},
 {id:"c1-19", f:"Indikatoren für Lernmotivation", b:"Aufmerksamkeit, Anstrengung, Latenz (Zeit bis zum Beginn), Persistenz (Ausdauer), Präferenz, Verhaltenswahrscheinlichkeit, emotionaler Ausdruck.\nBei hoher Motivation: Latenz kurz, alles andere hoch bzw. positiv."},
 {id:"c1-20", f:"Traits vs. States", b:"Traits: zeitlich stabile Merkmale von Personen (z. B. Intelligenz).\nStates: situationsabhängige Zustände (z. B. aktuelle Nervosität)."}
];

/* ================= Kapitel 9: Lernen und nicht-assoziatives Lernen =================
   Grundlage: Folien Sitzung 2 (WiSe 26/27), Klausur WiSe 24/25 (Lehr-Lernpsychologie, Aufgaben 1 und 2), Lehrbuch Urhahne/Dresel/Fischer (2019) Kap. 1 */
LESSONS[9]=[
{id:"9-1", t:"Was ist Lernen?", html:`
<p>Heine stellt drei Definitionen von Lernen gegenüber:</p>
<table class="kvq"><tr><th></th><th>Definition</th><th>Fokus</th></tr>
<tr><td>1</td><td>Eine Veränderung als Folge der Auseinandersetzung mit der Umwelt</td><td>eher unspezifisch</td></tr>
<tr><td>2</td><td>Ein biologischer Prozess, der die Anpassung an die Umwelt bewirkt</td><td>eher evolutionär, auf das Ziel gerichtet</td></tr>
<tr><td>3</td><td>Ein Veränderungsprozess, durch den sich <b>Verhalten bzw. Verhaltenspotenzial</b> in Abhängigkeit von <b>Erfahrung konsistent und relativ dauerhaft</b> ändert</td><td>auf Art und Qualität der Veränderung</td></tr></table>
<p>Mit Definition 3 wird gearbeitet. Ihre drei Bausteine haben jeweils einen Haken:</p>
<p><b>1. Verhalten vs. Verhaltenspotenzial.</b> Lernen wird sichtbar, wenn sich das Verhalten ändert (tatsächliche <b>Performanz</b>). Aber:</p>
<ul><li>Nicht jede beobachtbare Verhaltensänderung ist Lernen. Sie kann auch auf <b>Reifung</b> (langfristig) oder <b>Ermüdung</b> (kurzfristig) beruhen.</li>
<li>Nicht jedes Lernen zeigt sich sofort im Verhalten. Es kann als <b>Verhaltenspotenzial</b> vorhanden sein, ohne dass es ausgeführt wird. Das ist ein <i>messtheoretisches Problem</i>.</li></ul>
<p><b>2. Konsistent und dauerhaft.</b> Die Veränderung muss über gleichartige Situationen hinweg und zeitlich stabil sein. Offen bleibt: Was sind „gleichartige“ Situationen, und wie lange ist „dauerhaft“? Eine kurzfristige Motivationsschwankung ist jedenfalls kein Lernen.</p>
<p><b>3. Erfahrungsbasiert.</b> Lernen hängt von Erfahrung ab, Reifung nicht. Dafür müssen Informationen aufgenommen, verarbeitet und gespeichert werden. Deshalb ist das <b>Gedächtnis</b> so wichtig für das Lernen. Die Abgrenzung zur Reifung ist trotzdem schwierig, weil auch manche Reifungsprozesse umweltabhängig sind (z. B. die frühe Entwicklung des Sehens).</p>
<div class="merk"><b>Schulbeispiele aus dem Lehrbuch (Urhahne et al., 2019, Kap. 1)</b><div class="mrows">
<div><span class="ml">Erfahrung statt Reifung</span><span>Zeigt die Lehrkraft den „Schweigefuchs“, wird die Klasse still. Das Handzeichen hat erst durch frühere Erfahrungen seine Wirkung bekommen. Krabbeln, Laufen und Sprechen beim Kleinkind kommen dagegen mit der Reifung.</span></div>
<div><span class="ml">Keine physiologischen Ursachen</span><span>Bleibt am Abend vor der Prüfung nichts mehr hängen, kann das an Krankheit, Übermüdung oder Alkohol liegen. Das ist dann kein Lernen und kein Vergessen.</span></div>
<div><span class="ml">Verhaltenspotenzial</span><span>Auch ein Kind, das stumm im Unterricht sitzt, kann lernen. Ob es gelernt hat, zeigt sich erst, wenn es die Fragen der Lehrkraft beantworten kann.</span></div>
<div><span class="ml">Relativ dauerhaft</span><span>Wer mit Messer und Gabel essen gelernt hat, kann es bei jeder Gelegenheit. Schulwissen (Wer war Franz Ferdinand?) wirkt weniger stabil, lässt sich aber oft mit passenden Hinweisreizen wieder abrufen. Erst wenn auch das scheitert, war die Veränderung nicht dauerhaft genug.</span></div></div></div>
<div class="merk"><b>So stand es in der Klausur WiSe 24/25</b><div class="mrows">
<div><span class="ml"><span class="vd f">falsch</span></span><span>„Jede beobachtbare Veränderung des Verhaltens ist das Ergebnis von Lernprozessen.“<br><span class="small muted">Grund: Reifung, Ermüdung</span></span></div>
<div><span class="ml"><span class="vd t">wahr</span></span><span>„Ein Lernprozess führt nicht unbedingt zu einer unmittelbar beobachtbaren Veränderung des Verhaltens.“<br><span class="small muted">Grund: Verhaltenspotenzial</span></span></div></div></div>`,
check:[
 {q:"Ein Kind kann nach den Ferien plötzlich höher springen. Warum ist das nicht automatisch Lernen?", o:["Weil Springen kein Verhalten ist","Weil die Veränderung auch auf Reifung, also körperlichem Wachstum, beruhen kann","Weil Lernen immer bewusst ist","Weil die Veränderung zu dauerhaft ist"], a:1, ex:"Nicht jede beobachtbare Verhaltensänderung ist Lernen. Reifung ist nicht erfahrungsbasiert."},
 {q:"Eine Schülerin hat eine Rechenstrategie verstanden, wendet sie in der Arbeit aber vor Aufregung nicht an. Was liegt vor?", o:["Kein Lernen","Lernen auf der Ebene des Verhaltenspotenzials","Habituation","Reifung"], a:1, ex:"Gelernt ist gelernt, auch wenn es sich (noch) nicht im Verhalten zeigt. Deshalb spricht Definition 3 von Verhalten bzw. Verhaltenspotenzial."}
]},
{id:"9-2", t:"Arten des Lernens im Überblick", html:`
<p>Grundsätzlich unterscheidet man zwei Typen:</p>
<ul><li><b>Nichtassoziatives Lernen:</b> Die Stärke oder Art einer Reaktion auf einen Reiz verändert sich, weil der Reiz <i>wiederholt</i> auftritt. Es wird nichts verknüpft.</li>
<li><b>Assoziatives Lernen:</b> Gelernt werden <b>Kontingenzen</b>, also das zeitliche Zusammenfallen von Ereignissen. Es entstehen Verknüpfungen (Assoziationen)
 <ul><li>zwischen zwei Reizen, S → S: <b>klassische Konditionierung</b>,</li>
 <li>zwischen einer Reaktion und einem Reiz, R → S: <b>operante Konditionierung</b>.</li></ul></li></ul>
<table class="kvq"><tr><th>Nichtassoziativ</th><th>Assoziativ</th></tr>
<tr><td>Habituation, Sensitivierung</td><td>klassische Konditionierung (S1 → S2)</td></tr>
<tr><td>Lernen durch wiederholte Reizdarbietung: perzeptuelles Lernen, Priming, „mere exposure“</td><td>operante Konditionierung (R → S)</td></tr></table>
<p class="small muted">S = Stimulus (Reiz), R = Response (Reaktion). Weitere Formen auf Heines Übersicht: Diskriminationstraining, räumliches Lernen.</p>
<div class="merk"><b>Merksatz</b><div class="mrows">
<div><span class="ml">Nichtassoziativ</span><span>ein Reiz, oft wiederholt, die Reaktion ändert sich</span></div>
<div><span class="ml">Assoziativ</span><span>zwei Ereignisse, die zusammen auftreten, werden verknüpft</span></div></div></div>`,
check:[
 {q:"Was wird beim assoziativen Lernen gelernt?", o:["Reaktionen auf einen einzigen wiederholten Reiz","Kontingenzen, also das gemeinsame Auftreten von Ereignissen","Reflexe","Reifungsprozesse"], a:1, ex:"Zum Beispiel, dass auf einen Ton Futter folgt (klassisch) oder dass auf ein Verhalten Lob folgt (operant)."},
 {q:"Welche Form gehört zum nichtassoziativen Lernen?", o:["Klassische Konditionierung","Operante Konditionierung","Habituation","Lernen am Modell"], a:2, ex:"Habituation und Sensitivierung sind die beiden basalen nichtassoziativen Lernprozesse."}
]},
{id:"9-3", t:"Reflexe und Habituation", html:`
<p>Betrachtet werden die einfachsten Reaktionen auf Reize, die angeborenen <b>Reflexe</b>. Reflexe sind <b>unwillkürlich</b>, <b>invariant</b> (immer gleich ablaufend) und <b>schnell</b>. Drei Arten:</p>
<table class="kvq"><tr><th>Reflex</th><th>Beispiel</th><th>durch Lernen veränderbar?</th></tr>
<tr><td>Eigenreflex (Reizort = Effektort)</td><td>Kniesehnenreflex (Patellarreflex)</td><td>nein</td></tr>
<tr><td>Fremdreflex (Reizort ≠ Effektort)</td><td>Lidschlussreflex</td><td>ja</td></tr>
<tr><td>koordinierte, komplexe Reflexbewegung</td><td>Schreckreflex</td><td>ja</td></tr></table>
<p><b>Habituation</b> ist die Abschwächung einer Reflexreaktion (Stärke, Häufigkeit) auf einen Reiz, der wiederholt auftritt. Man gewöhnt sich daran, etwa an das Ticken einer Uhr. Habituation ist ein Lernprozess, der die Anpassung an eine bestimmte Umwelt erlaubt.</p>
<p>Wie schnell und stark habituiert wird, hängt ab von</p>
<ul><li>der <b>Intensität</b> des Reizes (schwache Reize: leichter),</li><li>der <b>Regelmäßigkeit</b> des Auftretens,</li><li>dem <b>Intervall</b> zwischen den Reizen,</li><li>dem <b>tonischen Zustand</b> des Organismus, also dem allgemeinen Erregungsniveau (<b>Arousal</b>).</li></ul>
<p>Weitere Eigenschaften:</p>
<ul><li><b>Reversibel:</b> Nach einer Pause kehrt die Reaktion teilweise zurück (<b>Spontanerholung</b>). Eine erneute Habituation geht dann aber schneller, denn es wurde etwas gelernt.</li>
<li>Der Effekt ist <b>anfangs stark</b> (steiler Abfall der Reaktion) und flacht dann ab.</li>
<li><b>Stimulusspezifisch:</b> Bei einem neuen, unbekannten Reiz ist die ursprüngliche Reaktion sofort wieder da (<b>Dishabituation</b>).</li></ul>`,
check:[
 {q:"Welcher Reflex ist durch Lernen nicht veränderbar?", o:["Lidschlussreflex","Schreckreflex","Patellarreflex","Alle sind veränderbar"], a:2, ex:"Beim Eigenreflex sind Reiz- und Effektort gleich; laut Folie ist keine lernbedingte Veränderung möglich."},
 {q:"Eine Klasse hat sich an das Brummen des Beamers gewöhnt. Plötzlich piept der Rauchmelder, und alle schrecken hoch. Welche Eigenschaft der Habituation zeigt sich?", o:["Spontanerholung","Stimulusspezifität (Dishabituation)","Sensitivierung","Reversibilität"], a:1, ex:"Die Habituation gilt nur für den gewohnten Reiz. Ein neuer Reiz löst die volle Reaktion aus."}
]},
{id:"9-4", t:"Sensitivierung und der Schulalltag", html:`
<p><b>Sensitivierung</b> ist das Gegenstück zur Habituation: Die Reflexreaktion auf einen Reiz wird bei wiederholter Darbietung <b>stärker</b> (Reaktionsstärke, Häufigkeit).</p>
<p>Eigenschaften:</p>
<ul><li>Auslöser sind eine <b>hohe Reizintensität</b> und ein <b>hohes allgemeines Erregungsniveau</b>.</li>
<li>Es braucht <b>nur wenige Darbietungen</b>.</li>
<li><b>Weniger stimulusspezifisch</b> als Habituation: Sensitivierung gegenüber Reiz 1 kann auch die Reaktion auf Reiz 2 verstärken, weil das allgemeine Erregungsniveau steigt.</li>
<li>Die <b>„Failure-to-habituate“-Theorie</b> erklärt damit z. B. Symptome bei posttraumatischer Belastungsstörung (PTBS): Die Betroffenen gewöhnen sich nicht an Reize, sondern reagieren immer stärker.</li></ul>
<table class="kvq"><tr><th></th><th>Habituation</th><th>Sensitivierung</th></tr>
<tr><td>Reaktion</td><td>wird schwächer</td><td>wird stärker</td></tr>
<tr><td>Reizintensität</td><td>eher gering</td><td>hoch</td></tr>
<tr><td>Erregungsniveau</td><td>eher niedrig</td><td>hoch</td></tr>
<tr><td>Spezifität</td><td>stimulusspezifisch</td><td>weniger spezifisch</td></tr></table>
<div class="merk"><b>Beispiel aus der Vorlesung</b>Im normalen Lernalltag stört das Schniefen des Sitznachbarn nicht (Habituation). In der Klausur ist das Erregungsniveau hoch: Man nimmt das Geräusch plötzlich wahr, kann es nicht mehr ausblenden, und es wirkt immer lauter (Sensitivierung).</div>
<p><b>Schulbezug:</b> In ersten Klassen wurden im Unterricht durchschnittlich 60 bis 85 dB gemessen (Schönwälder et al., 2004), eine Bohrmaschine liegt bei etwa 90 dB. Lärm und Prüfungsstress erhöhen das Erregungsniveau und begünstigen damit Sensitivierung. Für Lehrkräfte heißt das: Lärm senken und eine ruhige Atmosphäre schaffen, besonders in Prüfungen.</p>`,

 {q:"Unter welchen Bedingungen ist Sensitivierung besonders wahrscheinlich?", o:["Geringe Reizintensität, niedriges Erregungsniveau","Hohe Reizintensität, hohes Erregungsniveau","Viele regelmäßige Wiederholungen eines schwachen Reizes","Wenn der Reiz neu ist"], a:1, ex:"Bei schwachen, regelmäßigen Reizen und niedrigem Arousal tritt eher Habituation auf."},
 {q:"Nach einem lauten Knall zuckt man auch bei einer zufallenden Tür stark zusammen. Welche Eigenschaft der Sensitivierung zeigt sich?", o:["Stimulusspezifität","Sie ist weniger stimulusspezifisch","Spontanerholung","Dishabituation"], a:1, ex:"Das allgemeine Erregungsniveau ist gestiegen, deshalb wirkt sich die Sensitivierung auch auf andere Reize aus."}
]}
];

CARDS[9]=[
 {id:"c9-01", f:"Lernen: Arbeitsdefinition (Definition 3)", b:"Ein Veränderungsprozess, durch den sich Verhalten bzw. Verhaltenspotenzial in Abhängigkeit von Erfahrung konsistent und relativ dauerhaft ändert."},
 {id:"c9-02", f:"Die drei Lerndefinitionen und ihr Fokus", b:"1. Veränderung als Folge der Auseinandersetzung mit der Umwelt (eher unspezifisch)\n2. Biologischer Prozess der Anpassung an die Umwelt (eher evolutionär)\n3. Erfahrungsbedingte, konsistente, relativ dauerhafte Änderung von Verhalten bzw. Verhaltenspotenzial (Art und Qualität der Veränderung)"},
 {id:"c9-03", f:"Warum ist nicht jede Verhaltensänderung Lernen?", b:"Sie kann auch auf Reifung (langfristig, z. B. Wachstum) oder Ermüdung (kurzfristig) beruhen. Auch Krankheit, Alkohol oder Drogen erzeugen Veränderungen, die kein Lernen sind (Lehrbuch Kap. 1)."},
 {id:"c9-04", f:"Warum zeigt sich nicht jedes Lernen im Verhalten?", b:"Gelerntes kann als Verhaltenspotenzial vorhanden sein, ohne ausgeführt zu werden, weil die tatsächliche Ausführung von vielen Faktoren abhängt (z. B. Motivation, Aufregung). Ein messtheoretisches Problem."},
 {id:"c9-05", f:"Lernen vs. Reifung", b:"Lernen: erfahrungsabhängig. Informationen werden aufgenommen, verarbeitet und gespeichert (daher die Bedeutung des Gedächtnisses).\nReifung: nicht erfahrungsabhängig (z. B. Krabbeln, Laufen beim Kleinkind).\nProblem: Die Abgrenzung ist schwierig, weil auch manche Reifung umweltabhängig ist (frühe Entwicklung des Sehens)."},
 {id:"c9-06", f:"Nichtassoziatives vs. assoziatives Lernen", b:"Nichtassoziativ: Stärke oder Art einer Reaktion auf einen Reiz ändert sich durch wiederholte Darbietung (Habituation, Sensitivierung).\nAssoziativ: Lernen von Kontingenzen (gemeinsamem Auftreten) von Ereignissen, S → S (klassisch) oder R → S (operant)."},
 {id:"c9-07", f:"Kontingenz", b:"Das zeitliche Zusammenfallen bzw. die regelhafte Verknüpfung von Ereignissen, etwa Verhalten und Konsequenz."},
 {id:"c9-08", f:"Drei Eigenschaften von Reflexen", b:"unwillkürlich\ninvariant (stereotyp, immer gleich)\nschnell"},
 {id:"c9-09", f:"Eigenreflex, Fremdreflex, koordinierter Reflex", b:"Eigenreflex: Reizort = Effektort, z. B. Patellarreflex, nicht lernbar veränderbar\nFremdreflex: Reizort ≠ Effektort, z. B. Lidschlussreflex, veränderbar\nKoordinierte Reflexbewegung: z. B. Schreckreflex, veränderbar"},
 {id:"c9-10", f:"Habituation", b:"Abschwächung einer Reflexreaktion (Stärke, Häufigkeit) auf einen Reiz bei wiederholter Darbietung. Ermöglicht die Anpassung an eine bestimmte Umwelt (z. B. Gewöhnung an Straßenlärm)."},
 {id:"c9-11", f:"Vier Determinanten des Habituationsverlaufs", b:"Intensität des Reizes\nRegelmäßigkeit des Auftretens\nAuftretensintervall\ntonischer Zustand des Organismus (allgemeines Erregungsniveau, Arousal)"},
 {id:"c9-12", f:"Spontanerholung", b:"Nach einer Pause kehrt die habituierte Reaktion teilweise zurück. Die erneute Habituation erfolgt dann schneller, ein Hinweis darauf, dass gelernt wurde."},
 {id:"c9-13", f:"Dishabituation", b:"Weil Habituation stimulusspezifisch ist, zeigt sich bei einem neuen, unbekannten Reiz wieder die ursprüngliche volle Reaktion."},
 {id:"c9-14", f:"Sensitivierung", b:"Verstärkung einer Reflexreaktion (Stärke, Häufigkeit) auf einen Reiz bei wiederholter Darbietung."},
 {id:"c9-15", f:"Eigenschaften der Sensitivierung", b:"hohe Reizintensität und hohes allgemeines Erregungsniveau als Determinante\nnur geringe Expositionsraten nötig\nweniger stimulusspezifisch (S1 kann Reaktion auf S2 verstärken)\n„Failure-to-habituate“-Theorie, z. B. bei PTBS"},
 {id:"c9-16", f:"Habituation vs. Sensitivierung im Vergleich", b:"Reaktion: wird schwächer / wird stärker\nReizintensität: eher gering / hoch\nErregungsniveau: eher niedrig / hoch\nSpezifität: stimulusspezifisch / weniger spezifisch"},
 {id:"c9-17", f:"Sensitivierung in der Klausursituation", b:"Hohes Erregungsniveau (Stress) begünstigt Sensitivierung: Geräusche, die man sonst nicht bemerkt (Schniefen, Tüte), werden wahrgenommen, nicht mehr ausgeblendet und wirken immer lauter.\nSchulbezug: Unterrichtslärm von 60–85 dB in ersten Klassen (Schönwälder et al., 2004)."}
];

  ["Jede beobachtbare Veränderung auf der Ebene des Verhaltens ist das Ergebnis von Lernprozessen.", false, "Verhaltensänderungen können auch auf <b>Reifung</b> oder <b>Ermüdung</b> beruhen."],

KURZ.push(
 {id:"k9-1", ch:9, pts:6,
  q:"Erläutern Sie die Definition von Lernen als „Veränderungsprozess, der dazu führt, dass sich Verhalten bzw. Verhaltenspotenzial in Abhängigkeit von Erfahrung konsistent und relativ dauerhaft ändert“. Gehen Sie auf je ein Problem der drei Bestandteile ein.",
  k:["Verhalten vs. Verhaltenspotenzial erläutert (Performanz)","Problem: nicht jede Verhaltensänderung ist Lernen (Reifung, Ermüdung) bzw. nicht jedes Lernen ist sichtbar","Konsistent und dauerhaft: stabil über gleichartige Situationen und über die Zeit","Problem: unklar, was gleichartige Situationen sind und wie lange dauerhaft ist","Erfahrungsbasiert: Information wird aufgenommen, verarbeitet, gespeichert (Gedächtnis)","Problem: Abgrenzung zur Reifung, da auch Reifung umweltabhängig sein kann"],
  m:"Lernen zeigt sich in Verhaltensänderungen, also in der Performanz. Allerdings ist nicht jede Verhaltensänderung Lernen (Reifung, Ermüdung), und nicht jedes Lernen ist sofort sichtbar, weil es als Verhaltenspotenzial vorliegen kann. Die Veränderung muss konsistent über gleichartige Situationen und relativ dauerhaft sein; offen bleibt, was gleichartige Situationen sind und wie dauerhaft eine Änderung sein muss. Schließlich ist Lernen erfahrungsbasiert: Informationen werden aufgenommen, verarbeitet und gespeichert, weshalb das Gedächtnis zentral ist. Die Abgrenzung zur Reifung bleibt schwierig, da auch Reifungsprozesse umweltabhängig sein können, etwa die frühe Entwicklung des visuellen Systems."},
 {id:"k9-2", ch:9, pts:6,
  q:"Ein Schüler bemerkt im Unterricht das Ticken der Wanduhr nicht. In der Klassenarbeit stört ihn dasselbe Ticken so sehr, dass er sich nicht konzentrieren kann. Erklären Sie beide Beobachtungen mit nichtassoziativen Lernprozessen und leiten Sie eine Handlungsmöglichkeit für die Lehrkraft ab.",
  k:["Unterricht: Habituation, Abschwächung der Reaktion bei wiederholtem Reiz","Bedingungen: schwacher, regelmäßiger Reiz, niedriges Erregungsniveau","Klassenarbeit: Sensitivierung, Verstärkung der Reaktion","Bedingung: hohes allgemeines Erregungsniveau (Prüfungsstress)","Weniger stimulusspezifisch: auch andere Geräusche stören stärker","Handlungsmöglichkeit, z. B. Störquellen beseitigen, Lärm senken, Stress reduzieren"],
  m:"Im Unterricht habituiert der Schüler: Das Ticken ist ein schwacher, regelmäßiger Reiz, sein Erregungsniveau ist niedrig, die Reaktion auf den Reiz schwächt sich ab. In der Klassenarbeit ist sein allgemeines Erregungsniveau durch den Prüfungsstress hoch. Das begünstigt Sensitivierung: Die Reaktion auf denselben Reiz wird stärker, er nimmt das Ticken wahr und kann es nicht mehr ausblenden. Da Sensitivierung weniger stimulusspezifisch ist, stören ihn auch andere Geräusche stärker. Die Lehrkraft kann Störquellen wie die Uhr entfernen, für eine ruhige Prüfungsatmosphäre sorgen und das Stressniveau senken, etwa durch klare Ansagen und einen ruhigen Einstieg."}
);

function symBack(x){
  return [x.formel?`$ ${x.formel}`:"", `Bedeutung: ${x.bed}`, `Wofür: ${x.wof}`, `Beispiel: ${x.bsp}`, `Kommt vor: ${x.wo}`, x.falle?`Achtung: ${x.falle}`:""].filter(Boolean).join("\n");
}
function symBackRev(x){ return [`$ ${x.formel?x.formel:x.s}`, x.formel&&!x.formel.startsWith(x.s+" ")?`Zeichen: ${x.s}`:"", `Beispiel: ${x.bsp}`, x.falle?`Achtung: ${x.falle}`:""].filter(Boolean).join("\n"); }
CARDS.sym=SYMBOLS.map(x=>({id:"s-"+x.id, f:x.s, b:symBack(x), rt:true}));
CARDS.symr=SYMBOLS.map(x=>({id:"r-"+x.id, f:x.n, b:symBackRev(x), rt:true}));
SYMBOLS.forEach(x=>{ CARD_CTX["s-"+x.id]="Zeichen · "+x.gt+" · Was bedeutet es?"; CARD_CTX["r-"+x.id]="Zeichen · "+x.gt+" · Wie schreibt man es?"; if(x.merk) CARD_INFO["s-"+x.id]=CARD_INFO["r-"+x.id]="Merkhilfe: "+x.merk; });
const DECK_NAME={sym:"Zeichen", symr:"Zeichen umgekehrt"};

/* Lexikon: alle Zeichen nach Themen */
function lexiconHTML(){
  return SYMBOL_GROUPS.map(g=>`<div class="block"><h3>${g.t}</h3><div class="dlist lex">${g.items.map(x=>`<b class="sy">${x.s}</b><span>${inl(x.n)}${x.formel?`<span class="eq lexeq">${fx(x.formel)}</span>`:""}<span class="small muted">${inl(x.bsp)}</span>${x.falle?`<span class="small lexwarn">${inl(x.falle)}</span>`:""}</span>`).join("")}</div></div>`).join("");
}
function renderSym(){

    <p class="muted">Jedes Zeichen der Diagnostik-Statistik mit Bedeutung, Mini-Beispiel und typischer Verwechslung. Gewusste Karten kommen nach 1, 3, 7, 16 und 35 Tagen wieder, wie die anderen Karten.</p>
    <div class="block"><div class="modes">
      <button class="mode" id="sy1"><span class="t">Zeichen → Bedeutung</span><span class="n">${st("sym")}</span><span class="d">Vorne steht das Zeichen, z. B. σ. Sag, was es bedeutet.</span></button>
      <button class="mode" id="sy2"><span class="t">Bedeutung → Zeichen</span><span class="n">${st("symr")}</span><span class="d">Vorne steht die Bedeutung. Schreib Zeichen und Formel auf, wie in der Klausur.</span></button>
    </div></div>
    <h2 style="margin-top:18px">Lexikon</h2>${lexiconHTML()}`;
  bindCrumb(()=>go("practice"));
  $("#sy1").onclick=()=>openCards("sym"); $("#sy2").onclick=()=>openCards("symr");

/* Lexikon als Blatt über einer Aufgabe, ohne sie zu verlassen */
function showLexicon(){
  const d=document.createElement("div"); d.className="sheet"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Lexikon der Zeichen");
  d.innerHTML=`<div class="sheetin"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Zeichen</h2><button class="btn ghost small" id="lexX">Schließen</button></div>${lexiconHTML()}</div>`;

/* ================= Verständnisfragen: erst selbst abrufen, dann Auswahl; Wiederholung mit Abstand =================
   Jede Frage aus den Lektionen bekommt ein eigenes Fach wie eine Karteikarte (state.qbox).
   Ältere Antworten (vor dieser Funktion) werden aus state.lessons abgeleitet, ohne etwas zu speichern.
   Frage-Felder: q, o (Optionen), a (richtig), ex (Erklärung), w (optional: je falscher Option, warum sie falsch ist) */
const qid=(lid,j)=>lid+"#"+j;
function allQuestions(){ const out=[]; for(const ch of CHAPTERS) for(const L of (LESSONS[ch.n]||[])) L.check.forEach((c,j)=>out.push({id:qid(L.id,j), lid:L.id, n:ch.n, c, lt:L.t, li:(LESSONS[ch.n]||[]).indexOf(L)})); return out; }
function qInfo(id){
  const s=(state.qbox||{})[id]; if(s) return s;
  const ls=(state.lessons||{})[id.split("#")[0]]; if(!ls) return null;
  return ls.ok? {b:2, due:dayStart(ls.t)+3*864e5} : {b:1, due:dayStart(ls.t)+864e5};
}
function qDue(){ const now=Date.now(); return allQuestions().filter(q=>{ const s=qInfo(q.id); return s&&s.due<=now; }).sort((a,b)=>qInfo(a.id).due-qInfo(b.id).due); }
function qGrade(id,ok){
  state.qbox=state.qbox||{}; const s=qInfo(id)||{b:0};
  const b1= ok? Math.min(5,Math.max(s.b,1)+1) : 1;
  state.qbox[id]={b:b1, due:dayStart()+(ok?(s.b===5?35:INTERVAL[b1]):1)*864e5};
  if(!ok){ state.qlapses=state.qlapses||{}; state.qlapses[id]=(state.qlapses[id]||0)+1; }
  save();
}
/* Rückmeldung: bei falscher Wahl erst, warum genau diese Wahl nicht passt, dann das Richtige und der Unterschied */
function feedback(c,a){
  const right=`<b>Richtig</b><span>${inl(c.o[c.a])}</span>`;
  if(a===c.a) return `<div class="fb good"><p class="fh">Richtig.</p><p style="margin:0">${inl(c.ex)}</p></div>`;
  if(a===-1) return `<div class="fb idk"><p class="fh">Kein Problem, die Frage kommt morgen noch einmal.</p><div class="dlist">${right}<b>Warum</b><span>${inl(c.ex)}</span></div></div>`;
  const why=c.w&&c.w[a];
  return `<div class="fb bad"><p class="fh">Nicht ganz.</p><div class="dlist">${why?`<b>Warum nicht</b><span>${inl(why)}</span>`:""}${right}<b>${why?"Der Unterschied":"Warum"}</b><span>${inl(c.ex)}</span></div></div>`;
}
/* Eine Frage: erst nur die Frage, dann auf Wunsch die Auswahl */
function qBlock(c,key,a,shown,first){
  const opts= a!==undefined || shown;
  return `<div class="qb" style="margin-top:${first?4:18}px"><p style="margin:0"><b>${inl(c.q)}</b></p>
    ${opts?`<div class="mc">${c.o.map((o,k)=>{ const cls=a===undefined?"":(k===c.a?"r":(k===a?"w":""));
        return `<button data-q="${key}" data-k="${k}" class="${cls}" ${a!==undefined?"disabled":""}>${inl(o)}</button>`; }).join("")}
        ${a===undefined?`<button data-q="${key}" data-k="-1" class="idk">Weiß ich nicht</button>`:""}</div>`
      :`<p class="hint" style="margin:4px 0 8px">Erst selbst überlegen, dann Auswahl zeigen.</p>
        <div class="row"><button class="btn small" data-show="${key}">Auswahl zeigen</button><button class="btn ghost small" data-q="${key}" data-k="-1">Weiß ich nicht</button></div>`}
    ${a!==undefined?feedback(c,a):""}</div>`;
}
/* Übungsmodus: fällige Verständnisfragen aus allen Lektionen */
function openRecall(list){ const L=list||qDue().slice(0,8); cur.rq={list:L, i:0, ans:undefined, shown:false, right:0}; go("recall"); }
function renderRecall(){
  const R=cur.rq, L=R.list;
  if(R.i>=L.length){
    const left=qDue().length;
    $("#app").innerHTML=`${backTo("Üben")}<h1>${L.length?"Runde geschafft":"Nichts fällig"}</h1><div class="block">
      ${L.length?`<p>${R.right} von ${L.length} richtig.</p>`:`<p>Gerade ist keine Verständnisfrage fällig. Neue Fragen kommen mit jeder Lektion dazu.</p>`}
      <p class="small muted">Richtige Fragen kommen nach 1, 3, 7, 16 und 35 Tagen wieder, falsche schon morgen. ${left?`Noch ${left} fällig.`:""}</p>
      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="rAgain">Weiter</button>`:""}<button class="btn ghost" id="rOut">Fertig</button>`}</div></div>`;
    bindCrumb(()=>go("practice")); if($("#rAgain")) $("#rAgain").onclick=()=>openRecall(); if($("#rOut")) $("#rOut").onclick=()=>go("practice"); return;
  }
  const q=L[R.i], ch=CHAPTERS.find(c=>c.n===q.n);
  $("#app").innerHTML=`${backTo("Üben")}
    <p class="eyebrow">Verständnisfrage ${R.i+1} von ${L.length}</p>
    <div class="block"><p class="small muted" style="margin:0 0 2px">${ch.title} · ${q.lt}</p>${qBlock(q.c,"r",R.ans,R.shown,true)}</div>
    ${R.ans!==undefined?`<div class="row"><button class="btn" id="rNext">Weiter</button><button class="btn ghost" id="rLes">Zur Lektion</button></div>`:""}`;
  bindCrumb(()=>go("practice"));
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ R.shown=true; renderRecall(); });
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ if(R.ans!==undefined) return; const k=+b.dataset.k; R.ans=k; const ok=k===q.c.a; if(ok) R.right++; logDay(); qGrade(q.id,ok); renderRecall(); });
  if($("#rNext")) $("#rNext").onclick=()=>{ R.i++; R.ans=undefined; R.shown=false; renderRecall(); window.scrollTo(0,0); };
  if($("#rLes")) $("#rLes").onclick=()=>openLesson(q.n,q.li);
}

/* ================= Zuordnen: Beispiele dem richtigen Begriff zuordnen =================
   Trainiert das Unterscheiden ähnlicher Begriffe, wie es die Kreuzaufgaben und Fallbeispiele verlangen.
   Nur Kategorien, die in Heines Folien schon vorkommen. Weitere Sätze (z. B. Lerntheorien) kommen mit den Folien dazu.
   Je Satz: t Titel, q Frage, hint Tipp, cats Kategorien. Je Beispiel: id (bleibt fest), set, t Text, s richtige Kategorie,
   alt ähnliche Kategorien, die nicht als falsche Antwort angeboten werden, ex Begründung, kap Kapitel */
const WHO_SETS={
  lern:{t:"Welche Lernform?", kap:9, q:"Was steckt hinter dieser Beobachtung?",
    hint:"Wird die Reaktion schwächer oder stärker? Werden zwei Ereignisse verknüpft? Oder steckt Reifung oder Müdigkeit dahinter?",
    cats:{hab:"Habituation", sens:"Sensitivierung", kk:"Klassische Konditionierung (S → S)", ok:"Operante Konditionierung (R → S)", kein:"Kein Lernen (Reifung, Ermüdung)"}}
};
const WHO=[
 {id:"l01", set:"lern", t:"Nach zwei Wochen im neuen Klassenraum bemerkt Ayla das Rauschen der Lüftung nicht mehr.", s:"hab", ex:"Ein schwacher, regelmäßiger Reiz wird wiederholt dargeboten, die Reaktion wird schwächer."},
 {id:"l02", set:"lern", t:"Während der Klassenarbeit wirkt das Schniefen des Sitznachbarn immer lauter. Tom kann es nicht mehr ausblenden.", s:"sens", ex:"Beispiel aus der Vorlesung: Das hohe Erregungsniveau in der Prüfung macht die Reaktion auf denselben Reiz stärker."},
 {id:"l03", set:"lern", t:"Nach einem lauten Knall auf dem Flur zuckt die ganze Klasse auch beim Zufallen eines Mäppchens stark zusammen.", s:"sens", ex:"Sensitivierung ist weniger stimulusspezifisch: Die Erregung durch Reiz 1 verstärkt auch die Reaktion auf Reiz 2."},
 {id:"l04", set:"lern", t:"Ein Erstklässler springt im Sommer deutlich höher als im Winter davor.", s:"kein", ex:"Das kann Reifung sein, also körperliches Wachstum. Reifung hängt nicht von Erfahrung ab und ist deshalb kein Lernen."},
 {id:"l05", set:"lern", t:"In der sechsten Stunde macht Lena beim Kopfrechnen viel mehr Fehler als am Morgen.", s:"kein", ex:"Ermüdung: eine kurzfristige Verhaltensänderung, nicht konsistent und nicht dauerhaft."},
 {id:"l06", set:"lern", t:"Die Klasse hört das Brummen des Beamers nicht mehr. Als der Rauchmelder piept, schrecken alle hoch.", s:"hab", alt:["sens"], ex:"Habituation ist stimulusspezifisch: An den Beamer haben sich alle gewöhnt, ein neuer Reiz löst die volle Reaktion aus (Dishabituation)."},

 {id:"l11", set:"lern", t:"Ein Kleinkind fängt an zu laufen, ohne dass es jemand gezielt geübt hat.", s:"kein", ex:"Laufen und Krabbeln sind Beispiele für Reifung auf Heines Folie: nicht erfahrungsabhängig."},
 {id:"l12", set:"lern", t:"Ein Jugendlicher reagiert nach einem belastenden Erlebnis auf laute Geräusche nicht ruhiger, sondern jedes Mal heftiger.", s:"sens", ex:"„Failure to habituate“: Statt Gewöhnung tritt eine immer stärkere Reaktion auf. So erklärt man z. B. Symptome bei PTBS."},
 {id:"l13", set:"lern", t:"Mit Fieber bleibt am Abend vor der Prüfung kaum etwas hängen.", s:"kein", ex:"Eine körperliche Ursache wie Krankheit ist weder Lernen noch Vergessen (Lehrbuch Kap. 1)."},
 {id:"l14", set:"lern", t:"Neu an der Schule an der Hauptstraße, stört Elif der Verkehrslärm. Nach einigen Wochen nimmt sie ihn kaum noch wahr.", s:"hab", ex:"Gewöhnung an einen wiederholten Reiz ermöglicht die Anpassung an eine bestimmte Umwelt."}
];
const whoCats=x=>WHO_SETS[x.set].cats;
function whoOptions(x){
  const C=whoCats(x), pool=Object.keys(C).filter(k=>k!==x.s&&!(x.alt||[]).includes(k));
  return shuffle([x.s].concat(shuffle(pool).slice(0,3)));
}
/* Auswahl: neue Beispiele und verwechselte kommen öfter */
function whoPick(n){
  const st=state.who||{}, pool=WHO.filter(x=>LESSONS[WHO_SETS[x.set].kap]), out=[];
  const w=pool.map(x=>{ const h=st[x.id]; return !h?3 : h.last?1:4; });
  while(out.length<Math.min(n,pool.length)){ let q=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<pool.length;i++){ q-=w[i]; if(q<=0) break; } i=Math.min(i,pool.length-1); out.push(pool.splice(i,1)[0]); w.splice(i,1); }
  return out;
}
function openWho(n){ cur.wh={list:whoPick(n||8).map(x=>({x,o:whoOptions(x)})), i:0, a:null, right:0}; go("who"); }
function renderWho(){
  const W=cur.wh, L=W.list;
  if(W.i>=L.length){
    $("#app").innerHTML=`${backTo("Üben")}<h1>Runde geschafft</h1><div class="block"><p>${W.right} von ${L.length} richtig zugeordnet.</p>
      <p class="small muted">Falsch zugeordnete Beispiele kommen in den nächsten Runden häufiger.</p>
      <div class="row">${sess?sessBtn():`<button class="btn" id="wAgain">Neue Runde</button><button class="btn ghost" id="wOut">Fertig</button>`}</div></div>`;
    bindCrumb(()=>go("practice")); if($("#wAgain")) $("#wAgain").onclick=()=>openWho(8); if($("#wOut")) $("#wOut").onclick=()=>go("practice"); return;
  }
  const {x,o}=L[W.i], S=WHO_SETS[x.set], C=S.cats;
  $("#app").innerHTML=`${backTo("Üben")}
    <p class="eyebrow">Zuordnen · ${S.t} · ${W.i+1} von ${L.length}</p>
    <div class="block"><p class="small muted" style="margin:0 0 6px">${S.q}</p><p class="who">${inl(x.t)}</p>
      <div class="mc">${o.map(k=>{ const cls=W.a===null?"":(k===x.s?"r":(k===W.a?"w":"")); return `<button data-s="${k}" class="${cls}" ${W.a!==null?"disabled":""}>${C[k]}</button>`; }).join("")}</div>
      ${W.a===null?"":W.a===x.s?`<div class="fb good"><p class="fh">Richtig.</p><p style="margin:0">${inl(x.ex)}</p></div>`
        :`<div class="fb bad"><p class="fh">Nicht ganz.</p><div class="dlist"><b>Richtig</b><span>${C[x.s]}</span><b>Warum</b><span>${inl(x.ex)}</span></div></div>`}</div>
    ${W.a!==null?`<button class="btn" id="wNext">Weiter</button>`:`<p class="small muted">Tipp: ${S.hint}</p>`}`;
  bindCrumb(()=>go("practice"));
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ if(W.a!==null) return; W.a=b.dataset.s; const ok=W.a===x.s; if(ok) W.right++;
    state.who=state.who||{}; const h=state.who[x.id]||{n:0,r:0}; h.n++; if(ok) h.r++; h.last=ok; if(!ok) h.conf=W.a; state.who[x.id]=h; logDay(); save(); renderWho(); });
  if($("#wNext")) $("#wNext").onclick=()=>{ W.i++; W.a=null; renderWho(); window.scrollTo(0,0); };
}

/* ================= Tägliche Einheit „Heute“ =================
   Mischt, was heute dran ist: fällige Karten, fällige Verständnisfragen, Kreuzaufgaben wie in der Klausur,
   abwechselnd eine Rechenaufgabe, eine offene Aufgabe oder „Zuordnen“, dazu die nächste neue Lektion.
   Gemischtes Üben (Interleaving) und Abstände (Spacing), ohne dass du selbst planen musst. */
let sess=null;
const dayIndex=()=>Math.floor(dayStart()/864e5);
function freshChapter(){ for(const ch of CHAPTERS){ const L=LESSONS[ch.n]||[]; if(L.some(x=>lessonState(x.id)) && (CARDS[ch.n]||[]).some(x=>!isSeen(x.id))) return ch.n; } return 0; }
function planToday(){
  const S=[], dc=dueCards(0).length, dq=qDue().length, kd=kzDue().length;
  if(dc) S.push({k:"cards", t:"Karten wiederholen", d:`${Math.min(dc,20)} fällige Karten`, min:Math.max(2,Math.round(Math.min(dc,20)*.4))});
  else { const n=freshChapter(); if(n) S.push({k:"newcards", n, t:"Neue Karten", d:`5 neue Karten: ${CHAPTERS.find(c=>c.n===n).title}`, min:3}); }
  if(dq) S.push({k:"recall", t:"Verständnisfragen", d:`${Math.min(dq,6)} fällige Fragen aus den Lektionen`, min:3});
  if(kreuzOf(0).length) S.push({k:"kreuz", t:"Kreuzaufgaben", d:kd?`3 Aufgaben wie in der Klausur, ${Math.min(kd,3)} davon fällig`:"3 Aufgaben wie in der Klausur", min:4});
  const rot=["calc","who","kurz"][dayIndex()%3];
  if(rot==="calc"&&calcTypes(0).length) S.push({k:"calc", t:"Eine Rechenaufgabe", d:"Diagnostik, bevorzugt was dir schwerfällt", min:5});
  else if(rot==="kurz"&&kurzOf(0).length) S.push({k:"kurz", t:"Eine offene Aufgabe", d:"tippen wie in der Klausur am PC", min:6});
  else if(whoPick(1).length) S.push({k:"who", t:"Zuordnen", d:"5 Beispiele der richtigen Lernform zuordnen", min:3});
  const nx=nextStep(); if(/Theorie/.test(nx.label)) S.push({k:"lesson", t:"Neu lernen", d:nx.title, min:5, go:nx.go});
  return S;
}
function startSession(){ sess={steps:planToday(), i:0, t0:Date.now()}; runStep(); }
function runStep(){
  if(!sess) return; const s=sess.steps[sess.i]; updateSessBar();
  if(!s){ return finishSession(); }
  ({cards:()=>openCards(0,false,dueCards(0).slice(0,20)),
    newcards:()=>openCards(s.n,false,allCards(s.n).filter(x=>!isSeen(x.id)).slice(0,5)),
    recall:()=>openRecall(qDue().slice(0,6)),
    kreuz:()=>openKreuz(0,3),
    calc:()=>startTask(recommend(),false),
    who:()=>openWho(5),
    kurz:()=>openKurz(0),
    lesson:()=>s.go()})[s.k]();
  window.scrollTo(0,0);
}
function sessNext(){ if(!sess) return; sess.i++; runStep(); }
function endSession(){ sess=null; updateSessBar(); go("home"); }
function finishSession(){
  const min=Math.max(1,Math.round((Date.now()-sess.t0)/60000)); state.sessions=state.sessions||{}; state.sessions[today()]=min; save();
  sess=null; updateSessBar(); view="sessdone"; renderNav();
  $("#app").innerHTML=`<p class="eyebrow">Heute</p><h1>Geschafft</h1><div class="block"><p>Deine Einheit ist fertig, etwa ${min} Minuten.</p>
    <p class="small muted">Morgen stellt die App eine neue Einheit zusammen. Was du heute nicht sicher wusstest, ist dann wieder dabei.</p>
    <div class="row"><button class="btn" id="sdHome">Zum Lernpfad</button></div></div>`;
  $("#sdHome").onclick=()=>go("home"); window.scrollTo(0,0);
}
function updateSessBar(){
  const b=$("#sessbar"); if(!b) return;
  if(!sess||!sess.steps[sess.i]){ b.hidden=true; b.innerHTML=""; return; }
  const s=sess.steps[sess.i];
  b.hidden=false;
  b.innerHTML=`<div class="sbin"><span class="sbt"><b>Heute ${sess.i+1}/${sess.steps.length}</b> · ${s.t}</span><button class="btn small" id="sbNext">${sess.i<sess.steps.length-1?"Nächster Schritt":"Abschließen"}</button><button class="btn ghost small" id="sbEnd" aria-label="Einheit beenden">✕</button></div>`;
  $("#sbNext").onclick=sessNext; $("#sbEnd").onclick=endSession;
}
const sessBtn=()=>`<button class="btn" id="sessGo">${sess&&sess.i<sess.steps.length-1?"Weiter zum nächsten Schritt":"Einheit abschließen"}</button>`;
document.addEventListener("click",e=>{ if(e.target.closest("#sessGo")) sessNext(); });
/* Block auf der Startseite */
function todayBlock(){
  const done=(state.sessions||{})[today()], S=planToday(), min=S.reduce((a,s)=>a+s.min,0);
  const plan=examPlanToday();
  if(sess) return `<div class="block today"><p class="eyebrow">Heute</p><h2>Einheit läuft</h2><p class="small muted" style="margin-top:0">Schritt ${sess.i+1} von ${sess.steps.length}: ${sess.steps[sess.i]?sess.steps[sess.i].t:""}</p><button class="btn" id="goSess">Fortsetzen</button></div>`;
  return `<div class="block today"><p class="eyebrow">Heute · etwa ${min} Minuten</p><h2>${done?"Für heute erledigt":"Deine Lerneinheit"}</h2>
    ${done?`<p class="small muted" style="margin-top:0">Du hast heute schon gelernt. Eine zweite Runde schadet nicht, morgen geht es mit neuen Abständen weiter.</p>`:""}
    <ol class="plan">${S.map(s=>`<li><b>${s.t}</b><span>${inl(s.d)}</span></li>`).join("")}</ol>
    ${plan?`<p class="small" style="margin:0 0 10px"><b>Probeklausur:</b> ${plan}</p>`:""}
    <button class="btn" id="goSess">${done?"Noch eine Runde":"Starten"}</button></div>`;
}

/* ================= Klausurtermin, Probeklausur-Plan und Schwachstellen ================= */
const EXAM_DEFAULT="2027-02-17";   // laut Unterlagen: Modulklausur am PC im PC-Raum; änderbar unter Statistik
const fmtDate=t=>{ const d=new Date(t); return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+"."; };
const examDateTs=()=>{ const s=state.examDate||EXAM_DEFAULT; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
const examDaysLeft=()=>Math.ceil((examDateTs()-dayStart())/864e5);
/* Plan: eine Probeklausur früh als Standortbestimmung, dann 21, 14 und 7 Tage vor dem Termin */
function examPlan(){
  const T=examDateTs(), ex=(state.exams||[]).map(e=>e.t).sort((a,b)=>a-b);
  const P=[{lab:"Standortbestimmung", when:null}];
  [21,14,7].forEach(d=>P.push({lab:`${d} Tage vor der Klausur`, when:T-d*864e5}));
  const used=new Set();
  P.forEach(p=>{ const i=ex.findIndex((t,k)=>!used.has(k)&&(p.when==null||t>=p.when-3*864e5)); if(i>=0){ used.add(i); p.done=ex[i]; } });
  return P;
}
function examPlanToday(){
  const P=examPlan(), now=Date.now(), open=P.find(p=>!p.done);
  if(!open) return "";
  if(open.when==null) return "Schreib bald eine als Standortbestimmung (unter Üben).";
  if(open.when-now<=864e5) return `Laut Plan ist jetzt die nächste dran (${open.lab}).`;
  return "";
}
function examPlanBlock(){
  const days=examDaysLeft(), P=examPlan(), own=!!state.examDate;
  return `<div class="block"><h2>Klausur und Probeklausuren</h2>
    <div class="row" style="margin-bottom:8px"><label class="small" for="exD">Klausurtermin</label><input type="date" id="exD" value="${state.examDate||EXAM_DEFAULT}" class="dateinp"><button class="btn ghost small" id="exS">Speichern</button></div>
    <p class="small" style="margin:0 0 6px">${days>0?`Noch <b>${days} Tage</b> bis zur Klausur.`:days===0?"<b>Heute ist Klausur.</b> Viel Erfolg!":"Der Termin liegt in der Vergangenheit."}${own?"":` <span class="muted">Termin laut deinen Unterlagen (17.02.2027). Ändert er sich, trag ihn hier neu ein.</span>`}</p>
    <div class="klist">${P.map(p=>`<b>${p.done?"✓ ":""}${p.lab}</b><span>${p.done?`geschrieben am ${fmtDate(p.done)}`:p.when?fmtDate(p.when):"so bald wie möglich"}</span>`).join("")}</div></div>`;
}
function bindExamPlan(){ if($("#exS")) $("#exS").onclick=()=>{ const v=$("#exD").value; state.examDate=v||null; save(); toast(v?"Termin gespeichert":"Termin zurückgesetzt"); render(); }; }

/* Schwachstellen aus allen Übungsformen */
function weakData(){
  const byId=Object.fromEntries(Object.values(CARDS).flat().map(c=>[c.id,c]));
  const weakCards=Object.entries(state.lapses||{}).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([id])=>byId[id]).filter(Boolean);
  const qById=Object.fromEntries(allQuestions().map(q=>[q.id,q]));
  const weakQ=Object.entries(state.qlapses||{}).filter(([id,n])=>n>=1&&qById[id]&&((state.qbox||{})[id]||{}).b<=2).sort((a,b)=>b[1]-a[1]).map(([id])=>qById[id]);
  const weakK=kreuzOf(0).filter(x=>{ const s=kzStat(x.id); return s&&s.p<4; }).sort((a,b)=>kzStat(a.id).p-kzStat(b.id).p);
  const weakCalc=calcTypes(0).filter(t=>{ const h=state.hist[t]; return h&&h.n>=2&&h.r/h.n<.7; }).sort((a,b)=>acc(a)-acc(b));
  const conf={}; Object.entries(state.who||{}).forEach(([id,h])=>{ if(h.conf&&!h.last){ const x=WHO.find(w=>w.id===id); if(x){ const C=whoCats(x), k=C[x.s]+" ↔ "+C[h.conf]; conf[k]=(conf[k]||0)+1; } } });
  return {weakCards,weakQ,weakK,weakCalc,confL:Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,3)};
}
function weakBlock(){
  const {weakCards,weakQ,weakK,weakCalc,confL}=weakData();
  const none=!weakCards.length&&!weakQ.length&&!weakK.length&&!weakCalc.length&&!confL.length;
  return `<div class="block"><h2>Deine Schwachstellen</h2>${none?`<p class="small muted" style="margin:0">Noch nichts Auffälliges. Die Übersicht füllt sich, sobald du übst: Karten, die du mehrmals nicht wusstest, falsche Verständnisfragen, Kreuzaufgaben unter 4 Punkten, Rechenaufgaben unter 70 % und verwechselte Begriffe.</p>`:""}
    ${weakCards.length?`<h3>Karten, die du mehrmals nicht wusstest</h3><ul class="weak">${weakCards.slice(0,5).map(c=>`<li>${inl(c.f)}</li>`).join("")}</ul><button class="btn ghost small" id="wkC">Diese ${Math.min(weakCards.length,15)} Karten üben</button>`:""}
    ${weakQ.length?`<h3 style="margin-top:14px">Verständnisfragen mit Fehlern</h3><ul class="weak">${weakQ.slice(0,5).map(q=>`<li>${inl(q.c.q)}</li>`).join("")}</ul><button class="btn ghost small" id="wkQ">Diese Fragen üben</button>`:""}
    ${weakK.length?`<h3 style="margin-top:14px">Kreuzaufgaben unter 4 Punkten</h3><ul class="weak">${weakK.slice(0,5).map(x=>`<li>${inl(x.stem.replace(/:$/,""))} <span class="muted">(zuletzt ${kzStat(x.id).p}/4)</span></li>`).join("")}</ul><button class="btn ghost small" id="wkK">Diese Kreuzaufgaben üben</button>`:""}
    ${weakCalc.length?`<h3 style="margin-top:14px">Rechenaufgaben unter 70 %</h3>${weakCalc.map(t=>`<div class="srow"><span>${TYPES[t].short}</span><span class="small muted">${Math.round(acc(t)*100)} %</span><button class="btn ghost small" data-wt="${t}">Üben</button></div>`).join("")}`:""}
    ${confL.length?`<h3 style="margin-top:14px">Oft verwechselt</h3><ul class="weak">${confL.map(([k,n])=>`<li>${k} (${n}×)</li>`).join("")}</ul><button class="btn ghost small" id="wkW">Zuordnen üben</button>`:""}
  </div>`;
}
function bindWeak(){
  const W=weakData();
  if($("#wkC")) $("#wkC").onclick=()=>openCards(0,true,W.weakCards.slice(0,15));
  if($("#wkQ")) $("#wkQ").onclick=()=>openRecall(W.weakQ.slice(0,8));
  if($("#wkK")) $("#wkK").onclick=()=>openKreuz(0,5,W.weakK.slice(0,5).map(x=>x.id));
  document.querySelectorAll("[data-wt]").forEach(b=>b.onclick=()=>startTask(b.dataset.wt,false));
  if($("#wkW")) $("#wkW").onclick=()=>openWho(8);
}

/* ================= Aufgabe ================= */
function startTask(t,mix){
  task={t,mix,lvl:lvlOf(t),data:TYPES[t].gen(),cur:0,shown:0,first:{},done:false,checks:{}};
  view="task"; render(); window.scrollTo(0,0);
}
function nextTask(){
  if(task.mix){ const pool=ORDER.filter(x=>x!==task.t); const w=pool.map(x=>{const a=acc(x);return a==null?2:1.5-a;}); let s=Math.random()*w.reduce((a,b)=>a+b,0); let i=0; for(;i<pool.length;i++){ s-=w[i]; if(s<=0) break; } startTask(pool[Math.min(i,pool.length-1)],true); }
  else startTask(task.t,false);
}
function record(ok){
  const t=task.t; state.hist[t]=state.hist[t]||{n:0,r:0}; state.hist[t].n++; if(ok) state.hist[t].r++;
  const k=today(); state.days[k]=(state.days[k]||0)+1;
  const l=lvlOf(t), st=state.streak[t]||0;
  if(l===2){ state.streak[t]= ok? st+1 : 0; if(state.streak[t]>=2){ state.lvl[t]=3; state.streak[t]=0; toast("Stufe Frei freigeschaltet"); } }
  else if(l===3){ state.streak[t]= ok? 0 : st+1; if(state.streak[t]>=2){ state.lvl[t]=2; state.streak[t]=0; toast("Zurück zu Geführt, um den Weg zu festigen"); } }
  save();
}
function head(){
  const T=TYPES[task.t], d=task.data;
  return `<div class="row between" style="margin-bottom:8px">
      <button class="btn ghost small" id="back">← Liste</button>
      <div class="seg" role="group" aria-label="Stufe">${[1,2,3].map(l=>`<button data-l="${l}" aria-pressed="${task.lvl===l}">${LVL[l]}</button>`).join("")}</div>
    </div>
    <div class="row between" style="margin:0 0 .3em"><p class="eyebrow" style="margin:0">${task.mix?"Gemischt · ":""}${T.name}</p><button class="btn ghost small" id="lex">Zeichen</button></div>
    <div class="block">
      <p class="small">${d.intro}</p>
      ${d.table}
      <p style="margin:10px 0 0"><b>${d.q}</b></p>
    </div>`;
}
function bindHead(){
  $("#back").onclick=()=>go("calc");
  $("#lex").onclick=showLexicon;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ const l=+b.dataset.l; state.lvl[task.t]=l; state.streak[task.t]=0; save(); task.lvl=l; task.cur=0; task.shown=0; task.first={}; task.done=false; task.checks={}; render(); });
}
function renderTask(){
  const T=TYPES[task.t];
  if(T.self) return renderSelf();
  if(task.lvl===1) return renderWorked();
  if(task.lvl===2) return renderGuided();
  return renderFree();
}
const eqLine=s=>`<div class="eq">${esc(s.calc)}</div>`;
/* Lösungsschritt: Formel, Einsetzen, Begründung; am Ende Ergebnis und Deutung */
const stepRows=s=>`<div class="dlist">${s.f?`<b>Formel</b><span><span class="eq" style="display:block">${esc(s.f)}</span></span>`:""}<b>Einsetzen</b><span><span class="eq" style="display:block">${esc(s.calc)}</span></span>${s.why?`<b>Warum</b><span>${s.why}</span>`:""}</div>`;
const deutBox=d=>{ const t=d.deut||(TYPES[task.t]||{}).deut; return t?`<div class="bsp"><p class="bh">Deutung</p><p style="margin:0 0 8px">${t}</p></div>`:""; };

/* Stufe 1: vorgerechnet, Schritt für Schritt aufdecken */
function renderWorked(){
  const S=task.data.steps, n=task.shown;
  $("#app").innerHTML=head()+`
    <div class="stack">${S.slice(0,n+1).map((s,i)=>`<div class="step">
      <div class="lab">${i+1}. ${s.lab}</div>${stepRows(s)}</div>`).join("")}</div>
    ${n>=S.length-1?deutBox(task.data):""}
    <div class="row" style="margin-top:14px">${n<S.length-1?`<button class="btn" id="more">Nächster Schritt</button>`:`<button class="btn" id="self">Jetzt selbst rechnen</button>`}</div>`;
  bindHead();
  if($("#more")) $("#more").onclick=()=>{ task.shown++; renderWorked(); };
  if($("#self")) $("#self").onclick=()=>{ state.lvl[task.t]=2; state.streak[task.t]=0; save(); startTask(task.t,task.mix); };
}

/* Stufe 2: geführt, ein Schritt nach dem anderen mit Eingabe */
function renderGuided(){
  const S=task.data.steps, cur=task.cur;
  const html=S.map((s,i)=>{
    if(i>cur) return "";
    if(i<cur){ const ok=task.first[i]; return `<div class="step ${ok?"ok":"no"}"><div class="lab">${i+1}. ${s.lab}</div>${eqLine(s)}</div>`; }
    return `<div class="step" id="curStep"><div class="lab">${i+1}. ${s.lab}</div><div class="why">${s.why}</div>
      <div class="inp"><input id="in" inputmode="decimal" autocomplete="off" aria-label="${esc(s.lab.replace(/<[^>]+>/g,""))}"><button class="btn small" id="chk">Prüfen</button><button class="btn ghost small" id="hint">Formel</button></div>
      <div id="out"></div></div>`;
  }).join("");
  $("#app").innerHTML=head()+`<div class="stack">${html}</div>
    ${task.done?deutBox(task.data)+finishBox():padHTML()}`;
  bindHead(); bindPad();
  if(task.done){ bindFinish(); return; }
  const inp=$("#in"); inp.focus({preventScroll:true});
  const s=S[cur];
  const check=()=>{
    const res=judge(s,inp.value);
    if(res===null){ $("#out").innerHTML=`<p class="res bad">Bitte eine Zahl eingeben, Komma oder Punkt geht beides.</p>`; return; }
    if(!(cur in task.first)) task.first[cur]=res;
    if(res){ task.cur++; if(task.cur>=S.length){ task.done=true; record(Object.values(task.first).every(Boolean)); } renderGuided(); }
    else{ $("#out").innerHTML=`<p class="res bad">Noch nicht. ${s.sign?"Achte auch aufs Vorzeichen. ":""}Versuch es nochmal oder lass dir den Schritt zeigen.</p><button class="btn ghost small" id="reveal">Schritt zeigen</button>`;
      $("#reveal").onclick=()=>{ task.first[cur]=false; task.cur++; if(task.cur>=S.length){ task.done=true; record(false); } renderGuided(); }; }
  };
  $("#chk").onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
  $("#hint").onclick=()=>{ $("#out").innerHTML=`<p class="hint muted">Formel:</p><div class="eq">${esc(s.f)}</div>`; };
}

/* Stufe 3: frei, nur die Klausurgrößen */
function renderFree(){
  const S=task.data.steps, F=S.map((s,i)=>[s,i]).filter(([s])=>s.final);
  $("#app").innerHTML=head()+`
    ${padHTML()}
    <div class="block stack">${F.map(([s,i])=>`<div>
      <label class="lab" for="f${i}" style="font-weight:600">${s.lab}</label>
      <div class="inp" style="margin-top:4px"><input id="f${i}" inputmode="decimal" autocomplete="off" ${task.done?"disabled":""}></div>
      <div id="o${i}"></div></div>`).join("")}
      ${task.done?"":`<button class="btn" id="chkAll">Abgeben</button>`}
    </div>
    <div id="sol"></div>`;
  bindHead(); bindPad();
  if(task.done) return;
  $("#chkAll").onclick=()=>{
    let all=true, empty=false;
    F.forEach(([s,i])=>{ const v=$("#f"+i).value; const res=judge(s,v); if(res===null) empty=true; });
    if(empty && !task.confirmEmpty){ task.confirmEmpty=true; toast("Noch leere Felder. Nochmal tippen zum Abgeben."); return; }
    F.forEach(([s,i])=>{ const el=$("#f"+i), res=judge(s,el.value); if(!res) all=false;
      el.disabled=true; $("#o"+i).innerHTML=`<p class="res ${res?"good":"bad"}">${res?"Richtig":"Richtig wäre "+fmt(s.ans)+(s.rate?" (= "+fmt(s.ans*100)+" Prozentpunkte)":"")+(s.pct?" %":"")}</p>`; });
    task.done=true; record(all); $("#chkAll").remove();
    $("#sol").innerHTML=`<div class="block"><h3>Lösungsweg</h3><div class="stack">${S.map((s,i)=>`<div><div class="small" style="font-weight:600">${i+1}. ${s.lab}</div>${stepRows(s)}</div>`).join("")}</div>${deutBox(task.data)}</div>`+finishBox(all);
    bindFinish();
  };
}

/* Herleitung: selbst schreiben, dann aufdecken und abhaken */
function renderSelf(){
  const S=task.data.steps, guided=task.lvl===2, worked=task.lvl===1;
  const n= worked? S.length : (guided? task.shown : (task.done? S.length : 0));
  $("#app").innerHTML=head()+`
    ${worked?"":`<p class="small muted">${guided?"Schreib den nächsten Schritt auf den Schmierzettel, dann deck ihn auf.":"Schreib die komplette Herleitung auf den Schmierzettel. Danach vergleichen und abhaken, welche Schritte du hattest."}</p>${padHTML()}`}
    <div class="block">${S.slice(0,n).map((s,i)=>`
      <div class="check">${worked?"":`<input type="checkbox" id="c${i}" ${task.checks[i]?"checked":""} aria-label="Schritt ${i+1} gehabt">`}
      <div style="min-width:0;flex:1"><div class="small" style="font-weight:600">${i+1}. ${s.lab}</div><div class="eq">${esc(s.f)}</div></div></div>`).join("")||`<p class="small muted" style="margin:0">${S.length} Schritte warten auf dich.</p>`}
    </div>
    <div class="row">
      ${worked?`<button class="btn" id="self">Jetzt selbst schreiben</button>`:
        (n<S.length?`<button class="btn" id="more">${guided?"Nächsten Schritt aufdecken":"Lösung aufdecken"}</button>`:
        (task.saved?"":`<button class="btn" id="sv">Ergebnis speichern</button>`))}
    </div>
    <div id="fin">${task.saved?finishBox(task.savedOk):""}</div>`;
  bindHead(); if(!worked) bindPad();
  document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ task.checks[+c.id.slice(1)]=c.checked; });
  if($("#self")) $("#self").onclick=()=>{ state.lvl[task.t]=2; save(); startTask(task.t,task.mix); };
  if($("#more")) $("#more").onclick=()=>{ if(guided) task.shown++; else task.done=true; renderSelf(); };
  if($("#sv")) $("#sv").onclick=()=>{ const ok=S.every((_,i)=>task.checks[i]); task.saved=true; task.savedOk=ok; record(ok); renderSelf(); };
  if(task.saved) bindFinish();
}

function finishBox(ok){
  if(ok===undefined) ok=Object.values(task.first).every(Boolean);
  const l=lvlOf(task.t);
  return `<div class="block" style="margin-top:14px">
    <h3>${ok?"Fehlerfrei":"Geschafft, mit Fehlern"}</h3>
    <p class="small muted">${ok?"Gut so.":"Schau dir den markierten Schritt nochmal an, die nächste Aufgabe hat neue Zahlen."} Stufe jetzt: ${LVL[l]}.</p>
    <div class="row">${sess?sessBtn():`<button class="btn" id="next">${task.mix?"Nächste Aufgabe":"Neue Zahlen"}</button><button class="btn ghost" id="list">Zur Liste</button>`}</div></div>`;
}
function bindFinish(){ if($("#next")) $("#next").onclick=nextTask; if($("#list")) $("#list").onclick=()=>go("calc"); }

/* ================= Schmierzettel für den Apple Pencil ================= */
let padStrokes=[];
function padHTML(){ return `<div class="pad" style="margin:0 0 14px"><span class="ph">Schmierzettel</span><canvas id="pad" aria-label="Schmierzettel zum Rechnen mit dem Stift"></canvas><div class="tools"><button id="padUndo">Zurück</button><button id="padClr">Leeren</button></div></div>`; }
function bindPad(){
  const c=$("#pad"); if(!c) return;
  const ctx=c.getContext("2d"); let penSeen=false, cur=null;
  const size=()=>{ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); };
  const color=()=>getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#1B2433";
  function draw(){ ctx.clearRect(0,0,c.width,c.height); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=color();
    for(const s of padStrokes){ for(let i=1;i<s.length;i++){ ctx.lineWidth=s[i][2]; ctx.beginPath(); ctx.moveTo(s[i-1][0],s[i-1][1]); ctx.lineTo(s[i][0],s[i][1]); ctx.stroke(); } } }
  const pt=e=>{ const r=c.getBoundingClientRect(); const p=e.pressure&&e.pointerType==="pen"? e.pressure : .5; return [e.clientX-r.left,e.clientY-r.top,1+p*2.4]; };
  c.onpointerdown=e=>{ if(e.pointerType==="pen") penSeen=true; if(penSeen&&e.pointerType==="touch") return; cur=[pt(e)]; padStrokes.push(cur); c.setPointerCapture(e.pointerId); };
  c.onpointermove=e=>{ if(!cur) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) cur.push(pt(ev)); draw(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
  $("#padUndo").onclick=()=>{ padStrokes.pop(); draw(); };
  $("#padClr").onclick=()=>{ padStrokes=[]; draw(); };
  size(); window.onresize=size;
}

/* Start: erst sofort zeigen, dann mit den anderen Geräten abgleichen */
/* Zoom gilt pro Gerät (nicht synchronisiert) */
(function(){ let z=parseFloat(lsGet("bw2-zoom"))||1;
  const apply=()=>{ document.documentElement.style.setProperty("--z",z); lsSet("bw2-zoom",String(z)); };
  apply();
  document.getElementById("zIn").onclick=()=>{ z=Math.min(1.8,Math.round((z+.1)*10)/10); apply(); };
  document.getElementById("zOut").onclick=()=>{ z=Math.max(.8,Math.round((z-.1)*10)/10); apply(); };
})();
initToken();
render();
syncFromRemote().then(changed=>{ if(changed&&!["task","essay","graph","lesson","cards","kreuz","exam","kurz","recall","who"].includes(view)) render(); });
