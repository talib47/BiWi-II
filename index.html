CARDS[3]=[
 {id:"c3-01", f:"Enkodierung", b:"Prozess des Abspeicherns von Information, noch während der Stimulus präsent ist."},
 {id:"c3-02", f:"Vier Faktoren für die Qualität der Enkodierung", b:"Verarbeitungstiefe (levels of processing, deep/shallow encoding)\nPassung der Enkodierungs- und Abrufprozesse\nVorwissen\nLernrate"},
 {id:"c3-03", f:"Verarbeitungstiefe", b:"Regel: je tiefer (z. B. semantisch) bei der Enkodierung verarbeitet, desto besser behalten\nFalle: „desto schwieriger der Abruf“ war 24/25 falsch\nBeispiel: Wer über die Bedeutung eines Fachbegriffs nachdenkt, behält ihn besser als wer nur das Schriftbild abschreibt."},
 {id:"c3-04", f:"Gedächtnis als konstruktiver Prozess", b:"Kern: Gedächtnisinhalte sind keine objektiven Abbildungen (Augenzeugenberichte!)\nBei der Enkodierung: Schemata und Skripte lenken Selektion, Abstraktion, Interpretation, Integration\nBeim Abruf: Rekonstruktion\nBeispiel: Zwei Schüler schildern denselben Streit ganz unterschiedlich, und beide sind überzeugt."},
 {id:"c3-05", f:"Schemata und Skripte", b:"Gelernte Muster von Ereignisabfolgen, die als „Situationsmodelle“ Enkodierung und Abruf lenken.\nBeispiel: Skript „Restaurantbesuch“: Platz nehmen, bestellen, essen, zahlen. Fehlt ein Schritt in einer Geschichte, wird er oft dazu erinnert."},
 {id:"c3-06", f:"Behaltensleistung: permastore", b:"Verlauf: Abfall in den ersten 2–3 Jahren, danach bleibt semantisches Gedächtnis relativ stabil\nAbruf: wirkt konservierend\nAber: ggf. wird das zuletzt Erinnerte erinnert, nicht das Original"},
 {id:"c3-07", f:"Abruf und retrieval cue", b:"Beim Abruf wird ein Gedächtnisinhalt nach einem Schlüsselreiz reproduziert, z. B. „agua“ nach dem Cue „water“."},
 {id:"c3-08", f:"Vier Faktoren des Abrufs (erste Folie)", b:"Aufmerksamkeitslenkung (unbeachteter Cue senkt den Erfolg)\nCue-Relevanz (Ähnlichkeit von Enkodierung und Abruf)\nassoziative Stärke von Cue und Target\nAnzahl der Cues (Kombinationen wirken besser)"},
 {id:"c3-09", f:"Drei weitere Faktoren des Abrufs", b:"Stärke der Gedächtnisspur\nAbrufstrategie (ähnlich der Enkodierungsstrategie)\nmentaler Modus (aktiviertes Schema lenkt auf relevante Cues)"},
 {id:"c3-10", f:"Drei Ursachen inzidentellen Vergessens", b:"Spurenzerfall (unklar, ob es ihn gibt)\nKontextfluktuation (Abruf-Cues gehen verloren)\nInterferenz (ähnliche Information stört den Abruf)"},
 {id:"c3-11", f:"Spurenzerfall im LZG", b:"Graduelles Abschwächen der Gedächtnisspur. Unklar, ob es existiert, weil es nicht zu untersuchen ist: Abruf führt zu Konsolidierung."},
 {id:"c3-12", f:"Kontextfluktuation", b:"Verlust von Abruf-Cues durch Veränderung des Kontextes. Bedingt Vergessen (Klausur 24/25: wahr).\nBeispiel: In den Ferien Gelerntes fällt im Klassenraum schwerer ein, weil die Abruf-Cues von damals fehlen."},
 {id:"c3-13", f:"Cue-Competition und Cue-Overload-Prinzip", b:"Cue-Competition: Ein Cue ist mit mehr als einer Spur verknüpft, die Inhalte blockieren sich.\nCue-Overload: Die Abrufleistung sinkt systematisch mit der Anzahl der Einheiten an einem Cue.\nBeispiel: Cue-Overload: Je mehr Vokabeln unter „Kapitel 3“ abgelegt sind, desto schlechter findest du eine einzelne."},
 {id:"c3-14", f:"Retroaktive Interferenz", b:"Neu erworbene Information stört den Abruf früher erworbener Inhalte.\nBeispiel: Nach dem Lernen der neuen Handynummer fällt dir die alte nicht mehr ein."},
 {id:"c3-15", f:"Proaktive Interferenz", b:"Früher erworbene Information stört den Abruf später erworbener Inhalte (Klausur 24/25: wahr).\nBeispiel: Die alte Handynummer drängt sich auf, wenn du die neue nennen willst."},
 {id:"c3-16", f:"Abrufinduziertes Vergessen", b:"Der Abruf bestimmter Teilinformationen behindert einen späteren Abruf anderer Informationsteile.\nBeispiel: Wer vor der Klausur nur einige Themen abfragt, erinnert verwandte, nicht geübte Themen danach schlechter."}
];

KURZ.push(
 {id:"k2-1", ch:2, pts:8,
  q:"Erläutern Sie, warum das Kurzzeitgedächtnis im modalen Modell zum Konzept des Arbeitsgedächtnisses weiterentwickelt wurde, und beschreiben Sie die Subsysteme des Arbeitsgedächtnisses nach Baddeley & Hitch (1974).",
  k:["KZG im modalen Modell: kleine Mengen kurz aktiv halten (ca. 20 s, 7 ± 2)","Schwäche 1: passiver Speicher, erklärt keine aktive Manipulation (Problemlösen)","Schwäche 2: unitärer Speicher, aber Dual-Task-Befunde: manche Aufgaben interferieren kaum","Phonologische Schleife (sprachlich) und räumlich-visueller Notizblock (visuell-räumlich), je Speicher + Rehearsal","Episodischer Puffer: multimodal, Binding","Zentrale Exekutive: überwacht, verteilt Ressourcen, lenkt Aufmerksamkeit"],
  m:"Im modalen Modell von Atkinson und Shiffrin hält das Kurzzeitgedächtnis kleine Informationsmengen für kurze Zeit aktiv, etwa 20 Sekunden und 7 ± 2 Einheiten. Zwei Annahmen erwiesen sich als zu eng: Ein passiver Speicher kann nicht erklären, wie Information beim Problemlösen aktiv manipuliert wird, und ein einheitlicher Speicher passt nicht zu Dual-Task-Befunden, nach denen bestimmte Aufgaben kaum interferieren. Baddeley und Hitch fassen das Arbeitsgedächtnis daher als aktives System mit mindestens vier Subsystemen: Die phonologische Schleife hält sprachbasierte, der räumlich-visuelle Notizblock visuell-räumliche Information aufrecht, beide mit Speicher und Rehearsal-Mechanismus. Der episodische Puffer verbindet als multimodaler Speicher Informationen zu komplexen Mustern. Die zentrale Exekutive überwacht die Verarbeitung, verteilt Ressourcen und lenkt die Aufmerksamkeit."},
 {id:"k3-1", ch:3, pts:8,
  q:"Ein Schüler lernt am Montag englische, am Dienstag französische Vokabeln für ähnliche Begriffe. Am Mittwoch fallen ihm im Englischtest viele Wörter nicht ein. Erklären Sie das Vergessen mit Interferenz und nennen Sie zwei weitere Ursachen inzidentellen Vergessens.",
  k:["Interferenz: ähnliche gespeicherte Information stört den Abruf","Retroaktive Interferenz: das neu gelernte Französisch stört den Abruf des früher gelernten Englisch","Cue-Competition/Cue-Overload: derselbe Cue (deutsches Wort) ist mit mehreren Spuren verknüpft","Kontextfluktuation: Abruf-Cues gehen durch veränderten Kontext verloren","Spurenzerfall: graduelles Abschwächen, Existenz im LZG unklar"],
  m:"Interferenz liegt vor, wenn ähnliche Information den Abruf stört. Hier wirkt das später gelernte Französisch zurück auf das früher gelernte Englisch: retroaktive Interferenz. Der deutsche Begriff als Abrufreiz ist nun mit zwei Gedächtnisspuren verknüpft; diese blockieren sich (Cue-Competition), und mit jeder weiteren Verknüpfung sinkt die Abrufleistung (Cue-Overload). Weitere Ursachen sind Kontextfluktuation, also der Verlust von Abrufreizen, weil sich der Kontext ändert, und Spurenzerfall, ein graduelles Abschwächen der Spur, dessen Existenz im Langzeitgedächtnis allerdings unklar ist, weil jeder Abruf zur Konsolidierung führt."}
);

LESSONS[10]=[
{id:"kk-1", t:"Was bei der klassischen Konditionierung passiert", html:`
<p><b>Klassische Konditionierung</b> ist ein Lernprozess, der dazu führt, dass</p>
<ul><li>ein ursprünglich <b>neutraler Reiz</b> (NS, später CS), der eine antizipatorische Reaktion nicht auslöst,</li>
<li>durch <b>Assoziation</b> mit einem Reiz, der diese Reaktion immer bzw. unbedingt auslöst (US),</li>
<li>ebenfalls eine antizipatorische Reaktion (CR) auslöst.</li></ul>
<table class="kvq"><tr><th>Kürzel</th><th>Bedeutung</th><th>Pawlows Hund</th></tr>
<tr><td><b>US</b></td><td>unkonditionierter Reiz (unconditioned stimulus)</td><td>Futter</td></tr>
<tr><td><b>UR</b></td><td>unkonditionierte, reflexartige Reaktion</td><td>Speichelfluss auf Futter</td></tr>
<tr><td><b>NS</b></td><td>neutraler Reiz</td><td>Ton vor dem Lernen</td></tr>
<tr><td><b>CS</b></td><td>konditionierter Reiz</td><td>Ton nach dem Lernen</td></tr>
<tr><td><b>CR</b></td><td>konditionierte Reaktion</td><td>Speichelfluss auf den Ton</td></tr></table>
<p><b>Schema des Erwerbs</b> (Akquisition):</p>
<table class="kvq"><tr><th>vorher</th><td>NS (Ton) → keine Reaktion · US (Futter) → UR (Speichelfluss)</td></tr>
<tr><th>Lernen</th><td>NS (Ton) + US (Futter) → UR (Speichelfluss), mehrfach</td></tr>
<tr><th>nachher</th><td>CS (Ton) → CR (Speichelfluss)</td></tr></table>
<p><b>Zwei Typen:</b></p>
<table class="kvq"><tr><th>Fall</th><th>Typ</th><th>US</th><th>UR</th><th>NS/CS</th><th>CR</th></tr>
<tr><td>Pawlows Hunde</td><td><b>appetitiv</b></td><td>Futter</td><td>Speichelfluss</td><td>Metronom</td><td>Speichelfluss</td></tr>
<tr><td>„Little Albert“</td><td><b>aversiv</b></td><td>lauter Ton</td><td>Schreckreaktion</td><td>Ratte</td><td>Angstreaktion</td></tr></table>
<p>„Little Albert“ (<b>Watson & Rayner</b>) ist das Beispiel für <b>Furchtkonditionierung</b> („Conditioned Emotional Response“, CER).</p>
<div class="merk"><b>Merksatz</b>Gelernt wird eine Verknüpfung zweier Reize (S1 → S2). Das eigene Verhalten spielt keine Rolle, anders als bei der operanten Konditionierung.</div>`,
check:[
 {q:"Bei „Little Albert“: Was ist die Ratte nach dem Lernen?", o:["Unkonditionierter Reiz (US)","Konditionierter Reiz (CS)","Unkonditionierte Reaktion (UR)","Konditionierte Reaktion (CR)"], a:1, ex:"Die Ratte war vorher neutral. Durch die Kopplung mit dem lauten Ton löst sie jetzt Angst aus, sie ist also der CS.", w:["Der US ist der laute Ton, der die Schreckreaktion von sich aus auslöst.",null,"Eine Reaktion ist ein Verhalten des Kindes, kein Reiz.","Die CR ist die Angstreaktion auf die Ratte, nicht die Ratte selbst."]},
 {q:"Was unterscheidet die Konditionierung bei Pawlows Hunden von der bei „Little Albert“?", o:["Bei Pawlow wird ein Verhalten belohnt","Pawlow ist appetitiv, Albert aversiv","Bei Albert wird ein neutraler Reiz mit einem CS gekoppelt","Bei Albert ist die CR angeboren, bei Pawlow gelernt"], a:1, ex:"Futter ist ein angenehmer, ein lauter Ton ein unangenehmer US. Albert ist das Beispiel für Furchtkonditionierung.", w:["Belohnung eines Verhaltens wäre operante Konditionierung.",null,"Das wäre Konditionierung zweiter Ordnung. Bei Albert ist der laute Knall ein US.","In beiden Fällen ist die CR gelernt; angeboren ist nur die UR."]}
]},
{id:"kk-2", t:"Unterdrückung, Löschung und Spontanerholung", html:`
<p>Klassische Konditionierung bezieht sich nicht nur auf das Verstärken, sondern auch auf das <b>Unterdrücken</b> von Verhalten. Beispiel auf der Folie: Ein Ton (NS) kündigt einen Schock (US) an, der Erstarren (Freezing) auslöst. Danach löst der Ton allein Freezing aus.</p>
<p>Standard ist eine <b>zeitlich verzögerte</b> Darbietung des US: Der CS kommt zuerst und ist damit <b>prädiktiv</b>, er kündigt den US an.</p>
<p><b>Löschung?</b> Etablierte konditionierte Reaktionen sind <b>sehr stabil</b>. Trotzdem gibt es eine gewisse Dynamik:</p>
<ul><li><b>Extinktion</b> (Löschung): die vollständige oder teilweise Abschwächung einer CR durch wiederholte Darbietung des CS (Glocke) <b>ohne</b> den US (Futter).</li>
<li><b>Spontanerholung</b>: das Wiederaufflackern einer gelöschten CR auf den CS nach einer Ruhephase.</li></ul>
<div class="merk"><b>Schulbezug</b>Angst vor einem Fach lässt sich abschwächen, wenn das Fach immer wieder ohne die unangenehme Erfahrung erlebt wird. Nach den Ferien kann sie aber kurz wieder aufflackern (Spontanerholung).</div>`,
check:[
 {q:"Wie wird eine konditionierte Reaktion gelöscht? Indem man …", o:["den US häufiger allein darbietet","den CS wiederholt ohne den US darbietet","den CS mit einem neuen neutralen Reiz koppelt","den CS und den US gleichzeitig darbietet"], a:1, ex:"Extinktion: CS (Glocke) immer wieder ohne US (Futter). Die CR schwächt sich ab.", w:["Der US allein ändert nichts an der Verknüpfung des CS.",null,"Das ist Konditionierung zweiter Ordnung, keine Löschung.","Gemeinsame Darbietung hält die Assoziation aufrecht; Löschung heißt CS ohne US."]},
 {q:"Warum ist eine verzögerte Darbietung des US der Standard?", o:["Weil der CS dadurch den US vorhersagt","Weil der US sonst zu stark wirkt","Weil so die Löschung schneller geht","Weil der US so seltener gebraucht wird und Löschung ausbleibt"], a:0, ex:"Der CS kommt zuerst und wird so zum Signal, er ist prädiktiv.", w:[null,"Die Stärke des US hängt nicht an der Reihenfolge.","Löschung hat mit der Reihenfolge beim Erwerb nichts zu tun.","Die Verzögerung macht den CS prädiktiv; mit Löschung hat das nichts zu tun."]}
]},
{id:"kk-3", t:"Generalisierung, Diskrimination und Stärke", html:`
<p><b>Generalisierung:</b> Die CR folgt nicht nur auf den CS, sondern auch auf <b>ähnliche</b> Reize. Je ähnlicher der Reiz dem CS, desto stärker die CR: <b>Generalisierungsgradient</b>. Beispiel auf der Folie: Konditioniert auf einen Ton von 1000 Hz, reagiert das Tier auch auf 900 oder 1100 Hz, schwächer auf 700 oder 1300 Hz.</p>
<p><b>Diskriminierungstraining:</b> Ziel ist, die CR zu fokussieren. Grundlage ist die <b>konditionierte Inhibition</b>: Ein zweiter Reiz (CS2, z. B. 900 Hz) sagt vorher, dass der US <i>ausbleibt</i>.</p>
<p>Laut <b>Pawlow</b> bestimmen vor allem drei Parameter die Stärke der Konditionierung:</p>
<ol><li><b>Kontiguität</b>, also zeitliche Nähe der Reize, ist besonders bedeutsam.</li>
<li>Die Intensität der CR hängt stark von der <b>Intensität des US</b> ab.</li>
<li>Die <b>Häufigkeit</b> des gemeinsamen Auftretens ist zentral. Ausnahme: <b>erlernte Geschmacksaversion</b> (dort reicht ein Mal).</li></ol>
<p><b>Rescorla</b> ergänzte die <b>Kontingenz</b>: die Wahrscheinlichkeit des US bei Anwesenheit des CS im Verhältnis zu seiner Wahrscheinlichkeit ohne CS. Die Frage ist also: Ist der CS ein <b>zuverlässiger Prädiktor</b>?</p>`,
check:[
 {q:"Ein Hund ist auf einen Ton von 1000 Hz konditioniert. Auf welchen Ton speichelt er am stärksten, abgesehen von 1000 Hz?", o:["700 Hz","900 Hz","1300 Hz","Auf alle gleich stark"], a:1, ex:"Generalisierungsgradient: Je ähnlicher der Reiz dem CS, desto stärker die CR. 900 Hz liegt am nächsten an 1000 Hz.", w:["700 Hz ist weiter vom CS entfernt, die Reaktion ist schwächer.",null,"1300 Hz ist weiter vom CS entfernt als 900 Hz.","Gerade nicht: Die Stärke hängt von der Ähnlichkeit ab."]},

{id:"kk-4", t:"Konditionierung zweiter Ordnung und Matheangst", html:`
<p><b>Konditionierung zweiter Ordnung:</b> Durch die Verknüpfung mit einem CS erwirbt ein bisher neutraler <b>dritter Reiz</b> die Kraft eines (abgeschwächten) CS. Das ist <b>Lernen ohne US</b>.</p>
<table class="kvq"><tr><th>vorher</th><td>NS (Ton) → keine Reaktion · US (Futter) → UR (Speichelfluss)</td></tr>
<tr><th>danach</th><td>CS (Ton) → CR (Speichelfluss)</td></tr>
<tr><th>zweite Ordnung</th><td>Licht wird mit dem Ton gekoppelt, ganz ohne Futter. Danach: CS (Licht) → CR (Speichelfluss)</td></tr></table>
<p><b>Warum relevant für uns?</b> So erklärt Heine z. B. <b>Matheangst</b>:</p>
<table class="kvq"><tr><th>Schritt 1</th><td>NS (Lehrer) + US (Tadel) → UR (Angstreaktion). Danach: CS (Lehrer) → CR (Angstreaktion)</td></tr>
<tr><th>Schritt 2</th><td>NS („Zahlen“) + CS (Lehrer) → CR (Angstreaktion). Danach: CS („Zahlen“) → CR (Angstreaktion)</td></tr></table>
<div class="merk"><b>Merksatz</b>Die Zahlen selbst wurden nie getadelt. Sie lösen Angst aus, weil sie mit dem Lehrer gekoppelt waren, der seinerseits mit Tadel gekoppelt war. Genauso lassen sich Prüfungs- und Schulangst erklären.</div>`,
check:[
 {q:"Was ist das Besondere an der Konditionierung zweiter Ordnung?", o:["Sie braucht einen besonders starken und häufigen US","Ein neuer Reiz wird nur mit einem CS gekoppelt","Ein neuer Reiz wird erneut mit dem US gekoppelt","Der neue Reiz löst danach eine stärkere CR aus als der erste CS"], a:1, ex:"Lernen ohne US: Der dritte Reiz bekommt die Kraft eines (abgeschwächten) CS.", w:["Bei der zweiten Ordnung ist gar kein US beteiligt.",null,"Gerade ohne US: Der neue Reiz wird nur mit dem CS gekoppelt.","Er erwirbt die Kapazität eines abgeschwächten CS."]},
 {q:"Im Matheangst-Beispiel: Was ist der „Lehrer“ in Schritt 2?", o:["Der unkonditionierte Reiz (US)","Ein CS, der wie ein US wirkt","Die unkonditionierte Reaktion (UR)","Ein neutraler Reiz (NS)"], a:1, ex:"Der Lehrer ist nach Schritt 1 ein CS. In Schritt 2 übernimmt er die Rolle des US, damit „Zahlen“ zum CS werden.", w:["Der US war in Schritt 1 der Tadel, nicht der Lehrer.",null,"UR und CR sind die Angstreaktion, also kein Reiz.","Neutral war der Lehrer nur vor Schritt 1."]}
]}
];

CARDS[10]=[
 {id:"ckk-01", f:"Klassische Konditionierung (Definition)", b:"Vorher: ein neutraler Reiz (NS) löst die antizipatorische Reaktion nicht aus\nKopplung: mit einem Reiz, der sie unbedingt auslöst (US)\nNachher: der frühere NS ist ein CS und löst die Reaktion aus (CR)"},
 {id:"ckk-02", f:"US, UR, NS, CS, CR", b:"US: unkonditionierter Reiz\nUR: unkonditionierte, reflexartige Reaktion\nNS: neutraler Reiz\nCS: konditionierter Reiz\nCR: konditionierte Reaktion"},
 {id:"ckk-03", f:"Schema des Erwerbs (Pawlow)", b:"Vorher: Ton (NS) → keine Reaktion; Futter (US) → Speichelfluss (UR)\nLernen: Ton + Futter → Speichelfluss\nNachher: Ton (CS) → Speichelfluss (CR)"},
 {id:"ckk-04", f:"Appetitive vs. aversive Konditionierung", b:"Appetitiv: Pawlows Hunde, US Futter, UR/CR Speichelfluss, CS Metronom.\nAversiv: „Little Albert“, US lauter Ton, UR Schreckreaktion, CS Ratte, CR Angstreaktion."},
 {id:"ckk-05", f:"„Little Albert“ (Watson & Rayner)", b:"Beispiel für Furchtkonditionierung bzw. „Conditioned Emotional Response“ (CER): Eine Ratte (NS) wird mit einem lauten Ton (US) gekoppelt und löst danach Angst aus (CR)."},
 {id:"ckk-06", f:"Klassische Konditionierung: nur Verstärkung von Verhalten?", b:"Nein, auch Unterdrückung: Ton (CS) kündigt Schock (US) an und löst danach Freezing aus.\nStandard: zeitlich verzögerte Darbietung des US, der CS ist prädiktiv."},
 {id:"ckk-07", f:"Extinktion (klassische Konditionierung)", b:"Wie: CS (Glocke) wiederholt ohne US (Futter) darbieten\nFolge: CR schwächt sich ganz oder teilweise ab\nAber: etablierte CRs sind sehr stabil\nBeispiel: Der Lehrer (CS) tadelt nicht mehr, die Angst vor ihm lässt allmählich nach."},
 {id:"ckk-08", f:"Spontanerholung (klassische Konditionierung)", b:"Das Wiederaufflackern einer gelöschten CR auf den CS nach einer Ruhephase.\nBeispiel: Nach den Sommerferien ist die schon gelöschte Angst vor dem Lehrer kurz wieder da."},
 {id:"ckk-09", f:"Generalisierung und Generalisierungsgradient", b:"Generalisierung: die CR folgt auch auf Reize, die dem CS ähneln\nGradient: je ähnlicher dem CS, desto stärker die CR\nBeispiel: CS 1000 Hz, schwächere CR auf 900 oder 1100 Hz."},
 {id:"ckk-10", f:"Diskriminierungstraining", b:"Ziel: die CR auf den CS fokussieren. Basis: konditionierte Inhibition, d. h. ein CS2 sagt das Ausbleiben des US vorher."},
 {id:"ckk-11", f:"Drei Parameter der Konditionierungsstärke nach Pawlow", b:"Kontiguität (zeitliche Nähe der Reize, vor allem)\nIntensität des US (bestimmt Intensität der CR)\nHäufigkeit des gemeinsamen Auftretens (Ausnahme: erlernte Geschmacksaversion)"},
 {id:"ckk-12", f:"Kontingenz nach Rescorla", b:"Wahrscheinlichkeit des US bei Anwesenheit des CS im Verhältnis zur Wahrscheinlichkeit des US ohne CS. Frage: Ist der CS ein zuverlässiger Prädiktor?\nBeispiel: Kommt der Schock ohne Ton genauso oft wie mit Ton, sagt der Ton nichts vorher, es wird kaum gelernt."},
 {id:"ckk-13", f:"Konditionierung zweiter Ordnung", b:"Was: ein neutraler dritter Reiz wird mit einem CS gekoppelt und wird selbst zum (abgeschwächten) CS\nBesonders: Lernen ohne US\nBeispiel: Licht wird mit dem Ton gekoppelt."},
 {id:"ckk-14", f:"Matheangst als klassische Konditionierung", b:"Schritt 1: Lehrer (NS) + Tadel (US) → Angst (UR); danach Lehrer (CS) → Angst (CR).\nSchritt 2: „Zahlen“ (NS) + Lehrer (CS) → Angst; danach „Zahlen“ (CS) → Angst (CR). Konditionierung zweiter Ordnung."}
];

  q:"Erklären Sie mit Hilfe der klassischen Konditionierung, wie bei einem Schüler Matheangst entstehen kann, obwohl ihm Zahlen selbst nie etwas getan haben. Verwenden Sie die Fachbegriffe und gehen Sie auf die Konditionierung zweiter Ordnung ein.",
  k:["Schritt 1: Lehrer (NS) wird mit Tadel (US) gekoppelt, Tadel löst Angst (UR) aus","Danach ist der Lehrer ein CS und löst Angst (CR) aus","Schritt 2: „Zahlen“ (NS) werden mit dem Lehrer (CS) gekoppelt, ohne Tadel","Danach lösen „Zahlen“ als CS Angst (CR) aus","Das ist Konditionierung zweiter Ordnung: Lernen ohne US, der neue CS ist meist abgeschwächt","Generalisierung möglich, z. B. auf ähnliche Situationen (Prüfungen, Schule)"],
  m:"Zunächst ist der Lehrer ein neutraler Reiz. Er tritt wiederholt zusammen mit Tadel auf, einem unkonditionierten Reiz, der von sich aus eine Angstreaktion auslöst. Durch diese Kopplung wird der Lehrer zum konditionierten Reiz und löst selbst eine konditionierte Angstreaktion aus. In einem zweiten Schritt werden die Zahlen, bisher neutral, mit dem Lehrer gekoppelt, ohne dass noch getadelt wird. Nun lösen auch die Zahlen als konditionierter Reiz Angst aus. Das ist Konditionierung zweiter Ordnung: Ein neutraler Reiz erwirbt die Kraft eines meist abgeschwächten konditionierten Reizes allein über die Verknüpfung mit einem anderen konditionierten Reiz, also ohne US. Über Generalisierung kann sich die Angst auf ähnliche Reize wie Prüfungssituationen ausweiten."}
);

 /* Kapitel 11: Operante Konditionierung */

 {id:"x12-05", ch:12, stem:"In Bezug auf Modelle und Abgrenzungen gilt:", s:[

  ["Die Selbstwirksamkeitserwartung ist die eigene Beurteilung, ein Ergebnis erreichen zu können.", true, "So auf der Folie."],

 {id:"x2-05", ch:2, stem:"Für Kurzzeit- und Arbeitsgedächtnis gilt:", s:[

  ["Die Kapazität des KZG beträgt bei Ungeübten etwa 7 ± 2 Sekunden.", false, "7 ± 2 <b>Informationseinheiten</b> (Miller, 1956); die Dauer liegt ohne Rehearsal bei etwa 20 Sekunden."],
  ["Durch Elaboration, also Enkodierung in ein bestimmtes Format, kann Information aus dem KZG ins LZG übergehen.", true, "Etwa visuell oder semantisch (Folie Sitzung 5)."]]},
 {id:"x2-06", ch:2, stem:"Für das prozedurale Gedächtnis gilt:", s:[

  ["Prozedurale Inhalte treten zwangsläufig ins Bewusstsein und lassen sich daher berichten.", false, "Prozedural ist <b>implizit</b>: wirkt auf Verhalten, ohne zwangsläufig bewusst zu werden."]]},

  ["In den klassischen Schlafstudien dienen Wortpaare als prozedurale und Spiegelzeichnen als deklarative Lernaufgabe.", false, "Vertauscht: Wortpaare deklarativ, Mirror-Tracing (Spiegelzeichnen) prozedural."],

LESSONS[6]=[
{id:"6-1", t:"Exekutive Funktionen: Was sie sind", html:`
<p>Heine beginnt mit einem Fall: <b>Phineas Gage</b> (1823–1869). Nach einer Kopfverletzung, bei der eine Eisenstange sein Stirnhirn durchschlug, veränderte sich sein Verhalten tiefgreifend. Heute heißt das Bild <b>Frontalhirnsyndrom</b>, im ICD-10 <b>F07.2: dysexekutives Syndrom</b> (nach Schädelhirntrauma). Kennzeichen:</p>
<ul><li><b>Impulsivität</b>, also mangelnde inhibitorische Kontrolle,</li>
<li>mangelnde kognitive <b>Flexibilität</b>, also ein Hang zur <b>Perseveration</b> (Festhalten an einer Reaktion),</li>
<li>eingeschränkte <b>Planungsfähigkeit</b>,</li>
<li>mangelnde <b>Überwachung</b> der Zielerreichung,</li>
<li>verminderte Fähigkeit zur <b>Parallelverarbeitung</b>, also Fehleranfälligkeit beim Dual-Tasking,</li>
<li>Unfähigkeit, <b>Regeln</b> zu beachten (kognitiv, emotional und sozial).</li></ul>
<p>Was hier ausfällt, sind die <b>exekutiven Funktionen</b>: ein Set kognitiver Prozesse, die <b>andere kognitive Prozesse</b> (z. B. Wahrnehmung, Gedächtnis) kontrollieren bzw. deren Zusammenspiel optimieren, um <b>zielgerichtetes Verhalten</b> zu ermöglichen. Deshalb heißen sie auch <b>metakognitive</b> Funktionen.</p>
<p>Der Begriff ist ein konzeptuelles <b>„Sammelbecken“</b>: Handlungsplanung, Problemlösen, Aufmerksamkeitssteuerung, Inhibition, mentale Flexibilität, Multi-Tasking, Monitoring-Prozesse und mehr.</p>
<div class="merk"><b>Merksatz</b>Exekutive Funktionen arbeiten nicht selbst an der Aufgabe, sie steuern die Prozesse, die daran arbeiten. „Meta“ heißt: über der Kognition.</div>
<p class="small muted">Folien 14–15 (Sitzung 6)</p>`,
check:[

]},
{id:"6-2", t:"Zentrale Exekutive und „Unity and Diversity“", html:`
<p>Ein erstes explizites Modell exekutiver Kontrolle ist die <b>zentrale Exekutive</b> im Arbeitsgedächtnismodell von <b>Baddeley & Hitch (1974)</b> (siehe Kapitel 2). Sie ist ein <b>unitäres</b> System, das den untergeordneten Systemen Verarbeitungsressourcen zuordnet, vor allem für</p>
<ul><li>Fokussierung und Teilung von Aufmerksamkeit,</li><li>die Verbindung zum Langzeitgedächtnis.</li></ul>
<p><b>Baddeley (1996)</b> nennt vier konkrete Aufgaben der zentralen Exekutive:</p>
<ol><li>Koordination unter <b>Dual-Task</b>-Bedingungen,</li><li>flexibles <b>Wechseln</b> zwischen Strategien,</li><li><b>Aufmerksamkeitsfokussierung</b> und Inhibition,</li><li>selektive Aktivierung, Aufrechterhaltung und Manipulation von Information aus dem <b>LZG</b>.</li></ol>
<p><b>Moderne Sicht: „Unity and Diversity“</b> nach <b>Miyake & Friedman</b> (Miyake et al., 2000). Ausgangspunkt: Man muss die Leistung bei <b>komplexen</b> Aufgaben, die exekutive Kontrolle fordern, von der Leistung bei Aufgaben unterscheiden, die nur auf <b>einzelne Aspekte</b> laden. Komplexe Aufgaben erfordern das Zusammenspiel unterscheidbarer Aspekte.</p>
<table class="kvq"><tr><th>Diversity</th><td>Mit <b>clusteranalytischen</b> Verfahren lassen sich drei zentrale Aspekte trennen:<br><b>Updating</b>: Überwachung und Aktualisierung von Arbeitsgedächtnisrepräsentationen<br><b>Inhibition</b>: Unterdrückung jeweils aktuell vorherrschender (kognitiver und motorischer) Antworttendenzen<br><b>Switching/Shifting</b>: kognitive Flexibilität, zwischen Strategien und mentalen Zuständen zu wechseln</td></tr>
<tr><th>Unity</th><td>Die drei Aspekte sind eindeutig zu trennen, aber <b>moderat miteinander korreliert</b>. Vermutung: <b>Inhibitorische</b> Prozesse liegen allen drei Teilfunktionen zugrunde.</td></tr></table>
<div class="merk"><b>Aus dem Fragenkatalog (Nr. 49)</b>Steuerung unter Aufwendung von Aufmerksamkeitsressourcen ist erforderlich beim Umgang mit unbekannten oder unerwarteten Situationen, bei kognitiven Konflikten und für die Unterdrückung präpotenter (vorherrschender) Antwortmuster.</div>
<p class="small muted">Folien 16–20 (Sitzung 6), dazu Folie 12 (zentrale Exekutive, SAS)</p>`,

{id:"6-3", t:"Wie man exekutive Prozesse misst", html:`
<p><b>Klassische komplexe Maße</b>, z. B. der <b>Wisconsin Card Sorting-Test</b> (WCST; Monchi et al., 2001). Er fordert mehrere Aspekte zugleich:</p>
<ul><li>Updating eines Situationsmodells,</li><li>Wechseln der Strategie,</li><li>Unterdrücken alter Antworttendenzen.</li></ul>
<p>Gemessen wird die <b>Perseveration</b>: Wie oft sortiert jemand nach der alten Regel weiter, obwohl sie nicht mehr gilt?</p>
<p><b>Experimentelle Paradigmen</b>, die auf <b>einzelne</b> Aspekte laden:</p>
<table class="kvq"><tr><th>Aspekt</th><th>Paradigma</th></tr>
<tr><td>Updating</td><td><b>n-back</b>-Aufgabe</td></tr>
<tr><td>Inhibition</td><td><b>stop-signal</b>-Aufgabe</td></tr>
<tr><td>Switching</td><td><b>global-local</b>-Aufgabe</td></tr></table>
<div class="ergbox"><p><span class="erg">Ergänzung</span> <b>So laufen die Aufgaben ab</b> (gedeutet aus den Bildern auf Folie 21–22):</p>
<ul><li><b>WCST:</b> Karten mit Symbolen werden nach einer unbekannten Regel (Farbe, Form oder Anzahl) zugeordnet. Die Rückmeldung zeigt, ob es stimmt. Ohne Ankündigung wechselt die Regel.</li>
<li><b>n-back:</b> Eine Folge von Buchstaben läuft durch. Man meldet, ob der aktuelle Buchstabe derselbe ist wie der vor n Schritten (1-back, 2-back …). Der Inhalt des Arbeitsgedächtnisses muss ständig aktualisiert werden.</li>
<li><b>stop-signal:</b> Auf einen Pfeil („GO“) schnell reagieren, aber die schon gestartete Reaktion abbrechen, wenn ein Stoppsignal erscheint.</li>
<li><b>global-local:</b> Eine große Figur besteht aus kleinen Figuren. Mal ist die große (global), mal die kleine Form (lokal) zu benennen; bei inkonsistenten Figuren muss man zwischen den Ebenen umschalten.</li></ul></div>
<p class="small muted">Folien 21–22 (Sitzung 6)</p>`,

{id:"6-4", t:"Entwicklung und Förderung", html:`
<p>Exekutive Funktionen gehören zu den <b>am spätesten reifenden</b> kognitiven Funktionen. Die Basis ist die späte Reifung des <b>präfrontalen Kortex</b> (PFC): Er erreicht in der Ontogenese als <b>letzte Hirnregion</b> die volle Reife, vor allem wegen der späten <b>Myelinisierung</b>, die erst in der <b>Adoleszenz</b> abgeschlossen ist.</p>
<p>Die Entwicklung ist <b>inhomogen</b>:</p>
<table class="kvq"><tr><th>Aspekt</th><th>Verlauf</th></tr>
<tr><td><b>Inhibition</b></td><td>gilt als Basis höherer exekutiver Funktionen; entwickelt sich <b>relativ früh</b>: Spurt im Vorschulalter, Reife mit <b>11–12 Jahren</b></td></tr>
<tr><td><b>Shifting und Updating</b></td><td>entwickeln sich länger, erwachsene Funktion etwa mit <b>15 Jahren</b></td></tr>
<tr><td><b>Komplexe Funktionen</b> (Planning, Sequencing, Dual-Tasking)</td><td>folgen <b>noch später</b></td></tr></table>
<p><b>Förderung: eine problematische Situation.</b> Es gibt keinen Mangel an Trainings, aber einen massiven Mangel an <b>sauber evaluierten</b> Zugängen, vor allem beim <b>Transfer</b> (Nahtransfer? Ferntransfer?). Umschriebene und kurzfristige Trainings (PC-basiert, aerober Sport) bringen ernüchternde Ergebnisse. Was funktioniert, sind <b>lebenspraktische und langfristige</b> Zugänge:</p>
<ul><li>Rollenspiele</li><li>Achtsamkeitstraining und Yoga</li><li>zweisprachige Erziehung</li><li>regelbasiertes Spiel</li><li>Gruppensport</li><li>Montessori-Curriculum</li></ul>
<p><b>EF-Intervention, nur komplex:</b> Laut <b>Diamond & Lee (2011)</b> lassen sich exekutive Funktionen schon mit 4–5 Jahren verbessern, durch <b>reguläre Lehrkräfte</b> in regulären Klassen ohne teure Ausstattung. Beispiel: <b>Tools of the Mind</b>.</p>
<ul><li>Hintergrund: <b>Vygotskys</b> Annahme, dass „<b>als-ob-Spiel</b>“ metakognitive Steuerung befördert,</li>
<li><b>40</b> EF-relevante Aktivitäten (z. B. Verbalisierung, Peer-„Scaffolding“, Einbettung in den Alltag),</li>
<li>Start im Vorschulalter (5;1 Jahre), Dauer 1 oder 2 Jahre,</li>
<li>richtungsweisendes Ergebnis aus <b>Diamond et al. (2007)</b>.</li></ul>
<div class="ergbox"><p><span class="erg">Ergänzung</span> Das Säulendiagramm auf Folie 26 vergleicht vermutlich Kinder aus Tools of the Mind mit einer Vergleichsgruppe in EF-Aufgaben: Die Tools-Kinder schneiden besser ab, besonders bei den Aufgaben mit den höchsten Anforderungen an exekutive Kontrolle. Die Kurven auf Folie 24 zeigen, dass die Leistung in Inhibition früh flach wird, Planen und Wortflüssigkeit dagegen bis ins Jugendalter steigen.</p></div>
<p class="small muted">Folien 23–26 (Sitzung 6)</p>`,

{id:"6-5", t:"Selbststeuerung: Marshmallow und Entwicklung", html:`
<p>Richtungsweisend sind <b>Walter Mischels</b> Studien der 1970er Jahre, das <b>Marshmallow-Experiment</b>. Gemessen wird der <b>Gratifikationsaufschub</b> als Maß für Selbststeuerung: die (meist kindliche) Kapazität, <b>kurzfristige</b> Bedürfnisbefriedigung zugunsten <b>langfristiger</b> Zielerreichung aufzuschieben. Mehr oder weniger erfolgreiche Selbststeuerung und die Strategien dahinter sind dabei unmittelbar erkennbar.</p>
<p><span class="lit">Lehrbuch</span> Im klassischen Aufbau bekommt ein Kind eine Süßigkeit sofort oder die doppelte Menge, wenn es allein im Raum wartet. Kindergartenkindern fällt das sehr schwer; leichter wird es, wenn sie an etwas Schönes denken. Ältere Kinder berichten selbst Ablenkungsstrategien (Kap. 15, S. 302 f.).</p>
<p><b>Warum ist Selbststeuerung entwicklungspsychologisch bedeutsam?</b></p>
<ul><li><b>Querschnittlich:</b> Die Steuerung eigener kognitiver, affektiver und behavioraler/motorischer Tendenzen sagt zu jedem Zeitpunkt psychologisches <b>Well-Being</b> vorher.</li>
<li><b>Längsschnittlich:</b> Die Kapazität ist ein <b>früher Prädiktor</b> vieler Entwicklungsoutcomes, von akademischer Leistung über Zufriedenheit in Partnerschaften bis Substanzmissbrauch.</li></ul>
<p><b>Selbststeuerung im Kindesalter:</b> Es gibt eine solide empirische Basis für <b>massive Unterschiede</b>:</p>
<ul><li>interindividuell (Korrelation mit dem <b>IQ</b>),</li><li>innerindividuell,</li><li>interkulturell,</li>
<li>entwicklungsbezogen: erste Ansätze schon mit etwa <b>einem Jahr</b> (basale Affektkontrolle), Hauptphase der Reifung zwischen dem <b>3. und 6. Lebensjahr</b>.</li></ul>
<p>Daraus folgt die Bedeutung früher <b>Ko-Regulation</b> durch erwachsene Bezugspersonen und kompetente Peers.</p>
<div class="ergbox"><p><span class="erg">Ergänzung</span> <b>Folie 33 „Selbststeuerung ist umfassend!“ (Diamond, 2014)</b>: Kern sind drei Funktionen, <b>Arbeitsgedächtnis</b>, <b>inhibitorische Kontrolle</b> (Interferenzkontrolle: selektive Aufmerksamkeit und kognitive Inhibition; Reaktionshemmung: Selbstkontrolle) und daraus <b>kognitive Flexibilität</b>. Auf ihnen bauen die höheren exekutiven Funktionen auf: Schlussfolgern, Problemlösen, Planen. Arbeitsgedächtnis und Inhibition stützen sich gegenseitig: Wer sein Ziel im Kopf hält, weiß, was zu hemmen ist; wer Ablenkung hemmt, hält den Inhalt im Kopf. Selbstregulation überlappt mit der inhibitorischen Kontrolle. Die Grafik zeigt also, dass Selbststeuerung auf denselben Bausteinen ruht wie die exekutiven Funktionen.</p></div>
<p class="small muted">Folien 30–33 (Sitzung 6), Lehrbuch Kap. 15</p>`,

{id:"6-6", t:"Selbstregulation und Selbstkontrolle", html:`
<p><b>Fröhlich & Kuhl (2003)</b> teilen den allgemeinen Begriff der <b>Selbststeuerung</b> in zwei Komponenten:</p>
<table class="kvq"><tr><th>Selbstregulation</th><td>das <b>Bilden und Aufrechterhalten selbstkongruenter Ziele</b></td></tr>
<tr><th>Selbstkontrolle</th><td>die durch <b>explizite Absichten</b> vermittelte Zielverfolgung</td></tr></table>
<p><b>Selbstregulation</b> ist eine mentale Funktion, die die bewusste <b>oder unbewusste</b> Lenkung eigener kognitiver, affektiver, motivationaler, behavioraler und motorischer Aktionen und Reaktionen im Sinne übergeordneter, willentlich angestrebter kurz-, mittel- und langfristiger Zielzustände ermöglicht. Im Fokus steht die <b>Handlungssteuerung</b>: neben der eigentlichen Verhaltensregulation die begleitende Regulation von Kognitionen, von Emotionen und Motivation sowie des Kontexts. Damit verbunden sind die Fähigkeiten,</p>
<ul><li>sich Ziele zu setzen,</li><li>Handlungsoptionen auszuwählen und umzusetzen,</li><li>die Handlung zu überwachen,</li><li>Soll- und Ist-Zustand im Handlungsvollzug abzugleichen,</li><li>das System mit dem erforderlichen Handlungsimpetus (Energie) auszustatten.</li></ul>
<p><b>Selbstkontrolle</b> wird relevant, wenn man sich in realen Entscheidungssituationen zwischen <b>zielkongruenten</b> und (attraktiven!) <b>zielinkongruenten</b> Alternativen entscheiden muss. In solchen <b>Konfliktsituationen</b> gilt es,</p>
<ul><li>eingeschliffene Reaktionstendenzen zu <b>unterdrücken</b> bzw. reizvolle Wahlmöglichkeiten zugunsten übergeordneter Ziele zu ignorieren,</li>
<li>Alternativen (Reaktionen, Wahl) im Arbeitsgedächtnis zu <b>aktualisieren</b>,</li>
<li>alternative Handlungspfade zu <b>initiieren</b>.</li></ul>
<p><span class="erg">Ergänzung</span> Heine fragt dazu: „Woran erinnert Sie das?“ Gemeint sind vermutlich die drei Aspekte exekutiver Kontrolle: Unterdrücken = <b>Inhibition</b>, im AG aktualisieren = <b>Updating</b>, neue Pfade einschlagen = <b>Shifting</b>. Exekutive Funktionen sind die funktionalen Bausteine der Selbststeuerung (Titel von Input 2).</p>
<div class="merk"><b>Das heißt</b>Selbststeuerung umfasst Selbstregulation und Selbstkontrolle. Selbstregulation richtet uns allgemein nach eigenen Zielen aus. Willentliche Selbstkontrolle wird bei zu lösenden <b>Zielkonflikten</b> wirksam (siehe Gratifikationsaufschub). Kontrolliert werden dann, aufwändig, einerseits psychische Prozesse und Zustände (Kognition, Emotion, Motivation), andererseits die Umsetzungsebene, das Verhalten.</div>
<p class="small muted">Folien 34–38 (Sitzung 6)</p>`,

{id:"6-7", t:"Modelle selbstregulierten Lernens", html:`
<p><b>Bereiche der Selbstregulation beim Lernen</b> nach <b>Pintrich (2000)</b> (Quelle der Folie: Wild & Möller, 2009). Vier <b>Phasen</b> × vier <b>Bereiche</b>:</p>
<table class="kvq"><tr><th>1 Voraussicht, Planung, Aktivierung</th><td><b>Kognition:</b> Ziele setzen, Wissen und metakognitives Wissen aktivieren<br><b>Motivation/Affekt:</b> Zielorientierung, Selbstwirksamkeitseinschätzung, wahrgenommene Schwierigkeit, Aufgabenwert und Interesse<br><b>Verhalten:</b> Zeit und Anstrengung planen, Selbstbeobachtung planen<br><b>Kontext:</b> Aufgabe und Kontext wahrnehmen</td></tr>
<tr><th>2 Monitoring</th><td><b>Kognition:</b> metakognitive Bewusstheit, Monitoring der Kognitionen<br><b>Motivation/Affekt:</b> Monitoring von Motivation und Affekt<br><b>Verhalten:</b> Anstrengung, Zeit- und Hilfebedarf überwachen, Selbstbeobachtung<br><b>Kontext:</b> sich ändernde Aufgaben und Kontext überwachen</td></tr>
<tr><th>3 Kontrolle</th><td><b>Kognition:</b> kognitive Strategien auswählen und anpassen<br><b>Motivation/Affekt:</b> Strategien zur Motivations- und Affektregulation<br><b>Verhalten:</b> Anstrengung erhöhen/reduzieren, durchhalten, aufgeben, Hilfe suchen<br><b>Kontext:</b> Aufgabe ändern/beibehalten, Kontext ändern/verlassen</td></tr>
<tr><th>4 Reaktion, Reflexion</th><td><b>Kognition:</b> kognitive Beurteilung, Attributionen<br><b>Motivation/Affekt:</b> affektive Reaktionen, Attributionen<br><b>Verhalten:</b> Wahlverhalten<br><b>Kontext:</b> Ziele und Kontext evaluieren</td></tr></table>
<p><b>Ebenenmodell</b> (Schalenmodell) nach <b>Boekaerts (1999)</b>, drei Schalen von innen nach außen:</p>
<table class="kvq"><tr><th>innen</th><td><b>Regulation der Prozessmodi</b>: Wahl der kognitiven Strategien. Fokus <b>kognitive</b> Prozesse: Wie lerne ich dieses konkrete Material? (z. B. Wiederholung, Elaboration)</td></tr>
<tr><th>Mitte</th><td><b>Regulation der Lernprozesse</b>: Nutzung metakognitiven Wissens und Fähigkeiten, um das eigene Lernen zu steuern. Fokus <b>metakognitive</b> Prozesse: Planung, Überwachung, Regulation des Lernfortschritts (z. B. spezifische Lernziele, Lerntagebuch)</td></tr>
<tr><th>außen</th><td><b>Regulation des Selbst</b>: Wahl von Zielen und Ressourcen. Fokus <b>motivationale und emotionale</b> Prozesse (Ressourcen, Ziele: Identifikation, Attribuierung)</td></tr></table>
<p><b>20 Jahre später:</b> das <b>hierarchische Modell</b> von Selbstregulation beim Lernen nach <b>Landmann & Schmitz (2007)</b>. Der Lernprozess läuft in drei Phasen:</p>
<ul><li><b>präaktional</b>: Situation, Aufgabe, Emotion, Ziele, Motivation, Planung,</li>
<li><b>aktional</b>: Lernstrategien, Volition, Zeit, Leistung, begleitet von <b>Self-Monitoring</b>,</li>
<li><b>postaktional</b>: Bewertung, Reflexion, Emotion, Reaktion.</li></ul>
<p>Ist das Ziel erreicht, endet der Prozess (Stop). Wenn nicht, greifen nacheinander höhere Regelkreise des Self-Monitorings:</p>
<table class="kvq"><tr><th>0. Ordnung</th><td>→ Ausführungsregulation</td></tr>
<tr><th>1. Ordnung</th><td>→ Reflexion → Strategieregulation (zurück zum Strategiepool)</td></tr>
<tr><th>2. Ordnung</th><td>→ Reflexion → Mustererkennung</td></tr>
<tr><th>3. Ordnung</th><td>→ Reflexion → Zielregulation (zurück zur übergeordneten Zielklärung)</td></tr></table>
<p><span class="erg">Ergänzung</span> Lesart des Schaubilds: Erst wird an der Ausführung nachgesteuert; scheitert das mehrfach („n × nein“), wechselt man die Strategie, dann sucht man nach Mustern im eigenen Lernen und stellt zuletzt das Ziel selbst infrage. Gemeinsam ist allen drei Modellen: Selbstreguliertes Lernen verbindet kognitive, metakognitive und motivationale Steuerung, und Metakognition (Planen, Überwachen, Regulieren) ist das Bindeglied.</p>
<p class="small muted">Folien 39–41 (Sitzung 6), Lehrbuch Kap. 5</p>`,

 {id:"c6-01", f:"Phineas Gage und das Frontalhirnsyndrom", b:"Phineas Gage (1823–1869): Verhaltensänderung nach Verletzung des Stirnhirns.\nICD-10 F07.2: dysexekutives Syndrom (nach Schädelhirntrauma)."},

 {id:"c6-03", f:"Exekutive Funktionen (Definition)", b:"Was: Set kognitiver Prozesse, die andere kognitive Prozesse (z. B. Wahrnehmung, Gedächtnis) kontrollieren bzw. ihr Zusammenspiel optimieren\nWozu: zielgerichtetes Verhalten ermöglichen\nDeshalb: metakognitive Funktionen\nBeispiel: Bei einer Textaufgabe planen, ablenkende Gedanken unterdrücken und den Lösungsweg überwachen."},
 {id:"c6-04", f:"Exekutive Funktionen als „Sammelbecken“: Was gehört dazu?", b:"- Handlungsplanung\n- Problemlösen\n- Aufmerksamkeitssteuerung\n- Inhibition\n- mentale Flexibilität\n- Multi-Tasking\n- Monitoring-Prozesse (usw.)"},
 {id:"c6-05", f:"Zentrale Exekutive als erstes Modell exekutiver Kontrolle", b:"Herkunft: Teil des Arbeitsgedächtnismodells (Baddeley & Hitch, 1974)\nArt: unitäres System, das untergeordneten Systemen Ressourcen zuordnet\nVor allem für: Fokussierung und Teilung von Aufmerksamkeit, Verbindung zum LZG"},

 {id:"c6-08", f:"Die drei Aspekte exekutiver Kontrolle (Diversity)", b:"Updating: Überwachung und Aktualisierung von Arbeitsgedächtnisrepräsentationen\nInhibition: Unterdrückung aktuell vorherrschender (kognitiver und motorischer) Antworttendenzen\nSwitching/Shifting: kognitive Flexibilität, zwischen Strategien und mentalen Zuständen zu wechseln\nBeispiel: Beim Mitschreiben neue Punkte ergänzen (Updating), nicht reinrufen (Inhibition), von Mathe auf Deutsch umschalten (Shifting)."},

 {id:"c6-13", f:"Warum reifen exekutive Funktionen spät?", b:"Basis: präfrontaler Kortex\nGrund: reift als letzte Hirnregion, v. a. wegen später Myelinisierung, die erst in der Adoleszenz endet"},
 {id:"c6-14", f:"Inhomogene Entwicklung exekutiver Funktionen", b:"Inhibition: früh, Spurt im Vorschulalter, Reife mit 11–12 Jahren (Basis höherer Funktionen)\nShifting und Updating: erwachsen etwa mit 15 Jahren\nKomplexe Funktionen (Planning, Sequencing, Dual-Tasking): noch später"},
 {id:"c6-15", f:"Förderung exekutiver Funktionen: die problematische Situation", b:"Kein Mangel an Trainings, aber an sauber evaluierten Zugängen, v. a. zum Transfer (Nah-, Ferntransfer).\nUmschriebene, kurzfristige Trainings (PC-basiert, aerober Sport): ernüchternd."},
 {id:"c6-16", f:"Was bei der EF-Förderung funktioniert", b:"Lebenspraktische und langfristige Zugänge:\nRollenspiele\nAchtsamkeitstraining und Yoga\nzweisprachige Erziehung\nregelbasiertes Spiel\nGruppensport\nMontessori-Curriculum"},
 {id:"c6-17", f:"Tools of the Mind", b:"Was: EF-Curriculum (Diamond & Lee, 2011; Ergebnis Diamond et al., 2007)\nHintergrund: Vygotsky, „als-ob-Spiel“ befördert metakognitive Steuerung\nInhalt: 40 EF-relevante Aktivitäten (Verbalisierung, Peer-Scaffolding, Einbettung in den Alltag)\nRahmen: ab Vorschulalter (5;1 Jahre), 1 oder 2 Jahre, reguläre Lehrkräfte in regulären Klassen"},
 {id:"c6-18", f:"Marshmallow-Experiment (Mischel)", b:"Wann: Studien der 1970er Jahre\nMisst: Gratifikationsaufschub als Maß für Selbststeuerung\nGemeint: kurzfristige Bedürfnisbefriedigung zugunsten langfristiger Ziele aufschieben (meist Kinder)"},
 {id:"c6-19", f:"Warum ist Selbststeuerung entwicklungspsychologisch bedeutsam?", b:"Querschnittlich: sagt zu jedem Zeitpunkt psychologisches Well-Being vorher.\nLängsschnittlich: früher Prädiktor vieler Entwicklungsoutcomes (akademische Leistung, Zufriedenheit in Partnerschaften, Substanzmissbrauch)."},
 {id:"c6-20", f:"Selbststeuerung im Kindesalter: Unterschiede und Entwicklung", b:"Massive Unterschiede: interindividuell (Korrelation mit IQ), innerindividuell, interkulturell, entwicklungsbezogen.\nErste Ansätze mit etwa einem Jahr (basale Affektkontrolle), Hauptphase 3. bis 6. Lebensjahr.\nFolge: Relevanz früher Ko-Regulation (Erwachsene, kompetente Peers)."},
 {id:"c6-21", f:"Selbststeuerung nach Fröhlich & Kuhl (2003)", b:"Zwei Komponenten:\nSelbstregulation: Bilden und Aufrechterhalten selbstkongruenter Ziele\nSelbstkontrolle: durch explizite Absichten vermittelte Zielverfolgung\nBeispiel: Sich vornehmen, fürs Abi zu lernen (Selbstregulation), dann das Handy weglegen, obwohl ein Spiel lockt (Selbstkontrolle)."},
 {id:"c6-22", f:"Selbstregulation (Definition)", b:"Was: mentale Funktion, die eigene Aktionen und Reaktionen bewusst oder unbewusst lenkt\nWelche: kognitive, affektive, motivationale, behaviorale und motorische\nWozu: übergeordnete, willentlich angestrebte kurz-, mittel- und langfristige Ziele\nFokus: Handlungssteuerung, mit Regulation von Kognitionen, Emotionen/Motivation und Kontext"},
 {id:"c6-23", f:"Fähigkeiten der Selbstregulation", b:"Ziele setzen\nHandlungsoptionen auswählen und umsetzen\nHandlung überwachen\nSoll- und Ist-Zustand abgleichen\nSystem mit Handlungsimpetus/-energie ausstatten"},
 {id:"c6-24", f:"Selbstkontrolle: wann und was?", b:"Wann: im Konflikt zwischen zielkongruenten und attraktiven zielinkongruenten Alternativen.\nWas: eingeschliffene Reaktionstendenzen unterdrücken bzw. Reizvolles ignorieren, Alternativen im AG aktualisieren, alternative Handlungspfade initiieren."},
 {id:"c6-25", erg:true, f:"Selbstkontrolle: „Woran erinnert Sie das?“", b:"An die drei Aspekte exekutiver Kontrolle:\nunterdrücken: Inhibition\nim AG aktualisieren: Updating\nneue Pfade einschlagen: Shifting\nExekutive Funktionen sind die Bausteine der Selbststeuerung."},
 {id:"c6-26", f:"Selbststeuerung zusammengefasst", b:"Selbststeuerung umfasst Selbstregulation und Selbstkontrolle.\nSelbstregulation richtet uns allgemein nach eigenen Zielen aus.\nSelbstkontrolle wirkt bei zu lösenden Zielkonflikten (Gratifikationsaufschub).\nKontrolliert werden psychische Prozesse (Kognition, Emotion, Motivation) und das Verhalten."},
 {id:"c6-27", f:"Pintrich (2000): vier Phasen der Selbstregulation beim Lernen", b:"1 Voraussicht, Planung, Aktivierung\n2 Monitoring\n3 Kontrolle\n4 Reaktion, Reflexion\nJeweils in vier Bereichen: Kognition, Motivation/Affekt, Verhalten, Kontext."},
 {id:"c6-28", f:"Pintrich (2000): Beispiele je Phase (Bereich Kognition)", b:"Planung: Ziele setzen, Wissen und metakognitives Wissen aktivieren\nMonitoring: metakognitive Bewusstheit, Monitoring der Kognitionen\nKontrolle: kognitive Strategien auswählen und anpassen\nReflexion: kognitive Beurteilung, Attributionen"},
 {id:"c6-29", f:"Ebenenmodell nach Boekaerts (1999)", b:"innen: Regulation der Prozessmodi, kognitiv (Wahl der Strategien, z. B. Wiederholung, Elaboration)\nMitte: Regulation der Lernprozesse, metakognitiv (Planung, Überwachung, z. B. Lerntagebuch)\naußen: Regulation des Selbst, motivational-emotional (Ziele, Ressourcen, Attribuierung)"},
 {id:"c6-30", f:"Hierarchisches Modell (Landmann & Schmitz, 2007): Phasen", b:"präaktional: Situation, Aufgabe, Emotion, Ziele, Motivation, Planung\naktional: Lernstrategien, Volition, Zeit, Leistung, mit Self-Monitoring\npostaktional: Bewertung, Reflexion, Emotion, Reaktion"},
 {id:"c6-31", f:"Landmann & Schmitz (2007): Self-Monitoring 0. bis 3. Ordnung", b:"0. Ordnung: Ausführungsregulation\n1. Ordnung: Reflexion, Strategieregulation\n2. Ordnung: Reflexion, Mustererkennung\n3. Ordnung: Reflexion, Zielregulation"},
 {id:"c6-32", erg:true, f:"Diamond (2014), Folie „Selbststeuerung ist umfassend!“: Aufbau", b:"Kern: Arbeitsgedächtnis und inhibitorische Kontrolle (Interferenzkontrolle, Reaktionshemmung = Selbstkontrolle), daraus kognitive Flexibilität.\nDarauf: höhere exekutive Funktionen (Schlussfolgern, Problemlösen, Planen).\nSelbstregulation überlappt mit inhibitorischer Kontrolle."}
];

KURZ.push(
 {id:"k6-1", ch:6, pts:10,
  q:"Im Marshmallow-Experiment wartet ein Kind allein vor einer Süßigkeit. Erläutern Sie am Beispiel, was Selbststeuerung nach Fröhlich & Kuhl (2003) umfasst, wann Selbstkontrolle gefordert ist und welche Aspekte exekutiver Kontrolle das Kind dabei braucht.",
  k:["Gemessen wird Gratifikationsaufschub: kurzfristige Befriedigung zugunsten eines langfristigen Ziels aufschieben (Mischel)","Selbststeuerung umfasst Selbstregulation und Selbstkontrolle","Selbstregulation: selbstkongruente Ziele bilden und aufrechterhalten (später zwei Süßigkeiten)","Selbstkontrolle: über explizite Absichten vermittelte Zielverfolgung, gefordert im Zielkonflikt mit einer attraktiven, zielinkongruenten Alternative","Inhibition: den Impuls, sofort zu essen, unterdrücken","Updating: Ziel und Alternative im Arbeitsgedächtnis aktuell halten","Shifting: alternative Handlungspfade einschlagen, z. B. Aufmerksamkeit umlenken","Entwicklung: Hauptphase 3. bis 6. Lebensjahr, Ko-Regulation wichtig"],
  m:"Das Marshmallow-Experiment von Mischel misst den Gratifikationsaufschub, also die Fähigkeit, eine kurzfristige Befriedigung zugunsten eines langfristigen Ziels aufzuschieben. Nach Fröhlich und Kuhl umfasst Selbststeuerung zwei Komponenten. Selbstregulation ist das Bilden und Aufrechterhalten selbstkongruenter Ziele, hier das Ziel, später zwei Süßigkeiten zu bekommen. Selbstkontrolle ist die über explizite Absichten vermittelte Zielverfolgung; sie wird gefordert, sobald ein Zielkonflikt entsteht, denn die Süßigkeit vor dem Kind ist eine attraktive, aber zielinkongruente Alternative. Dafür braucht das Kind die drei Aspekte exekutiver Kontrolle: Inhibition, um den Impuls zu unterdrücken, sofort zu essen; Updating, um das Ziel und die Alternative im Arbeitsgedächtnis präsent zu halten; und Shifting, um einen alternativen Handlungspfad einzuschlagen, etwa die Aufmerksamkeit auf etwas anderes zu lenken. Weil die zugrunde liegenden Funktionen vor allem zwischen dem dritten und sechsten Lebensjahr reifen, unterscheiden sich gleichaltrige Kinder stark, und frühe Ko-Regulation durch Erwachsene ist bedeutsam."},
 {id:"k6-2", ch:6, pts:8,
  q:"Eine Schulleitung will die exekutiven Funktionen ihrer Erstklässler mit einem sechswöchigen Computertraining fördern. Nehmen Sie auf Basis der Vorlesung kritisch Stellung und schlagen Sie eine Alternative vor.",
  k:["Kein Mangel an Trainings, aber an sauber evaluierten Zugängen","Problem Transfer: Nahtransfer fraglich, Ferntransfer kaum belegt","Kurzfristige, umschriebene Trainings (PC-basiert) zeigen ernüchternde Ergebnisse","Wirksam: lebenspraktische, langfristige Zugänge (Rollenspiel, Achtsamkeit/Yoga, regelbasiertes Spiel, Gruppensport, Montessori, zweisprachige Erziehung)","Beispiel Tools of the Mind: als-ob-Spiel (Vygotsky), 40 Aktivitäten, 1–2 Jahre, reguläre Lehrkräfte ohne teure Ausstattung (Diamond & Lee, 2011)","Entwicklung: EF reifen spät und inhomogen, Förderung daher langfristig anlegen"],
  m:"Das Vorhaben ist kritisch zu sehen. An Trainings exekutiver Funktionen herrscht kein Mangel, wohl aber an sauber evaluierten Zugängen, vor allem was den Transfer angeht: Schon Nahtransfer ist fraglich, Ferntransfer auf schulische Leistungen kaum belegt. Gerade umschriebene und kurzfristige Trainings wie PC-basierte Programme zeigen ernüchternde Ergebnisse. Da exekutive Funktionen spät und ungleichmäßig reifen, ist eine Förderung über wenige Wochen ohnehin zu kurz. Wirksam sind lebenspraktische und langfristige Zugänge wie Rollenspiele, regelbasiertes Spiel, Gruppensport oder Achtsamkeitsübungen. Ein Beispiel ist Tools of the Mind: Nach Vygotskys Annahme, dass Als-ob-Spiel metakognitive Steuerung befördert, setzen reguläre Lehrkräfte über ein bis zwei Jahre rund 40 EF-relevante Aktivitäten in den Alltag ein, etwa Verbalisierung und Peer-Scaffolding, ohne teure Ausstattung. Die Schule sollte daher solche Elemente dauerhaft in den Unterricht einbauen statt eines kurzen Computertrainings."}
);

/* ================= Verständnisfragen: erst selbst abrufen, dann Auswahl; Wiederholung mit Abstand =================
   Jede Frage aus den Lektionen bekommt ein eigenes Fach wie eine Karteikarte (state.qbox).
   Ältere Antworten (vor dieser Funktion) werden aus state.lessons abgeleitet, ohne etwas zu speichern.
   Frage-Felder: q, o (Optionen), a (richtig), ex (Erklärung), w (optional: je falscher Option, warum sie falsch ist) */
const qid=(lid,j)=>lid+"#"+j;
function allQuestions(){ const out=[]; for(const ch of CHAPTERS) for(const L of (LESSONS[ch.n]||[])) L.check.forEach((c,j)=>out.push({id:qid(L.id,j), lid:L.id, n:ch.n, c, lt:L.t, li:(LESSONS[ch.n]||[]).indexOf(L)})); return out; }
function qInfo(id){
  const s=(state.qbox||{})[id]; if(s) return s;
  const ls=(state.lessons||{})[id.split("#")[0]]; if(!ls) return null;
  return ls.ok? {b:2, due:dayStart(ls.t)+3*864e5} : {b:1, due:dayStart(ls.t)+864e5};
}
function qDue(){ const now=Date.now(); return allQuestions().filter(q=>{ const s=qInfo(q.id); return s&&s.due<=now; }).sort((a,b)=>qInfo(a.id).due-qInfo(b.id).due); }
function qGrade(id,ok){
  state.qbox=state.qbox||{}; const s=qInfo(id)||{b:0};
  const b1= ok? Math.min(5,Math.max(s.b,1)+1) : 1;
  state.qbox[id]={b:b1, due:dayStart()+(ok?spaceDays(s.b===5?35:INTERVAL[b1]):1)*864e5};
  if(!ok){ state.qlapses=state.qlapses||{}; state.qlapses[id]=(state.qlapses[id]||0)+1; }
  save();
}
/* Rückmeldung: bei falscher Wahl erst, warum genau diese Wahl nicht passt, dann das Richtige und der Unterschied */
function feedback(c,a){
  const right=`<b>Richtig</b><span>${inl(c.o[c.a])}</span>`;
  if(a===c.a) return `<div class="fb good"><p class="fh">Richtig.</p><p style="margin:0">${inl(c.ex)}</p></div>`;
  if(a===-1) return `<div class="fb idk"><p class="fh">Kein Problem, die Frage kommt morgen noch einmal.</p><div class="dlist">${right}<b>Warum</b><span>${inl(c.ex)}</span></div></div>`;
  const why=c.w&&c.w[a];
  return `<div class="fb bad"><p class="fh">Nicht ganz.</p><div class="dlist">${why?`<b>Warum nicht</b><span>${inl(why)}</span>`:""}${right}<b>${why?"Der Unterschied":"Warum"}</b><span>${inl(c.ex)}</span></div></div>`;
}
/* Eine Frage: erst nur die Frage, dann auf Wunsch die Auswahl */
function qBlock(c,key,a,shown,first){
  const opts= a!==undefined || shown;
  return `<div class="qb" style="margin-top:${first?4:18}px"><p style="margin:0"><b>${inl(c.q)}</b></p>
    ${opts?`<div class="mc">${c.o.map((o,k)=>{ const cls=a===undefined?"":(k===c.a?"r":(k===a?"w":""));
        return `<button data-q="${key}" data-k="${k}" class="${cls}" ${a!==undefined?"disabled":""}>${inl(o)}</button>`; }).join("")}
        ${a===undefined?`<button data-q="${key}" data-k="-1" class="idk">Weiß ich nicht</button>`:""}</div>`
      :`<p class="hint" style="margin:4px 0 8px">Erst selbst überlegen, dann Auswahl zeigen.</p>
        <div class="row"><button class="btn small" data-show="${key}">Auswahl zeigen</button><button class="btn ghost small" data-q="${key}" data-k="-1">Weiß ich nicht</button></div>`}
    ${a!==undefined?feedback(c,a):""}</div>`;
}
/* Übungsmodus: fällige Verständnisfragen aus allen Lektionen */
function openRecall(list){ cur.mx=null; const L=list||qDue().slice(0,8); cur.rq={list:L, i:0, ans:undefined, shown:false, right:0}; go("recall"); }
function renderRecall(){
  const R=cur.rq, L=R.list;
  if(R.i>=L.length&&cur.mx) return mixNext(R.right>0);
  if(R.i>=L.length){
    const left=qDue().length;
    $("#app").innerHTML=`${backTo("Üben")}<h1>${L.length?"Runde geschafft":"Nichts fällig"}</h1><div class="block">
      ${L.length?`<p>${R.right} von ${L.length} richtig.</p>`:`<p>Gerade ist keine Verständnisfrage fällig. Neue Fragen kommen mit jeder Lektion dazu.</p>`}
      <p class="small muted">Richtige Fragen kommen nach 1, 3, 7, 16 und 35 Tagen wieder, falsche schon morgen. ${left?`Noch ${left} fällig.`:""}</p>
      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="rAgain">Weiter</button>`:""}<button class="btn ghost" id="rOut">Fertig</button>`}</div></div>`;
    bindCrumb(()=>go("practice")); if($("#rAgain")) $("#rAgain").onclick=()=>openRecall(); if($("#rOut")) $("#rOut").onclick=()=>go("practice"); return;
  }
  /* Wie eine Lernkarte: Vorderseite = Frage, erst selbst überlegen; Tippen zeigt die Auswahl (nochmal Tippen verdeckt sie),
     links wischen heißt „Weiß ich nicht“. Nach der Antwort: Tippen oder Wischen für die nächste Frage. */
  const q=L[R.i], c=q.c, ch=CHAPTERS.find(x=>x.n===q.n), a=R.ans, done=a!==undefined; if(!done) R.st0=qInfo(q.id); const st=R.st0;
  const ok=done&&a===c.a, why=done&&a>=0&&c.w&&c.w[a];
  qcRender({
    eye:`${cur.mx?"Verständnisfrage":`Frage ${R.i+1} von ${L.length}`}${st?lvlDots(st.b):` <span class="lvnew">neu</span>`}`,
    ctx:`${ch.title} · ${q.lt}`, front:inl(c.q),
    phase:done?"done":R.shown?"open":"front", idk:true,
    opts:c.o.map((l,k)=>({k:String(k),l})),
    ok:!done?undefined:a===-1?null:ok,
    verdict:!done?null:ok?{t:"Richtig.",s:[inl(c.o[c.a])]}
      :a===-1?{t:"Nicht gewusst.",s:[`Richtig ist: ${inl(c.o[c.a])}`,"Die Frage kommt morgen noch einmal."]}
      :{t:"Falsch.",s:[`Du: ${inl(c.o[a])}`,`Richtig: ${inl(c.o[c.a])}`]},
    why:done?`${why?`<p><b>Warum nicht:</b> ${inl(why)}</p>`:""}<p>${inl(c.ex)}</p>`:"",
    more:done?`<button class="qlink" id="rLes">Zur Lektion</button>`:"",
    next:cur.mx||R.i<L.length-1?"Weiter":"Auswertung",
    reveal:()=>{ R.shown=true; renderRecall(); }, hide:()=>{ R.shown=false; renderRecall(); },
    pick:k=>{ if(R.ans!==undefined) return; const n=k==="__idk"?-1:+k; R.ans=n; const good=n===c.a; if(good) R.right++; logDay(); qGrade(q.id,good); renderRecall(); if(n>=0&&!good) buzz(); },
    go:()=>{ R.i++; R.ans=undefined; R.shown=false; renderRecall(); window.scrollTo(0,0); },
    after:()=>{ if($("#rLes")) $("#rLes").onclick=()=>openLesson(q.n,q.li); }
  });
}

const whoCats=x=>WHO_SETS[x.set].cats;
function whoOptions(x){
  const C=whoCats(x), pool=Object.keys(C).filter(k=>k!==x.s&&!(x.alt||[]).includes(k));
  return shuffle([x.s].concat(shuffle(pool).slice(0,3)));
}
/* Auswahl: neue Beispiele und verwechselte kommen öfter */
function whoPick(n){
  const st=state.who||{}, pool=WHO.filter(x=>LESSONS[WHO_SETS[x.set].kap]), out=[];
  const w=pool.map(x=>{ const h=st[x.id]; return !h?3 : h.last?1:4; });
  while(out.length<Math.min(n,pool.length)){ let q=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<pool.length;i++){ q-=w[i]; if(q<=0) break; } i=Math.min(i,pool.length-1); out.push(pool.splice(i,1)[0]); w.splice(i,1); }
  return out;
}
function openWho(n){ cur.mx=null; cur.wh={list:whoPick(n||8).map(x=>({x,o:whoOptions(x)})), i:0, a:null, right:0}; go("who"); }
function renderWho(){
  const W=cur.wh, L=W.list;
  if(W.i>=L.length&&cur.mx) return mixNext(W.right>0);
  if(W.i>=L.length){
    $("#app").innerHTML=`${backTo("Üben")}<h1>Runde geschafft</h1><div class="block"><p>${W.right} von ${L.length} richtig zugeordnet.</p>
      <p class="small muted">Falsch zugeordnete Beispiele kommen in den nächsten Runden häufiger.</p>
      <div class="row">${sess?sessBtn():`<button class="btn" id="wAgain">Neue Runde</button><button class="btn ghost" id="wOut">Fertig</button>`}</div></div>`;
    bindCrumb(()=>go("practice")); if($("#wAgain")) $("#wAgain").onclick=()=>openWho(8); if($("#wOut")) $("#wOut").onclick=()=>go("practice"); return;
  }
  /* Zuordnen als Auswahlkarte: Beispiel auf der Karte, Kategorien darunter, Urteil auf der Karte, weiter mit Tippen oder Wischen */
  const {x,o}=L[W.i], S=WHO_SETS[x.set], C=S.cats, done=W.a!==null, ok=done&&W.a===x.s;
  qcRender({
    eye:`Zuordnen · ${S.t}${cur.mx?"":` · ${W.i+1} von ${L.length}`}`, stem:S.q,
    front:inl(x.t), phase:done?"done":"open",
    opts:o.map(k=>({k,l:C[k]})), hint:S.hint,
    ok:!done?undefined:ok,
    verdict:!done?null:ok?{t:"Richtig.",s:[C[x.s]]}:{t:"Falsch.",s:[`Du: ${C[W.a]}`,`Richtig: ${C[x.s]}`]},
    why:done?`<p>${inl(x.ex)}</p>`:"",
    next:cur.mx||W.i<L.length-1?"Weiter":"Auswertung",
    pick:k=>{ if(W.a!==null) return; W.a=k; const good=k===x.s; if(good) W.right++;
      state.who=state.who||{}; const h=state.who[x.id]||{n:0,r:0}; h.n++; if(good) h.r++; h.last=good; if(!good) h.conf=k; state.who[x.id]=h; logDay(); save(); renderWho(); if(!good) buzz(); },
    go:()=>{ W.i++; W.a=null; renderWho(); window.scrollTo(0,0); }
  });
}

/* ================= Tägliche Einheit „Heute“ =================
   Mischt, was heute dran ist: fällige Karten, fällige Verständnisfragen, Kreuzaufgaben wie in der Klausur,
   abwechselnd eine Rechenaufgabe, eine offene Aufgabe oder „Zuordnen“, dazu die nächste neue Lektion.
   Gemischtes Üben (Interleaving) und Abstände (Spacing), ohne dass du selbst planen musst. */
let sess=null;
const dayIndex=()=>Math.floor(dayStart()/864e5);
function freshChapter(){ for(const ch of CHAPTERS){ const L=LESSONS[ch.n]||[]; if(L.some(x=>lessonState(x.id)) && (CARDS[ch.n]||[]).some(x=>!isSeen(x.id))) return ch.n; } return 0; }
/* Höchstens vier Schritte (23.11.): 1 Karten (fällige und neue zusammen), 2 Fragen (Verständnisfragen,
   Kreuzaufgaben und Zuordnen gemischt, alle als Auswahlkarten), 3 abwechselnd offene Aufgabe oder Rechenaufgabe,
   4 Neu lernen, wenn eine Lektion ansteht. */
function planToday(){
  const S=[], due=dueCards(0).slice(0,20), n=due.length<25?freshChapter():0, fresh=n?allCards(n).filter(x=>!isSeen(x.id)).slice(0,5):[];
  if(due.length||fresh.length) S.push({k:"cards", deck:due.concat(fresh), t:"Karten", d:[due.length?`${due.length} fällig`:"",fresh.length?`${fresh.length} neu`:""].filter(Boolean).join(", "), min:Math.max(2,Math.round((due.length+fresh.length)*.4))});
  const mx=mixPlan(); if(mx.length) S.push({k:"mix", list:mx, t:"Fragen", d:`${mx.length} Fragen wie in der Klausur gemischt`, min:Math.max(3,Math.round(mx.length*.6))});
  const rot=dayIndex()%2;
  if(rot===0&&calcTypes(0).length) S.push({k:"calc", t:"Rechenaufgabe", d:"Diagnostik, bevorzugt was dir schwerfällt", min:5});
  else if(kurzOf(0).length) S.push({k:"kurz", t:"Offene Aufgabe", d:"tippen wie in der Klausur am PC", min:6});
  const nx=nextStep(); if(/Theorie/.test(nx.label)) S.push({k:"lesson", t:"Neu lernen", d:nx.title, min:5, go:nx.go});
  return S;
}
/* Fragenmix: fällige Verständnisfragen, Kreuzaufgaben und Zuordnen, verzahnt (Interleaving) */
function mixPlan(){
  const q=qDue().slice(0,5).map(x=>({t:"q",q:x})), k=kreuzOf(0).length?pickKreuz(0,2).map(x=>({t:"k",id:x.id})):[], w=whoPick(3).map(x=>({t:"w",x,o:whoOptions(x)}));
  const out=[], parts=[q,k,w]; while(parts.some(p=>p.length)) for(const p of parts) if(p.length) out.push(p.shift());
  return out;
}
function openMix(list){ cur.mx={list, i:0, right:0, n:0}; mixShow(); }
function mixShow(){ const M=cur.mx, e=M.list[M.i];
  if(!e) return mixDone();
  if(e.t==="q"){ cur.rq={list:[e.q], i:0, ans:undefined, shown:false, right:0}; go("recall"); }
  else if(e.t==="k"){ cur.kr={n:0, items:[e.id], i:0, j:0, ans:{}, prev:null, pts:[], sure:[]}; go("kreuz"); }
  else { cur.wh={list:[{x:e.x,o:e.o}], i:0, a:null, right:0}; go("who"); }
  window.scrollTo(0,0);
}
/* Wird von den Fragenansichten aufgerufen, wenn ihr einziges Element fertig ist: ok = richtig (Kreuzaufgabe: Punkte) */
function mixNext(ok,pts){ const M=cur.mx; if(pts!==undefined){ M.kp=(M.kp||0)+pts; M.km=(M.km||0)+4; } else { M.n++; if(ok) M.right++; } M.i++; mixShow(); }
function mixDone(){ const M=cur.mx; cur.mx=null; view="mixdone"; renderNav();
  $("#app").innerHTML=`<h1>Fragen geschafft</h1><div class="block">
    ${M.n?`<p>${M.right} von ${M.n} Fragen richtig.</p>`:""}${M.km?`<p>Kreuzaufgaben: ${M.kp} von ${M.km} Punkten.</p>`:""}
    <p class="small muted">Was nicht saß, kommt morgen wieder.</p><div class="row">${sess?sessBtn():`<button class="btn" id="mxOut">Fertig</button>`}</div></div>`;
  if($("#mxOut")) $("#mxOut").onclick=()=>go("practice"); window.scrollTo(0,0);
}
function startSession(){ sess={steps:planToday(), i:0, t0:Date.now(), done:[]}; runStep(); }
function runStep(){
  if(!sess) return; const s=sess.steps[sess.i]; updateSessBar();
  if(!s){ return finishSession(); }
  ({cards:()=>openCards(0,false,s.deck),
    mix:()=>openMix(s.list),
    calc:()=>startTask(recommend(),false),
    who:()=>openWho(5),
    kurz:()=>openKurz(0),
    lesson:()=>s.go()})[s.k]();
  window.scrollTo(0,0);
}
/* done = Schritt wirklich bis zum Ende bearbeitet (Abschlussseite oder Speichern); „Nächster Schritt“ oben zählt als übersprungen */
function sessNext(done){ if(!sess) return; (sess.done=sess.done||[])[sess.i]=done===true; sess.i++; runStep(); }
function endSession(){ cur.mx=null; sess=null; updateSessBar(); go("home"); }
function finishSession(){
  const min=Math.max(1,Math.round((Date.now()-sess.t0)/60000)), n=sess.steps.length, d=(sess.done||[]).filter(Boolean).length, all=d===n;
  if(all){ state.sessions=state.sessions||{}; state.sessions[today()]=min; save(); }
  sess=null; updateSessBar(); view="sessdone"; renderNav();
  $("#app").innerHTML=all?`<p class="eyebrow">Heute</p><h1>Geschafft</h1><div class="block"><p>Deine Einheit ist fertig, etwa ${min} Minuten.</p>
    <p class="small muted">Morgen stellt die App eine neue Einheit zusammen. Was du heute nicht sicher wusstest, ist dann wieder dabei.${new Date().getHours()>=18?" Abends gelernt? Dann mach morgen früh kurz die fälligen Karten: Mit Schlaf zwischen zwei Runden sitzt der Stoff schneller und länger.":""}</p>
    <div class="row"><button class="btn" id="sdHome">Zum Lernpfad</button></div></div>`
   :`<p class="eyebrow">Heute</p><h1>${d?"Noch nicht ganz":"Nichts bearbeitet"}</h1><div class="block"><p>${d} von ${n} Schritten bearbeitet.</p>
    <p class="small muted">Übersprungenes zählt nicht als gelernt und steht weiter unter „Heute“.</p>
    <div class="row"><button class="btn" id="sdHome">Zum Lernpfad</button></div></div>`;
  $("#sdHome").onclick=()=>go("home"); window.scrollTo(0,0);
}
function updateSessBar(){
  const b=$("#sessbar"); if(!b) return;
  if(!sess||!sess.steps[sess.i]){ b.hidden=true; b.innerHTML=""; return; }
  const s=sess.steps[sess.i];
  b.hidden=false;
  b.innerHTML=`<div class="sbin"><span class="sbt"><b>Heute ${sess.i+1}/${sess.steps.length}</b> · ${s.t}</span><button class="btn ghost small" id="sbNext">${sess.i<sess.steps.length-1?"Nächster Schritt":"Abschließen"}</button><button class="btn ghost small" id="sbEnd" aria-label="Einheit beenden">✕</button></div><div class="sbs" aria-hidden="true">${sess.steps.map((_,j)=>`<i class="${j<sess.i?"on":j===sess.i?"now":""}"></i>`).join("")}</div>`;
  $("#sbNext").onclick=()=>sessNext(false); $("#sbEnd").onclick=endSession;
}
const sessBtn=()=>`<button class="btn" id="sessGo">${sess&&sess.i<sess.steps.length-1?"Weiter zum nächsten Schritt":"Einheit abschließen"}</button>`;
document.addEventListener("click",e=>{ if(e.target.closest("#sessGo")) sessNext(true); });
/* Block auf der Startseite */
function todayBlock(){
  const done=(state.sessions||{})[today()], S=planToday(), min=S.reduce((a,s)=>a+s.min,0);

    ${done?`<p class="small muted" style="margin-top:0">Du hast heute schon gelernt. Eine zweite Runde schadet nicht, morgen geht es mit neuen Abständen weiter.</p>`:""}
    <ol class="plan">${S.map(s=>`<li><b>${s.t}</b><span>${inl(s.d)}</span></li>`).join("")}</ol>
    ${plan?`<p class="small" style="margin:0 0 10px"><b>Probeklausur:</b> ${plan}</p>`:""}

/* ================= Klausurtermin, Probeklausur-Plan und Schwachstellen ================= */
const EXAM_DEFAULT="2027-02-17";   // laut Unterlagen: Modulklausur am PC im PC-Raum; änderbar unter Statistik
const fmtDate=t=>{ const d=new Date(t); return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+"."; };
const examDateTs=()=>{ const s=state.examDate||EXAM_DEFAULT; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
const examDaysLeft=()=>Math.ceil((examDateTs()-dayStart())/864e5);
/* Plan: eine Probeklausur früh als Standortbestimmung, dann 21, 14 und 7 Tage vor dem Termin */
function examPlan(){
  const T=examDateTs(), ex=(state.exams||[]).map(e=>e.t).sort((a,b)=>a-b);
  const P=[{lab:"Standortbestimmung", when:null}];
  [21,14,7].forEach(d=>P.push({lab:`${d} Tage vor der Klausur`, when:T-d*864e5}));
  const used=new Set();
  P.forEach(p=>{ const i=ex.findIndex((t,k)=>!used.has(k)&&(p.when==null||t>=p.when-3*864e5)); if(i>=0){ used.add(i); p.done=ex[i]; } });
  return P;
}
function examPlanToday(){
  const P=examPlan(), now=Date.now(), open=P.find(p=>!p.done);
  if(!open) return "";
  if(open.when==null) return "Schreib bald eine als Standortbestimmung (unter Üben).";
  if(open.when-now<=864e5) return `Laut Plan ist jetzt die nächste dran (${open.lab}).`;
  return "";
}
function examPlanBlock(){
  const days=examDaysLeft(), P=examPlan(), own=!!state.examDate;
  return `<div class="block"><h2>Klausur und Probeklausuren</h2>
    <div class="row" style="margin-bottom:8px"><label class="small" for="exD">Klausurtermin</label><input type="date" id="exD" value="${state.examDate||EXAM_DEFAULT}" class="dateinp"><button class="btn ghost small" id="exS">Speichern</button></div>
    <p class="small" style="margin:0 0 6px">${days>0?`Noch <b>${days} Tage</b> bis zur Klausur.`:days===0?"<b>Heute ist Klausur.</b> Viel Erfolg!":"Der Termin liegt in der Vergangenheit."}${own?"":` <span class="muted">Termin laut deinen Unterlagen (17.02.2027). Ändert er sich, trag ihn hier neu ein.</span>`}</p>
    <div class="klist">${P.map(p=>`<b>${p.done?"✓ ":""}${p.lab}</b><span>${p.done?`geschrieben am ${fmtDate(p.done)}`:p.when?fmtDate(p.when):"so bald wie möglich"}</span>`).join("")}</div></div>`;
}

function weakData(){
  const byId=Object.fromEntries(Object.values(CARDS).flat().map(c=>[c.id,c]));
  const weakCards=Object.entries(state.lapses||{}).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(([id])=>byId[id]).filter(Boolean);
  const qById=Object.fromEntries(allQuestions().map(q=>[q.id,q]));
  const weakQ=Object.entries(state.qlapses||{}).filter(([id,n])=>n>=1&&qById[id]&&((state.qbox||{})[id]||{}).b<=2).sort((a,b)=>b[1]-a[1]).map(([id])=>qById[id]);
  const weakK=kreuzOf(0).filter(x=>{ const s=kzStat(x.id); return s&&s.p<4; }).sort((a,b)=>kzStat(a.id).p-kzStat(b.id).p);
  const weakCalc=calcTypes(0).filter(t=>{ const h=state.hist[t]; return h&&h.n>=2&&h.r/h.n<.7; }).sort((a,b)=>acc(a)-acc(b));
  const conf={}; Object.entries(state.who||{}).forEach(([id,h])=>{ if(h.conf&&!h.last){ const x=WHO.find(w=>w.id===id); if(x){ const C=whoCats(x), k=C[x.s]+" ↔ "+C[h.conf]; conf[k]=(conf[k]||0)+1; } } });
  return {weakCards,weakQ,weakK,weakCalc,confL:Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,3)};
}

    ${weakCalc.length?`<h3 style="margin-top:14px">Rechenaufgaben unter 70 %</h3>${weakCalc.map(t=>`<div class="srow"><span>${TYPES[t].short}</span><span class="small muted">${Math.round(acc(t)*100)} %</span><button class="btn ghost small" data-wt="${t}">Üben</button></div>`).join("")}`:""}
